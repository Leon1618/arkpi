045 96 Woolworths 28 Eenie Creek Road Noosaville -26.41545, 153.04763 97 IGA 3 Emerald Street Cooroy · +61 7 5447 6061 -26.41707, 152.90907 98 IGA 215 David Low Way Peregian Beach -26.48116, 153.09456 99 Coles 1 Ridgeview Drive -26.49667, 153.07997 100 Coles – -26.52616, 153.08840 101 Natural Harvest – -26.52701, 153.08816 102 Woolworths – -26.53837, 153.07908 103 Seasons IGA Yandin"},"10-navigation-and-maps/maps-noosa":{"title":"Maps of Noosa","folder":"10-navigation-and-maps","html":"<h1 id=\"maps-of-noosa\">Maps of Noosa<\/h1>\n<p>Two printable black-and-white maps, made from OpenStreetMap. Open the picture on\nits own to zoom in, or print it.<\/p>\n<ul>\n<li><strong>Black squares<\/strong> are emergency services and health: hospital, clinic, police,\n    fire station, ambulance station, SES.<\/li>\n<li><strong>White circles<\/strong> are other useful places: pharmacy, doctor, fuel,\n    supermarket, drinking water, community centre, lifeguard.<\/li>\n<li><strong>Numbers<\/strong> match the list in <a href=\"#/10-navigation-and-maps/key-places-noosa\">key-places-noosa.md<\/a>,\n    which also gives each place's address, phone number (where known) and GPS\n    coordinates.<\/li>\n<\/ul>\n<h2 id=\"tewantin-noosaville-and-noosa-heads\">Tewantin, Noosaville and Noosa Heads<\/h2>\n<p><img alt=\"Street map of Tewantin, Noosaville and Noosa Heads with numbered key places\" loading=\"lazy\" src=\"10-navigation-and-maps/maps/map-tewantin-noosa.svg\" /><\/p>\n<p><em>Main roads are named. Scale bar: 1 km.<\/em><\/p>\n<h2 id=\"all-of-noosa-shire\">All of Noosa Shire<\/h2>\n<p><img alt=\"Map of Noosa Shire showing main roads, rivers, lakes, towns and emergency services\" loading=\"lazy\" src=\"10-navigation-and-maps/maps/map-noosa-shire.svg\" /><\/p>\n<p><em>Main roads, the Noosa River and lakes, towns, and emergency services.<\/em><\/p>\n<h2 id=\"flood-maps\">Flood maps<\/h2>\n<p>Noosa Council's official flood maps for Tewantin, Noosaville and Noosa Heads are\nsaved by <code>./tools/download-local.sh<\/code> into <code>12-noosa-tewantin/downloads/<\/code> (see\n<a href=\"#/12-noosa-tewantin/local-hazards\">../12-noosa-tewantin/local-hazards.md<\/a>).<\/p>\n<h2 id=\"on-your-phone\">On your phone<\/h2>\n<p>For a zoomable map with search and directions that works with no signal, see\n<a href=\"#/10-navigation-and-maps/offline-map-apps\">offline-map-apps.md<\/a>.<\/p>\n<blockquote>\n<p>OpenStreetMap is made by volunteers. It may be missing places or be out of\ndate. In an emergency, call <strong>000<\/strong>.<\/p>\n<\/blockquote>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>Map data © OpenStreetMap contributors, Open Database License:\n    https://www.openstreetmap.org/copyright. Maps drawn with <code>tools/make-map.py<\/code>.<\/li>\n<\/ul>","text":"Maps of Noosa Two printable black-and-white maps, made from OpenStreetMap. Open the picture on its own to zoom in, or print it. Black squares are emergency services and health: hospital, clinic, police, fire station, ambulance station, SES. White circles are other useful places: pharmacy, doctor, fuel, supermarket, drinking water, community centre, lifeguard. Numbers match the list in key-places-noosa.md , which also gives each place's address, phone number (where known) and GPS coordinates. Tewantin, Noosaville and Noosa Heads Main roads are named. Scale bar: 1 km. All of Noosa Shire Main roads, the Noosa River and lakes, towns, and emergency services. Flood maps Noosa Council's official flood maps for Tewantin, Noosaville and Noosa Heads are saved by ./tools/download-local.sh into 12-noosa-tewantin/downloads/ (see ../12-noosa-tewantin/local-hazards.md ). On your phone For a zoomable map with search and directions that works with no signal, see offline-map-apps.md . OpenStreetMap is made by volunteers. It may be missing places or be out of date. In an emergency, call 000 . Sources (checked 2026-11-01) Map data © OpenStreetMap contributors, Open Database License: https://www.openstreetmap.org/copyright. Maps drawn with tools/make-map.py ."},"10-navigation-and-maps/offline-map-apps":{"title":"Offline Map Apps","folder":"10-navigation-and-maps","html":"<h1 id=\"offline-map-apps\">Offline Map Apps<\/h1>\n<p>A phone's GPS works <strong>without mobile signal or internet<\/strong>: it listens to\nsatellites. What you need is a map stored on the phone <strong>before<\/strong> the outage.<\/p>\n<h2 id=\"organic-maps-free\">Organic Maps (free)<\/h2>\n<ul>\n<li>Free, open source, no ads and no tracking.<\/li>\n<li>Uses OpenStreetMap, the same data as the maps in this folder.<\/li>\n<li>Every feature works offline: search, turn-by-turn directions for walking,\n    cycling and driving, hiking trails, contour lines and elevation.<\/li>\n<li>For iPhone (App Store) and Android (Google Play, F-Droid).<\/li>\n<\/ul>\n<p><strong>Set it up now, while you have internet:<\/strong><\/p>\n<ol>\n<li>Install <strong>Organic Maps<\/strong>.<\/li>\n<li>Download the map for your region (for Noosa: Queensland). Maps of other\n    places you might evacuate to are worth downloading too.<\/li>\n<li>Turn on flight mode and check that you can still search for an address and\n    get directions.<\/li>\n<li>Update the maps every few months.<\/li>\n<\/ol>\n<h2 id=\"save-these-places-in-the-app\">Save these places in the app<\/h2>\n<p>Mark them as bookmarks so you can find them in the dark or in smoke:<\/p>\n<ul>\n<li>Your home and your family meeting point<\/li>\n<li>The hospitals, fire, police and ambulance stations from\n    <a href=\"#/10-navigation-and-maps/key-places-noosa\">key-places-noosa.md<\/a><\/li>\n<li>Where you would evacuate to (family or friends out of the flood or bushfire\n    area)<\/li>\n<\/ul>\n<h2 id=\"saving-battery\">Saving battery<\/h2>\n<p>The screen uses the most power. Turn the brightness down, use flight mode (GPS\nkeeps working), and only open the map when you need it.<\/p>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>Organic Maps: https://organicmaps.app/<\/li>\n<\/ul>","text":"Offline Map Apps A phone's GPS works without mobile signal or internet : it listens to satellites. What you need is a map stored on the phone before the outage. Organic Maps (free) Free, open source, no ads and no tracking. Uses OpenStreetMap, the same data as the maps in this folder. Every feature works offline: search, turn-by-turn directions for walking, cycling and driving, hiking trails, contour lines and elevation. For iPhone (App Store) and Android (Google Play, F-Droid). Set it up now, while you have internet: Install Organic Maps . Download the map for your region (for Noosa: Queensland). Maps of other places you might evacuate to are worth downloading too. Turn on flight mode and check that you can still search for an address and get directions. Update the maps every few months. Save these places in the app Mark them as bookmarks so you can find them in the dark or in smoke: Your home and your family meeting point The hospitals, fire, police and ambulance stations from key-places-noosa.md Where you would evacuate to (family or friends out of the flood or bushfire area) Saving battery The screen uses the most power. Turn the brightness down, use flight mode (GPS keeps working), and only open the map when you need it. Sources (checked 2026-11-01) Organic Maps: https://organicmaps.app/"},"11-preparedness/README":{"title":"11 · Preparedness","folder":"11-preparedness","html":"<h1 id=\"11-preparedness\">11 · Preparedness<\/h1>\n<p>Checklists for <strong>before<\/strong> a disaster, while stores and the internet still work.<\/p>\n<h2 id=\"pages\">Pages<\/h2>\n<ul>\n<li><a href=\"#/11-preparedness/family-emergency-plan\">Family Emergency Plan<\/a><\/li>\n<li><a href=\"#/11-preparedness/emergency-kit\">Emergency Supply Kit<\/a>: Ready.gov checklist<\/li>\n<li>Food supply: see <a href=\"#/04-food/food-safety-in-an-emergency\">Food Safety in an Emergency<\/a>; water: see <a href=\"#/03-water/storing-water\">Storing Water<\/a><\/li>\n<li>Local hazards, hospitals and contacts: see <a href=\"#/12-noosa-tewantin/README\">12-noosa-tewantin<\/a><\/li>\n<\/ul>","text":"11 · Preparedness Checklists for before a disaster, while stores and the internet still work. Pages Family Emergency Plan Emergency Supply Kit : Ready.gov checklist Food supply: see Food Safety in an Emergency ; water: see Storing Water Local hazards, hospitals and contacts: see 12-noosa-tewantin"},"11-preparedness/emergency-kit":{"title":"Emergency Supply Kit","folder":"11-preparedness","html":"<h1 id=\"emergency-supply-kit\">Emergency Supply Kit<\/h1>\n<p>A kit you can use at home or take with you. Check it every six months and\nreplace expired food, water, medicine and batteries.<\/p>\n<h2 id=\"basic-kit\">Basic kit<\/h2>\n<ul>\n<li>☐ <strong>Water<\/strong>: one gallon (≈3.8 L) per person per day, for several days, for\n      drinking and sanitation<\/li>\n<li>☐ <strong>Food<\/strong>: a several-day supply of non-perishable food<\/li>\n<li>☐ Battery-powered or hand-crank radio, and a NOAA Weather Radio with tone\n      alert (US)<\/li>\n<li>☐ Flashlight<\/li>\n<li>☐ First aid kit<\/li>\n<li>☐ Extra batteries<\/li>\n<li>☐ Whistle to signal for help<\/li>\n<li>☐ Dust mask to filter contaminated air<\/li>\n<li>☐ Plastic sheeting, scissors and duct tape to shelter in place<\/li>\n<li>☐ Moist towelettes, garbage bags and plastic ties for personal sanitation<\/li>\n<li>☐ Wrench or pliers to turn off utilities<\/li>\n<li>☐ Manual can opener<\/li>\n<li>☐ Local maps (paper)<\/li>\n<li>☐ Cell phone with chargers and a backup battery<\/li>\n<\/ul>\n<h2 id=\"add-based-on-your-needs\">Add based on your needs<\/h2>\n<ul>\n<li>☐ Soap, hand sanitizer and disinfecting wipes<\/li>\n<li>☐ Prescription medications<\/li>\n<li>☐ Non-prescription medications: pain relievers, anti-diarrhea medication,\n      antacids, laxatives<\/li>\n<li>☐ Prescription glasses and contact lens solution<\/li>\n<li>☐ Infant formula, bottles, diapers, wipes, diaper rash cream<\/li>\n<li>☐ Pet food and extra water for pets<\/li>\n<li>☐ Cash<\/li>\n<li>☐ Important family documents, saved electronically or in a waterproof\n      container<\/li>\n<li>☐ Sleeping bag or warm blanket for each person<\/li>\n<li>☐ A complete change of clothes suited to your climate, and sturdy shoes<\/li>\n<li>☐ Fire extinguisher<\/li>\n<li>☐ Matches in a waterproof container<\/li>\n<li>☐ Feminine supplies and personal hygiene items<\/li>\n<li>☐ Mess kits, paper cups, plates, paper towels, plastic utensils<\/li>\n<li>☐ Paper and pencil<\/li>\n<li>☐ Books, games, puzzles and other activities for children<\/li>\n<\/ul>\n<h2 id=\"also-keep\">Also keep<\/h2>\n<ul>\n<li>☐ A copy of this Arkpi folder on a USB drive<\/li>\n<li>☐ A tourniquet (see <a href=\"#/01-emergency/severe-bleeding\">../01-emergency/severe-bleeding.md<\/a>)<\/li>\n<\/ul>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>Ready.gov, Build A Kit: https://www.ready.gov/kit<\/li>\n<\/ul>","text":"Emergency Supply Kit A kit you can use at home or take with you. Check it every six months and replace expired food, water, medicine and batteries. Basic kit ☐ Water : one gallon (≈3.8 L) per person per day, for several days, for drinking and sanitation ☐ Food : a several-day supply of non-perishable food ☐ Battery-powered or hand-crank radio, and a NOAA Weather Radio with tone alert (US) ☐ Flashlight ☐ First aid kit ☐ Extra batteries ☐ Whistle to signal for help ☐ Dust mask to filter contaminated air ☐ Plastic sheeting, scissors and duct tape to shelter in place ☐ Moist towelettes, garbage bags and plastic ties for personal sanitation ☐ Wrench or pliers to turn off utilities ☐ Manual can opener ☐ Local maps (paper) ☐ Cell phone with chargers and a backup battery Add based on your needs ☐ Soap, hand sanitizer and disinfecting wipes ☐ Prescription medications ☐ Non-prescription medications: pain relievers, anti-diarrhea medication, antacids, laxatives ☐ Prescription glasses and contact lens solution ☐ Infant formula, bottles, diapers, wipes, diaper rash cream ☐ Pet food and extra water for pets ☐ Cash ☐ Important family documents, saved electronically or in a waterproof container ☐ Sleeping bag or warm blanket for each person ☐ A complete change of clothes suited to your climate, and sturdy shoes ☐ Fire extinguisher ☐ Matches in a waterproof container ☐ Feminine supplies and personal hygiene items ☐ Mess kits, paper cups, plates, paper towels, plastic utensils ☐ Paper and pencil ☐ Books, games, puzzles and other activities for children Also keep ☐ A copy of this Arkpi folder on a USB drive ☐ A tourniquet (see ../01-emergency/severe-bleeding.md ) Sources (checked 2026-11-01) Ready.gov, Build A Kit: https://www.ready.gov/kit"},"11-preparedness/family-emergency-plan":{"title":"Family Emergency Plan","folder":"11-preparedness","html":"<h1 id=\"family-emergency-plan\">Family Emergency Plan<\/h1>\n<p>Make the plan <strong>together<\/strong>, write it down, and keep a copy in your emergency kit.\n<strong>Review it at least once a year<\/strong> (Noosa Council suggests a weekend in\n<strong>October<\/strong>, before the November–April disaster season) and whenever you move.<\/p>\n<blockquote>\n<p>Write your family's real details (names, phone numbers, addresses, medical\ninformation) in your own copy, kept in the <code>private/<\/code> folder or on paper.\n<strong>Not<\/strong> in this shared ark.<\/p>\n<\/blockquote>\n<h2 id=\"decide-now\">Decide now<\/h2>\n<ul>\n<li>☐ <strong>What could happen here?<\/strong> (Noosa: cyclone, flood, storm tide, bushfire,\n      heatwave; see <a href=\"#/12-noosa-tewantin/local-hazards\">../12-noosa-tewantin/local-hazards.md<\/a>)<\/li>\n<li>☐ <strong>Stay or go?<\/strong> Decide in advance for each hazard whether you'll shelter at\n      home or leave.<\/li>\n<li>☐ <strong>Where will you go if you leave?<\/strong> Ask family or friends outside the risk\n      area now whether you can stay with them.<\/li>\n<li>☐ <strong>How will you get there?<\/strong> Your evacuation route, and a second one.<\/li>\n<li>☐ <strong>Where will you meet<\/strong> if you're apart: one place near home, one outside\n      the area.<\/li>\n<li>☐ <strong>What if it happens while you're at work or school?<\/strong> Who picks up the\n      children? Who checks on anyone who needs help?<\/li>\n<li>☐ <strong>How and when to call 000 or 112.<\/strong> Make sure children know.<\/li>\n<li>☐ <strong>How to turn off water, power and gas<\/strong> at the mains.<\/li>\n<li>☐ <strong>Pets:<\/strong> where they'll go (most shelters don't take them) and 3 days of\n      their food.<\/li>\n<\/ul>\n<h2 id=\"have-ready\">Have ready<\/h2>\n<ul>\n<li>☐ <strong>Emergency kit<\/strong> for at least <strong>3 days<\/strong> at home (more if you could be cut\n      off): see <a href=\"#/11-preparedness/emergency-kit\">emergency-kit.md<\/a><\/li>\n<li>☐ <strong>Evacuation kit<\/strong> to take with it: sleeping bag, warm clothes, blankets\n      and pillows, valuables, and things for children<\/li>\n<li>☐ <strong>Important documents<\/strong> and some <strong>cash<\/strong> in sealed waterproof bags<\/li>\n<li>☐ Medicines and prescriptions (see <a href=\"#/02-first-aid/medicines-in-an-emergency\">../02-first-aid/medicines-in-an-emergency.md<\/a>)<\/li>\n<li>☐ A <strong>full fuel tank<\/strong> when bad weather is forecast<\/li>\n<li>☐ <strong>Noosa ALERT<\/strong> set up for warnings by SMS and email<\/li>\n<li>☐ Your <strong>insurance<\/strong> checked, and enough to cover you<\/li>\n<\/ul>\n<h2 id=\"check-on-others\">Check on others<\/h2>\n<p>Know your neighbours. When a warning comes, check on anyone who may need help:\nolder people, people living alone, people with a disability.<\/p>\n<p>Get Ready Queensland has an online planner that makes a printable plan:\nhttps://plan.getready.qld.gov.au<\/p>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>Get Ready Queensland, Make a plan: https://www.getready.qld.gov.au/plan<\/li>\n<li>Noosa Council, Emergency Action Guide 2024 (preparing in advance, emergency\n    and evacuation kits): https://www.noosa.qld.gov.au/Community/Disasters-and-emergencies<\/li>\n<\/ul>","text":"Family Emergency Plan Make the plan together , write it down, and keep a copy in your emergency kit. Review it at least once a year (Noosa Council suggests a weekend in October , before the November–April disaster season) and whenever you move. Write your family's real details (names, phone numbers, addresses, medical information) in your own copy, kept in the private/ folder or on paper. Not in this shared ark. Decide now ☐ What could happen here? (Noosa: cyclone, flood, storm tide, bushfire, heatwave; see ../12-noosa-tewantin/local-hazards.md ) ☐ Stay or go? Decide in advance for each hazard whether you'll shelter at home or leave. ☐ Where will you go if you leave? Ask family or friends outside the risk area now whether you can stay with them. ☐ How will you get there? Your evacuation route, and a second one. ☐ Where will you meet if you're apart: one place near home, one outside the area. ☐ What if it happens while you're at work or school? Who picks up the children? Who checks on anyone who needs help? ☐ How and when to call 000 or 112. Make sure children know. ☐ How to turn off water, power and gas at the mains. ☐ Pets: where they'll go (most shelters don't take them) and 3 days of their food. Have ready ☐ Emergency kit for at least 3 days at home (more if you could be cut off): see emergency-kit.md ☐ Evacuation kit to take with it: sleeping bag, warm clothes, blankets and pillows, valuables, and things for children ☐ Important documents and some cash in sealed waterproof bags ☐ Medicines and prescriptions (see ../02-first-aid/medicines-in-an-emergency.md ) ☐ A full fuel tank when bad weather is forecast ☐ Noosa ALERT set up for warnings by SMS and email ☐ Your insurance checked, and enough to cover you Check on others Know your neighbours. When a warning comes, check on anyone who may need help: older people, people living alone, people with a disability. Get Ready Queensland has an online planner that makes a printable plan: https://plan.getready.qld.gov.au Sources (checked 2026-11-01) Get Ready Queensland, Make a plan: https://www.getready.qld.gov.au/plan Noosa Council, Emergency Action Guide 2024 (preparing in advance, emergency and evacuation kits): https://www.noosa.qld.gov.au/Community/Disasters-and-emergencies"},"12-noosa-tewantin/README":{"title":"12 · Noosa / Tewantin (Queensland, Australia)","folder":"12-noosa-tewantin","html":"<h1 id=\"12-noosa-tewantin-queensland-australia\">12 · Noosa / Tewantin (Queensland, Australia)<\/h1>\n<p>Local information for Noosa Shire. <strong>Emergency: 000<\/strong> (or <strong>112<\/strong> from a\nmobile). <strong>Emergency radio: ABC Sunshine Coast 90.3 / 95.3 FM.<\/strong><\/p>\n<h2 id=\"pages\">Pages<\/h2>\n<ul>\n<li><a href=\"#/12-noosa-tewantin/emergency-contacts\">Emergency Contacts<\/a>: print this one<\/li>\n<li><a href=\"#/12-noosa-tewantin/warnings\">Understanding Warnings<\/a>: Advice / Watch and Act / Emergency Warning, fire danger ratings<\/li>\n<li><a href=\"#/12-noosa-tewantin/local-hazards\">Local Hazards<\/a>: what has happened here, and how to check your home's risk<\/li>\n<li><a href=\"#/12-noosa-tewantin/cyclone-and-storm-tide\">Cyclone and Storm Tide<\/a><\/li>\n<li><a href=\"#/12-noosa-tewantin/bushfire\">Bushfire<\/a><\/li>\n<li><a href=\"#/12-noosa-tewantin/heatwave\">Heatwave<\/a><\/li>\n<li>Tornado: see <a href=\"#/01-emergency/tornado\">../01-emergency/tornado.md<\/a><\/li>\n<li>Bites and stings (snakes, spiders, ticks, bluebottles):\n    <a href=\"#/02-first-aid/bites-and-stings-australia\">../02-first-aid/bites-and-stings-australia.md<\/a><\/li>\n<\/ul>\n<h2 id=\"official-documents-download-while-you-have-internet\">Official documents (download while you have internet)<\/h2>\n<p><code>bash\n./tools/download-local.sh<\/code><\/p>\n<p>This saves the following into <code>12-noosa-tewantin/downloads/<\/code>. They're not\nstored on GitHub: they're Noosa Council's documents, and the guide is too big\n(113 MB).<\/p>\n<ul>\n<li><strong>Noosa Emergency Action Guide<\/strong>: the council's full guide<\/li>\n<li><strong>Flood maps<\/strong> (minor/moderate and major/extreme) for <strong>Tewantin,\n    Noosaville and Noosa Heads<\/strong><\/li>\n<\/ul>\n<h2 id=\"australian-first-aid-differs-in-places\">Australian first aid differs in places<\/h2>\n<p>The first-aid pages in this ark come mostly from US sources. In Australia:<\/p>\n<ul>\n<li><strong>Choking:<\/strong> use <strong>back blows and chest thrusts<\/strong>, not abdominal thrusts. See\n    the note in <a href=\"#/01-emergency/choking\">../01-emergency/choking.md<\/a>.<\/li>\n<li><strong>Burns:<\/strong> cool under running water for <strong>at least 20 minutes<\/strong>. See the note\n    in <a href=\"#/01-emergency/burns\">../01-emergency/burns.md<\/a>.<\/li>\n<li><strong>CPR:<\/strong> the same 30:2 and 100–120 per minute, using the <strong>DRSABCD<\/strong> steps.\n    See the note in <a href=\"#/01-emergency/cpr\">../01-emergency/cpr.md<\/a>.<\/li>\n<\/ul>\n<h2 id=\"maps\">Maps<\/h2>\n<ul>\n<li><a href=\"#/10-navigation-and-maps/maps-noosa\">Maps of Noosa<\/a> and <a href=\"#/10-navigation-and-maps/key-places-noosa\">Key Places<\/a>: hospitals, police, fire, ambulance, pharmacies, fuel, water<\/li>\n<\/ul>\n<h2 id=\"to-add\">To add<\/h2>\n<ul>\n<li>Evacuation centres (they're announced on the Disaster Dashboard during an\n    event)<\/li>\n<\/ul>","text":"12 · Noosa / Tewantin (Queensland, Australia) Local information for Noosa Shire. Emergency: 000 (or 112 from a mobile). Emergency radio: ABC Sunshine Coast 90.3 / 95.3 FM. Pages Emergency Contacts : print this one Understanding Warnings : Advice / Watch and Act / Emergency Warning, fire danger ratings Local Hazards : what has happened here, and how to check your home's risk Cyclone and Storm Tide Bushfire Heatwave Tornado: see ../01-emergency/tornado.md Bites and stings (snakes, spiders, ticks, bluebottles): ../02-first-aid/bites-and-stings-australia.md Official documents (download while you have internet) bash ./tools/download-local.sh This saves the following into 12-noosa-tewantin/downloads/ . They're not stored on GitHub: they're Noosa Council's documents, and the guide is too big (113 MB). Noosa Emergency Action Guide : the council's full guide Flood maps (minor/moderate and major/extreme) for Tewantin, Noosaville and Noosa Heads Australian first aid differs in places The first-aid pages in this ark come mostly from US sources. In Australia: Choking: use back blows and chest thrusts , not abdominal thrusts. See the note in ../01-emergency/choking.md . Burns: cool under running water for at least 20 minutes . See the note in ../01-emergency/burns.md . CPR: the same 30:2 and 100–120 per minute, using the DRSABCD steps. See the note in ../01-emergency/cpr.md . Maps Maps of Noosa and Key Places : hospitals, police, fire, ambulance, pharmacies, fuel, water To add Evacuation centres (they're announced on the Disaster Dashboard during an event)"},"12-noosa-tewantin/bushfire":{"title":"Bushfire (Noosa)","folder":"12-noosa-tewantin","html":"<h1 id=\"bushfire-noosa\">Bushfire (Noosa)<\/h1>\n<p>You don't have to live in the bush to be at risk: being close enough for\n<strong>embers, burning material and smoke<\/strong> to reach you is enough. Fires can move\n<strong>faster than you can run<\/strong> and change direction suddenly.<\/p>\n<p>Fire season in South-East Queensland usually starts in <strong>July/August<\/strong> and can\nrun into summer. Check the daily <strong>Fire Danger Rating<\/strong> (see\n<a href=\"#/12-noosa-tewantin/warnings\">warnings.md<\/a>).<\/p>\n<h2 id=\"decide-now-leave-early-or-stay-and-defend\">Decide now: leave early, or stay and defend?<\/h2>\n<p>If you plan to leave, go <strong>well before<\/strong> a fire threatens, while the roads are\nstill safe.<\/p>\n<p>Only plan to stay if your property is well prepared, you are physically and\nmentally ready, and you have the equipment and know how to use it. On a\n<strong>Catastrophic<\/strong> day, leave bushfire risk areas.<\/p>\n<h2 id=\"before-a-fire\">Before a fire<\/h2>\n<ul>\n<li>Write a <strong>Bushfire Survival Plan<\/strong> with your household.<\/li>\n<li>Keep grass short and vegetation cleared around the house.<\/li>\n<li>Move flammable things away from the house: woodpiles, boxes, hanging\n    baskets, garden furniture, <strong>gas bottles<\/strong>.<\/li>\n<li>Keep driveways clear for fire trucks.<\/li>\n<li>Don't dump garden waste in reserves or bushland.<\/li>\n<li>Prepare your emergency and evacuation kits.<\/li>\n<li><strong>When a warning tells you to act, act immediately.<\/strong> Leave when advised,\n    even if it feels safe where you are, and go in the direction advised.<\/li>\n<\/ul>\n<h2 id=\"if-you-are-sheltering-as-the-fire-front-arrives\">If you are sheltering as the fire front arrives<\/h2>\n<ul>\n<li>Bring hoses and fittings inside. Go inside.<\/li>\n<li>Shelter on the <strong>side of the house away from the fire<\/strong>.<\/li>\n<li><strong>Drink lots of water.<\/strong><\/li>\n<li>Patrol for embers inside, especially in the <strong>roof space<\/strong>.<\/li>\n<li>Check on family and pets. Keep a way out.<\/li>\n<li>Close windows and doors, take down curtains, and move furniture away from\n    windows.<\/li>\n<\/ul>\n<h2 id=\"after-the-fire-front-passes\">After the fire front passes<\/h2>\n<ul>\n<li><strong>Emergency: 000<\/strong> (or 112 from a mobile).<\/li>\n<li>Listen to the radio for Queensland Fire Department warnings.<\/li>\n<li>If you evacuated, wait for the all-clear before leaving your safe place.<\/li>\n<li>Use a mask or a damp cloth over your face against smoke.<\/li>\n<li>Check the property for <strong>live electricity, leaking gas, sewage leaks, hot\n    embers<\/strong>, hanging branches and structural damage. If unsure, ask emergency\n    services. Don't take risks.<\/li>\n<li>Keep drinking water.<\/li>\n<\/ul>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>Noosa Council, Emergency Action Guide 2024 (Bushfire section):\n    https://www.noosa.qld.gov.au/Community/Disasters-and-emergencies<\/li>\n<li>Australian Fire Danger Rating System: https://afdrs.com.au/<\/li>\n<\/ul>","text":"Bushfire (Noosa) You don't have to live in the bush to be at risk: being close enough for embers, burning material and smoke to reach you is enough. Fires can move faster than you can run and change direction suddenly. Fire season in South-East Queensland usually starts in July/August and can run into summer. Check the daily Fire Danger Rating (see warnings.md ). Decide now: leave early, or stay and defend? If you plan to leave, go well before a fire threatens, while the roads are still safe. Only plan to stay if your property is well prepared, you are physically and mentally ready, and you have the equipment and know how to use it. On a Catastrophic day, leave bushfire risk areas. Before a fire Write a Bushfire Survival Plan with your household. Keep grass short and vegetation cleared around the house. Move flammable things away from the house: woodpiles, boxes, hanging baskets, garden furniture, gas bottles . Keep driveways clear for fire trucks. Don't dump garden waste in reserves or bushland. Prepare your emergency and evacuation kits. When a warning tells you to act, act immediately. Leave when advised, even if it feels safe where you are, and go in the direction advised. If you are sheltering as the fire front arrives Bring hoses and fittings inside. Go inside. Shelter on the side of the house away from the fire . Drink lots of water. Patrol for embers inside, especially in the roof space . Check on family and pets. Keep a way out. Close windows and doors, take down curtains, and move furniture away from windows. After the fire front passes Emergency: 000 (or 112 from a mobile). Listen to the radio for Queensland Fire Department warnings. If you evacuated, wait for the all-clear before leaving your safe place. Use a mask or a damp cloth over your face against smoke. Check the property for live electricity, leaking gas, sewage leaks, hot embers , hanging branches and structural damage. If unsure, ask emergency services. Don't take risks. Keep drinking water. Sources (checked 2026-11-01) Noosa Council, Emergency Action Guide 2024 (Bushfire section): https://www.noosa.qld.gov.au/Community/Disasters-and-emergencies Australian Fire Danger Rating System: https://afdrs.com.au/"},"12-noosa-tewantin/cyclone-and-storm-tide":{"title":"Cyclone and Storm Tide (Noosa)","folder":"12-noosa-tewantin","html":"<h1 id=\"cyclone-and-storm-tide-noosa\">Cyclone and Storm Tide (Noosa)<\/h1>\n<p>Most cyclones here come <strong>between November and April<\/strong>.<\/p>\n<h2 id=\"cyclone-categories\">Cyclone categories<\/h2>\n<table>\n<thead>\n<tr>\n<th>Cat.<\/th>\n<th>Strongest gusts<\/th>\n<th>Typical effects<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>1<\/strong><\/td>\n<td>under 125 km/h<\/td>\n<td>Minimal house damage; damage to some trees and caravans; boats may drag moorings<\/td>\n<\/tr>\n<tr>\n<td><strong>2<\/strong><\/td>\n<td>125–164 km/h<\/td>\n<td>Minor house damage; significant damage to trees and caravans; risk of power failure<\/td>\n<\/tr>\n<tr>\n<td><strong>3<\/strong> (severe)<\/td>\n<td>165–224 km/h<\/td>\n<td>Some roof and structural damage; some caravans destroyed; power failure likely<\/td>\n<\/tr>\n<tr>\n<td><strong>4<\/strong> (severe)<\/td>\n<td>225–279 km/h<\/td>\n<td>Significant roof and structural damage; dangerous flying debris; widespread power failures<\/td>\n<\/tr>\n<tr>\n<td><strong>5<\/strong> (severe)<\/td>\n<td>over 280 km/h<\/td>\n<td>Extremely dangerous, widespread destruction<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"before-the-season-october\">Before the season (October)<\/h2>\n<ul>\n<li>Clean up the yard; trim trees and overhanging branches; clear gutters.<\/li>\n<li>Check the roof, windows and loose fittings. Fit shutters if you can.<\/li>\n<li>Know how to turn off <strong>water, power and gas<\/strong> at the mains.<\/li>\n<li>Know whether you're in a <strong>storm tide evacuation zone<\/strong> (see\n    <a href=\"#/12-noosa-tewantin/local-hazards\">local-hazards.md<\/a>).<\/li>\n<li>Pack your emergency kit and an evacuation kit (see\n    <a href=\"#/11-preparedness/emergency-kit\">../11-preparedness/emergency-kit.md<\/a>).<\/li>\n<li>Boat owners: follow Maritime Safety Queensland's severe weather plan for the\n    region, double up mooring lines, and know where the boat must go.<\/li>\n<\/ul>\n<h2 id=\"when-a-cyclone-warning-is-issued\">When a cyclone warning is issued<\/h2>\n<p>A warning means winds are expected <strong>within 24 hours<\/strong>. <strong>Start your household\nemergency plan now.<\/strong> Depending on official advice:<\/p>\n<ul>\n<li>Collect children from school or childcare when told to, and go home.<\/li>\n<li>Park vehicles under solid shelter (handbrake on, in gear).<\/li>\n<li>Put outdoor furniture in the pool or inside, with other loose items.<\/li>\n<li>Close shutters, or board or tape windows (tape doesn't strengthen glass,\n    but limits shattering). Draw curtains and lock doors.<\/li>\n<li>Pack your evacuation kit. <strong>Leave if emergency services tell you to.<\/strong><\/li>\n<\/ul>\n<h2 id=\"during-the-cyclone\">During the cyclone<\/h2>\n<ul>\n<li>Listen to the radio: <strong>ABC Sunshine Coast 90.3 / 95.3 FM<\/strong>.<\/li>\n<li><strong>Stay inside, with your pets.<\/strong> Unplug electrical appliances. Keep the\n    fridge and freezer closed.<\/li>\n<li>Shelter in the <strong>strongest part of the house, away from windows<\/strong>: an\n    internal hallway or bathroom.<\/li>\n<li>If the building starts to break up, protect yourself with mattresses, rugs\n    or blankets under a strong table or bench, or hold onto something solid.<\/li>\n<li><strong>Beware the calm \"eye\".<\/strong> If the wind stops, it isn't over. Violent winds\n    will return from the other direction. <strong>Wait for the official all-clear.<\/strong><\/li>\n<li>If you're driving: stop (handbrake on, in gear) <strong>away from the sea<\/strong>, trees\n    and power lines, and stay in the car.<\/li>\n<\/ul>\n<h2 id=\"storm-tide\">Storm tide<\/h2>\n<p>A storm tide happens when a storm pushes sea water onshore on top of the normal\ntide, flooding low coastal land.<\/p>\n<p><img alt=\"Diagram: cyclone winds pile water toward the coast, and low pressure under the eye raises it further\" loading=\"lazy\" src=\"12-noosa-tewantin/images/storm-surge.png\" /><\/p>\n<p><em>Wind pushes water ashore; low pressure near the eye lifts it a little more.<\/em><\/p>\n<ul>\n<li>Stay inside until you're officially told it's safe.<\/li>\n<li>Don't use wet electrical appliances. Watch for fallen power lines, damaged\n    bridges and trees.<\/li>\n<li><strong>\"If it's flooded, forget it.\"<\/strong> Don't enter floodwater.<\/li>\n<\/ul>\n<h2 id=\"after\">After<\/h2>\n<ul>\n<li><strong>Don't go outside until officially advised it's safe.<\/strong> If you evacuated,\n    don't return until told to, and use the recommended route.<\/li>\n<li><strong>Check for gas leaks<\/strong> (see <a href=\"#/01-emergency/gas-leak\">../01-emergency/gas-leak.md<\/a>)\n    and fallen power lines.<\/li>\n<li>Wear rubber boots and gloves for cleanup. Treat everything that touched\n    floodwater as contaminated, and wash your hands after handling it.<\/li>\n<li>Watch for damaged floors, walls and ceilings, and for <strong>snakes<\/strong>.<\/li>\n<li>Throw out food that touched floodwater, and follow any instructions about\n    treating water (see <a href=\"#/03-water/making-water-safe\">../03-water/making-water-safe.md<\/a>).<\/li>\n<li>Don't go sightseeing. Check on neighbours, friends and family. Avoid\n    unnecessary phone calls so lines stay free.<\/li>\n<\/ul>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>Noosa Council, Emergency Action Guide 2024 (Cyclone and Storm surge\n    sections): https://www.noosa.qld.gov.au/Community/Disasters-and-emergencies<\/li>\n<li>Diagram: see <a href=\"#/12-noosa-tewantin/images/CREDITS\">images/CREDITS.md<\/a><\/li>\n<\/ul>","text":"Cyclone and Storm Tide (Noosa) Most cyclones here come between November and April . Cyclone categories Cat. Strongest gusts Typical effects 1 under 125 km/h Minimal house damage; damage to some trees and caravans; boats may drag moorings 2 125–164 km/h Minor house damage; significant damage to trees and caravans; risk of power failure 3 (severe) 165–224 km/h Some roof and structural damage; some caravans destroyed; power failure likely 4 (severe) 225–279 km/h Significant roof and structural damage; dangerous flying debris; widespread power failures 5 (severe) over 280 km/h Extremely dangerous, widespread destruction Before the season (October) Clean up the yard; trim trees and overhanging branches; clear gutters. Check the roof, windows and loose fittings. Fit shutters if you can. Know how to turn off water, power and gas at the mains. Know whether you're in a storm tide evacuation zone (see local-hazards.md ). Pack your emergency kit and an evacuation kit (see ../11-preparedness/emergency-kit.md ). Boat owners: follow Maritime Safety Queensland's severe weather plan for the region, double up mooring lines, and know where the boat must go. When a cyclone warning is issued A warning means winds are expected within 24 hours . Start your household emergency plan now. Depending on official advice: Collect children from school or childcare when told to, and go home. Park vehicles under solid shelter (handbrake on, in gear). Put outdoor furniture in the pool or inside, with other loose items. Close shutters, or board or tape windows (tape doesn't strengthen glass, but limits shattering). Draw curtains and lock doors. Pack your evacuation kit. Leave if emergency services tell you to. During the cyclone Listen to the radio: ABC Sunshine Coast 90.3 / 95.3 FM . Stay inside, with your pets. Unplug electrical appliances. Keep the fridge and freezer closed. Shelter in the strongest part of the house, away from windows : an internal hallway or bathroom. If the building starts to break up, protect yourself with mattresses, rugs or blankets under a strong table or bench, or hold onto something solid. Beware the calm \"eye\". If the wind stops, it isn't over. Violent winds will return from the other direction. Wait for the official all-clear. If you're driving: stop (handbrake on, in gear) away from the sea , trees and power lines, and stay in the car. Storm tide A storm tide happens when a storm pushes sea water onshore on top of the normal tide, flooding low coastal land. Wind pushes water ashore; low pressure near the eye lifts it a little more. Stay inside until you're officially told it's safe. Don't use wet electrical appliances. Watch for fallen power lines, damaged bridges and trees. \"If it's flooded, forget it.\" Don't enter floodwater. After Don't go outside until officially advised it's safe. If you evacuated, don't return until told to, and use the recommended route. Check for gas leaks (see ../01-emergency/gas-leak.md ) and fallen power lines. Wear rubber boots and gloves for cleanup. Treat everything that touched floodwater as contaminated, and wash your hands after handling it. Watch for damaged floors, walls and ceilings, and for snakes . Throw out food that touched floodwater, and follow any instructions about treating water (see ../03-water/making-water-safe.md ). Don't go sightseeing. Check on neighbours, friends and family. Avoid unnecessary phone calls so lines stay free. Sources (checked 2026-11-01) Noosa Council, Emergency Action Guide 2024 (Cyclone and Storm surge sections): https://www.noosa.qld.gov.au/Community/Disasters-and-emergencies Diagram: see images/CREDITS.md"},"12-noosa-tewantin/emergency-contacts":{"title":"Emergency Contacts: Noosa / Tewantin (QLD)","folder":"12-noosa-tewantin","html":"<h1 id=\"emergency-contacts-noosa-tewantin-qld\">Emergency Contacts: Noosa / Tewantin (QLD)<\/h1>\n<blockquote>\n<p><strong>Life-threatening emergency: 000<\/strong> (Police, Fire, Ambulance)\nFrom a mobile you can also dial <strong>112<\/strong>.\nOn the water: <strong>VHF channel 16<\/strong> (Marine Rescue Queensland).<\/p>\n<\/blockquote>\n<p>Print this page and keep it with your emergency kit. Phones and internet may be\ndown: <strong>NBN home phones and internet need power at both ends<\/strong>, so they can\nstop working in a power outage even if you have a backup at home.<\/p>\n<h2 id=\"emergency-help\">Emergency help<\/h2>\n<table>\n<thead>\n<tr>\n<th>Who<\/th>\n<th>Number<\/th>\n<th>For<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Police, Fire, Ambulance<\/td>\n<td><strong>000<\/strong> (or <strong>112<\/strong> from a mobile)<\/td>\n<td>Life-threatening emergencies<\/td>\n<\/tr>\n<tr>\n<td>SES (State Emergency Service)<\/td>\n<td><strong>132 500<\/strong><\/td>\n<td>Damaged roof, rising floodwater, trees on buildings, storm damage<\/td>\n<\/tr>\n<tr>\n<td>Poisons Information<\/td>\n<td><strong>13 11 26<\/strong><\/td>\n<td>Poisoning, bites, stings, overdoses<\/td>\n<\/tr>\n<tr>\n<td>13 HEALTH<\/td>\n<td><strong>13 43 25 84<\/strong><\/td>\n<td>Non-urgent health advice (24/7 nurse)<\/td>\n<\/tr>\n<tr>\n<td>healthdirect<\/td>\n<td><strong>1800 022 222<\/strong><\/td>\n<td>Health advice from a registered nurse (24/7)<\/td>\n<\/tr>\n<tr>\n<td>Policelink<\/td>\n<td><strong>131 444<\/strong><\/td>\n<td>Non-emergency police<\/td>\n<\/tr>\n<tr>\n<td>Tsunami warnings<\/td>\n<td><strong>1300 878 6264<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Bureau of Meteorology<\/td>\n<td><strong>1300 659 210<\/strong><\/td>\n<td>Weather and cyclone warnings<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"local\">Local<\/h2>\n<table>\n<thead>\n<tr>\n<th>Who<\/th>\n<th>Number<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Noosa Council (and Local Disaster Management Group)<\/td>\n<td><strong>(07) 5329 6500<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Noosa Hospital<\/td>\n<td><strong>(07) 5455 9200<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Sunshine Coast University Hospital<\/td>\n<td><strong>(07) 5202 0000<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Nambour Hospital<\/td>\n<td><strong>(07) 5470 6600<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Gympie Hospital<\/td>\n<td><strong>(07) 5489 8444<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Wildlife Rehabilitation Centre (Eumundi)<\/td>\n<td><strong>(07) 5442 8057<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"utilities\">Utilities<\/h2>\n<table>\n<thead>\n<tr>\n<th>Who<\/th>\n<th>Number<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Energex: emergencies (fallen power lines etc.)<\/td>\n<td><strong>13 19 62<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Energex: report a fault<\/td>\n<td><strong>13 62 62<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Unitywater (water and sewerage)<\/td>\n<td><strong>1300 086 489<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Telstra faults<\/td>\n<td><strong>13 22 03<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Road and travel conditions (TMR)<\/td>\n<td><strong>13 19 40<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"radio-emergency-broadcaster\">Radio (emergency broadcaster)<\/h2>\n<p><strong>ABC Sunshine Coast: 90.3 FM or 95.3 FM.<\/strong> Keep a battery or wind-up radio.<\/p>\n<h2 id=\"after-a-disaster\">After a disaster<\/h2>\n<table>\n<thead>\n<tr>\n<th>Who<\/th>\n<th>Number<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Community Recovery Hotline<\/td>\n<td><strong>1800 173 349<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Australian Government Emergency Information Line<\/td>\n<td><strong>180 22 66<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Red Cross<\/td>\n<td><strong>1300 554 419<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Lifeline (crisis support)<\/td>\n<td><strong>13 11 14<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Legal Aid (help with insurance claims)<\/td>\n<td><strong>1300 651 188<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Department of Housing<\/td>\n<td><strong>1800 806 197<\/strong><\/td>\n<\/tr>\n<tr>\n<td>RSPCA QLD 24/7 animal emergencies<\/td>\n<td><strong>1300 264 625<\/strong><\/td>\n<\/tr>\n<tr>\n<td>RSPCA QLD lost and found<\/td>\n<td><strong>1300 363 736<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Translating and Interpreting Service (24/7)<\/td>\n<td><strong>13 14 50<\/strong><\/td>\n<\/tr>\n<tr>\n<td>National Relay Service (hearing or speech impairment)<\/td>\n<td><strong>1800 555 677<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"online-when-the-internet-works\">Online (when the internet works)<\/h2>\n<ul>\n<li><strong>Noosa Disaster Dashboard<\/strong>, the council's main source during a disaster:\n    https://disaster.noosa.qld.gov.au (road conditions, power outages, warnings,\n    river heights, evacuation centres, flood cameras)<\/li>\n<li><strong>Noosa ALERT<\/strong>: free SMS and email warnings. Sign up on the dashboard.<\/li>\n<li>Bureau of Meteorology: https://www.bom.gov.au<\/li>\n<li>Queensland alerts: https://www.qld.gov.au/alerts<\/li>\n<li>Get Ready Queensland: https://www.getready.qld.gov.au<\/li>\n<\/ul>\n<h2 id=\"my-own-numbers\">My own numbers<\/h2>\n<p>(Write yours in. Keep personal details in the private folder, not here.)<\/p>\n<ul>\n<li>Gas supplier emergency: ______________________<\/li>\n<li>Family meeting point: see your private plan<\/li>\n<\/ul>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>Noosa Council, Emergency Action Guide (contacts page) and Disaster Dashboard:\n    https://disaster.noosa.qld.gov.au<\/li>\n<li>Get Ready Queensland, Emergency services contacts:\n    https://www.getready.qld.gov.au/during/emergency-services<\/li>\n<li>healthdirect, Spider bites (healthdirect number):\n    https://www.healthdirect.gov.au/spider-bites<\/li>\n<\/ul>","text":"Emergency Contacts: Noosa / Tewantin (QLD) Life-threatening emergency: 000 (Police, Fire, Ambulance) From a mobile you can also dial 112 . On the water: VHF channel 16 (Marine Rescue Queensland). Print this page and keep it with your emergency kit. Phones and internet may be down: NBN home phones and internet need power at both ends , so they can stop working in a power outage even if you have a backup at home. Emergency help Who Number For Police, Fire, Ambulance 000 (or 112 from a mobile) Life-threatening emergencies SES (State Emergency Service) 132 500 Damaged roof, rising floodwater, trees on buildings, storm damage Poisons Information 13 11 26 Poisoning, bites, stings, overdoses 13 HEALTH 13 43 25 84 Non-urgent health advice (24/7 nurse) healthdirect 1800 022 222 Health advice from a registered nurse (24/7) Policelink 131 444 Non-emergency police Tsunami warnings 1300 878 6264 Bureau of Meteorology 1300 659 210 Weather and cyclone warnings Local Who Number Noosa Council (and Local Disaster Management Group) (07) 5329 6500 Noosa Hospital (07) 5455 9200 Sunshine Coast University Hospital (07) 5202 0000 Nambour Hospital (07) 5470 6600 Gympie Hospital (07) 5489 8444 Wildlife Rehabilitation Centre (Eumundi) (07) 5442 8057 Utilities Who Number Energex: emergencies (fallen power lines etc.) 13 19 62 Energex: report a fault 13 62 62 Unitywater (water and sewerage) 1300 086 489 Telstra faults 13 22 03 Road and travel conditions (TMR) 13 19 40 Radio (emergency broadcaster) ABC Sunshine Coast: 90.3 FM or 95.3 FM. Keep a battery or wind-up radio. After a disaster Who Number Community Recovery Hotline 1800 173 349 Australian Government Emergency Information Line 180 22 66 Red Cross 1300 554 419 Lifeline (crisis support) 13 11 14 Legal Aid (help with insurance claims) 1300 651 188 Department of Housing 1800 806 197 RSPCA QLD 24/7 animal emergencies 1300 264 625 RSPCA QLD lost and found 1300 363 736 Translating and Interpreting Service (24/7) 13 14 50 National Relay Service (hearing or speech impairment) 1800 555 677 Online (when the internet works) Noosa Disaster Dashboard , the council's main source during a disaster: https://disaster.noosa.qld.gov.au (road conditions, power outages, warnings, river heights, evacuation centres, flood cameras) Noosa ALERT : free SMS and email warnings. Sign up on the dashboard. Bureau of Meteorology: https://www.bom.gov.au Queensland alerts: https://www.qld.gov.au/alerts Get Ready Queensland: https://www.getready.qld.gov.au My own numbers (Write yours in. Keep personal details in the private folder, not here.) Gas supplier emergency: ______________________ Family meeting point: see your private plan Sources (checked 2026-11-01) Noosa Council, Emergency Action Guide (contacts page) and Disaster Dashboard: https://disaster.noosa.qld.gov.au Get Ready Queensland, Emergency services contacts: https://www.getready.qld.gov.au/during/emergency-services healthdirect, Spider bites (healthdirect number): https://www.healthdirect.gov.au/spider-bites"},"12-noosa-tewantin/heatwave":{"title":"Heatwave (Noosa)","folder":"12-noosa-tewantin","html":"<h1 id=\"heatwave-noosa\">Heatwave (Noosa)<\/h1>\n<p>A heatwave is <strong>three or more days<\/strong> of maximum and minimum temperatures that\nare unusual for the area. <strong>Severe heatwaves have killed more people than any\nother natural hazard in Australia.<\/strong> They can also make power and transport\nfail.<\/p>\n<p>Most at risk: the elderly, pregnant women, babies and young children, but\nanyone can be affected.<\/p>\n<h2 id=\"before\">Before<\/h2>\n<ul>\n<li>Check the Noosa Disaster Dashboard and the Bureau of Meteorology.<\/li>\n<li>Plan to be indoors or somewhere air-conditioned.<\/li>\n<li>Fit blinds or curtains to keep heat out. Check fans and air-conditioners\n    work.<\/li>\n<li>Have enough food, water and medicine.<\/li>\n<\/ul>\n<h2 id=\"during\">During<\/h2>\n<ul>\n<li><strong>Stay out of the sun, especially 11 am to 3 pm.<\/strong><\/li>\n<li>Wear loose, cool clothes; hat, sunglasses and sunscreen outside.<\/li>\n<li>Take cool showers or splash yourself with water.<\/li>\n<li><strong>Drink plenty of water.<\/strong> Avoid caffeine, alcohol and heavy protein meals.<\/li>\n<li>Close curtains and blinds. Avoid physical effort.<\/li>\n<\/ul>\n<p><strong>Know the warning signs:<\/strong> breathlessness, chest pain, confusion, intense\nthirst, weakness, dizziness, cramps that won't stop. See\n<a href=\"#/02-first-aid/heat-illness\">../02-first-aid/heat-illness.md<\/a>. For a\nlife-threatening emergency, call <strong>000<\/strong>.<\/p>\n<h2 id=\"after\">After<\/h2>\n<p>Check on friends, neighbours and anyone less able to look after themselves.<\/p>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>Noosa Council, Emergency Action Guide 2024 (Heatwave section):\n    https://www.noosa.qld.gov.au/Community/Disasters-and-emergencies<\/li>\n<\/ul>","text":"Heatwave (Noosa) A heatwave is three or more days of maximum and minimum temperatures that are unusual for the area. Severe heatwaves have killed more people than any other natural hazard in Australia. They can also make power and transport fail. Most at risk: the elderly, pregnant women, babies and young children, but anyone can be affected. Before Check the Noosa Disaster Dashboard and the Bureau of Meteorology. Plan to be indoors or somewhere air-conditioned. Fit blinds or curtains to keep heat out. Check fans and air-conditioners work. Have enough food, water and medicine. During Stay out of the sun, especially 11 am to 3 pm. Wear loose, cool clothes; hat, sunglasses and sunscreen outside. Take cool showers or splash yourself with water. Drink plenty of water. Avoid caffeine, alcohol and heavy protein meals. Close curtains and blinds. Avoid physical effort. Know the warning signs: breathlessness, chest pain, confusion, intense thirst, weakness, dizziness, cramps that won't stop. See ../02-first-aid/heat-illness.md . For a life-threatening emergency, call 000 . After Check on friends, neighbours and anyone less able to look after themselves. Sources (checked 2026-11-01) Noosa Council, Emergency Action Guide 2024 (Heatwave section): https://www.noosa.qld.gov.au/Community/Disasters-and-emergencies"},"12-noosa-tewantin/images/CREDITS":{"title":"Image Credits: 12-noosa-tewantin","folder":"12-noosa-tewantin","html":"<h1 id=\"image-credits-12-noosa-tewantin\">Image Credits: 12-noosa-tewantin<\/h1>\n<table>\n<thead>\n<tr>\n<th>Image<\/th>\n<th>Source<\/th>\n<th>License<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>storm-surge.png<\/code><\/td>\n<td>Holly Cheng, after an original graphic by Robert Simmon, NASA GSFC: <a class=\"ext\" href=\"https://commons.wikimedia.org/wiki/File:Storm_surge_graphic.svg\" rel=\"noopener\" target=\"_blank\">Storm surge graphic.svg<\/a>, Wikimedia Commons, converted to greyscale<\/td>\n<td>Public domain<\/td>\n<\/tr>\n<\/tbody>\n<\/table>","text":"Image Credits: 12-noosa-tewantin Image Source License storm-surge.png Holly Cheng, after an original graphic by Robert Simmon, NASA GSFC: Storm surge graphic.svg , Wikimedia Commons, converted to greyscale Public domain"},"12-noosa-tewantin/local-hazards":{"title":"Local Hazards: Noosa Shire","folder":"12-noosa-tewantin","html":"<h1 id=\"local-hazards-noosa-shire\">Local Hazards: Noosa Shire<\/h1>\n<p><strong>Cyclones and flooding are the most common disasters here.<\/strong> Noosa can also\nhave bushfire, severe storms, storm tide, heatwave, tsunami, earthquake and\nlandslide.<\/p>\n<p><strong>Main disaster season: November to April.<\/strong> Noosa Council suggests setting\naside a weekend each <strong>October<\/strong> to get your home and family ready.<\/p>\n<h2 id=\"what-has-happened-here\">What has happened here<\/h2>\n<table>\n<thead>\n<tr>\n<th>Hazard<\/th>\n<th>Local history<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Cyclone<\/strong><\/td>\n<td>48 tropical or ex-tropical cyclones have affected Noosa since 1887. <strong>Cyclone Daisy<\/strong> crossed directly over Noosa in February 1972 (Category 2).<\/td>\n<\/tr>\n<tr>\n<td><strong>Flood<\/strong><\/td>\n<td>The <strong>Noosa River<\/strong> catchment (most of the shire) and the <strong>Mary River<\/strong> catchment flood. Last major flood: <strong>1992<\/strong>, about 540 lots flooded. In April 2009 a flash flood in the <strong>Kin Kin Creek<\/strong> catchment brought about 900 mm of rain in under 6 hours.<\/td>\n<\/tr>\n<tr>\n<td><strong>Storm tide<\/strong><\/td>\n<td>Minor storm tides are frequent (some \"king tides\" are actually minor storm tides). The most recent notable one was during <strong>Cyclone Oma<\/strong> (February 2019).<\/td>\n<\/tr>\n<tr>\n<td><strong>East Coast Lows<\/strong><\/td>\n<td>Intense storms off the coast, about 10 significant ones a year, at any time of year: damaging winds and surf, heavy rain, erosion, flooding.<\/td>\n<\/tr>\n<tr>\n<td><strong>Bushfire<\/strong><\/td>\n<td>The <strong>2019 Peregian, Cooroibah and North Shore fires<\/strong> burned more than 2,000 hectares.<\/td>\n<\/tr>\n<tr>\n<td><strong>Tornado<\/strong><\/td>\n<td>A tornado hit <strong>Kin Kin<\/strong> in 1971, killing three people. Kin Kin had tornadoes again as recently as 1984.<\/td>\n<\/tr>\n<tr>\n<td><strong>Landslide<\/strong><\/td>\n<td>Black Mountain.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"is-my-home-at-risk\">Is my home at risk?<\/h2>\n<p>Check these <strong>now<\/strong>, while the internet works:<\/p>\n<ul>\n<li><strong>Flood maps:<\/strong> Noosa Council has minor/moderate and major/extreme flood maps\n    for 27 localities, including Tewantin, Noosaville and Noosa Heads. Run\n    <code>./tools/download-local.sh<\/code> to save the Tewantin-area maps into\n    <code>12-noosa-tewantin/downloads/<\/code>, or see\n    https://www.noosa.qld.gov.au/community/maps/disaster-mapping<\/li>\n<li><strong>Storm tide evacuation zone:<\/strong> check your address on the Disaster Dashboard\n    (https://disaster.noosa.qld.gov.au). If your home is in a zone, plan to\n    evacuate. If it was <strong>built before 1982<\/strong>, or you're not sure, ask the\n    council about its construction ((07) 5329 6500).<\/li>\n<li><strong>Bushfire prone areas:<\/strong> interactive map on the council's disaster mapping\n    page (link above).<\/li>\n<\/ul>\n<h2 id=\"pages-for-each-hazard\">Pages for each hazard<\/h2>\n<ul>\n<li><a href=\"#/12-noosa-tewantin/cyclone-and-storm-tide\">Cyclone and Storm Tide<\/a><\/li>\n<li><a href=\"#/12-noosa-tewantin/bushfire\">Bushfire<\/a><\/li>\n<li><a href=\"#/12-noosa-tewantin/heatwave\">Heatwave<\/a><\/li>\n<li>Flood: see <a href=\"#/01-emergency/flood\">../01-emergency/flood.md<\/a>. Locally, the\n    council's rule is <strong>\"If it's flooded, forget it.\"<\/strong><\/li>\n<li>Severe thunderstorms: warnings are issued for gusts of <strong>90 km/h or more<\/strong>,\n    tornadoes, hail <strong>2 cm or larger<\/strong>, or very heavy rain that causes flash\n    flooding. They often give <strong>less than an hour's<\/strong> notice.<\/li>\n<\/ul>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>Noosa Council, Emergency Action Guide 2024 (4th edition):\n    https://www.noosa.qld.gov.au/Community/Disasters-and-emergencies<\/li>\n<li>Noosa Council, Disaster Mapping:\n    https://www.noosa.qld.gov.au/community/maps/disaster-mapping<\/li>\n<\/ul>","text":"Local Hazards: Noosa Shire Cyclones and flooding are the most common disasters here. Noosa can also have bushfire, severe storms, storm tide, heatwave, tsunami, earthquake and landslide. Main disaster season: November to April. Noosa Council suggests setting aside a weekend each October to get your home and family ready. What has happened here Hazard Local history Cyclone 48 tropical or ex-tropical cyclones have affected Noosa since 1887. Cyclone Daisy crossed directly over Noosa in February 1972 (Category 2). Flood The Noosa River catchment (most of the shire) and the Mary River catchment flood. Last major flood: 1992 , about 540 lots flooded. In April 2009 a flash flood in the Kin Kin Creek catchment brought about 900 mm of rain in under 6 hours. Storm tide Minor storm tides are frequent (some \"king tides\" are actually minor storm tides). The most recent notable one was during Cyclone Oma (February 2019). East Coast Lows Intense storms off the coast, about 10 significant ones a year, at any time of year: damaging winds and surf, heavy rain, erosion, flooding. Bushfire The 2019 Peregian, Cooroibah and North Shore fires burned more than 2,000 hectares. Tornado A tornado hit Kin Kin in 1971, killing three people. Kin Kin had tornadoes again as recently as 1984. Landslide Black Mountain. Is my home at risk? Check these now , while the internet works: Flood maps: Noosa Council has minor/moderate and major/extreme flood maps for 27 localities, including Tewantin, Noosaville and Noosa Heads. Run ./tools/download-local.sh to save the Tewantin-area maps into 12-noosa-tewantin/downloads/ , or see https://www.noosa.qld.gov.au/community/maps/disaster-mapping Storm tide evacuation zone: check your address on the Disaster Dashboard (https://disaster.noosa.qld.gov.au). If your home is in a zone, plan to evacuate. If it was built before 1982 , or you're not sure, ask the council about its construction ((07) 5329 6500). Bushfire prone areas: interactive map on the council's disaster mapping page (link above). Pages for each hazard Cyclone and Storm Tide Bushfire Heatwave Flood: see ../01-emergency/flood.md . Locally, the council's rule is \"If it's flooded, forget it.\" Severe thunderstorms: warnings are issued for gusts of 90 km/h or more , tornadoes, hail 2 cm or larger , or very heavy rain that causes flash flooding. They often give less than an hour's notice. Sources (checked 2026-11-01) Noosa Council, Emergency Action Guide 2024 (4th edition): https://www.noosa.qld.gov.au/Community/Disasters-and-emergencies Noosa Council, Disaster Mapping: https://www.noosa.qld.gov.au/community/maps/disaster-mapping"},"12-noosa-tewantin/warnings":{"title":"Understanding Warnings (Queensland)","folder":"12-noosa-tewantin","html":"<h1 id=\"understanding-warnings-queensland\">Understanding Warnings (Queensland)<\/h1>\n<h2 id=\"australian-warning-system\">Australian Warning System<\/h2>\n<p>Used for bushfire, flood, storm, cyclone, heat and other hazards.<\/p>\n<table>\n<thead>\n<tr>\n<th>Level<\/th>\n<th>Colour<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Advice<\/strong><\/td>\n<td>🟨 Yellow<\/td>\n<td>An incident has started. <strong>No immediate danger.<\/strong> Stay up to date in case it changes.<\/td>\n<\/tr>\n<tr>\n<td><strong>Watch and Act<\/strong><\/td>\n<td>🟧 Orange<\/td>\n<td><strong>Heightened threat.<\/strong> Conditions are changing; <strong>act now<\/strong> to protect yourself and your family.<\/td>\n<\/tr>\n<tr>\n<td><strong>Emergency Warning<\/strong><\/td>\n<td>🟥 Red<\/td>\n<td><strong>Highest level.<\/strong> You may be in danger and must <strong>act immediately<\/strong>. Any delay puts your life at risk.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Each warning comes with an action, for example:<\/p>\n<ul>\n<li><em>Advice:<\/em> Prepare now · Stay informed · Monitor conditions · Avoid the area · Return with caution<\/li>\n<li><em>Watch and Act:<\/em> Prepare to leave · Leave now (if you are not prepared) · Move to higher ground · Do not enter flood water · Be aware of ember attack · Prepare for isolation<\/li>\n<li><em>Emergency Warning:<\/em> <strong>Leave immediately<\/strong> · Shelter indoors now · <strong>Too late / dangerous to leave<\/strong><\/li>\n<\/ul>\n<h2 id=\"fire-danger-ratings\">Fire Danger Ratings<\/h2>\n<p>How dangerous a fire <strong>would be<\/strong> if one started today (not a warning that\nthere is a fire).<\/p>\n<table>\n<thead>\n<tr>\n<th>Rating<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Moderate<\/strong><\/td>\n<td>Plan and prepare<\/td>\n<\/tr>\n<tr>\n<td><strong>High<\/strong><\/td>\n<td>Prepare to act<\/td>\n<\/tr>\n<tr>\n<td><strong>Extreme<\/strong><\/td>\n<td>Take action now to protect your life and property<\/td>\n<\/tr>\n<tr>\n<td><strong>Catastrophic<\/strong><\/td>\n<td><strong>For your survival, leave bush fire risk areas<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Noosa is in the <strong>Southeast Coast<\/strong> fire weather district. The fire season in\nSouth-East Queensland usually starts in <strong>July/August<\/strong> and can run into\nsummer.<\/p>\n<h2 id=\"other-alerts\">Other alerts<\/h2>\n<ul>\n<li><strong>Standard Emergency Warning Signal (SEWS):<\/strong> a <strong>wailing siren<\/strong> played at\n    the start of serious warnings on radio and TV. If you hear it, listen.<\/li>\n<li><strong>Emergency Alert:<\/strong> voice messages to landlines and text messages to mobiles\n    in the affected area. Works on all carriers, with no sign-up needed.<\/li>\n<li><strong>Door-knocks:<\/strong> emergency services may come to your door with warnings.<\/li>\n<li><strong>Noosa ALERT:<\/strong> the council's opt-in SMS and email alerts. Sign up at\n    https://disaster.noosa.qld.gov.au<\/li>\n<\/ul>\n<p>When you get a warning: <strong>act immediately<\/strong>, make sure everyone in the house\nknows, check on neighbours who may need help, and start your household\nemergency plan.<\/p>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>Queensland Government, Watch for the warnings (Australian Warning System):\n    https://www.disaster.qld.gov.au/watch-for-the-warnings<\/li>\n<li>Australian Fire Danger Rating System: https://afdrs.com.au/<\/li>\n<li>Noosa Council, Emergency Action Guide (warnings, bushfire season):\n    https://www.noosa.qld.gov.au/Community/Disasters-and-emergencies<\/li>\n<li>Noosa Disaster Dashboard (fire weather district):\n    https://disaster.noosa.qld.gov.au<\/li>\n<\/ul>","text":"Understanding Warnings (Queensland) Australian Warning System Used for bushfire, flood, storm, cyclone, heat and other hazards. Level Colour Meaning Advice 🟨 Yellow An incident has started. No immediate danger. Stay up to date in case it changes. Watch and Act 🟧 Orange Heightened threat. Conditions are changing; act now to protect yourself and your family. Emergency Warning 🟥 Red Highest level. You may be in danger and must act immediately . Any delay puts your life at risk. Each warning comes with an action, for example: Advice: Prepare now · Stay informed · Monitor conditions · Avoid the area · Return with caution Watch and Act: Prepare to leave · Leave now (if you are not prepared) · Move to higher ground · Do not enter flood water · Be aware of ember attack · Prepare for isolation Emergency Warning: Leave immediately · Shelter indoors now · Too late / dangerous to leave Fire Danger Ratings How dangerous a fire would be if one started today (not a warning that there is a fire). Rating What to do Moderate Plan and prepare High Prepare to act Extreme Take action now to protect your life and property Catastrophic For your survival, leave bush fire risk areas Noosa is in the Southeast Coast fire weather district. The fire season in South-East Queensland usually starts in July/August and can run into summer. Other alerts Standard Emergency Warning Signal (SEWS): a wailing siren played at the start of serious warnings on radio and TV. If you hear it, listen. Emergency Alert: voice messages to landlines and text messages to mobiles in the affected area. Works on all carriers, with no sign-up needed. Door-knocks: emergency services may come to your door with warnings. Noosa ALERT: the council's opt-in SMS and email alerts. Sign up at https://disaster.noosa.qld.gov.au When you get a warning: act immediately , make sure everyone in the house knows, check on neighbours who may need help, and start your household emergency plan. Sources (checked 2026-11-01) Queensland Government, Watch for the warnings (Australian Warning System): https://www.disaster.qld.gov.au/watch-for-the-warnings Australian Fire Danger Rating System: https://afdrs.com.au/ Noosa Council, Emergency Action Guide (warnings, bushfire season): https://www.noosa.qld.gov.au/Community/Disasters-and-emergencies Noosa Disaster Dashboard (fire weather district): https://disaster.noosa.qld.gov.au"},"13-literature/README":{"title":"13 · Literature","folder":"13-literature","html":"<h1 id=\"13-literature\">13 · Literature<\/h1>\n<p><strong>100 great books<\/strong>, free and in the public domain, as plain text files (87 MB in total).\nThey open in any text editor, browser, phone or e-reader, with nothing to install.<\/p>\n<h2 id=\"copyright\">Copyright<\/h2>\n<p>Every book here is in the public domain in <strong>both Australia and the United States<\/strong>:\nthe authors (and translators) all died before 1955, and every edition was published long ago.<\/p>\n<p>The files come from <strong>Project Gutenberg<\/strong> (https://www.gutenberg.org), unchanged, with\nProject Gutenberg's licence at the start and end of each file. They may be copied and shared freely.<\/p>\n<h2 id=\"novels-in-english-41\">Novels in English (41)<\/h2>\n<table>\n<thead>\n<tr>\n<th>Book<\/th>\n<th>Author<\/th>\n<th>Size<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><a href=\"13-literature/novels/pride-and-prejudice-austen.txt\" target=\"_blank\">Pride and Prejudice<\/a><\/td>\n<td>Jane Austen (1775–1817)<\/td>\n<td>754 KB<\/td>\n<\/tr>\n<tr>\n<td><a href=\"13-literature/novels/emma-austen.txt\" target=\"_blank\">Emma<\/a><\/td>\n<td>Jane Austen (1775–1817)<\/td>\n<td>911 KB<\/td>\n<\/tr>\n<tr>\n<td><a href=\"13-literature/novels/persuasion-austen.txt\" target=\"_blank\">Persuasion<\/a><\/td>\n<td>Jane Austen (1775–1817)<\/td>\n<td>485 KB<\/td>\n<\/tr>\n<tr>\n<td><a href=\"13-literature/novels/jane-eyre-bronte.txt\" target=\"_blank\">Jane Eyre<\/a><\/td>\n<td>Charlotte Brontë (1816–1855)<\/td>\n<td>1,059 KB<\/td>\n<\/tr>\n<tr>\n<td><a href=\"13   return `

function search(q) {
  q = q.trim().toLowerCase();
  if (!q) return [];
  const words = q.split(/\s+/);
  const hits = new Map();
  const add = (key, score) => hits.set(key, (hits.get(key) || 0) + score);
  for (const [word, key] of Object.entries(ARK.synonyms)) if (q.includes(word) || (word.length > 3 && word.startsWith(q))) add(key, 50);
  for (const [key, p] of Object.entries(ARK.pages)) {
    if (key.includes("/images/")) continue;
    const title = p.title.toLowerCase(), text = p.text.toLowerCase();
    if (title.includes(q)) add(key, 30);
    let all = true;
    for (const w of words) { if (title.includes(w)) add(key, 5); else if (!text.includes(w)) all = false; }
    if (all) add(key, words.reduce((n, w) => n + Math.min(5, text.split(w).length - 1), 0));
  }
  const pages = [...hits].sort((a, b) => b[1] - a[1]).slice(0, 8).map(([key]) => {
    const p = ARK.pages[key], i = p.text.toLowerCase().indexOf(words[0]);
    const snip = i < 0 ? p.text.slice(0, 110) : (i > 40 ? "…" : "") + p.text.slice(Math.max(0, i - 40), i + 80) + "…";
    return `<a href="#/${key}">${esc(p.title)}<small>${esc(snip)}</small></a>`;
  });
  const books = ARK.books.filter(b => (b.title + " " + b.author).toLowerCase().includes(q)).slice(0, 5)
    .map(b => `<a href="${esc(b.path)}" target="_blank">${esc(b.title)}<small>Book · ${esc(b.author)}</small></a>`);
  return [...pages, ...books];
}

// ---------- Pages ----------
function renderPage(key, anchor) {
  const p = ARK.pages[key];
  if (!p) return `<div class="crumb"><a href="#/">← Ark</a></div><h1>Page not found</h1><p>Try searching from the <a href="#/">home screen</a>.</p>`;
  const folderPage = ARK.pages[p.folder + "/README"];
  const isFolderIndex = key.endsWith("/README");
  const crumb = `<a href="#/">← Ark</a>${folderPage && !isFolderIndex ? `<span>·</span><a href="#/${p.folder}/README">${esc(folderPage.title)}</a>` : ""}`;
  return `<div class="crumb">${crumb}</div><div class="toolbar" id="toolbar" hidden></div><article class="page" id="page">${p.html}</article>`;
}

// Wrap "Don't" sections, mark sources, wrap wide tables
function decorate(page) {
  page.querySelectorAll("table").forEach(t => { const w = document.createElement("div"); w.className = "table-wrap"; t.replaceWith(w); w.appendChild(t); });
  [...page.querySelectorAll("h2")].filter(h => /^don.?t\b/i.test(h.textContent.trim())).forEach(h => {
    const box = document.createElement("aside"); box.className = "dont";
    h.before(box);
    let n = h; const nodes = [];
    while (n && !(n !== h && /^(H1|H2|HR)$/.test(n.tagName))) { nodes.push(n); n = n.nextElementSibling; }
    nodes.forEach(x => box.appendChild(x));
  });
  const hr = [...page.children].find(el => el.tagName === "HR");
  if (hr) { const box = document.createElement("footer"); box.className = "sources"; hr.after(box); while (box.nextSibling) box.appendChild(box.nextSibling); }
}

// Turn a guide into one card per step: each numbered item is a step; other blocks are grouped
function buildSteps(page) {
  const steps = [];
  let group = null, title = $("h1", page)?.textContent || "";
  const flush = () => { if (group && group.nodes.length) steps.push(group); group = null; };
  for (const el of [...page.children]) {
    if (el.tagName === "H1") continue;
    if (el.tagName === "FOOTER") break;
    if (el.tagName === "H2" || el.tagName === "H3") { flush(); title = el.textContent; continue; }
    if (el.tagName === "OL") {
      flush();
      [...el.children].forEach(li => steps.push({ title, nodes: [li], li: true }));
      continue;
    }
    // Pictures and their captions belong to the step just before them
    const pictureOnly = el.tagName === "P" &&
      (el.querySelector("img") ? el.textContent.trim() === "" : /^\s*<em>[\s\S]*<\/em>\s*$/.test(el.innerHTML));
    if (pictureOnly && !group && steps.length && steps[steps.length - 1].li) { steps[steps.length - 1].nodes.push(el); continue; }
    if (el.classList.contains("dont")) { flush(); steps.push({ title: "Don't", nodes: [el], caution: true }); continue; }
    if (!group) group = { title, nodes: [] };
    group.nodes.push(el);
  }
  flush();
  return steps;
}

function showSteps(page, steps, key) {
  stepIndex = Math.max(0, Math.min(stepIndex, steps.length - 1));
  const s = steps[stepIndex];
  const card = document.createElement("section");
  card.className = "step" + (s.caution ? " caution" : "");
  card.setAttribute("aria-label", `Step ${stepIndex + 1} of ${steps.length}`);
  const body = document.createElement("div"); body.className = "body";
  s.nodes.forEach(n => {
    if (n.tagName === "LI") { [...n.childNodes].forEach(c => body.appendChild(c.cloneNode(true))); }
    else if (n.classList?.contains("dont")) { [...n.children].filter(c => c.tagName !== "H2").forEach(c => body.appendChild(c.cloneNode(true))); }
    else body.appendChild(n.cloneNode(true));
  });
  card.innerHTML = `<div class="head"><span class="num">${stepIndex + 1}</span><div class="eyebrow">${esc(s.title)}</div></div>`;
  card.appendChild(body);
  const footer = $("footer.sources", page);
  const h1 = $("h1", page);
  page.innerHTML = "";
  if (h1) page.appendChild(h1);
  page.appendChild(card);
  const nav = document.createElement("div");
  nav.innerHTML = `<div class="dots" aria-hidden="true">${steps.map((_, i) => `<i class="${i === stepIndex ? "on" : ""}"></i>`).join("")}</div>
    <div class="stepper" style="margin-top:12px"><button id="prev" type="button" ${stepIndex === 0 ? "disabled" : ""}>Back</button>
    <button id="next" type="button" class="primary" ${stepIndex === steps.length - 1 ? "disabled" : ""}>${stepIndex === steps.length - 1 ? "Last step" : "Next step"}</button></div>`;
  page.appendChild(nav);
  if (footer) page.appendChild(footer);
  $("#prev").onclick = () => { stepIndex--; route(); };
  $("#next").onclick = () => { stepIndex++; route(); };
}

function addBeat(page) {
  const beat = document.createElement("div");
  beat.className = "beat";
  beat.innerHTML = `<div class="pulse" id="pulse"></div><button id="beatBtn" type="button">Start 110 / min beat</button><span class="foot">Push down on each flash</span>`;
  const firstList = $("ol", page) || $("h1", page);
  firstList.after(beat);
  $("#beatBtn").onclick = () => beatTimer ? stopBeat() : startBeat();
}

// ---------- Router ----------
let currentKey = null;
function route() {
  stopBeat();
  const raw = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  const [key, anchor] = raw.split("~");
  if (key !== currentKey) { stepIndex = 0; currentKey = key; }
  const app = $("#app");
  if (!key) { app.innerHTML = home(); bindHome(); window.scrollTo(0, 0); return; }
  app.innerHTML = renderPage(key, anchor);
  const page = $("#page");
  if (!page) return;
  decorate(page);
  const steps = buildSteps(page);
  const hasList = steps.some(s => s.li);
  const stepDefault = key.startsWith("01-emergency/") && !key.endsWith("README");
  const stepMode = !printing && hasList && !anchor && (stepPref === null ? stepDefault : stepPref);
  const au = [...page.querySelectorAll("h2, h3, blockquote")].find(el => /australia/i.test(el.textContent));
  const bar = $("#toolbar");
  if (hasList || au) {
    bar.hidden = false;
    if (au && !au.id) au.id = "australia";
    bar.innerHTML = `${au ? `<a class="au-chip" href="#/${key}~${au.id}">Australian advice on this page ↓</a>` : "<span></span>"}
      ${hasList ? `<div class="toggle" role="group" aria-label="View"><button type="button" data-mode="step" aria-pressed="${stepMode}">One step</button><button type="button" data-mode="all" aria-pressed="${!stepMode}">All steps</button></div>` : ""}`;
    bar.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { stepPref = b.dataset.mode === "step"; store.set("stepMode", stepPref); route(); });
  }
  if (stepMode) showSteps(page, steps, key);
  if (key === "01-emergency/cpr") addBeat(page);
  if (/^0[12]-/.test(key)) keepAwake();
  if (anchor) { const t = document.getElementById(anchor); if (t) { t.scrollIntoView(); return; } }
  window.scrollTo(0, 0);
}

function bindHome() {
  const q = $("#q"), box = $("#results");
  q.addEventListener("input", () => {
    const res = search(q.value);
    box.hidden = !q.value.trim();
    box.innerHTML = res.length ? res.join("") : `<a href="#/">No match for “${esc(q.value)}”<small>Try a plain word, like “blood”, “breathing” or “water”.</small></a>`;
  });
}

// ---------- CPR beat (110 per minute) ----------
let beatTimer = null, audio = null;
function startBeat() {
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); } catch { audio = null; }
  const tick = () => {
    const p = $("#pulse"); if (!p) return stopBeat();
    p.classList.add("on"); setTimeout(() => p.classList.remove("on"), 120);
    if (audio) { const o = audio.createOscillator(), g = audio.createGain(); o.frequency.value = 880; g.gain.value = .08; o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + .05); }
  };
  tick(); beatTimer = setInterval(tick, 60000 / 110);
  const b = $("#beatBtn"); if (b) b.textContent = "Stop beat";
}
function stopBeat() { clearInterval(beatTimer); beatTimer = null; const b = $("#beatBtn"); if (b) b.textContent = "Start 110 / min beat"; }

// Keep the screen on while a first-aid page is open (ignored where not allowed)
let lock = null;
async function keepAwake() { try { if (!lock && navigator.wakeLock) { lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", () => lock = null); } } catch {} }

// ---------- Text size, theme, keys, print ----------
const setScale = v => { scale = Math.max(.85, Math.min(1.6, +v.toFixed(2))); store.set("scale", scale); document.documentElement.style.setProperty("--scale", scale); };
$("#bigger").onclick = () => setScale(scale + .1);
$("#smaller").onclick = () => setScale(scale - .1);
$("#theme").onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark"; store.set("theme", root.dataset.theme);
};
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight" && $("#next") && !$("#next").disabled) $("#next").click();
  if (e.key === "ArrowLeft" && $("#prev") && !$("#prev").disabled) $("#prev").click();
});
window.addEventListener("beforeprint", () => { printing = true; route(); });
window.addEventListener("afterprint", () => { printing = false; route(); });
window.addEventListener("hashchange", route);
route();
</script>
