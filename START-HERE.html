re Wounds , including signs of infection Broken Bones , including improvised splints Dehydration and Oral Rehydration Solution , with a homemade ORS recipe Hypothermia Heat Illness Bites and Stings (Australia) : snakes, spiders, ticks, bluebottles To add Sprains and strains Eye injuries Common medications: uses, doses, expiry Emergency childbirth"},"02-first-aid/bites-and-stings-australia":{"title":"Bites and Stings (Australia)","folder":"02-first-aid","html":"<h1 id=\"bites-and-stings-australia\">Bites and Stings (Australia)<\/h1>\n<p>For anaphylaxis (trouble breathing, swollen tongue or throat, collapse): <strong>call\n000<\/strong>, use an adrenaline autoinjector if they have one, lay them down and raise\ntheir legs. <strong>Poisons Information: 13 11 26.<\/strong><\/p>\n<h2 id=\"snake-bite\">Snake bite<\/h2>\n<p><strong>Call 000 for any snake bite.<\/strong> Every snake bite needs a doctor, even if the\nperson seems fine.<\/p>\n<p><strong>Pressure immobilisation bandage:<\/strong><\/p>\n<ol>\n<li><strong>Keep the person still and calm<\/strong>, away from the snake. Stay with them.<\/li>\n<li>Put a <strong>broad roller bandage (10–15 cm wide) firmly over the bite.<\/strong><\/li>\n<li>With a second bandage, <strong>wrap the whole limb<\/strong>, starting just above the\n    fingers or toes and working up toward the body.<\/li>\n<li><strong>Firm:<\/strong> you shouldn't be able to slide a finger easily under the bandage.<\/li>\n<li><strong>Splint<\/strong> the limb so it can't move.<\/li>\n<li><strong>Write down the time<\/strong> of the bite and when the bandage went on. Mark the\n    bite site on the bandage, or take a photo.<\/li>\n<li>If they stop responding or breathing normally, start CPR (see\n    <a href=\"#/01-emergency/cpr\">../01-emergency/cpr.md<\/a>).<\/li>\n<\/ol>\n<p><strong>Don't:<\/strong><\/p>\n<ul>\n<li><strong>Don't wash the bite.<\/strong> Venom left on the skin helps identify the snake.<\/li>\n<li><strong>Don't use a tourniquet.<\/strong><\/li>\n<li>Don't cut the wound or try to suck out the venom.<\/li>\n<li>Don't try to catch or kill the snake.<\/li>\n<\/ul>\n<h2 id=\"spider-bite\">Spider bite<\/h2>\n<p><strong>Funnel-web, mouse spider, or any big black spider: call 000.<\/strong> Use the\n<strong>same pressure immobilisation bandage<\/strong> as for snake bite (above): keep them\nlying still, bandage firmly but not cutting off circulation, splint, mark the\nsite, note the times.<\/p>\n<p><strong>Redback:<\/strong> wash with soap and water, apply a <strong>cold pack for 15 minutes<\/strong>,\nand see a doctor if symptoms are bad. Severe pain: go to hospital. <strong>No pressure\nbandage<\/strong>; that is only for funnel-web and mouse spiders.<\/p>\n<p><strong>Other spiders:<\/strong> wash, apply antiseptic, use an ice pack wrapped in cloth,\nparacetamol or ibuprofen for pain. See a doctor if the pain is bad, it doesn't\nsettle in a few hours, or it gets worse after 1–2 days.<\/p>\n<h2 id=\"tick-bite-paralysis-tick\">Tick bite (paralysis tick)<\/h2>\n<p>The <strong>paralysis tick<\/strong> is the most common tick in eastern Australia.<\/p>\n<p><img alt=\"Drawing of an adult female paralysis tick, Ixodes holocyclus\" loading=\"lazy\" src=\"02-first-aid/images/paralysis-tick.png\" /><\/p>\n<p><em>Adult female paralysis tick (enlarged).<\/em><\/p>\n<ol>\n<li><strong>Kill it first:<\/strong> freeze it with an <strong>ether-containing spray<\/strong> from a\n    pharmacy. It should drop off within about 5 minutes. (If it's embedded,\n    permethrin cream can be used.)<\/li>\n<li><strong>Don't pull, squeeze or twist it.<\/strong> That makes it inject more saliva.<\/li>\n<li>Don't use home remedies (methylated spirits, kerosene, Vaseline, nail\n    polish, oil, alcohol, matches). They can make it burrow deeper.<\/li>\n<li>Wash the area with soap and water.<\/li>\n<li>If it won't come off or can't be frozen, leave it and <strong>get medical help<\/strong>.<\/li>\n<\/ol>\n<p><strong>Tick allergy:<\/strong> if you know you're allergic, get medical help as soon as you\nfind an attached tick. Don't remove it yourself. Carry your adrenaline\nautoinjector.<\/p>\n<p>See a doctor if, days later, there's headache, blurred vision, weakness or poor\nbalance (tick paralysis is rare).<\/p>\n<h2 id=\"jellyfish-bluebottle-sting-noosa-beaches\">Jellyfish (bluebottle) sting: Noosa beaches<\/h2>\n<p>Noosa is in <strong>non-tropical<\/strong> waters (south of Bundaberg).<\/p>\n<ol>\n<li><strong>Rinse with sea water, not fresh water.<\/strong><\/li>\n<li>Pick off tentacles (by hand is OK) or wash them off with sea water.<\/li>\n<li>Put the area in <strong>hot water at about 45 °C for 20 minutes<\/strong>. Check it won't\n    burn. Or use a hot shower. Hot water works better than ice.<\/li>\n<li><strong>Don't use vinegar on a bluebottle sting.<\/strong> It can increase the pain.<\/li>\n<\/ol>\n<p>See a doctor if severe pain doesn't improve. If the person collapses or stops\nbreathing, call 000 and start CPR.<\/p>\n<p><strong>Travelling north of Bundaberg (tropical waters)?<\/strong> Box jellyfish and\nIrukandji stings are life-threatening: <strong>call 000<\/strong>, remove tentacles, <strong>pour\nvinegar<\/strong> on the site, apply ice, and go to hospital. If you don't know what\nstung you up there, treat it as a box jellyfish.<\/p>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>healthdirect (Australian Government), Snake bites:\n    https://www.healthdirect.gov.au/snake-bites<\/li>\n<li>healthdirect, Spider bites: https://www.healthdirect.gov.au/spider-bites<\/li>\n<li>healthdirect, Tick bites: https://www.healthdirect.gov.au/tick-bites<\/li>\n<li>healthdirect, Jellyfish stings: https://www.healthdirect.gov.au/jellyfish-stings<\/li>\n<li>Drawing: see <a href=\"#/02-first-aid/images/CREDITS\">images/CREDITS.md<\/a><\/li>\n<\/ul>","text":"Bites and Stings (Australia) For anaphylaxis (trouble breathing, swollen tongue or throat, collapse): call 000 , use an adrenaline autoinjector if they have one, lay them down and raise their legs. Poisons Information: 13 11 26. Snake bite Call 000 for any snake bite. Every snake bite needs a doctor, even if the person seems fine. Pressure immobilisation bandage: Keep the person still and calm , away from the snake. Stay with them. Put a broad roller bandage (10–15 cm wide) firmly over the bite. With a second bandage, wrap the whole limb , starting just above the fingers or toes and working up toward the body. Firm: you shouldn't be able to slide a finger easily under the bandage. Splint the limb so it can't move. Write down the time of the bite and when the bandage went on. Mark the bite site on the bandage, or take a photo. If they stop responding or breathing normally, start CPR (see ../01-emergency/cpr.md ). Don't: Don't wash the bite. Venom left on the skin helps identify the snake. Don't use a tourniquet. Don't cut the wound or try to suck out the venom. Don't try to catch or kill the snake. Spider bite Funnel-web, mouse spider, or any big black spider: call 000. Use the same pressure immobilisation bandage as for snake bite (above): keep them lying still, bandage firmly but not cutting off circulation, splint, mark the site, note the times. Redback: wash with soap and water, apply a cold pack for 15 minutes , and see a doctor if symptoms are bad. Severe pain: go to hospital. No pressure bandage ; that is only for funnel-web and mouse spiders. Other spiders: wash, apply antiseptic, use an ice pack wrapped in cloth, paracetamol or ibuprofen for pain. See a doctor if the pain is bad, it doesn't settle in a few hours, or it gets worse after 1–2 days. Tick bite (paralysis tick) The paralysis tick is the most common tick in eastern Australia. Adult female paralysis tick (enlarged). Kill it first: freeze it with an ether-containing spray from a pharmacy. It should drop off within about 5 minutes. (If it's embedded, permethrin cream can be used.) Don't pull, squeeze or twist it. That makes it inject more saliva. Don't use home remedies (methylated spirits, kerosene, Vaseline, nail polish, oil, alcohol, matches). They can make it burrow deeper. Wash the area with soap and water. If it won't come off or can't be frozen, leave it and get medical help . Tick allergy: if you know you're allergic, get medical help as soon as you find an attached tick. Don't remove it yourself. Carry your adrenaline autoinjector. See a doctor if, days later, there's headache, blurred vision, weakness or poor balance (tick paralysis is rare). Jellyfish (bluebottle) sting: Noosa beaches Noosa is in non-tropical waters (south of Bundaberg). Rinse with sea water, not fresh water. Pick off tentacles (by hand is OK) or wash them off with sea water. Put the area in hot water at about 45 °C for 20 minutes . Check it won't burn. Or use a hot shower. Hot water works better than ice. Don't use vinegar on a bluebottle sting. It can increase the pain. See a doctor if severe pain doesn't improve. If the person collapses or stops breathing, call 000 and start CPR. Travelling north of Bundaberg (tropical waters)? Box jellyfish and Irukandji stings are life-threatening: call 000 , remove tentacles, pour vinegar on the site, apply ice, and go to hospital. If you don't know what stung you up there, treat it as a box jellyfish. Sources (checked 2026-11-01) healthdirect (Australian Government), Snake bites: https://www.healthdirect.gov.au/snake-bites healthdirect, Spider bites: https://www.healthdirect.gov.au/spider-bites healthdirect, Tick bites: https://www.healthdirect.gov.au/tick-bites healthdirect, Jellyfish stings: https://www.healthdirect.gov.au/jellyfish-stings Drawing: see images/CREDITS.md"},"02-first-aid/broken-bones":{"title":"Broken Bones","folder":"02-first-aid","html":"<h1 id=\"broken-bones\">Broken Bones<\/h1>\n<h2 id=\"signs\">Signs<\/h2>\n<ul>\n<li>A limb or joint that looks <strong>out of place or misshapen<\/strong><\/li>\n<li>Swelling, bruising or bleeding<\/li>\n<li>Pain, often severe<\/li>\n<li>Numbness or tingling<\/li>\n<li><strong>Bone poking through the skin<\/strong><\/li>\n<li>Can't move the limb or put weight on it<\/li>\n<\/ul>\n<p>A young child who won't use a limb or put weight on it should be treated as if\nit's broken.<\/p>\n<p><img alt=\"Three leg bones: A and B closed fractures, C with bone through the skin\" loading=\"lazy\" src=\"02-first-aid/images/fracture-types.png\" /><\/p>\n<p><em>Closed fractures (A, B) and an open fracture with bone through the skin (C).<\/em><\/p>\n<h2 id=\"get-emergency-help-if\">Get emergency help if<\/h2>\n<ul>\n<li>The person isn't responding or is losing consciousness<\/li>\n<li>A break in the <strong>head, neck or back<\/strong> is possible<\/li>\n<li>A break in the <strong>hip, pelvis or upper leg<\/strong> is possible<\/li>\n<li><strong>Bone is sticking out<\/strong> through the skin<\/li>\n<li>Bleeding is severe<\/li>\n<li>The area below the injury is <strong>pale, cold, clammy or blue<\/strong><\/li>\n<li>You can't keep the injury still by yourself<\/li>\n<\/ul>\n<p>Other breaks still need a doctor soon.<\/p>\n<h2 id=\"what-to-do\">What to do<\/h2>\n<ol>\n<li><strong>Check breathing first.<\/strong> Start CPR or control bleeding if needed (see\n    <a href=\"#/01-emergency/cpr\">../01-emergency/cpr.md<\/a>,\n    <a href=\"#/01-emergency/severe-bleeding\">../01-emergency/severe-bleeding.md<\/a>).<\/li>\n<li><strong>Keep the person still and calm.<\/strong> Look for other injuries.<\/li>\n<li><strong>Bone through the skin:<\/strong> don't breathe on it or touch it. Cover it with a\n    clean (sterile if possible) dressing. Don't try to push the bone back.<\/li>\n<li>\n<p><strong>Splint it<\/strong> so it can't move. Immobilize the joints <strong>above and below<\/strong>\n    the break. You can improvise a splint with rolled-up newspaper, a magazine\n    or strips of wood, tied on with cloth. Use a sling for an arm.<\/p>\n<p><img alt=\"Forearm splinted to a padded board with cloth ties\" loading=\"lazy\" src=\"02-first-aid/images/splint-forearm.png\" />\n<img alt=\"Arm supported in a triangular bandage sling\" loading=\"lazy\" src=\"02-first-aid/images/arm-sling.png\" />\n<img alt=\"Broken leg tied to the uninjured leg with padding and belts\" loading=\"lazy\" src=\"02-first-aid/images/splint-leg-to-leg.png\" /><\/p>\n<p><em>A board splint for the forearm, an arm sling, and, with nothing else to\nhand, the good leg used as a splint for the broken one.<\/em>\n5. <strong>Ice and raise<\/strong> the injured limb to ease pain and swelling.\n6. <strong>Check circulation<\/strong> below the break: press the skin. It should go white\nand turn pink again within about <strong>2 seconds<\/strong>. Pale or blue skin, numbness,\ntingling or no pulse means poor blood flow. If blood flow is poor and\ntrained help isn't coming soon, gently move the limb back into a normal\nresting position.\n7. <strong>Watch for shock<\/strong> (see <a href=\"#/01-emergency/shock\">../01-emergency/shock.md<\/a>):\nlay them flat, raise their feet about 12 inches (30 cm) and cover them, <strong>but\nnot if a head, neck or back injury is possible.<\/strong><\/p>\n<\/li>\n<\/ol>\n<h2 id=\"dont\">Don't<\/h2>\n<ul>\n<li><strong>Don't move someone who may have a spine injury.<\/strong><\/li>\n<li>Don't move someone with a hip, pelvis or upper leg injury unless you\n    absolutely must. If you must, drag them by their clothing.<\/li>\n<li>Don't straighten the bone or change its position, unless blood flow is poor\n    and no trained help is nearby.<\/li>\n<li>Don't test the limb by moving it.<\/li>\n<li>Don't use a tourniquet unless the bleeding is life-threatening.<\/li>\n<\/ul>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>MedlinePlus (US National Library of Medicine), Broken bone:\n    https://medlineplus.gov/ency/article/000001.htm<\/li>\n<li>Drawings: see <a href=\"#/02-first-aid/images/CREDITS\">images/CREDITS.md<\/a><\/li>\n<\/ul>","text":"Broken Bones Signs A limb or joint that looks out of place or misshapen Swelling, bruising or bleeding Pain, often severe Numbness or tingling Bone poking through the skin Can't move the limb or put weight on it A young child who won't use a limb or put weight on it should be treated as if it's broken. Closed fractures (A, B) and an open fracture with bone through the skin (C). Get emergency help if The person isn't responding or is losing consciousness A break in the head, neck or back is possible A break in the hip, pelvis or upper leg is possible Bone is sticking out through the skin Bleeding is severe The area below the injury is pale, cold, clammy or blue You can't keep the injury still by yourself Other breaks still need a doctor soon. What to do Check breathing first. Start CPR or control bleeding if needed (see ../01-emergency/cpr.md , ../01-emergency/severe-bleeding.md ). Keep the person still and calm. Look for other injuries. Bone through the skin: don't breathe on it or touch it. Cover it with a clean (sterile if possible) dressing. Don't try to push the bone back. Splint it so it can't move. Immobilize the joints above and below the break. You can improvise a splint with rolled-up newspaper, a magazine or strips of wood, tied on with cloth. Use a sling for an arm. A board splint for the forearm, an arm sling, and, with nothing else to hand, the good leg used as a splint for the broken one. 5. Ice and raise the injured limb to ease pain and swelling. 6. Check circulation below the break: press the skin. It should go white and turn pink again within about 2 seconds . Pale or blue skin, numbness, tingling or no pulse means poor blood flow. If blood flow is poor and trained help isn't coming soon, gently move the limb back into a normal resting position. 7. Watch for shock (see ../01-emergency/shock.md ): lay them flat, raise their feet about 12 inches (30 cm) and cover them, but not if a head, neck or back injury is possible. Don't Don't move someone who may have a spine injury. Don't move someone with a hip, pelvis or upper leg injury unless you absolutely must. If you must, drag them by their clothing. Don't straighten the bone or change its position, unless blood flow is poor and no trained help is nearby. Don't test the limb by moving it. Don't use a tourniquet unless the bleeding is life-threatening. Sources (checked 2026-11-01) MedlinePlus (US National Library of Medicine), Broken bone: https://medlineplus.gov/ency/article/000001.htm Drawings: see images/CREDITS.md"},"02-first-aid/cuts-and-wounds":{"title":"Cuts and Puncture Wounds","folder":"02-first-aid","html":"<h1 id=\"cuts-and-puncture-wounds\">Cuts and Puncture Wounds<\/h1>\n<p>For heavy bleeding that won't stop, go to\n<a href=\"#/01-emergency/severe-bleeding\">../01-emergency/severe-bleeding.md<\/a> first.<\/p>\n<h2 id=\"minor-cut\">Minor cut<\/h2>\n<ol>\n<li><strong>Wash your hands<\/strong> with soap.<\/li>\n<li><strong>Wash the cut well<\/strong> with mild soap and water. Always wash it, even if it\n    looks clean.<\/li>\n<li><strong>Press on it<\/strong> to stop the bleeding.<\/li>\n<li>\n<p>Put on <strong>antibacterial ointment<\/strong> and cover it with a clean bandage that\n    won't stick to the wound.<\/p>\n<p><img alt=\"Placing a dressing directly on a leg wound\" loading=\"lazy\" src=\"02-first-aid/images/dressing-on-wound.png\" />\n<img alt=\"Wrapping the dressing's tail around the leg\" loading=\"lazy\" src=\"02-first-aid/images/dressing-wrap.png\" /><\/p>\n<p><em>Put the dressing straight onto the wound, then wrap it to hold it in place.<\/em><\/p>\n<\/li>\n<\/ol>\n<h2 id=\"minor-puncture-nail-splinter-thorn\">Minor puncture (nail, splinter, thorn)<\/h2>\n<ol>\n<li><strong>Wash your hands<\/strong> with soap.<\/li>\n<li><strong>Rinse the wound under running water for 5 minutes<\/strong>, then wash it with\n    soap.<\/li>\n<li><strong>Look into it without poking around.<\/strong><ul>\n<li>If something is stuck in it, <strong>leave it in place<\/strong> and get medical help.<\/li>\n<li>If part of the object seems to be missing (a broken tip, for example), get\n medical help.<\/li>\n<\/ul>\n<\/li>\n<li>Put on antibacterial ointment and cover it with a clean, non-stick bandage.<\/li>\n<\/ol>\n<h2 id=\"get-medical-help-soon-if\">Get medical help soon if<\/h2>\n<ul>\n<li>The wound is <strong>deeper than ¼ inch (about 6 mm)<\/strong>, large, on the face, or\n    reaches the bone. It may need stitches.<\/li>\n<li>It's a <strong>human or animal bite<\/strong>.<\/li>\n<li>It was caused by a <strong>fishhook, a rusty object, or stepping on a nail<\/strong>.<\/li>\n<li>Something is stuck in the wound.<\/li>\n<li>The person hasn't had a <strong>tetanus shot in the last 10 years<\/strong>.<\/li>\n<li>It shows <strong>signs of infection<\/strong>:<ul>\n<li>warmth and redness around it<\/li>\n<li>pain or throbbing<\/li>\n<li>fever<\/li>\n<li>swelling<\/li>\n<li>a <strong>red streak<\/strong> spreading from the wound<\/li>\n<li>pus<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2 id=\"get-emergency-help-if\">Get emergency help if<\/h2>\n<ul>\n<li>Bleeding is severe or doesn't stop after <strong>10 minutes of pressure<\/strong><\/li>\n<li>The person can't feel or move the injured area normally<\/li>\n<li>They have other serious injuries<\/li>\n<\/ul>\n<h2 id=\"dont\">Don't<\/h2>\n<ul>\n<li>Don't breathe on an open wound.<\/li>\n<li>Don't try to clean a <strong>major<\/strong> wound, especially once bleeding is under\n    control.<\/li>\n<li><strong>Don't pull out a long or deeply stuck object.<\/strong><\/li>\n<li>Don't push or pick dirt out of the wound.<\/li>\n<li>Don't push body parts that are sticking out back in. Cover them with clean\n    material until help arrives.<\/li>\n<\/ul>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>MedlinePlus (US National Library of Medicine), Cuts and puncture wounds:\n    https://medlineplus.gov/ency/article/000043.htm<\/li>\n<li>Drawings: see <a href=\"#/02-first-aid/images/CREDITS\">images/CREDITS.md<\/a><\/li>\n<\/ul>","text":"Cuts and Puncture Wounds For heavy bleeding that won't stop, go to ../01-emergency/severe-bleeding.md first. Minor cut Wash your hands with soap. Wash the cut well with mild soap and water. Always wash it, even if it looks clean. Press on it to stop the bleeding. Put on antibacterial ointment and cover it with a clean bandage that won't stick to the wound. Put the dressing straight onto the wound, then wrap it to hold it in place. Minor puncture (nail, splinter, thorn) Wash your hands with soap. Rinse the wound under running water for 5 minutes , then wash it with soap. Look into it without poking around. If something is stuck in it, leave it in place and get medical help. If part of the object seems to be missing (a broken tip, for example), get medical help. Put on antibacterial ointment and cover it with a clean, non-stick bandage. Get medical help soon if The wound is deeper than ¼ inch (about 6 mm) , large, on the face, or reaches the bone. It may need stitches. It's a human or animal bite . It was caused by a fishhook, a rusty object, or stepping on a nail . Something is stuck in the wound. The person hasn't had a tetanus shot in the last 10 years . It shows signs of infection : warmth and redness around it pain or throbbing fever swelling a red streak spreading from the wound pus Get emergency help if Bleeding is severe or doesn't stop after 10 minutes of pressure The person can't feel or move the injured area normally They have other serious injuries Don't Don't breathe on an open wound. Don't try to clean a major wound, especially once bleeding is under control. Don't pull out a long or deeply stuck object. Don't push or pick dirt out of the wound. Don't push body parts that are sticking out back in. Cover them with clean material until help arrives. Sources (checked 2026-11-01) MedlinePlus (US National Library of Medicine), Cuts and puncture wounds: https://medlineplus.gov/ency/article/000043.htm Drawings: see images/CREDITS.md"},"02-first-aid/dehydration":{"title":"Dehydration and Oral Rehydration Solution (ORS)","folder":"02-first-aid","html":"<h1 id=\"dehydration-and-oral-rehydration-solution-ors\">Dehydration and Oral Rehydration Solution (ORS)<\/h1>\n<p>Diarrhea, vomiting, heat and too little clean water can all cause dehydration.\n<strong>Severe dehydration is life-threatening<\/strong>, especially for babies and young\nchildren.<\/p>\n<h2 id=\"signs\">Signs<\/h2>\n<p><strong>Mild to moderate:<\/strong><\/p>\n<ul>\n<li>Thirst, dry or sticky mouth<\/li>\n<li>Peeing less, darker yellow urine<\/li>\n<li>Dry, cool skin<\/li>\n<li>Headache, muscle cramps<\/li>\n<\/ul>\n<p><strong>Severe (get medical help):<\/strong><\/p>\n<ul>\n<li>Little or no urine, or very dark amber urine<\/li>\n<li>Dry, shriveled skin; sunken eyes<\/li>\n<li>Dizziness, fast heartbeat and breathing<\/li>\n<li>Irritability, confusion, listlessness<\/li>\n<li>Shock or passing out<\/li>\n<\/ul>\n<h2 id=\"oral-rehydration-solution-ors\">Oral rehydration solution (ORS)<\/h2>\n<p>ORS replaces the water <strong>and salts<\/strong> the body loses. Ready-made ORS packets are\nsold in pharmacies. Mix them with clean, treated water (see\n<a href=\"#/03-water/making-water-safe\">../03-water/making-water-safe.md<\/a>).<\/p>\n<p><strong>No packets? Make it at home (WHO recipe):<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Ingredient<\/th>\n<th>Amount<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Safe drinking water<\/td>\n<td><strong>1 liter<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Sugar<\/td>\n<td><strong>6 teaspoons<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Salt<\/td>\n<td><strong>½ teaspoon<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Measure carefully, with flat, level spoons and an accurately measured liter.\nToo much salt or sugar makes it harmful, and too little makes it weak.<\/p>\n<p><strong>How much to give each day (CDC):<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Who<\/th>\n<th>ORS per day<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Babies and toddlers with diarrhea<\/td>\n<td><strong>½ liter<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Children with vomiting or diarrhea<\/td>\n<td><strong>1 liter<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Adults with vomiting or diarrhea<\/td>\n<td><strong>3 liters<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong>Start as soon as symptoms begin<\/strong>, and keep them drinking even if they\n    vomit some of it.<\/li>\n<li><strong>Babies:<\/strong> keep breastfeeding or giving formula as well.<\/li>\n<li>Go to a clinic as soon as you can, and <strong>keep giving ORS on the way<\/strong>.<\/li>\n<li>No ORS and no ingredients? Give safe water, broth or other fluids. <strong>Avoid\n    juice, soft drinks and sports drinks<\/strong> for diarrhea; they can make it worse.<\/li>\n<\/ul>\n<p><img alt=\"CDC poster: how to make and use oral rehydration solution\" loading=\"lazy\" src=\"02-first-aid/images/rehydration-poster.png\" /><\/p>\n<p><em>Full-size poster: <a href=\"02-first-aid/rehydration-poster-cdc.pdf\" target=\"_blank\">rehydration-poster-cdc.pdf<\/a>\n(CDC, in this folder).<\/em><\/p>\n<h2 id=\"get-medical-help-right-away-if\">Get medical help right away if<\/h2>\n<ul>\n<li>They can't drink enough to keep up, or have severe diarrhea<\/li>\n<li>They are <strong>confused, drowsy or dizzy<\/strong>, have a seizure or pass out<\/li>\n<li>Fever is over <strong>102 °F (38.9 °C)<\/strong><\/li>\n<li>They don't improve, or get worse<\/li>\n<\/ul>\n<h2 id=\"dont\">Don't<\/h2>\n<ul>\n<li><strong>Don't take salt tablets.<\/strong> They can cause serious problems.<\/li>\n<\/ul>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>MedlinePlus (US National Library of Medicine), Dehydration:\n    https://medlineplus.gov/ency/article/000982.htm<\/li>\n<li>World Health Organization, Cholera outbreaks Q&amp;A (homemade ORS recipe):\n    https://www.who.int/news-room/questions-and-answers/item/cholera-outbreaks<\/li>\n<li>CDC, How to make and use oral rehydration solution (poster CS 229310):\n    https://www.cdc.gov/global-water-sanitation-hygiene/media/pdfs/11_229310-j_ors_print-africa.pdf<\/li>\n<li>CDC, Cholera treatment: https://www.cdc.gov/cholera/treatment/index.html<\/li>\n<li>Poster image: see <a href=\"#/02-first-aid/images/CREDITS\">images/CREDITS.md<\/a><\/li>\n<\/ul>","text":"Dehydration and Oral Rehydration Solution (ORS) Diarrhea, vomiting, heat and too little clean water can all cause dehydration. Severe dehydration is life-threatening , especially for babies and young children. Signs Mild to moderate: Thirst, dry or sticky mouth Peeing less, darker yellow urine Dry, cool skin Headache, muscle cramps Severe (get medical help): Little or no urine, or very dark amber urine Dry, shriveled skin; sunken eyes Dizziness, fast heartbeat and breathing Irritability, confusion, listlessness Shock or passing out Oral rehydration solution (ORS) ORS replaces the water and salts the body loses. Ready-made ORS packets are sold in pharmacies. Mix them with clean, treated water (see ../03-water/making-water-safe.md ). No packets? Make it at home (WHO recipe): Ingredient Amount Safe drinking water 1 liter Sugar 6 teaspoons Salt ½ teaspoon Measure carefully, with flat, level spoons and an accurately measured liter. Too much salt or sugar makes it harmful, and too little makes it weak. How much to give each day (CDC): Who ORS per day Babies and toddlers with diarrhea ½ liter Children with vomiting or diarrhea 1 liter Adults with vomiting or diarrhea 3 liters Start as soon as symptoms begin , and keep them drinking even if they vomit some of it. Babies: keep breastfeeding or giving formula as well. Go to a clinic as soon as you can, and keep giving ORS on the way . No ORS and no ingredients? Give safe water, broth or other fluids. Avoid juice, soft drinks and sports drinks for diarrhea; they can make it worse. Full-size poster: rehydration-poster-cdc.pdf (CDC, in this folder). Get medical help right away if They can't drink enough to keep up, or have severe diarrhea They are confused, drowsy or dizzy , have a seizure or pass out Fever is over 102 °F (38.9 °C) They don't improve, or get worse Don't Don't take salt tablets. They can cause serious problems. Sources (checked 2026-11-01) MedlinePlus (US National Library of Medicine), Dehydration: https://medlineplus.gov/ency/article/000982.htm World Health Organization, Cholera outbreaks Q&A (homemade ORS recipe): https://www.who.int/news-room/questions-and-answers/item/cholera-outbreaks CDC, How to make and use oral rehydration solution (poster CS 229310): https://www.cdc.gov/global-water-sanitation-hygiene/media/pdfs/11_229310-j_ors_print-africa.pdf CDC, Cholera treatment: https://www.cdc.gov/cholera/treatment/index.html Poster image: see images/CREDITS.md"},"02-first-aid/heat-illness":{"title":"Heat Illness (Heat Exhaustion and Heat Stroke)","folder":"02-first-aid","html":"<h1 id=\"heat-illness-heat-exhaustion-and-heat-stroke\">Heat Illness (Heat Exhaustion and Heat Stroke)<\/h1>\n<p>Heat illness gets worse in stages. <strong>Heat stroke can cause brain damage,\norgan failure and death.<\/strong><\/p>\n<h2 id=\"signs\">Signs<\/h2>\n<table>\n<thead>\n<tr>\n<th>Stage<\/th>\n<th>Signs<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Heat cramps<\/strong><\/td>\n<td>Muscle cramps (legs, belly), tiredness, thirst, heavy sweating<\/td>\n<\/tr>\n<tr>\n<td><strong>Heat exhaustion<\/strong><\/td>\n<td>Cool, moist skin; sweating; strong thirst; dark urine; dizziness; headache; nausea or vomiting; weakness; fast, shallow breathing; fast, weak pulse<\/td>\n<\/tr>\n<tr>\n<td><strong>Heat stroke<\/strong> (emergency)<\/td>\n<td>All of the above <strong>plus<\/strong> temperature over <strong>104 °F (40 °C)<\/strong>, confusion, strange behavior, slurred speech, seizures, extreme drowsiness or passing out. <strong>Sweating may stop.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"what-to-do\">What to do<\/h2>\n<ol>\n<li><strong>Lay them down somewhere cool<\/strong> and raise their feet about <strong>12 inches\n    (30 cm)<\/strong>.<\/li>\n<li><strong>Cool them down:<\/strong> cool, wet cloths or water on the skin, a fan, and cold\n    packs on the <strong>neck, groin and armpits<\/strong>.<\/li>\n<li><strong>If they're alert<\/strong>, give a sports drink or slightly salted drink, in\n    <strong>small sips: about half a cup every 15 minutes<\/strong>. Cool water if nothing\n    else is available.<\/li>\n<li><strong>Cramps:<\/strong> give fluids and firmly massage the cramping muscle until it\n    relaxes.<\/li>\n<\/ol>\n<h2 id=\"get-emergency-help-if\">Get emergency help if<\/h2>\n<ul>\n<li>They <strong>pass out<\/strong>, at any time<\/li>\n<li>They become <strong>confused<\/strong> or have a <strong>seizure<\/strong><\/li>\n<li>Fever is over <strong>102 °F (38.9 °C)<\/strong><\/li>\n<li>They have a fast pulse or fast breathing (signs of heat stroke)<\/li>\n<li>They show signs of shock (see <a href=\"#/01-emergency/shock\">../01-emergency/shock.md<\/a>)<\/li>\n<li>They don't improve, or get worse<\/li>\n<\/ul>\n<h2 id=\"dont\">Don't<\/h2>\n<ul>\n<li><strong>Don't give fever medicine<\/strong> (aspirin, acetaminophen/paracetamol). It won't\n    help and may harm.<\/li>\n<li><strong>Don't give salt tablets.<\/strong><\/li>\n<li>Don't give alcohol or caffeine.<\/li>\n<li>Don't rub alcohol on the skin.<\/li>\n<li><strong>Don't give anything by mouth<\/strong> if they are vomiting or unconscious.<\/li>\n<\/ul>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>MedlinePlus (US National Library of Medicine), Heat emergencies:\n    https://medlineplus.gov/ency/article/000056.htm<\/li>\n<\/ul>","text":"Heat Illness (Heat Exhaustion and Heat Stroke) Heat illness gets worse in stages. Heat stroke can cause brain damage, organ failure and death. Signs Stage Signs Heat cramps Muscle cramps (legs, belly), tiredness, thirst, heavy sweating Heat exhaustion Cool, moist skin; sweating; strong thirst; dark urine; dizziness; headache; nausea or vomiting; weakness; fast, shallow breathing; fast, weak pulse Heat stroke (emergency) All of the above plus temperature over 104 °F (40 °C) , confusion, strange behavior, slurred speech, seizures, extreme drowsiness or passing out. Sweating may stop. What to do Lay them down somewhere cool and raise their feet about 12 inches (30 cm) . Cool them down: cool, wet cloths or water on the skin, a fan, and cold packs on the neck, groin and armpits . If they're alert , give a sports drink or slightly salted drink, in small sips: about half a cup every 15 minutes . Cool water if nothing else is available. Cramps: give fluids and firmly massage the cramping muscle until it relaxes. Get emergency help if They pass out , at any time They become confused or have a seizure Fever is over 102 °F (38.9 °C) They have a fast pulse or fast breathing (signs of heat stroke) They show signs of shock (see ../01-emergency/shock.md ) They don't improve, or get worse Don't Don't give fever medicine (aspirin, acetaminophen/paracetamol). It won't help and may harm. Don't give salt tablets. Don't give alcohol or caffeine. Don't rub alcohol on the skin. Don't give anything by mouth if they are vomiting or unconscious. Sources (checked 2026-11-01) MedlinePlus (US National Library of Medicine), Heat emergencies: https://medlineplus.gov/ency/article/000056.htm"},"02-first-aid/hypothermia":{"title":"Hypothermia (Body Too Cold)","folder":"02-first-aid","html":"<h1 id=\"hypothermia-body-too-cold\">Hypothermia (Body Too Cold)<\/h1>\n<p>Hypothermia happens when the body loses heat faster than it can make it.\n<strong>It can kill.<\/strong> Get help early.<\/p>\n<h2 id=\"signs\">Signs<\/h2>\n<ul>\n<li><strong>Shivering that's hard to control<\/strong> (in extreme cold, shivering may stop)<\/li>\n<li>Confusion, drowsiness<\/li>\n<li>Pale, cold skin<\/li>\n<li>Weakness, clumsiness<\/li>\n<li>Slow breathing or heart rate<\/li>\n<\/ul>\n<h2 id=\"what-to-do\">What to do<\/h2>\n<ol>\n<li><strong>Call emergency services right away<\/strong>, especially if they are confused.<\/li>\n<li><strong>If they're unconscious<\/strong>, check breathing. Start CPR if needed (see\n    <a href=\"#/01-emergency/cpr\">../01-emergency/cpr.md<\/a>). Give rescue breaths if\n    they take <strong>fewer than 6 breaths per minute<\/strong>.<\/li>\n<li><strong>Get them out of the cold.<\/strong> Indoors, at room temperature, under warm\n    blankets. If you can't go indoors: shield them from wind, put something\n    between them and the cold ground, and cover their <strong>head and neck<\/strong>.<\/li>\n<li><strong>Severe hypothermia:<\/strong> move them <strong>gently<\/strong> and with as little effort on\n    their part as possible.<\/li>\n<li><strong>Replace wet or tight clothing<\/strong> with dry, loose clothing.<\/li>\n<li><strong>Warm the core:<\/strong> warm compresses on the <strong>neck, chest and groin<\/strong>.<\/li>\n<li>If they are <strong>alert and can swallow easily<\/strong>, give warm, sweet drinks with\n    no alcohol.<\/li>\n<li><strong>Stay with them<\/strong> until help arrives.<\/li>\n<\/ol>\n<h2 id=\"dont\">Don't<\/h2>\n<ul>\n<li><strong>Don't assume someone found still and cold is dead.<\/strong> Start help anyway.<\/li>\n<li><strong>Don't use direct heat<\/strong> (hot water, a heating pad, a heat lamp).<\/li>\n<li><strong>Don't give alcohol.<\/strong><\/li>\n<\/ul>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>MedlinePlus (US National Library of Medicine), Hypothermia:\n    https://medlineplus.gov/ency/article/000038.htm<\/li>\n<\/ul>","text":"Hypothermia (Body Too Cold) Hypothermia happens when the body loses heat faster than it can make it. It can kill. Get help early. Signs Shivering that's hard to control (in extreme cold, shivering may stop) Confusion, drowsiness Pale, cold skin Weakness, clumsiness Slow breathing or heart rate What to do Call emergency services right away , especially if they are confused. If they're unconscious , check breathing. Start CPR if needed (see ../01-emergency/cpr.md ). Give rescue breaths if they take fewer than 6 breaths per minute . Get them out of the cold. Indoors, at room temperature, under warm blankets. If you can't go indoors: shield them from wind, put something between them and the cold ground, and cover their head and neck . Severe hypothermia: move them gently and with as little effort on their part as possible. Replace wet or tight clothing with dry, loose clothing. Warm the core: warm compresses on the neck, chest and groin . If they are alert and can swallow easily , give warm, sweet drinks with no alcohol. Stay with them until help arrives. Don't Don't assume someone found still and cold is dead. Start help anyway. Don't use direct heat (hot water, a heating pad, a heat lamp). Don't give alcohol. Sources (checked 2026-11-01) MedlinePlus (US National Library of Medicine), Hypothermia: https://medlineplus.gov/ency/article/000038.htm"},"02-first-aid/images/CREDITS":{"title":"Image Credits: 02-first-aid","folder":"02-first-aid","html":"<h1 id=\"image-credits-02-first-aid\">Image Credits: 02-first-aid<\/h1>\n<p>All images were converted to small greyscale PNGs for this ark.<\/p>\n<table>\n<thead>\n<tr>\n<th>Image<\/th>\n<th>Source<\/th>\n<th>License<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>fracture-types.png<\/code>, <code>arm-sling.png<\/code>, <code>splint-forearm.png<\/code>, <code>splint-leg-to-leg.png<\/code>, <code>dressing-on-wound.png<\/code>, <code>dressing-wrap.png<\/code><\/td>\n<td>US Army, <em>FM 4-25.11 First Aid<\/em> (2002), figures 4-1, 4-9, 4-14, 4-24, 2-22, 2-23<\/td>\n<td>Public domain (US Government work)<\/td>\n<\/tr>\n<tr>\n<td><code>rehydration-poster.png<\/code><\/td>\n<td>CDC, <em>How to make and use oral rehydration solution (ORS)<\/em>, poster CS 229310<\/td>\n<td>Public domain (US Government work)<\/td>\n<\/tr>\n<tr>\n<td><code>paralysis-tick.png<\/code><\/td>\n<td>F. H. S. Roberts (1970), <em>Australian Ticks<\/em>, CSIRO, Melbourne, via <a class=\"ext\" href=\"https://commons.wikimedia.org/wiki/File:Ixodholfemale.gif\" rel=\"noopener\" target=\"_blank\">Ixodholfemale.gif<\/a>, Wikimedia Commons, converted to greyscale<\/td>\n<td><a class=\"ext\" href=\"https://creativecommons.org/licenses/by/3.0/\" rel=\"noopener\" target=\"_blank\">CC BY 3.0<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>","text":"Image Credits: 02-first-aid All images were converted to small greyscale PNGs for this ark. Image Source License fracture-types.png , arm-sling.png , splint-forearm.png , splint-leg-to-leg.png , dressing-on-wound.png , dressing-wrap.png US Army, FM 4-25.11 First Aid (2002), figures 4-1, 4-9, 4-14, 4-24, 2-22, 2-23 Public domain (US Government work) rehydration-poster.png CDC, How to make and use oral rehydration solution (ORS) , poster CS 229310 Public domain (US Government work) paralysis-tick.png F. H. S. Roberts (1970), Australian Ticks , CSIRO, Melbourne, via Ixodholfemale.gif , Wikimedia Commons, converted to greyscale CC BY 3.0"},"03-water/README":{"title":"03 · Water","folder":"03-water","html":"<h1 id=\"03-water\">03 · Water<\/h1>\n<p>Finding, treating and storing drinking water.<\/p>\n<h2 id=\"pages\">Pages<\/h2>\n<ul>\n<li><a href=\"#/03-water/finding-water\">Finding Water in an Emergency<\/a>: safe sources in and around the home<\/li>\n<li><a href=\"#/03-water/making-water-safe\">Making Water Safe to Drink<\/a>: boiling, bleach, and what neither can fix<\/li>\n<li><a href=\"#/03-water/storing-water\">Storing an Emergency Water Supply<\/a>: how much, containers, cleaning, labeling<\/li>\n<\/ul>\n<h2 id=\"to-add\">To add<\/h2>\n<ul>\n<li>Disinfecting a well after a flood<\/li>\n<\/ul>","text":"03 · Water Finding, treating and storing drinking water. Pages Finding Water in an Emergency : safe sources in and around the home Making Water Safe to Drink : boiling, bleach, and what neither can fix Storing an Emergency Water Supply : how much, containers, cleaning, labeling To add Disinfecting a well after a flood"},"03-water/finding-water":{"title":"Finding Water in an Emergency","folder":"03-water","html":"<h1 id=\"finding-water-in-an-emergency\">Finding Water in an Emergency<\/h1>\n<p>Listen to local officials for advice about your tap water. You may need to\n<strong>shut off your home's main water valve<\/strong> to keep contaminated water out of\nyour pipes.<\/p>\n<h2 id=\"inside-your-home-safe-to-drink\">Inside your home (safe to drink)<\/h2>\n<ul>\n<li><strong>Water heater tank<\/strong> (the one that feeds your taps and showers). In older\n    homes, <strong>don't<\/strong> use the tank that feeds radiators. That is heating system\n    water, and it's not safe.<\/li>\n<li><strong>Melted ice cubes<\/strong>, if they were made with clean water.<\/li>\n<li><strong>Toilet tank, not the bowl<\/strong>, only if the water is clear and has no cleaning\n    chemicals in it (for example, cleaners that color the water).<\/li>\n<li><strong>Liquid from canned fruit and vegetables.<\/strong><\/li>\n<\/ul>\n<h2 id=\"inside-your-home-washing-only-not-drinking\">Inside your home (washing only, not drinking)<\/h2>\n<ul>\n<li><strong>Swimming pools and spas<\/strong>: fine for washing, cleaning and personal hygiene.\n    <strong>Don't drink it.<\/strong><\/li>\n<\/ul>\n<h2 id=\"outside-must-be-treated-before-use\">Outside (must be treated before use)<\/h2>\n<p>All of these can carry germs from animal waste, sewage or chemicals.\n<strong>Treat them before drinking or washing<\/strong>; see\n<a href=\"#/03-water/making-water-safe\">making-water-safe.md<\/a>.<\/p>\n<ul>\n<li>Rainwater<\/li>\n<li>Streams and rivers<\/li>\n<li>Ponds and lakes<\/li>\n<li>Natural springs<\/li>\n<li>Wells, after a flood<\/li>\n<\/ul>\n<h2 id=\"never-use\">Never use<\/h2>\n<blockquote>\n<p><strong>Water contaminated with fuel or toxic chemicals cannot be made safe.<\/strong>\nDon't drink it or wash with it, even after boiling or bleach.<\/p>\n<\/blockquote>\n<ul>\n<li>Toilet bowl water<\/li>\n<li>Toilet tank water with chemical cleaners in it<\/li>\n<li>Radiator or boiler water from a home heating system<\/li>\n<\/ul>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>CDC, How to Find Clean Water in an Emergency:\n    https://www.cdc.gov/water-emergency/about/how-to-find-clean-water-in-an-emergency.html<\/li>\n<\/ul>","text":"Finding Water in an Emergency Listen to local officials for advice about your tap water. You may need to shut off your home's main water valve to keep contaminated water out of your pipes. Inside your home (safe to drink) Water heater tank (the one that feeds your taps and showers). In older homes, don't use the tank that feeds radiators. That is heating system water, and it's not safe. Melted ice cubes , if they were made with clean water. Toilet tank, not the bowl , only if the water is clear and has no cleaning chemicals in it (for example, cleaners that color the water). Liquid from canned fruit and vegetables. Inside your home (washing only, not drinking) Swimming pools and spas : fine for washing, cleaning and personal hygiene. Don't drink it. Outside (must be treated before use) All of these can carry germs from animal waste, sewage or chemicals. Treat them before drinking or washing ; see making-water-safe.md . Rainwater Streams and rivers Ponds and lakes Natural springs Wells, after a flood Never use Water contaminated with fuel or toxic chemicals cannot be made safe. Don't drink it or wash with it, even after boiling or bleach. Toilet bowl water Toilet tank water with chemical cleaners in it Radiator or boiler water from a home heating system Sources (checked 2026-11-01) CDC, How to Find Clean Water in an Emergency: https://www.cdc.gov/water-emergency/about/how-to-find-clean-water-in-an-emergency.html"},"03-water/making-water-safe":{"title":"Making Water Safe to Drink","folder":"03-water","html":"<h1 id=\"making-water-safe-to-drink\">Making Water Safe to Drink<\/h1>\n<p>Use <strong>bottled water<\/strong> first if you have it. If not, <strong>boiling is the best way\nto kill germs<\/strong> in water.<\/p>\n<h2 id=\"option-1-boil-it-best\">Option 1: Boil it (best)<\/h2>\n<ol>\n<li><strong>If the water is cloudy<\/strong>, filter it through a clean cloth, paper towel or\n    coffee filter, <em>or<\/em> let it settle and pour off the clear water.<\/li>\n<li><strong>Bring it to a rolling boil for 1 minute.<\/strong>\n    Above <strong>6,500 feet (about 2,000 m)<\/strong> altitude, boil for <strong>3 minutes<\/strong>.<\/li>\n<li><strong>Let it cool<\/strong> and store it in clean, sanitized containers with tight\n    covers.<\/li>\n<li><em>Better taste:<\/em> pour it back and forth between two clean containers and let\n    it stand a few hours, or add a pinch of salt per quart/liter.<\/li>\n<\/ol>\n<h2 id=\"option-2-household-bleach\">Option 2: Household bleach<\/h2>\n<p>Use <strong>unscented<\/strong> household chlorine bleach. If the label has directions for\ndisinfecting drinking water, follow those. Otherwise, check that the active\ningredient is <strong>sodium hypochlorite<\/strong>. Most US bleach is 5–9%.<\/p>\n<p><strong>For bleach at 5–9% concentration:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Water<\/th>\n<th>Drops<\/th>\n<th>mL<\/th>\n<th>Spoon<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1 quart / 1 liter<\/td>\n<td><strong>2 drops<\/strong><\/td>\n<td>0.1 mL<\/td>\n<td>too small to measure<\/td>\n<\/tr>\n<tr>\n<td>1 gallon (≈3.8 L)<\/td>\n<td><strong>8 drops<\/strong><\/td>\n<td>½ mL<\/td>\n<td>a little less than ⅛ tsp<\/td>\n<\/tr>\n<tr>\n<td>5 gallons (≈19 L)<\/td>\n<td><strong>40 drops<\/strong><\/td>\n<td>2½ mL<\/td>\n<td>½ tsp<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>For bleach at 1% concentration:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Water<\/th>\n<th>Drops<\/th>\n<th>mL<\/th>\n<th>Spoon<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1 quart / 1 liter<\/td>\n<td><strong>10 drops<\/strong><\/td>\n<td>½ mL<\/td>\n<td>⅛ tsp<\/td>\n<\/tr>\n<tr>\n<td>1 gallon (≈3.8 L)<\/td>\n<td><strong>40 drops<\/strong><\/td>\n<td>2½ mL<\/td>\n<td>½ tsp<\/td>\n<\/tr>\n<tr>\n<td>5 gallons (≈19 L)<\/td>\n<td><strong>200 drops<\/strong><\/td>\n<td>12½ mL<\/td>\n<td>2½ tsp<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ol>\n<li><strong>Double the amount<\/strong> if the water is cloudy, murky, colored or very cold.<\/li>\n<li><strong>Stir well.<\/strong><\/li>\n<li><strong>Wait at least 30 minutes<\/strong> before drinking.<\/li>\n<li>Store in clean, sanitized containers with tight covers.<\/li>\n<\/ol>\n<h2 id=\"warnings\">Warnings<\/h2>\n<blockquote>\n<p><strong>Boiling and bleach can't fix everything.<\/strong> Water contaminated with\n<strong>fuel, toxic chemicals or radioactive material<\/strong> cannot be made safe by\nboiling or disinfecting. Find another source.<\/p>\n<\/blockquote>\n<ul>\n<li><strong>Never drink radiator or boiler water<\/strong> from a home heating system.<\/li>\n<li>Until water is treated, don't use it for drinking, washing dishes, brushing\n    teeth, preparing food, washing hands, making ice or baby formula.<\/li>\n<li><strong>Iodine and chlorine tablets do not kill <em>Cryptosporidium<\/em>.<\/strong> Boiling and\n    bleach work better against <em>Cryptosporidium<\/em> and <em>Giardia<\/em>.<\/li>\n<li><strong>Avoid iodine-treated water<\/strong> if you are pregnant, have thyroid problems or\n    are sensitive to iodine. No one should drink it for more than a few weeks at\n    a time.<\/li>\n<li><strong>Portable filters do not remove viruses.<\/strong> Disinfect filtered water too.<\/li>\n<\/ul>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>CDC, Water in an Emergency:\n    https://www.cdc.gov/water-emergency/about/index.html<\/li>\n<\/ul>","text":"Making Water Safe to Drink Use bottled water first if you have it. If not, boiling is the best way to kill germs in water. Option 1: Boil it (best) If the water is cloudy , filter it through a clean cloth, paper towel or coffee filter, or let it settle and pour off the clear water. Bring it to a rolling boil for 1 minute. Above 6,500 feet (about 2,000 m) altitude, boil for 3 minutes . Let it cool and store it in clean, sanitized containers with tight covers. Better taste: pour it back and forth between two clean containers and let it stand a few hours, or add a pinch of salt per quart/liter. Option 2: Household bleach Use unscented household chlorine bleach. If the label has directions for disinfecting drinking water, follow those. Otherwise, check that the active ingredient is sodium hypochlorite . Most US bleach is 5–9%. For bleach at 5–9% concentration: Water Drops mL Spoon 1 quart / 1 liter 2 drops 0.1 mL too small to measure 1 gallon (≈3.8 L) 8 drops ½ mL a little less than ⅛ tsp 5 gallons (≈19 L) 40 drops 2½ mL ½ tsp For bleach at 1% concentration: Water Drops mL Spoon 1 quart / 1 liter 10 drops ½ mL ⅛ tsp 1 gallon (≈3.8 L) 40 drops 2½ mL ½ tsp 5 gallons (≈19 L) 200 drops 12½ mL 2½ tsp Double the amount if the water is cloudy, murky, colored or very cold. Stir well. Wait at least 30 minutes before drinking. Store in clean, sanitized containers with tight covers. Warnings Boiling and bleach can't fix everything. Water contaminated with fuel, toxic chemicals or radioactive material cannot be made safe by boiling or disinfecting. Find another source. Never drink radiator or boiler water from a home heating system. Until water is treated, don't use it for drinking, washing dishes, brushing teeth, preparing food, washing hands, making ice or baby formula. Iodine and chlorine tablets do not kill Cryptosporidium . Boiling and bleach work better against Cryptosporidium and Giardia . Avoid iodine-treated water if you are pregnant, have thyroid problems or are sensitive to iodine. No one should drink it for more than a few weeks at a time. Portable filters do not remove viruses. Disinfect filtered water too. Sources (checked 2026-11-01) CDC, Water in an Emergency: https://www.cdc.gov/water-emergency/about/index.html"},"03-water/storing-water":{"title":"Storing an Emergency Water Supply","folder":"03-water","html":"<h1 id=\"storing-an-emergency-water-supply\">Storing an Emergency Water Supply<\/h1>\n<p>Do this <strong>now<\/strong>, while tap water is safe.<\/p>\n<h2 id=\"how-much\">How much<\/h2>\n<ul>\n<li><strong>At least 1 gallon (≈3.8 L) per person, per day, for 3 days.<\/strong><\/li>\n<li><strong>2 weeks' worth if you can.<\/strong><\/li>\n<li>Store more for pregnant women, people who are sick, pets, and hot climates.<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>People<\/th>\n<th>3 days<\/th>\n<th>2 weeks<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>3 gal (≈11 L)<\/td>\n<td>14 gal (≈53 L)<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>6 gal (≈23 L)<\/td>\n<td>28 gal (≈106 L)<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>12 gal (≈45 L)<\/td>\n<td>56 gal (≈212 L)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"easiest-buy-bottled-water\">Easiest: buy bottled water<\/h2>\n<p><strong>Unopened store-bought bottled water is the safest choice.<\/strong> Check the\nexpiration date.<\/p>\n<h2 id=\"storing-your-own\">Storing your own<\/h2>\n<p><strong>1. Pick containers<\/strong><\/p>\n<ul>\n<li>Best: <strong>food-grade<\/strong> water containers.<\/li>\n<li>Otherwise: a <strong>tight-closing lid<\/strong>, <strong>unbreakable material (not glass)<\/strong>, and\n    a narrow opening if possible.<\/li>\n<li><strong>Never<\/strong> use containers that held chemicals (bleach, pesticides, etc.).<\/li>\n<\/ul>\n<p><strong>2. Clean and sanitize them<\/strong><\/p>\n<ol>\n<li>Wash with soap and rinse well with water.<\/li>\n<li>Mix <strong>1 teaspoon of unscented household bleach in 1 quart (4 cups / ≈1 L)\n    of water.<\/strong> Pour it in the container.<\/li>\n<li>Close the lid and <strong>shake<\/strong> so it touches every inside surface.<\/li>\n<li>Wait <strong>at least 30 seconds<\/strong>, then pour it out.<\/li>\n<li>Let the container air-dry.<\/li>\n<\/ol>\n<p><strong>3. Fill and label<\/strong><\/p>\n<ol>\n<li>Fill with clean tap water and close tightly.<\/li>\n<li>Label it <strong>\"Drinking water\"<\/strong> with <strong>today's date<\/strong>.<\/li>\n<\/ol>\n<p><strong>4. Store it<\/strong><\/p>\n<ul>\n<li><strong>Cool place: 50–70 °F (10–21 °C).<\/strong><\/li>\n<li><strong>Out of direct sunlight.<\/strong><\/li>\n<li><strong>Away from gasoline, pesticides and other chemicals.<\/strong><\/li>\n<li><strong>Replace it every 6 months.<\/strong><\/li>\n<\/ul>\n<h2 id=\"using-stored-water\">Using stored water<\/h2>\n<ul>\n<li>Pour it out, or use a <strong>clean<\/strong> scoop each time.<\/li>\n<li><strong>Don't put your hands<\/strong> in the water or touch the inside of the container.<\/li>\n<\/ul>\n<h2 id=\"also-keep\">Also keep<\/h2>\n<ul>\n<li>A bottle of <strong>unscented household bleach (5–9% sodium hypochlorite)<\/strong> to\n    disinfect water if you need to (see <a href=\"#/03-water/making-water-safe\">making-water-safe.md<\/a>).<\/li>\n<\/ul>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>CDC, How to Create and Store an Emergency Water Supply:\n    https://www.cdc.gov/water-emergency/about/how-to-create-and-store-an-emergency-water-supply.html<\/li>\n<\/ul>","text":"Storing an Emergency Water Supply Do this now , while tap water is safe. How much At least 1 gallon (≈3.8 L) per person, per day, for 3 days. 2 weeks' worth if you can. Store more for pregnant women, people who are sick, pets, and hot climates. People 3 days 2 weeks 1 3 gal (≈11 L) 14 gal (≈53 L) 2 6 gal (≈23 L) 28 gal (≈106 L) 4 12 gal (≈45 L) 56 gal (≈212 L) Easiest: buy bottled water Unopened store-bought bottled water is the safest choice. Check the expiration date. Storing your own 1. Pick containers Best: food-grade water containers. Otherwise: a tight-closing lid , unbreakable material (not glass) , and a narrow opening if possible. Never use containers that held chemicals (bleach, pesticides, etc.). 2. Clean and sanitize them Wash with soap and rinse well with water. Mix 1 teaspoon of unscented household bleach in 1 quart (4 cups / ≈1 L) of water. Pour it in the container. Close the lid and shake so it touches every inside surface. Wait at least 30 seconds , then pour it out. Let the container air-dry. 3. Fill and label Fill with clean tap water and close tightly. Label it \"Drinking water\" with today's date . 4. Store it Cool place: 50–70 °F (10–21 °C). Out of direct sunlight. Away from gasoline, pesticides and other chemicals. Replace it every 6 months. Using stored water Pour it out, or use a clean scoop each time. Don't put your hands in the water or touch the inside of the container. Also keep A bottle of unscented household bleach (5–9% sodium hypochlorite) to disinfect water if you need to (see making-water-safe.md ). Sources (checked 2026-11-01) CDC, How to Create and Store an Emergency Water Supply: https://www.cdc.gov/water-emergency/about/how-to-create-and-store-an-emergency-water-supply.html"},"04-food/README":{"title":"04 · Food","folder":"04-food","html":"<h1 id=\"04-food\">04 · Food<\/h1>\n<p>Keeping food safe and making it last.<\/p>\n<h2 id=\"pages\">Pages<\/h2>\n<p><em>None yet.<\/em><\/p>\n<h2 id=\"to-add\">To add<\/h2>\n<ul>\n<li>Food safety during a power outage (fridge and freezer)<\/li>\n<li>Preserving food: drying, salting, canning<\/li>\n<li>Safe foraging basics and poisonous look-alikes<\/li>\n<\/ul>","text":"04 · Food Keeping food safe and making it last. Pages None yet. To add Food safety during a power outage (fridge and freezer) Preserving food: drying, salting, canning Safe foraging basics and poisonous look-alikes"},"05-shelter-and-warmth/README":{"title":"05 · Shelter and Warmth","folder":"05-shelter-and-warmth","html":"<h1 id=\"05-shelter-and-warmth\">05 · Shelter and Warmth<\/h1>\n<p>Staying protected and warm, at home or away.<\/p>\n<h2 id=\"pages\">Pages<\/h2>\n<p><em>None yet.<\/em><\/p>\n<h2 id=\"to-add\">To add<\/h2>\n<ul>\n<li>Keeping warm without heating<\/li>\n<li>Carbon monoxide danger<\/li>\n<li>Sheltering in place<\/li>\n<\/ul>","text":"05 · Shelter and Warmth Staying protected and warm, at home or away. Pages None yet. To add Keeping warm without heating Carbon monoxide danger Sheltering in place"},"06-fire-and-light/README":{"title":"06 · Fire and Light","folder":"06-fire-and-light","html":"<h1 id=\"06-fire-and-light\">06 · Fire and Light<\/h1>\n<p>Lighting fires safely, and light when the power is out.<\/p>\n<h2 id=\"pages\">Pages<\/h2>\n<p><em>None yet.<\/em><\/p>\n<h2 id=\"to-add\">To add<\/h2>\n<ul>\n<li>Lighting and keeping a fire safely<\/li>\n<li>Safe use of candles and lamps<\/li>\n<\/ul>","text":"06 · Fire and Light Lighting fires safely, and light when the power is out. Pages None yet. To add Lighting and keeping a fire safely Safe use of candles and lamps"},"07-sanitation-and-hygiene/README":{"title":"07 · Sanitation and Hygiene","folder":"07-sanitation-and-hygiene","html":"<h1 id=\"07-sanitation-and-hygiene\">07 · Sanitation and Hygiene<\/h1>\n<p>Preventing disease when water and sewage systems fail.<\/p>\n<h2 id=\"pages\">Pages<\/h2>\n<p><em>None yet.<\/em><\/p>\n<h2 id=\"to-add\">To add<\/h2>\n<ul>\n<li>Emergency toilets and waste disposal<\/li>\n<li>Handwashing with little water<\/li>\n<\/ul>","text":"07 · Sanitation and Hygiene Preventing disease when water and sewage systems fail. Pages None yet. To add Emergency toilets and waste disposal Handwashing with little water"},"08-power/README":{"title":"08 · Power","folder":"08-power","html":"<h1 id=\"08-power\">08 · Power<\/h1>\n<p>Electricity when the grid is down.<\/p>\n<h2 id=\"pages\">Pages<\/h2>\n<p><em>None yet.<\/em><\/p>\n<h2 id=\"to-add\">To add<\/h2>\n<ul>\n<li>Generator safety<\/li>\n<li>Using a car battery for power<\/li>\n<li>Small solar setups<\/li>\n<\/ul>","text":"08 · Power Electricity when the grid is down. Pages None yet. To add Generator safety Using a car battery for power Small solar setups"},"09-communication/README":{"title":"09 · Communication","folder":"09-communication","html":"<h1 id=\"09-communication\">09 · Communication<\/h1>\n<p>Staying in touch and getting help without phones or internet.<\/p>\n<h2 id=\"pages\">Pages<\/h2>\n<p><em>None yet.<\/em><\/p>\n<h2 id=\"to-add\">To add<\/h2>\n<ul>\n<li>Emergency radio frequencies<\/li>\n<li>Ham and GMRS radio basics<\/li>\n<li>Signaling for help<\/li>\n<\/ul>","text":"09 · Communication Staying in touch and getting help without phones or internet. Pages None yet. To add Emergency radio frequencies Ham and GMRS radio basics Signaling for help"},"10-navigation-and-maps/README":{"title":"10 · Navigation and Maps","folder":"10-navigation-and-maps","html":"<h1 id=\"10-navigation-and-maps\">10 · Navigation and Maps<\/h1>\n<p>Finding your way without GPS or online maps.<\/p>\n<h2 id=\"pages\">Pages<\/h2>\n<p><em>None yet.<\/em><\/p>\n<h2 id=\"to-add\">To add<\/h2>\n<ul>\n<li>Using a map and compass<\/li>\n<li>Offline maps of your region (OpenStreetMap)<\/li>\n<\/ul>","text":"10 · Navigation and Maps Finding your way without GPS or online maps. Pages None yet. To add Using a map and compass Offline maps of your region (OpenStreetMap)"},"11-preparedness/README":{"title":"11 · Preparedness","folder":"11-preparedness","html":"<h1 id=\"11-preparedness\">11 · Preparedness<\/h1>\n<p>Checklists for <strong>before<\/strong> a disaster, while stores and the internet still work.<\/p>\n<h2 id=\"pages\">Pages<\/h2>\n<ul>\n<li><a href=\"#/11-preparedness/emergency-kit\">Emergency Supply Kit<\/a><\/li>\n<\/ul>\n<h2 id=\"to-add\">To add<\/h2>\n<ul>\n<li>Family emergency plan<\/li>\n<li>Local hazards, hospitals and shelters<\/li>\n<\/ul>","text":"11 · Preparedness Checklists for before a disaster, while stores and the internet still work. Pages Emergency Supply Kit To add Family emergency plan Local hazards, hospitals and shelters"},"11-preparedness/emergency-kit":{"title":"Emergency Supply Kit","folder":"11-preparedness","html":"<h1 id=\"emergency-supply-kit\">Emergency Supply Kit<\/h1>\n<p>A kit you can use at home or take with you. Check it every six months and\nreplace expired food, water, medicine and batteries.<\/p>\n<h2 id=\"basic-kit\">Basic kit<\/h2>\n<ul>\n<li>☐ <strong>Water<\/strong>: one gallon (≈3.8 L) per person per day, for several days, for\n      drinking and sanitation<\/li>\n<li>☐ <strong>Food<\/strong>: a several-day supply of non-perishable food<\/li>\n<li>☐ Battery-powered or hand-crank radio, and a NOAA Weather Radio with tone\n      alert (US)<\/li>\n<li>☐ Flashlight<\/li>\n<li>☐ First aid kit<\/li>\n<li>☐ Extra batteries<\/li>\n<li>☐ Whistle to signal for help<\/li>\n<li>☐ Dust mask to filter contaminated air<\/li>\n<li>☐ Plastic sheeting, scissors and duct tape to shelter in place<\/li>\n<li>☐ Moist towelettes, garbage bags and plastic ties for personal sanitation<\/li>\n<li>☐ Wrench or pliers to turn off utilities<\/li>\n<li>☐ Manual can opener<\/li>\n<li>☐ Local maps (paper)<\/li>\n<li>☐ Cell phone with chargers and a backup battery<\/li>\n<\/ul>\n<h2 id=\"add-based-on-your-needs\">Add based on your needs<\/h2>\n<ul>\n<li>☐ Soap, hand sanitizer and disinfecting wipes<\/li>\n<li>☐ Prescription medications<\/li>\n<li>☐ Non-prescription medications: pain relievers, anti-diarrhea medication,\n      antacids, laxatives<\/li>\n<li>☐ Prescription glasses and contact lens solution<\/li>\n<li>☐ Infant formula, bottles, diapers, wipes, diaper rash cream<\/li>\n<li>☐ Pet food and extra water for pets<\/li>\n<li>☐ Cash<\/li>\n<li>☐ Important family documents, saved electronically or in a waterproof\n      container<\/li>\n<li>☐ Sleeping bag or warm blanket for each person<\/li>\n<li>☐ A complete change of clothes suited to your climate, and sturdy shoes<\/li>\n<li>☐ Fire extinguisher<\/li>\n<li>☐ Matches in a waterproof container<\/li>\n<li>☐ Feminine supplies and personal hygiene items<\/li>\n<li>☐ Mess kits, paper cups, plates, paper towels, plastic utensils<\/li>\n<li>☐ Paper and pencil<\/li>\n<li>☐ Books, games, puzzles and other activities for children<\/li>\n<\/ul>\n<h2 id=\"also-keep\">Also keep<\/h2>\n<ul>\n<li>☐ A copy of this Arkpi folder on a USB drive<\/li>\n<li>☐ A tourniquet (see <a href=\"#/01-emergency/severe-bleeding\">../01-emergency/severe-bleeding.md<\/a>)<\/li>\n<\/ul>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>Ready.gov, Build A Kit: https://www.ready.gov/kit<\/li>\n<\/ul>","text":"Emergency Supply Kit A kit you can use at home or take with you. Check it every six months and replace expired food, water, medicine and batteries. Basic kit ☐ Water : one gallon (≈3.8 L) per person per day, for several days, for drinking and sanitation ☐ Food : a several-day supply of non-perishable food ☐ Battery-powered or hand-crank radio, and a NOAA Weather Radio with tone alert (US) ☐ Flashlight ☐ First aid kit ☐ Extra batteries ☐ Whistle to signal for help ☐ Dust mask to filter contaminated air ☐ Plastic sheeting, scissors and duct tape to shelter in place ☐ Moist towelettes, garbage bags and plastic ties for personal sanitation ☐ Wrench or pliers to turn off utilities ☐ Manual can opener ☐ Local maps (paper) ☐ Cell phone with chargers and a backup battery Add based on your needs ☐ Soap, hand sanitizer and disinfecting wipes ☐ Prescription medications ☐ Non-prescription medications: pain relievers, anti-diarrhea medication, antacids, laxatives ☐ Prescription glasses and contact lens solution ☐ Infant formula, bottles, diapers, wipes, diaper rash cream ☐ Pet food and extra water for pets ☐ Cash ☐ Important family documents, saved electronically or in a waterproof container ☐ Sleeping bag or warm blanket for each person ☐ A complete change of clothes suited to your climate, and sturdy shoes ☐ Fire extinguisher ☐ Matches in a waterproof container ☐ Feminine supplies and personal hygiene items ☐ Mess kits, paper cups, plates, paper towels, plastic utensils ☐ Paper and pencil ☐ Books, games, puzzles and other activities for children Also keep ☐ A copy of this Arkpi folder on a USB drive ☐ A tourniquet (see ../01-emergency/severe-bleeding.md ) Sources (checked 2026-11-01) Ready.gov, Build A Kit: https://www.ready.gov/kit"},"12-noosa-tewantin/README":{"title":"12 · Noosa / Tewantin (Queensland, Australia)","folder":"12-noosa-tewantin","html":"<h1 id=\"12-noosa-tewantin-queensland-australia\">12 · Noosa / Tewantin (Queensland, Australia)<\/h1>\n<p>Local information for Noosa Shire. <strong>Emergency: 000<\/strong> (or <strong>112<\/strong> from a\nmobile). <strong>Emergency radio: ABC Sunshine Coast 90.3 / 95.3 FM.<\/strong><\/p>\n<h2 id=\"pages\">Pages<\/h2>\n<ul>\n<li><a href=\"#/12-noosa-tewantin/emergency-contacts\">Emergency Contacts<\/a>: print this one<\/li>\n<li><a href=\"#/12-noosa-tewantin/warnings\">Understanding Warnings<\/a>: Advice / Watch and Act / Emergency Warning, fire danger ratings<\/li>\n<li><a href=\"#/12-noosa-tewantin/local-hazards\">Local Hazards<\/a>: what has happened here, and how to check your home's risk<\/li>\n<li><a href=\"#/12-noosa-tewantin/cyclone-and-storm-tide\">Cyclone and Storm Tide<\/a><\/li>\n<li><a href=\"#/12-noosa-tewantin/bushfire\">Bushfire<\/a><\/li>\n<li><a href=\"#/12-noosa-tewantin/heatwave\">Heatwave<\/a><\/li>\n<li>Bites and stings (snakes, spiders, ticks, bluebottles):\n    <a href=\"#/02-first-aid/bites-and-stings-australia\">../02-first-aid/bites-and-stings-australia.md<\/a><\/li>\n<\/ul>\n<h2 id=\"official-documents-download-while-you-have-internet\">Official documents (download while you have internet)<\/h2>\n<p><code>bash\n./tools/download-local.sh<\/code><\/p>\n<p>This saves the following into <code>12-noosa-tewantin/downloads/<\/code>. They're not\nstored on GitHub: they're Noosa Council's documents, and the guide is too big\n(113 MB).<\/p>\n<ul>\n<li><strong>Noosa Emergency Action Guide<\/strong>: the council's full guide<\/li>\n<li><strong>Flood maps<\/strong> (minor/moderate and major/extreme) for <strong>Tewantin,\n    Noosaville and Noosa Heads<\/strong><\/li>\n<\/ul>\n<h2 id=\"australian-first-aid-differs-in-places\">Australian first aid differs in places<\/h2>\n<p>The first-aid pages in this ark come mostly from US sources. In Australia:<\/p>\n<ul>\n<li><strong>Choking:<\/strong> use <strong>back blows and chest thrusts<\/strong>, not abdominal thrusts. See\n    the note in <a href=\"#/01-emergency/choking\">../01-emergency/choking.md<\/a>.<\/li>\n<li><strong>Burns:<\/strong> cool under running water for <strong>at least 20 minutes<\/strong>. See the note\n    in <a href=\"#/01-emergency/burns\">../01-emergency/burns.md<\/a>.<\/li>\n<li><strong>CPR:<\/strong> the same 30:2 and 100–120 per minute, using the <strong>DRSABCD<\/strong> steps.\n    See the note in <a href=\"#/01-emergency/cpr\">../01-emergency/cpr.md<\/a>.<\/li>\n<\/ul>\n<h2 id=\"to-add\">To add<\/h2>\n<ul>\n<li>Evacuation centres (they're announced on the Disaster Dashboard during an\n    event)<\/li>\n<li>Offline map of the local area<\/li>\n<\/ul>","text":"12 · Noosa / Tewantin (Queensland, Australia) Local information for Noosa Shire. Emergency: 000 (or 112 from a mobile). Emergency radio: ABC Sunshine Coast 90.3 / 95.3 FM. Pages Emergency Contacts : print this one Understanding Warnings : Advice / Watch and Act / Emergency Warning, fire danger ratings Local Hazards : what has happened here, and how to check your home's risk Cyclone and Storm Tide Bushfire Heatwave Bites and stings (snakes, spiders, ticks, bluebottles): ../02-first-aid/bites-and-stings-australia.md Official documents (download while you have internet) bash ./tools/download-local.sh This saves the following into 12-noosa-tewantin/downloads/ . They're not stored on GitHub: they're Noosa Council's documents, and the guide is too big (113 MB). Noosa Emergency Action Guide : the council's full guide Flood maps (minor/moderate and major/extreme) for Tewantin, Noosaville and Noosa Heads Australian first aid differs in places The first-aid pages in this ark come mostly from US sources. In Australia: Choking: use back blows and chest thrusts , not abdominal thrusts. See the note in ../01-emergency/choking.md . Burns: cool under running water for at least 20 minutes . See the note in ../01-emergency/burns.md . CPR: the same 30:2 and 100–120 per minute, using the DRSABCD steps. See the note in ../01-emergency/cpr.md . To add Evacuation centres (they're announced on the Disaster Dashboard during an event) Offline map of the local area"},"12-noosa-tewantin/bushfire":{"title":"Bushfire (Noosa)","folder":"12-noosa-tewantin","html":"<h1 id=\"bushfire-noosa\">Bushfire (Noosa)<\/h1>\n<p>You don't have to live in the bush to be at risk: being close enough for\n<strong>embers, burning material and smoke<\/strong> to reach you is enough. Fires can move\n<strong>faster than you can run<\/strong> and change direction suddenly.<\/p>\n<p>Fire season in South-East Queensland usually starts in <strong>July/August<\/strong> and can\nrun into summer. Check the daily <strong>Fire Danger Rating<\/strong> (see\n<a href=\"#/12-noosa-tewantin/warnings\">warnings.md<\/a>).<\/p>\n<h2 id=\"decide-now-leave-early-or-stay-and-defend\">Decide now: leave early, or stay and defend?<\/h2>\n<p>If you plan to leave, go <strong>well before<\/strong> a fire threatens, while the roads are\nstill safe.<\/p>\n<p>Only plan to stay if your property is well prepared, you are physically and\nmentally ready, and you have the equipment and know how to use it. On a\n<strong>Catastrophic<\/strong> day, leave bushfire risk areas.<\/p>\n<h2 id=\"before-a-fire\">Before a fire<\/h2>\n<ul>\n<li>Write a <strong>Bushfire Survival Plan<\/strong> with your household.<\/li>\n<li>Keep grass short and vegetation cleared around the house.<\/li>\n<li>Move flammable things away from the house: woodpiles, boxes, hanging\n    baskets, garden furniture, <strong>gas bottles<\/strong>.<\/li>\n<li>Keep driveways clear for fire trucks.<\/li>\n<li>Don't dump garden waste in reserves or bushland.<\/li>\n<li>Prepare your emergency and evacuation kits.<\/li>\n<li><strong>When a warning tells you to act, act immediately.<\/strong> Leave when advised,\n    even if it feels safe where you are, and go in the direction advised.<\/li>\n<\/ul>\n<h2 id=\"if-you-are-sheltering-as-the-fire-front-arrives\">If you are sheltering as the fire front arrives<\/h2>\n<ul>\n<li>Bring hoses and fittings inside. Go inside.<\/li>\n<li>Shelter on the <strong>side of the house away from the fire<\/strong>.<\/li>\n<li><strong>Drink lots of water.<\/strong><\/li>\n<li>Patrol for embers inside, especially in the <strong>roof space<\/strong>.<\/li>\n<li>Check on family and pets. Keep a way out.<\/li>\n<li>Close windows and doors, take down curtains, and move furniture away from\n    windows.<\/li>\n<\/ul>\n<h2 id=\"after-the-fire-front-passes\">After the fire front passes<\/h2>\n<ul>\n<li><strong>Emergency: 000<\/strong> (or 112 from a mobile).<\/li>\n<li>Listen to the radio for Queensland Fire Department warnings.<\/li>\n<li>If you evacuated, wait for the all-clear before leaving your safe place.<\/li>\n<li>Use a mask or a damp cloth over your face against smoke.<\/li>\n<li>Check the property for <strong>live electricity, leaking gas, sewage leaks, hot\n    embers<\/strong>, hanging branches and structural damage. If unsure, ask emergency\n    services. Don't take risks.<\/li>\n<li>Keep drinking water.<\/li>\n<\/ul>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>Noosa Council, Emergency Action Guide 2024 (Bushfire section):\n    https://www.noosa.qld.gov.au/Community/Disasters-and-emergencies<\/li>\n<li>Australian Fire Danger Rating System: https://afdrs.com.au/<\/li>\n<\/ul>","text":"Bushfire (Noosa) You don't have to live in the bush to be at risk: being close enough for embers, burning material and smoke to reach you is enough. Fires can move faster than you can run and change direction suddenly. Fire season in South-East Queensland usually starts in July/August and can run into summer. Check the daily Fire Danger Rating (see warnings.md ). Decide now: leave early, or stay and defend? If you plan to leave, go well before a fire threatens, while the roads are still safe. Only plan to stay if your property is well prepared, you are physically and mentally ready, and you have the equipment and know how to use it. On a Catastrophic day, leave bushfire risk areas. Before a fire Write a Bushfire Survival Plan with your household. Keep grass short and vegetation cleared around the house. Move flammable things away from the house: woodpiles, boxes, hanging baskets, garden furniture, gas bottles . Keep driveways clear for fire trucks. Don't dump garden waste in reserves or bushland. Prepare your emergency and evacuation kits. When a warning tells you to act, act immediately. Leave when advised, even if it feels safe where you are, and go in the direction advised. If you are sheltering as the fire front arrives Bring hoses and fittings inside. Go inside. Shelter on the side of the house away from the fire . Drink lots of water. Patrol for embers inside, especially in the roof space . Check on family and pets. Keep a way out. Close windows and doors, take down curtains, and move furniture away from windows. After the fire front passes Emergency: 000 (or 112 from a mobile). Listen to the radio for Queensland Fire Department warnings. If you evacuated, wait for the all-clear before leaving your safe place. Use a mask or a damp cloth over your face against smoke. Check the property for live electricity, leaking gas, sewage leaks, hot embers , hanging branches and structural damage. If unsure, ask emergency services. Don't take risks. Keep drinking water. Sources (checked 2026-11-01) Noosa Council, Emergency Action Guide 2024 (Bushfire section): https://www.noosa.qld.gov.au/Community/Disasters-and-emergencies Australian Fire Danger Rating System: https://afdrs.com.au/"},"12-noosa-tewantin/cyclone-and-storm-tide":{"title":"Cyclone and Storm Tide (Noosa)","folder":"12-noosa-tewantin","html":"<h1 id=\"cyclone-and-storm-tide-noosa\">Cyclone and Storm Tide (Noosa)<\/h1>\n<p>Most cyclones here come <strong>between November and April<\/strong>.<\/p>\n<h2 id=\"cyclone-categories\">Cyclone categories<\/h2>\n<table>\n<thead>\n<tr>\n<th>Cat.<\/th>\n<th>Strongest gusts<\/th>\n<th>Typical effects<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>1<\/strong><\/td>\n<td>under 125 km/h<\/td>\n<td>Minimal house damage; damage to some trees and caravans; boats may drag moorings<\/td>\n<\/tr>\n<tr>\n<td><strong>2<\/strong><\/td>\n<td>125–164 km/h<\/td>\n<td>Minor house damage; significant damage to trees and caravans; risk of power failure<\/td>\n<\/tr>\n<tr>\n<td><strong>3<\/strong> (severe)<\/td>\n<td>165–224 km/h<\/td>\n<td>Some roof and structural damage; some caravans destroyed; power failure likely<\/td>\n<\/tr>\n<tr>\n<td><strong>4<\/strong> (severe)<\/td>\n<td>225–279 km/h<\/td>\n<td>Significant roof and structural damage; dangerous flying debris; widespread power failures<\/td>\n<\/tr>\n<tr>\n<td><strong>5<\/strong> (severe)<\/td>\n<td>over 280 km/h<\/td>\n<td>Extremely dangerous, widespread destruction<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"before-the-season-october\">Before the season (October)<\/h2>\n<ul>\n<li>Clean up the yard; trim trees and overhanging branches; clear gutters.<\/li>\n<li>Check the roof, windows and loose fittings. Fit shutters if you can.<\/li>\n<li>Know how to turn off <strong>water, power and gas<\/strong> at the mains.<\/li>\n<li>Know whether you're in a <strong>storm tide evacuation zone<\/strong> (see\n    <a href=\"#/12-noosa-tewantin/local-hazards\">local-hazards.md<\/a>).<\/li>\n<li>Pack your emergency kit and an evacuation kit (see\n    <a href=\"#/11-preparedness/emergency-kit\">../11-preparedness/emergency-kit.md<\/a>).<\/li>\n<li>Boat owners: follow Maritime Safety Queensland's severe weather plan for the\n    region, double up mooring lines, and know where the boat must go.<\/li>\n<\/ul>\n<h2 id=\"when-a-cyclone-warning-is-issued\">When a cyclone warning is issued<\/h2>\n<p>A warning means winds are expected <strong>within 24 hours<\/strong>. <strong>Start your household\nemergency plan now.<\/strong> Depending on official advice:<\/p>\n<ul>\n<li>Collect children from school or childcare when told to, and go home.<\/li>\n<li>Park vehicles under solid shelter (handbrake on, in gear).<\/li>\n<li>Put outdoor furniture in the pool or inside, with other loose items.<\/li>\n<li>Close shutters, or board or tape windows (tape doesn't strengthen glass,\n    but limits shattering). Draw curtains and lock doors.<\/li>\n<li>Pack your evacuation kit. <strong>Leave if emergency services tell you to.<\/strong><\/li>\n<\/ul>\n<h2 id=\"during-the-cyclone\">During the cyclone<\/h2>\n<ul>\n<li>Listen to the radio: <strong>ABC Sunshine Coast 90.3 / 95.3 FM<\/strong>.<\/li>\n<li><strong>Stay inside, with your pets.<\/strong> Unplug electrical appliances. Keep the\n    fridge and freezer closed.<\/li>\n<li>Shelter in the <strong>strongest part of the house, away from windows<\/strong>: an\n    internal hallway or bathroom.<\/li>\n<li>If the building starts to break up, protect yourself with mattresses, rugs\n    or blankets under a strong table or bench, or hold onto something solid.<\/li>\n<li><strong>Beware the calm \"eye\".<\/strong> If the wind stops, it isn't over. Violent winds\n    will return from the other direction. <strong>Wait for the official all-clear.<\/strong><\/li>\n<li>If you're driving: stop (handbrake on, in gear) <strong>away from the sea<\/strong>, trees\n    and power lines, and stay in the car.<\/li>\n<\/ul>\n<h2 id=\"storm-tide\">Storm tide<\/h2>\n<p>A storm tide happens when a storm pushes sea water onshore on top of the normal\ntide, flooding low coastal land.<\/p>\n<p><img alt=\"Diagram: cyclone winds pile water toward the coast, and low pressure under the eye raises it further\" loading=\"lazy\" src=\"12-noosa-tewantin/images/storm-surge.png\" /><\/p>\n<p><em>Wind pushes water ashore; low pressure near the eye lifts it a little more.<\/em><\/p>\n<ul>\n<li>Stay inside until you're officially told it's safe.<\/li>\n<li>Don't use wet electrical appliances. Watch for fallen power lines, damaged\n    bridges and trees.<\/li>\n<li><strong>\"If it's flooded, forget it.\"<\/strong> Don't enter floodwater.<\/li>\n<\/ul>\n<h2 id=\"after\">After<\/h2>\n<ul>\n<li><strong>Don't go outside until officially advised it's safe.<\/strong> If you evacuated,\n    don't return until told to, and use the recommended route.<\/li>\n<li><strong>Check for gas leaks<\/strong> (see <a href=\"#/01-emergency/gas-leak\">../01-emergency/gas-leak.md<\/a>)\n    and fallen power lines.<\/li>\n<li>Wear rubber boots and gloves for cleanup. Treat everything that touched\n    floodwater as contaminated, and wash your hands after handling it.<\/li>\n<li>Watch for damaged floors, walls and ceilings, and for <strong>snakes<\/strong>.<\/li>\n<li>Throw out food that touched floodwater, and follow any instructions about\n    treating water (see <a href=\"#/03-water/making-water-safe\">../03-water/making-water-safe.md<\/a>).<\/li>\n<li>Don't go sightseeing. Check on neighbours, friends and family. Avoid\n    unnecessary phone calls so lines stay free.<\/li>\n<\/ul>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>Noosa Council, Emergency Action Guide 2024 (Cyclone and Storm surge\n    sections): https://www.noosa.qld.gov.au/Community/Disasters-and-emergencies<\/li>\n<li>Diagram: see <a href=\"#/12-noosa-tewantin/images/CREDITS\">images/CREDITS.md<\/a><\/li>\n<\/ul>","text":"Cyclone and Storm Tide (Noosa) Most cyclones here come between November and April . Cyclone categories Cat. Strongest gusts Typical effects 1 under 125 km/h Minimal house damage; damage
