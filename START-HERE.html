 pulse<\/li>\n<li>Fast, shallow breathing<\/li>\n<li>Dizziness, feeling faint<\/li>\n<li>Anxiety, restlessness, confusion<\/li>\n<li>Blue lips or fingernails<\/li>\n<li>Chest discomfort<\/li>\n<li>Little or no urine<\/li>\n<li>Passing out<\/li>\n<\/ul>\n<h2 id=\"what-to-do\">What to do<\/h2>\n<ol>\n<li><strong>Call your local emergency number right away.<\/strong><\/li>\n<li>Check airway and breathing. Start CPR if needed (see <a href=\"#/01-emergency/cpr\">cpr.md<\/a>).<\/li>\n<li><strong>Recheck breathing at least every 5 minutes<\/strong>, even if they seem fine.<\/li>\n<li>\n<p>If they are conscious and have <strong>no head, neck, spine or leg injury<\/strong>: lay\n    them on their back and <strong>raise their legs about 12 inches (30 cm)<\/strong>, head\n    flat. If raising the legs hurts or could cause harm, leave them flat.<\/p>\n<p><img alt=\"Person lying on their back with feet raised on a pack\" loading=\"lazy\" src=\"01-emergency/images/shock-legs-raised.png\" /><\/p>\n<\/li>\n<li>\n<p>Treat other injuries (for bleeding, see\n    <a href=\"#/01-emergency/severe-bleeding\">severe-bleeding.md<\/a>).<\/p>\n<\/li>\n<li>\n<p><strong>Keep them warm<\/strong> and comfortable. Loosen tight clothing.<\/p>\n<p><img alt=\"Person lying covered by a blanket, feet raised\" loading=\"lazy\" src=\"01-emergency/images/shock-keep-warm.png\" /><\/p>\n<\/li>\n<li>\n<p>If they vomit or drool, turn their head to the side so they don't choke.\n    If a spine injury is possible, roll the <strong>whole body<\/strong> together, keeping\n    head, neck and back in line.<\/p>\n<p><img alt=\"Person's head turned to one side\" loading=\"lazy\" src=\"01-emergency/images/shock-head-to-side.png\" /><\/p>\n<\/li>\n<\/ol>\n<h2 id=\"dont\">Don't<\/h2>\n<ul>\n<li><strong>Don't give them anything to eat or drink.<\/strong><\/li>\n<li>Don't move someone with a known or suspected spine injury.<\/li>\n<li>Don't wait for mild signs to get worse before calling for help.<\/li>\n<\/ul>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>MedlinePlus (US National Library of Medicine), Shock:\n    https://medlineplus.gov/ency/article/000039.htm<\/li>\n<li>Drawings: see <a href=\"#/01-emergency/images/CREDITS\">images/CREDITS.md<\/a><\/li>\n<\/ul>","text":"Shock Shock means the body isn't getting enough blood flow. It can follow heavy bleeding, severe burns, serious injury, infection or allergic reactions. It is life-threatening. Don't wait for it to get worse before getting help. Signs Pale, cool, clammy skin; heavy sweating Fast but weak pulse Fast, shallow breathing Dizziness, feeling faint Anxiety, restlessness, confusion Blue lips or fingernails Chest discomfort Little or no urine Passing out What to do Call your local emergency number right away. Check airway and breathing. Start CPR if needed (see cpr.md ). Recheck breathing at least every 5 minutes , even if they seem fine. If they are conscious and have no head, neck, spine or leg injury : lay them on their back and raise their legs about 12 inches (30 cm) , head flat. If raising the legs hurts or could cause harm, leave them flat. Treat other injuries (for bleeding, see severe-bleeding.md ). Keep them warm and comfortable. Loosen tight clothing. If they vomit or drool, turn their head to the side so they don't choke. If a spine injury is possible, roll the whole body together, keeping head, neck and back in line. Don't Don't give them anything to eat or drink. Don't move someone with a known or suspected spine injury. Don't wait for mild signs to get worse before calling for help. Sources (checked 2026-11-01) MedlinePlus (US National Library of Medicine), Shock: https://medlineplus.gov/ency/article/000039.htm Drawings: see images/CREDITS.md"},"01-emergency/tornado":{"title":"Tornado","folder":"01-emergency","html":"<h1 id=\"tornado\">Tornado<\/h1>\n<p>Tornadoes do happen around Noosa: one hit <strong>Kin Kin<\/strong> in 1971, killing three\npeople (see <a href=\"#/12-noosa-tewantin/local-hazards\">../12-noosa-tewantin/local-hazards.md<\/a>).<\/p>\n<h2 id=\"warning-signs\">Warning signs<\/h2>\n<ul>\n<li>A <strong>rotating, funnel-shaped cloud<\/strong><\/li>\n<li>An approaching <strong>cloud of debris<\/strong><\/li>\n<li>A <strong>loud roar, like a freight train<\/strong><\/li>\n<\/ul>\n<h2 id=\"at-home-or-in-a-building\">At home or in a building<\/h2>\n<ol>\n<li><strong>Go straight to the safest place you've already chosen<\/strong>: a small,\n    <strong>interior, windowless room<\/strong> on the <strong>lowest floor<\/strong> of a sturdy building.<\/li>\n<li><strong>Keep away from windows, doors and outside walls.<\/strong><\/li>\n<li><strong>Protect your head and neck<\/strong> with your arms. Use furniture or blankets for\n    extra cover.<\/li>\n<\/ol>\n<p>If you can't stay at home, go to a public shelter.<\/p>\n<h2 id=\"in-a-car\">In a car<\/h2>\n<p>There's no safe option in a car, only less dangerous ones.<\/p>\n<ul>\n<li>If the tornado is far away, visible, and traffic is light, you may be able to\n    drive away at <strong>right angles<\/strong> to its path.<\/li>\n<li>Caught by strong wind or flying debris: <strong>park out of the traffic lanes, stay\n    buckled in and keep your head below the windows.<\/strong><\/li>\n<li>If there's ground <strong>clearly lower than the road<\/strong> nearby, get out and lie down\n    there.<\/li>\n<li><strong>Don't shelter under bridges.<\/strong><\/li>\n<\/ul>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>Ready.gov, Tornadoes: https://www.ready.gov/tornadoes<\/li>\n<li>Noosa Council, Emergency Action Guide 2024 (local history)<\/li>\n<\/ul>","text":"Tornado Tornadoes do happen around Noosa: one hit Kin Kin in 1971, killing three people (see ../12-noosa-tewantin/local-hazards.md ). Warning signs A rotating, funnel-shaped cloud An approaching cloud of debris A loud roar, like a freight train At home or in a building Go straight to the safest place you've already chosen : a small, interior, windowless room on the lowest floor of a sturdy building. Keep away from windows, doors and outside walls. Protect your head and neck with your arms. Use furniture or blankets for extra cover. If you can't stay at home, go to a public shelter. In a car There's no safe option in a car, only less dangerous ones. If the tornado is far away, visible, and traffic is light, you may be able to drive away at right angles to its path. Caught by strong wind or flying debris: park out of the traffic lanes, stay buckled in and keep your head below the windows. If there's ground clearly lower than the road nearby, get out and lie down there. Don't shelter under bridges. Sources (checked 2026-11-01) Ready.gov, Tornadoes: https://www.ready.gov/tornadoes Noosa Council, Emergency Action Guide 2024 (local history)"},"02-first-aid/README":{"title":"02 · First Aid","folder":"02-first-aid","html":"<h1 id=\"02-first-aid\">02 · First Aid<\/h1>\n<p>Care for injuries and illness once the immediate danger has passed.\nFor life-threatening situations, start with <a href=\"#/01-emergency/README\">01-emergency<\/a>.<\/p>\n<h2 id=\"pages\">Pages<\/h2>\n<ul>\n<li><a href=\"#/02-first-aid/cuts-and-wounds\">Cuts and Puncture Wounds<\/a>, including signs of infection<\/li>\n<li><a href=\"#/02-first-aid/broken-bones\">Broken Bones<\/a>, including improvised splints<\/li>\n<li><a href=\"#/02-first-aid/sprains-and-strains\">Sprains and Strains<\/a><\/li>\n<li><a href=\"#/02-first-aid/eye-injuries\">Eye Injuries<\/a><\/li>\n<li><a href=\"#/02-first-aid/bites-and-stings-australia\">Bites and Stings (Australia)<\/a>: snakes, spiders, ticks, bluebottles<\/li>\n<li><a href=\"#/02-first-aid/dehydration\">Dehydration and Oral Rehydration Solution<\/a>, with a homemade ORS recipe<\/li>\n<li><a href=\"#/02-first-aid/hypothermia\">Hypothermia<\/a><\/li>\n<li><a href=\"#/02-first-aid/heat-illness\">Heat Illness<\/a><\/li>\n<li><a href=\"#/02-first-aid/medicines-in-an-emergency\">Medicines in an Emergency<\/a><\/li>\n<\/ul>\n<h2 id=\"to-add\">To add<\/h2>\n<ul>\n<li>Emergency childbirth: no official step-by-step guide has been found yet. Call\n    000 and stay on the line.<\/li>\n<\/ul>","text":"02 · First Aid Care for injuries and illness once the immediate danger has passed. For life-threatening situations, start with 01-emergency . Pages Cuts and Puncture Wounds , including signs of infection Broken Bones , including improvised splints Sprains and Strains Eye Injuries Bites and Stings (Australia) : snakes, spiders, ticks, bluebottles Dehydration and Oral Rehydration Solution , with a homemade ORS recipe Hypothermia Heat Illness Medicines in an Emergency To add Emergency childbirth: no official step-by-step guide has been found yet. Call 000 and stay on the line."},"02-first-aid/bites-and-stings-australia":{"title":"Bites and Stings (Australia)","folder":"02-first-aid","html":"<h1 id=\"bites-and-stings-australia\">Bites and Stings (Australia)<\/h1>\n<p>For anaphylaxis (trouble breathing, swollen tongue or throat, collapse): <strong>call\n000<\/strong>, use an adrenaline autoinjector if they have one, lay them down and raise\ntheir legs. <strong>Poisons Information: 13 11 26.<\/strong><\/p>\n<h2 id=\"snake-bite\">Snake bite<\/h2>\n<p><strong>Call 000 for any snake bite.<\/strong> Every snake bite needs a doctor, even if the\nperson seems fine.<\/p>\n<p><strong>Pressure immobilisation bandage:<\/strong><\/p>\n<ol>\n<li><strong>Keep the person still and calm<\/strong>, away from the snake. Stay with them.<\/li>\n<li>Put a <strong>broad roller bandage (10–15 cm wide) firmly over the bite.<\/strong><\/li>\n<li>With a second bandage, <strong>wrap the whole limb<\/strong>, starting just above the\n    fingers or toes and working up toward the body.<\/li>\n<li><strong>Firm:<\/strong> you shouldn't be able to slide a finger easily under the bandage.<\/li>\n<li><strong>Splint<\/strong> the limb so it can't move.<\/li>\n<li><strong>Write down the time<\/strong> of the bite and when the bandage went on. Mark the\n    bite site on the bandage, or take a photo.<\/li>\n<li>If they stop responding or breathing normally, start CPR (see\n    <a href=\"#/01-emergency/cpr\">../01-emergency/cpr.md<\/a>).<\/li>\n<\/ol>\n<p><strong>Don't:<\/strong><\/p>\n<ul>\n<li><strong>Don't wash the bite.<\/strong> Venom left on the skin helps identify the snake.<\/li>\n<li><strong>Don't use a tourniquet.<\/strong><\/li>\n<li>Don't cut the wound or try to suck out the venom.<\/li>\n<li>Don't try to catch or kill the snake.<\/li>\n<\/ul>\n<h2 id=\"spider-bite\">Spider bite<\/h2>\n<p><strong>Funnel-web, mouse spider, or any big black spider: call 000.<\/strong> Use the\n<strong>same pressure immobilisation bandage<\/strong> as for snake bite (above): keep them\nlying still, bandage firmly but not cutting off circulation, splint, mark the\nsite, note the times.<\/p>\n<p><strong>Redback:<\/strong> wash with soap and water, apply a <strong>cold pack for 15 minutes<\/strong>,\nand see a doctor if symptoms are bad. Severe pain: go to hospital. <strong>No pressure\nbandage<\/strong>; that is only for funnel-web and mouse spiders.<\/p>\n<p><strong>Other spiders:<\/strong> wash, apply antiseptic, use an ice pack wrapped in cloth,\nparacetamol or ibuprofen for pain. See a doctor if the pain is bad, it doesn't\nsettle in a few hours, or it gets worse after 1–2 days.<\/p>\n<h2 id=\"tick-bite-paralysis-tick\">Tick bite (paralysis tick)<\/h2>\n<p>The <strong>paralysis tick<\/strong> is the most common tick in eastern Australia.<\/p>\n<p><img alt=\"Drawing of an adult female paralysis tick, Ixodes holocyclus\" loading=\"lazy\" src=\"02-first-aid/images/paralysis-tick.png\" /><\/p>\n<p><em>Adult female paralysis tick (enlarged).<\/em><\/p>\n<ol>\n<li><strong>Kill it first:<\/strong> freeze it with an <strong>ether-containing spray<\/strong> from a\n    pharmacy. It should drop off within about 5 minutes. (If it's embedded,\n    permethrin cream can be used.)<\/li>\n<li><strong>Don't pull, squeeze or twist it.<\/strong> That makes it inject more saliva.<\/li>\n<li>Don't use home remedies (methylated spirits, kerosene, Vaseline, nail\n    polish, oil, alcohol, matches). They can make it burrow deeper.<\/li>\n<li>Wash the area with soap and water.<\/li>\n<li>If it won't come off or can't be frozen, leave it and <strong>get medical help<\/strong>.<\/li>\n<\/ol>\n<p><strong>Tick allergy:<\/strong> if you know you're allergic, get medical help as soon as you\nfind an attached tick. Don't remove it yourself. Carry your adrenaline\nautoinjector.<\/p>\n<p>See a doctor if, days later, there's headache, blurred vision, weakness or poor\nbalance (tick paralysis is rare).<\/p>\n<h2 id=\"jellyfish-bluebottle-sting-noosa-beaches\">Jellyfish (bluebottle) sting: Noosa beaches<\/h2>\n<p>Noosa is in <strong>non-tropical<\/strong> waters (south of Bundaberg).<\/p>\n<ol>\n<li><strong>Rinse with sea water, not fresh water.<\/strong><\/li>\n<li>Pick off tentacles (by hand is OK) or wash them off with sea water.<\/li>\n<li>Put the area in <strong>hot water at about 45 °C for 20 minutes<\/strong>. Check it won't\n    burn. Or use a hot shower. Hot water works better than ice.<\/li>\n<li><strong>Don't use vinegar on a bluebottle sting.<\/strong> It can increase the pain.<\/li>\n<\/ol>\n<p>See a doctor if severe pain doesn't improve. If the person collapses or stops\nbreathing, call 000 and start CPR.<\/p>\n<p><strong>Travelling north of Bundaberg (tropical waters)?<\/strong> Box jellyfish and\nIrukandji stings are life-threatening: <strong>call 000<\/strong>, remove tentacles, <strong>pour\nvinegar<\/strong> on the site, apply ice, and go to hospital. If you don't know what\nstung you up there, treat it as a box jellyfish.<\/p>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>healthdirect (Australian Government), Snake bites:\n    https://www.healthdirect.gov.au/snake-bites<\/li>\n<li>healthdirect, Spider bites: https://www.healthdirect.gov.au/spider-bites<\/li>\n<li>healthdirect, Tick bites: https://www.healthdirect.gov.au/tick-bites<\/li>\n<li>healthdirect, Jellyfish stings: https://www.healthdirect.gov.au/jellyfish-stings<\/li>\n<li>Drawing: see <a href=\"#/02-first-aid/images/CREDITS\">images/CREDITS.md<\/a><\/li>\n<\/ul>","text":"Bites and Stings (Australia) For anaphylaxis (trouble breathing, swollen tongue or throat, collapse): call 000 , use an adrenaline autoinjector if they have one, lay them down and raise their legs. Poisons Information: 13 11 26. Snake bite Call 000 for any snake bite. Every snake bite needs a doctor, even if the person seems fine. Pressure immobilisation bandage: Keep the person still and calm , away from the snake. Stay with them. Put a broad roller bandage (10–15 cm wide) firmly over the bite. With a second bandage, wrap the whole limb , starting just above the fingers or toes and working up toward the body. Firm: you shouldn't be able to slide a finger easily under the bandage. Splint the limb so it can't move. Write down the time of the bite and when the bandage went on. Mark the bite site on the bandage, or take a photo. If they stop responding or breathing normally, start CPR (see ../01-emergency/cpr.md ). Don't: Don't wash the bite. Venom left on the skin helps identify the snake. Don't use a tourniquet. Don't cut the wound or try to suck out the venom. Don't try to catch or kill the snake. Spider bite Funnel-web, mouse spider, or any big black spider: call 000. Use the same pressure immobilisation bandage as for snake bite (above): keep them lying still, bandage firmly but not cutting off circulation, splint, mark the site, note the times. Redback: wash with soap and water, apply a cold pack for 15 minutes , and see a doctor if symptoms are bad. Severe pain: go to hospital. No pressure bandage ; that is only for funnel-web and mouse spiders. Other spiders: wash, apply antiseptic, use an ice pack wrapped in cloth, paracetamol or ibuprofen for pain. See a doctor if the pain is bad, it doesn't settle in a few hours, or it gets worse after 1–2 days. Tick bite (paralysis tick) The paralysis tick is the most common tick in eastern Australia. Adult female paralysis tick (enlarged). Kill it first: freeze it with an ether-containing spray from a pharmacy. It should drop off within about 5 minutes. (If it's embedded, permethrin cream can be used.) Don't pull, squeeze or twist it. That makes it inject more saliva. Don't use home remedies (methylated spirits, kerosene, Vaseline, nail polish, oil, alcohol, matches). They can make it burrow deeper. Wash the area with soap and water. If it won't come off or can't be frozen, leave it and get medical help . Tick allergy: if you know you're allergic, get medical help as soon as you find an attached tick. Don't remove it yourself. Carry your adrenaline autoinjector. See a doctor if, days later, there's headache, blurred vision, weakness or poor balance (tick paralysis is rare). Jellyfish (bluebottle) sting: Noosa beaches Noosa is in non-tropical waters (south of Bundaberg). Rinse with sea water, not fresh water. Pick off tentacles (by hand is OK) or wash them off with sea water. Put the area in hot water at about 45 °C for 20 minutes . Check it won't burn. Or use a hot shower. Hot water works better than ice. Don't use vinegar on a bluebottle sting. It can increase the pain. See a doctor if severe pain doesn't improve. If the person collapses or stops breathing, call 000 and start CPR. Travelling north of Bundaberg (tropical waters)? Box jellyfish and Irukandji stings are life-threatening: call 000 , remove tentacles, pour vinegar on the site, apply ice, and go to hospital. If you don't know what stung you up there, treat it as a box jellyfish. Sources (checked 2026-11-01) healthdirect (Australian Government), Snake bites: https://www.healthdirect.gov.au/snake-bites healthdirect, Spider bites: https://www.healthdirect.gov.au/spider-bites healthdirect, Tick bites: https://www.healthdirect.gov.au/tick-bites healthdirect, Jellyfish stings: https://www.healthdirect.gov.au/jellyfish-stings Drawing: see images/CREDITS.md"},"02-first-aid/broken-bones":{"title":"Broken Bones","folder":"02-first-aid","html":"<h1 id=\"broken-bones\">Broken Bones<\/h1>\n<h2 id=\"signs\">Signs<\/h2>\n<ul>\n<li>A limb or joint that looks <strong>out of place or misshapen<\/strong><\/li>\n<li>Swelling, bruising or bleeding<\/li>\n<li>Pain, often severe<\/li>\n<li>Numbness or tingling<\/li>\n<li><strong>Bone poking through the skin<\/strong><\/li>\n<li>Can't move the limb or put weight on it<\/li>\n<\/ul>\n<p>A young child who won't use a limb or put weight on it should be treated as if\nit's broken.<\/p>\n<p><img alt=\"Three leg bones: A and B closed fractures, C with bone through the skin\" loading=\"lazy\" src=\"02-first-aid/images/fracture-types.png\" /><\/p>\n<p><em>Closed fractures (A, B) and an open fracture with bone through the skin (C).<\/em><\/p>\n<h2 id=\"get-emergency-help-if\">Get emergency help if<\/h2>\n<ul>\n<li>The person isn't responding or is losing consciousness<\/li>\n<li>A break in the <strong>head, neck or back<\/strong> is possible<\/li>\n<li>A break in the <strong>hip, pelvis or upper leg<\/strong> is possible<\/li>\n<li><strong>Bone is sticking out<\/strong> through the skin<\/li>\n<li>Bleeding is severe<\/li>\n<li>The area below the injury is <strong>pale, cold, clammy or blue<\/strong><\/li>\n<li>You can't keep the injury still by yourself<\/li>\n<\/ul>\n<p>Other breaks still need a doctor soon.<\/p>\n<h2 id=\"what-to-do\">What to do<\/h2>\n<ol>\n<li><strong>Check breathing first.<\/strong> Start CPR or control bleeding if needed (see\n    <a href=\"#/01-emergency/cpr\">../01-emergency/cpr.md<\/a>,\n    <a href=\"#/01-emergency/severe-bleeding\">../01-emergency/severe-bleeding.md<\/a>).<\/li>\n<li><strong>Keep the person still and calm.<\/strong> Look for other injuries.<\/li>\n<li><strong>Bone through the skin:<\/strong> don't breathe on it or touch it. Cover it with a\n    clean (sterile if possible) dressing. Don't try to push the bone back.<\/li>\n<li>\n<p><strong>Splint it<\/strong> so it can't move. Immobilize the joints <strong>above and below<\/strong>\n    the break. You can improvise a splint with rolled-up newspaper, a magazine\n    or strips of wood, tied on with cloth. Use a sling for an arm.<\/p>\n<p><img alt=\"Forearm splinted to a padded board with cloth ties\" loading=\"lazy\" src=\"02-first-aid/images/splint-forearm.png\" />\n<img alt=\"Arm supported in a triangular bandage sling\" loading=\"lazy\" src=\"02-first-aid/images/arm-sling.png\" />\n<img alt=\"Broken leg tied to the uninjured leg with padding and belts\" loading=\"lazy\" src=\"02-first-aid/images/splint-leg-to-leg.png\" /><\/p>\n<p><em>A board splint for the forearm, an arm sling, and, with nothing else to\nhand, the good leg used as a splint for the broken one.<\/em>\n5. <strong>Ice and raise<\/strong> the injured limb to ease pain and swelling.\n6. <strong>Check circulation<\/strong> below the break: press the skin. It should go white\nand turn pink again within about <strong>2 seconds<\/strong>. Pale or blue skin, numbness,\ntingling or no pulse means poor blood flow. If blood flow is poor and\ntrained help isn't coming soon, gently move the limb back into a normal\nresting position.\n7. <strong>Watch for shock<\/strong> (see <a href=\"#/01-emergency/shock\">../01-emergency/shock.md<\/a>):\nlay them flat, raise their feet about 12 inches (30 cm) and cover them, <strong>but\nnot if a head, neck or back injury is possible.<\/strong><\/p>\n<\/li>\n<\/ol>\n<h2 id=\"dont\">Don't<\/h2>\n<ul>\n<li><strong>Don't move someone who may have a spine injury.<\/strong><\/li>\n<li>Don't move someone with a hip, pelvis or upper leg injury unless you\n    absolutely must. If you must, drag them by their clothing.<\/li>\n<li>Don't straighten the bone or change its position, unless blood flow is poor\n    and no trained help is nearby.<\/li>\n<li>Don't test the limb by moving it.<\/li>\n<li>Don't use a tourniquet unless the bleeding is life-threatening.<\/li>\n<\/ul>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>MedlinePlus (US National Library of Medicine), Broken bone:\n    https://medlineplus.gov/ency/article/000001.htm<\/li>\n<li>Drawings: see <a href=\"#/02-first-aid/images/CREDITS\">images/CREDITS.md<\/a><\/li>\n<\/ul>","text":"Broken Bones Signs A limb or joint that looks out of place or misshapen Swelling, bruising or bleeding Pain, often severe Numbness or tingling Bone poking through the skin Can't move the limb or put weight on it A young child who won't use a limb or put weight on it should be treated as if it's broken. Closed fractures (A, B) and an open fracture with bone through the skin (C). Get emergency help if The person isn't responding or is losing consciousness A break in the head, neck or back is possible A break in the hip, pelvis or upper leg is possible Bone is sticking out through the skin Bleeding is severe The area below the injury is pale, cold, clammy or blue You can't keep the injury still by yourself Other breaks still need a doctor soon. What to do Check breathing first. Start CPR or control bleeding if needed (see ../01-emergency/cpr.md , ../01-emergency/severe-bleeding.md ). Keep the person still and calm. Look for other injuries. Bone through the skin: don't breathe on it or touch it. Cover it with a clean (sterile if possible) dressing. Don't try to push the bone back. Splint it so it can't move. Immobilize the joints above and below the break. You can improvise a splint with rolled-up newspaper, a magazine or strips of wood, tied on with cloth. Use a sling for an arm. A board splint for the forearm, an arm sling, and, with nothing else to hand, the good leg used as a splint for the broken one. 5. Ice and raise the injured limb to ease pain and swelling. 6. Check circulation below the break: press the skin. It should go white and turn pink again within about 2 seconds . Pale or blue skin, numbness, tingling or no pulse means poor blood flow. If blood flow is poor and trained help isn't coming soon, gently move the limb back into a normal resting position. 7. Watch for shock (see ../01-emergency/shock.md ): lay them flat, raise their feet about 12 inches (30 cm) and cover them, but not if a head, neck or back injury is possible. Don't Don't move someone who may have a spine injury. Don't move someone with a hip, pelvis or upper leg injury unless you absolutely must. If you must, drag them by their clothing. Don't straighten the bone or change its position, unless blood flow is poor and no trained help is nearby. Don't test the limb by moving it. Don't use a tourniquet unless the bleeding is life-threatening. Sources (checked 2026-11-01) MedlinePlus (US National Library of Medicine), Broken bone: https://medlineplus.gov/ency/article/000001.htm Drawings: see images/CREDITS.md"},"02-first-aid/cuts-and-wounds":{"title":"Cuts and Puncture Wounds","folder":"02-first-aid","html":"<h1 id=\"cuts-and-puncture-wounds\">Cuts and Puncture Wounds<\/h1>\n<p>For heavy bleeding that won't stop, go to\n<a href=\"#/01-emergency/severe-bleeding\">../01-emergency/severe-bleeding.md<\/a> first.<\/p>\n<h2 id=\"minor-cut\">Minor cut<\/h2>\n<ol>\n<li><strong>Wash your hands<\/strong> with soap.<\/li>\n<li><strong>Wash the cut well<\/strong> with mild soap and water. Always wash it, even if it\n    looks clean.<\/li>\n<li><strong>Press on it<\/strong> to stop the bleeding.<\/li>\n<li>\n<p>Put on <strong>antibacterial ointment<\/strong> and cover it with a clean bandage that\n    won't stick to the wound.<\/p>\n<p><img alt=\"Placing a dressing directly on a leg wound\" loading=\"lazy\" src=\"02-first-aid/images/dressing-on-wound.png\" />\n<img alt=\"Wrapping the dressing's tail around the leg\" loading=\"lazy\" src=\"02-first-aid/images/dressing-wrap.png\" /><\/p>\n<p><em>Put the dressing straight onto the wound, then wrap it to hold it in place.<\/em><\/p>\n<\/li>\n<\/ol>\n<h2 id=\"minor-puncture-nail-splinter-thorn\">Minor puncture (nail, splinter, thorn)<\/h2>\n<ol>\n<li><strong>Wash your hands<\/strong> with soap.<\/li>\n<li><strong>Rinse the wound under running water for 5 minutes<\/strong>, then wash it with\n    soap.<\/li>\n<li><strong>Look into it without poking around.<\/strong><ul>\n<li>If something is stuck in it, <strong>leave it in place<\/strong> and get medical help.<\/li>\n<li>If part of the object seems to be missing (a broken tip, for example), get\n medical help.<\/li>\n<\/ul>\n<\/li>\n<li>Put on antibacterial ointment and cover it with a clean, non-stick bandage.<\/li>\n<\/ol>\n<h2 id=\"get-medical-help-soon-if\">Get medical help soon if<\/h2>\n<ul>\n<li>The wound is <strong>deeper than ¼ inch (about 6 mm)<\/strong>, large, on the face, or\n    reaches the bone. It may need stitches.<\/li>\n<li>It's a <strong>human or animal bite<\/strong>.<\/li>\n<li>It was caused by a <strong>fishhook, a rusty object, or stepping on a nail<\/strong>.<\/li>\n<li>Something is stuck in the wound.<\/li>\n<li>The person hasn't had a <strong>tetanus shot in the last 10 years<\/strong>.<\/li>\n<li>It shows <strong>signs of infection<\/strong>:<ul>\n<li>warmth and redness around it<\/li>\n<li>pain or throbbing<\/li>\n<li>fever<\/li>\n<li>swelling<\/li>\n<li>a <strong>red streak<\/strong> spreading from the wound<\/li>\n<li>pus<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2 id=\"get-emergency-help-if\">Get emergency help if<\/h2>\n<ul>\n<li>Bleeding is severe or doesn't stop after <strong>10 minutes of pressure<\/strong><\/li>\n<li>The person can't feel or move the injured area normally<\/li>\n<li>They have other serious injuries<\/li>\n<\/ul>\n<h2 id=\"dont\">Don't<\/h2>\n<ul>\n<li>Don't breathe on an open wound.<\/li>\n<li>Don't try to clean a <strong>major<\/strong> wound, especially once bleeding is under\n    control.<\/li>\n<li><strong>Don't pull out a long or deeply stuck object.<\/strong><\/li>\n<li>Don't push or pick dirt out of the wound.<\/li>\n<li>Don't push body parts that are sticking out back in. Cover them with clean\n    material until help arrives.<\/li>\n<\/ul>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>MedlinePlus (US National Library of Medicine), Cuts and puncture wounds:\n    https://medlineplus.gov/ency/article/000043.htm<\/li>\n<li>Drawings: see <a href=\"#/02-first-aid/images/CREDITS\">images/CREDITS.md<\/a><\/li>\n<\/ul>","text":"Cuts and Puncture Wounds For heavy bleeding that won't stop, go to ../01-emergency/severe-bleeding.md first. Minor cut Wash your hands with soap. Wash the cut well with mild soap and water. Always wash it, even if it looks clean. Press on it to stop the bleeding. Put on antibacterial ointment and cover it with a clean bandage that won't stick to the wound. Put the dressing straight onto the wound, then wrap it to hold it in place. Minor puncture (nail, splinter, thorn) Wash your hands with soap. Rinse the wound under running water for 5 minutes , then wash it with soap. Look into it without poking around. If something is stuck in it, leave it in place and get medical help. If part of the object seems to be missing (a broken tip, for example), get medical help. Put on antibacterial ointment and cover it with a clean, non-stick bandage. Get medical help soon if The wound is deeper than ¼ inch (about 6 mm) , large, on the face, or reaches the bone. It may need stitches. It's a human or animal bite . It was caused by a fishhook, a rusty object, or stepping on a nail . Something is stuck in the wound. The person hasn't had a tetanus shot in the last 10 years . It shows signs of infection : warmth and redness around it pain or throbbing fever swelling a red streak spreading from the wound pus Get emergency help if Bleeding is severe or doesn't stop after 10 minutes of pressure The person can't feel or move the injured area normally They have other serious injuries Don't Don't breathe on an open wound. Don't try to clean a major wound, especially once bleeding is under control. Don't pull out a long or deeply stuck object. Don't push or pick dirt out of the wound. Don't push body parts that are sticking out back in. Cover them with clean material until help arrives. Sources (checked 2026-11-01) MedlinePlus (US National Library of Medicine), Cuts and puncture wounds: https://medlineplus.gov/ency/article/000043.htm Drawings: see images/CREDITS.md"},"02-first-aid/dehydration":{"title":"Dehydration and Oral Rehydration Solution (ORS)","folder":"02-first-aid","html":"<h1 id=\"dehydration-and-oral-rehydration-solution-ors\">Dehydration and Oral Rehydration Solution (ORS)<\/h1>\n<p>Diarrhea, vomiting, heat and too little clean water can all cause dehydration.\n<strong>Severe dehydration is life-threatening<\/strong>, especially for babies and young\nchildren.<\/p>\n<h2 id=\"signs\">Signs<\/h2>\n<p><strong>Mild to moderate:<\/strong><\/p>\n<ul>\n<li>Thirst, dry or sticky mouth<\/li>\n<li>Peeing less, darker yellow urine<\/li>\n<li>Dry, cool skin<\/li>\n<li>Headache, muscle cramps<\/li>\n<\/ul>\n<p><strong>Severe (get medical help):<\/strong><\/p>\n<ul>\n<li>Little or no urine, or very dark amber urine<\/li>\n<li>Dry, shriveled skin; sunken eyes<\/li>\n<li>Dizziness, fast heartbeat and breathing<\/li>\n<li>Irritability, confusion, listlessness<\/li>\n<li>Shock or passing out<\/li>\n<\/ul>\n<h2 id=\"oral-rehydration-solution-ors\">Oral rehydration solution (ORS)<\/h2>\n<p>ORS replaces the water <strong>and salts<\/strong> the body loses. Ready-made ORS packets are\nsold in pharmacies. Mix them with clean, treated water (see\n<a href=\"#/03-water/making-water-safe\">../03-water/making-water-safe.md<\/a>).<\/p>\n<p><strong>No packets? Make it at home (WHO recipe):<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Ingredient<\/th>\n<th>Amount<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Safe drinking water<\/td>\n<td><strong>1 liter<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Sugar<\/td>\n<td><strong>6 teaspoons<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Salt<\/td>\n<td><strong>½ teaspoon<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Measure carefully, with flat, level spoons and an accurately measured liter.\nToo much salt or sugar makes it harmful, and too little makes it weak.<\/p>\n<p><strong>How much to give each day (CDC):<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Who<\/th>\n<th>ORS per day<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Babies and toddlers with diarrhea<\/td>\n<td><strong>½ liter<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Children with vomiting or diarrhea<\/td>\n<td><strong>1 liter<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Adults with vomiting or diarrhea<\/td>\n<td><strong>3 liters<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong>Start as soon as symptoms begin<\/strong>, and keep them drinking even if they\n    vomit some of it.<\/li>\n<li><strong>Babies:<\/strong> keep breastfeeding or giving formula as well.<\/li>\n<li>Go to a clinic as soon as you can, and <strong>keep giving ORS on the way<\/strong>.<\/li>\n<li>No ORS and no ingredients? Give safe water, broth or other fluids. <strong>Avoid\n    juice, soft drinks and sports drinks<\/strong> for diarrhea; they can make it worse.<\/li>\n<\/ul>\n<p><img alt=\"CDC poster: how to make and use oral rehydration solution\" loading=\"lazy\" src=\"02-first-aid/images/rehydration-poster.png\" /><\/p>\n<p><em>Full-size poster: <a href=\"02-first-aid/rehydration-poster-cdc.pdf\" target=\"_blank\">rehydration-poster-cdc.pdf<\/a>\n(CDC, in this folder).<\/em><\/p>\n<h2 id=\"get-medical-help-right-away-if\">Get medical help right away if<\/h2>\n<ul>\n<li>They can't drink enough to keep up, or have severe diarrhea<\/li>\n<li>They are <strong>confused, drowsy or dizzy<\/strong>, have a seizure or pass out<\/li>\n<li>Fever is over <strong>102 °F (38.9 °C)<\/strong><\/li>\n<li>They don't improve, or get worse<\/li>\n<\/ul>\n<h2 id=\"dont\">Don't<\/h2>\n<ul>\n<li><strong>Don't take salt tablets.<\/strong> They can cause serious problems.<\/li>\n<\/ul>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>MedlinePlus (US National Library of Medicine), Dehydration:\n    https://medlineplus.gov/ency/article/000982.htm<\/li>\n<li>World Health Organization, Cholera outbreaks Q&amp;A (homemade ORS recipe):\n    https://www.who.int/news-room/questions-and-answers/item/cholera-outbreaks<\/li>\n<li>CDC, How to make and use oral rehydration solution (poster CS 229310):\n    https://www.cdc.gov/global-water-sanitation-hygiene/media/pdfs/11_229310-j_ors_print-africa.pdf<\/li>\n<li>CDC, Cholera treatment: https://www.cdc.gov/cholera/treatment/index.html<\/li>\n<li>Poster image: see <a href=\"#/02-first-aid/images/CREDITS\">images/CREDITS.md<\/a><\/li>\n<\/ul>","text":"Dehydration and Oral Rehydration Solution (ORS) Diarrhea, vomiting, heat and too little clean water can all cause dehydration. Severe dehydration is life-threatening , especially for babies and young children. Signs Mild to moderate: Thirst, dry or sticky mouth Peeing less, darker yellow urine Dry, cool skin Headache, muscle cramps Severe (get medical help): Little or no urine, or very dark amber urine Dry, shriveled skin; sunken eyes Dizziness, fast heartbeat and breathing Irritability, confusion, listlessness Shock or passing out Oral rehydration solution (ORS) ORS replaces the water and salts the body loses. Ready-made ORS packets are sold in pharmacies. Mix them with clean, treated water (see ../03-water/making-water-safe.md ). No packets? Make it at home (WHO recipe): Ingredient Amount Safe drinking water 1 liter Sugar 6 teaspoons Salt ½ teaspoon Measure carefully, with flat, level spoons and an accurately measured liter. Too much salt or sugar makes it harmful, and too little makes it weak. How much to give each day (CDC): Who ORS per day Babies and toddlers with diarrhea ½ liter Children with vomiting or diarrhea 1 liter Adults with vomiting or diarrhea 3 liters Start as soon as symptoms begin , and keep them drinking even if they vomit some of it. Babies: keep breastfeeding or giving formula as well. Go to a clinic as soon as you can, and keep giving ORS on the way . No ORS and no ingredients? Give safe water, broth or other fluids. Avoid juice, soft drinks and sports drinks for diarrhea; they can make it worse. Full-size poster: rehydration-poster-cdc.pdf (CDC, in this folder). Get medical help right away if They can't drink enough to keep up, or have severe diarrhea They are confused, drowsy or dizzy , have a seizure or pass out Fever is over 102 °F (38.9 °C) They don't improve, or get worse Don't Don't take salt tablets. They can cause serious problems. Sources (checked 2026-11-01) MedlinePlus (US National Library of Medicine), Dehydration: https://medlineplus.gov/ency/article/000982.htm World Health Organization, Cholera outbreaks Q&A (homemade ORS recipe): https://www.who.int/news-room/questions-and-answers/item/cholera-outbreaks CDC, How to make and use oral rehydration solution (poster CS 229310): https://www.cdc.gov/global-water-sanitation-hygiene/media/pdfs/11_229310-j_ors_print-africa.pdf CDC, Cholera treatment: https://www.cdc.gov/cholera/treatment/index.html Poster image: see images/CREDITS.md"},"02-first-aid/eye-injuries":{"title":"Eye Injuries","folder":"02-first-aid","html":"<h1 id=\"eye-injuries\">Eye Injuries<\/h1>\n<h2 id=\"chemical-in-the-eye-emergency\">Chemical in the eye: emergency<\/h2>\n<ol>\n<li><strong>Call 000<\/strong> (112 from a mobile).<\/li>\n<li><strong>Rinse the eye with cool water for 20 minutes.<\/strong> Tilt the head back and\n    <strong>towards the injured side<\/strong>, and hold the eye open with your fingers.<\/li>\n<li><strong>Don't let the chemical run into the other eye.<\/strong><\/li>\n<li>Take out contact lenses, unless the surface of the eye is badly damaged.<\/li>\n<\/ol>\n<h2 id=\"something-stuck-in-the-eye-emergency\">Something stuck in the eye: emergency<\/h2>\n<p><strong>Don't try to remove it.<\/strong> Go to the nearest emergency department or call\n<strong>000<\/strong>. Same for any cut, or anything that has <strong>pierced<\/strong> the eye.<\/p>\n<h2 id=\"speck-or-grit-on-the-surface\">Speck or grit on the surface<\/h2>\n<ol>\n<li>Look up and pull the <strong>lower<\/strong> eyelid down. If you can see it, lift it off\n    with the corner of a <strong>moist cloth<\/strong>.<\/li>\n<li>Can't see it? Pull the <strong>upper<\/strong> eyelid up and look again.<\/li>\n<li>Still there? <strong>Rinse gently<\/strong> with clean water or sterile saline.<\/li>\n<li>Still there after that? <strong>Cover the eye<\/strong> and get medical help.<\/li>\n<\/ol>\n<h2 id=\"a-blow-to-the-eye\">A blow to the eye<\/h2>\n<p>Hold something cold against it to reduce swelling, like a bag of frozen peas\nwrapped in a tea towel. <strong>See a doctor urgently<\/strong> if the pain gets worse, your\nvision changes, or you see black spots.<\/p>\n<h2 id=\"dont\">Don't<\/h2>\n<ul>\n<li>Don't rub the eye, even if it hurts or itches.<\/li>\n<li>Don't put drops, ointment or any medicine in the eye.<\/li>\n<li>Don't try to remove anything stuck in the eye.<\/li>\n<li>Don't touch your eyes with dirty hands.<\/li>\n<\/ul>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>healthdirect (Australian Government), Eye injuries:\n    https://www.healthdirect.gov.au/eye-injuries<\/li>\n<\/ul>","text":"Eye Injuries Chemical in the eye: emergency Call 000 (112 from a mobile). Rinse the eye with cool water for 20 minutes. Tilt the head back and towards the injured side , and hold the eye open with your fingers. Don't let the chemical run into the other eye. Take out contact lenses, unless the surface of the eye is badly damaged. Something stuck in the eye: emergency Don't try to remove it. Go to the nearest emergency department or call 000 . Same for any cut, or anything that has pierced the eye. Speck or grit on the surface Look up and pull the lower eyelid down. If you can see it, lift it off with the corner of a moist cloth . Can't see it? Pull the upper eyelid up and look again. Still there? Rinse gently with clean water or sterile saline. Still there after that? Cover the eye and get medical help. A blow to the eye Hold something cold against it to reduce swelling, like a bag of frozen peas wrapped in a tea towel. See a doctor urgently if the pain gets worse, your vision changes, or you see black spots. Don't Don't rub the eye, even if it hurts or itches. Don't put drops, ointment or any medicine in the eye. Don't try to remove anything stuck in the eye. Don't touch your eyes with dirty hands. Sources (checked 2026-11-01) healthdirect (Australian Government), Eye injuries: https://www.healthdirect.gov.au/eye-injuries"},"02-first-aid/heat-illness":{"title":"Heat Illness (Heat Exhaustion and Heat Stroke)","folder":"02-first-aid","html":"<h1 id=\"heat-illness-heat-exhaustion-and-heat-stroke\">Heat Illness (Heat Exhaustion and Heat Stroke)<\/h1>\n<p>Heat illness gets worse in stages. <strong>Heat stroke can cause brain damage,\norgan failure and death.<\/strong><\/p>\n<h2 id=\"signs\">Signs<\/h2>\n<table>\n<thead>\n<tr>\n<th>Stage<\/th>\n<th>Signs<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Heat cramps<\/strong><\/td>\n<td>Muscle cramps (legs, belly), tiredness, thirst, heavy sweating<\/td>\n<\/tr>\n<tr>\n<td><strong>Heat exhaustion<\/strong><\/td>\n<td>Cool, moist skin; sweating; strong thirst; dark urine; dizziness; headache; nausea or vomiting; weakness; fast, shallow breathing; fast, weak pulse<\/td>\n<\/tr>\n<tr>\n<td><strong>Heat stroke<\/strong> (emergency)<\/td>\n<td>All of the above <strong>plus<\/strong> temperature over <strong>104 °F (40 °C)<\/strong>, confusion, strange behavior, slurred speech, seizures, extreme drowsiness or passing out. <strong>Sweating may stop.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"what-to-do\">What to do<\/h2>\n<ol>\n<li><strong>Lay them down somewhere cool<\/strong> and raise their feet about <strong>12 inches\n    (30 cm)<\/strong>.<\/li>\n<li><strong>Cool them down:<\/strong> cool, wet cloths or water on the skin, a fan, and cold\n    packs on the <strong>neck, groin and armpits<\/strong>.<\/li>\n<li><strong>If they're alert<\/strong>, give a sports drink or slightly salted drink, in\n    <strong>small sips: about half a cup every 15 minutes<\/strong>. Cool water if nothing\n    else is available.<\/li>\n<li><strong>Cramps:<\/strong> give fluids and firmly massage the cramping muscle until it\n    relaxes.<\/li>\n<\/ol>\n<h2 id=\"get-emergency-help-if\">Get emergency help if<\/h2>\n<ul>\n<li>They <strong>pass out<\/strong>, at any time<\/li>\n<li>They become <strong>confused<\/strong> or have a <strong>seizure<\/strong><\/li>\n<li>Fever is over <strong>102 °F (38.9 °C)<\/strong><\/li>\n<li>They have a fast pulse or fast breathing (signs of heat stroke)<\/li>\n<li>They show signs of shock (see <a href=\"#/01-emergency/shock\">../01-emergency/shock.md<\/a>)<\/li>\n<li>They don't improve, or get worse<\/li>\n<\/ul>\n<h2 id=\"dont\">Don't<\/h2>\n<ul>\n<li><strong>Don't give fever medicine<\/strong> (aspirin, acetaminophen/paracetamol). It won't\n    help and may harm.<\/li>\n<li><strong>Don't give salt tablets.<\/strong><\/li>\n<li>Don't give alcohol or caffeine.<\/li>\n<li>Don't rub alcohol on the skin.<\/li>\n<li><strong>Don't give anything by mouth<\/strong> if they are vomiting or unconscious.<\/li>\n<\/ul>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>MedlinePlus (US National Library of Medicine), Heat emergencies:\n    https://medlineplus.gov/ency/article/000056.htm<\/li>\n<\/ul>","text":"Heat Illness (Heat Exhaustion and Heat Stroke) Heat illness gets worse in stages. Heat stroke can cause brain damage, organ failure and death. Signs Stage Signs Heat cramps Muscle cramps (legs, belly), tiredness, thirst, heavy sweating Heat exhaustion Cool, moist skin; sweating; strong thirst; dark urine; dizziness; headache; nausea or vomiting; weakness; fast, shallow breathing; fast, weak pulse Heat stroke (emergency) All of the above plus temperature over 104 °F (40 °C) , confusion, strange behavior, slurred speech, seizures, extreme drowsiness or passing out. Sweating may stop. What to do Lay them down somewhere cool and raise their feet about 12 inches (30 cm) . Cool them down: cool, wet cloths or water on the skin, a fan, and cold packs on the neck, groin and armpits . If they're alert , give a sports drink or slightly salted drink, in small sips: about half a cup every 15 minutes . Cool water if nothing else is available. Cramps: give fluids and firmly massage the cramping muscle until it relaxes. Get emergency help if They pass out , at any time They become confused or have a seizure Fever is over 102 °F (38.9 °C) They have a fast pulse or fast breathing (signs of heat stroke) They show signs of shock (see ../01-emergency/shock.md ) They don't improve, or get worse Don't Don't give fever medicine (aspirin, acetaminophen/paracetamol). It won't help and may harm. Don't give salt tablets. Don't give alcohol or caffeine. Don't rub alcohol on the skin. Don't give anything by mouth if they are vomiting or unconscious. Sources (checked 2026-11-01) MedlinePlus (US National Library of Medicine), Heat emergencies: https://medlineplus.gov/ency/article/000056.htm"},"02-first-aid/hypothermia":{"title":"Hypothermia (Body Too Cold)","folder":"02-first-aid","html":"<h1 id=\"hypothermia-body-too-cold\">Hypothermia (Body Too Cold)<\/h1>\n<p>Hypothermia happens when the body loses heat faster than it can make it.\n<strong>It can kill.<\/strong> Get help early.<\/p>\n<h2 id=\"signs\">Signs<\/h2>\n<ul>\n<li><strong>Shivering that's hard to control<\/strong> (in extreme cold, shivering may stop)<\/li>\n<li>Confusion, drowsiness<\/li>\n<li>Pale, cold skin<\/li>\n<li>Weakness, clumsiness<\/li>\n<li>Slow breathing or heart rate<\/li>\n<\/ul>\n<h2 id=\"what-to-do\">What to do<\/h2>\n<ol>\n<li><strong>Call emergency services right away<\/strong>, especially if they are confused.<\/li>\n<li><strong>If they're unconscious<\/strong>, check breathing. Start CPR if needed (see\n    <a href=\"#/01-emergency/cpr\">../01-emergency/cpr.md<\/a>). Give rescue breaths if\n    they take <strong>fewer than 6 breaths per minute<\/strong>.<\/li>\n<li><strong>Get them out of the cold.<\/strong> Indoors, at room temperature, under warm\n    blankets. If you can't go indoors: shield them from wind, put something\n    between them and the cold ground, and cover their <strong>head and neck<\/strong>.<\/li>\n<li><strong>Severe hypothermia:<\/strong> move them <strong>gently<\/strong> and with as little effort on\n    their part as possible.<\/li>\n<li><strong>Replace wet or tight clothing<\/strong> with dry, loose clothing.<\/li>\n<li><strong>Warm the core:<\/strong> warm compresses on the <strong>neck, chest and groin<\/strong>.<\/li>\n<li>If they are <strong>alert and can swallow easily<\/strong>, give warm, sweet drinks with\n    no alcohol.<\/li>\n<li><strong>Stay with them<\/strong> until help arrives.<\/li>\n<\/ol>\n<h2 id=\"dont\">Don't<\/h2>\n<ul>\n<li><strong>Don't assume someone found still and cold is dead.<\/strong> Start help anyway.<\/li>\n<li><strong>Don't use direct heat<\/strong> (hot water, a heating pad, a heat lamp).<\/li>\n<li><strong>Don't give alcohol.<\/strong><\/li>\n<\/ul>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>MedlinePlus (US National Library of Medicine), Hypothermia:\n    https://medlineplus.gov/ency/article/000038.htm<\/li>\n<\/ul>","text":"Hypothermia (Body Too Cold) Hypothermia happens when the body loses heat faster than it can make it. It can kill. Get help early. Signs Shivering that's hard to control (in extreme cold, shivering may stop) Confusion, drowsiness Pale, cold skin Weakness, clumsiness Slow breathing or heart rate What to do Call emergency services right away , especially if they are confused. If they're unconscious , check breathing. Start CPR if needed (see ../01-emergency/cpr.md ). Give rescue breaths if they take fewer than 6 breaths per minute . Get them out of the cold. Indoors, at room temperature, under warm blankets. If you can't go indoors: shield them from wind, put something between them and the cold ground, and cover their head and neck . Severe hypothermia: move them gently and with as little effort on their part as possible. Replace wet or tight clothing with dry, loose clothing. Warm the core: warm compresses on the neck, chest and groin . If they are alert and can swallow easily , give warm, sweet drinks with no alcohol. Stay with them until help arrives. Don't Don't assume someone found still and cold is dead. Start help anyway. Don't use direct heat (hot water, a heating pad, a heat lamp). Don't give alcohol. Sources (checked 2026-11-01) MedlinePlus (US National Library of Medicine), Hypothermia: https://medlineplus.gov/ency/article/000038.htm"},"02-first-aid/images/CREDITS":{"title":"Image Credits: 02-first-aid","folder":"02-first-aid","html":"<h1 id=\"image-credits-02-first-aid\">Image Credits: 02-first-aid<\/h1>\n<p>All images were converted to small greyscale PNGs for this ark.<\/p>\n<table>\n<thead>\n<tr>\n<th>Image<\/th>\n<th>Source<\/th>\n<th>License<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>fracture-types.png<\/code>, <code>arm-sling.png<\/code>, <code>splint-forearm.png<\/code>, <code>splint-leg-to-leg.png<\/code>, <code>dressing-on-wound.png<\/code>, <code>dressing-wrap.png<\/code><\/td>\n<td>US Army, <em>FM 4-25.11 First Aid<\/em> (2002), figures 4-1, 4-9, 4-14, 4-24, 2-22, 2-23<\/td>\n<td>Public domain (US Government work)<\/td>\n<\/tr>\n<tr>\n<td><code>rehydration-poster.png<\/code><\/td>\n<td>CDC, <em>How to make and use oral rehydration solution (ORS)<\/em>, poster CS 229310<\/td>\n<td>Public domain (US Government work)<\/td>\n<\/tr>\n<tr>\n<td><code>paralysis-tick.png<\/code><\/td>\n<td>F. H. S. Roberts (1970), <em>Australian Ticks<\/em>, CSIRO, Melbourne, via <a class=\"ext\" href=\"https://commons.wikimedia.org/wiki/File:Ixodholfemale.gif\" rel=\"noopener\" target=\"_blank\">Ixodholfemale.gif<\/a>, Wikimedia Commons, converted to greyscale<\/td>\n<td><a class=\"ext\" href=\"https://creativecommons.org/licenses/by/3.0/\" rel=\"noopener\" target=\"_blank\">CC BY 3.0<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>","text":"Image Credits: 02-first-aid All images were converted to small greyscale PNGs for this ark. Image Source License fracture-types.png , arm-sling.png , splint-forearm.png , splint-leg-to-leg.png , dressing-on-wound.png , dressing-wrap.png US Army, FM 4-25.11 First Aid (2002), figures 4-1, 4-9, 4-14, 4-24, 2-22, 2-23 Public domain (US Government work) rehydration-poster.png CDC, How to make and use oral rehydration solution (ORS) , poster CS 229310 Public domain (US Government work) paralysis-tick.png F. H. S. Roberts (1970), Australian Ticks , CSIRO, Melbourne, via Ixodholfemale.gif , Wikimedia Commons, converted to greyscale CC BY 3.0"},"02-first-aid/medicines-in-an-emergency":{"title":"Medicines in an Emergency","folder":"02-first-aid","html":"<h1 id=\"medicines-in-an-emergency\">Medicines in an Emergency<\/h1>\n<h2 id=\"before\">Before<\/h2>\n<ul>\n<li>Keep <strong>medicines, prescriptions and care plans together<\/strong> in a safe place you\n    can grab quickly if you have to leave.<\/li>\n<li>Store them <strong>out of reach of children<\/strong>, where a broken or leaking bottle\n    can't contaminate food or other medicines.<\/li>\n<li>If you rely on <strong>refrigerated medicine<\/strong> (like insulin) or powered medical\n    equipment, ask your doctor or pharmacist now what to do in a power outage.<\/li>\n<\/ul>\n<h2 id=\"run-out-or-had-to-leave-them-behind\">Run out, or had to leave them behind?<\/h2>\n<ul>\n<li>A <strong>pharmacy can give you up to 3 days' supply without a prescription<\/strong>\n    (an \"emergency supply\").<\/li>\n<li>The pharmacy may also contact your doctor for a phone or electronic\n    prescription.<\/li>\n<li>You may have to pay full price for these. If you can't reach a community\n    pharmacy, a Queensland Health public hospital pharmacy may be able to help.<\/li>\n<\/ul>\n<h2 id=\"damaged-medicines\">Damaged medicines<\/h2>\n<ul>\n<li><strong>Throw out medicines that touched floodwater or unsafe water<\/strong>, and any that\n    are <strong>wet<\/strong> or look changed.<\/li>\n<li><strong>Exception:<\/strong> if a medicine keeps you alive and you can't get a replacement,\n    you may use it <strong>only if it looks unchanged<\/strong>, and replace it as soon as\n    possible.<\/li>\n<li>Heat and smoke from a fire can make medicines weaker or useless. Replace them\n    if you can.<\/li>\n<li><strong>Refrigerated medicines that got warm<\/strong> in a power outage: check the label or\n    ask a pharmacist or doctor whether they're still OK. If it keeps you alive and\n    there's no replacement, keep using it until you can get more.<\/li>\n<\/ul>\n<p>See also <a href=\"#/01-emergency/power-outage\">../01-emergency/power-outage.md<\/a>.<\/p>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>Queensland Health, Medication safety in a disaster:\n    https://www.health.qld.gov.au/public-health/disaster/public-health-advice/medication-safety<\/li>\n<li>US Food and Drug Administration, Safe drug use after a natural disaster:\n    https://www.fda.gov/drugs/emergency-preparedness-drugs/safe-drug-use-after-natural-disaster<\/li>\n<\/ul>","text":"Medicines in an Emergency Before Keep medicines, prescriptions and care plans together in a safe place you can grab quickly if you have to leave. Store them out of reach of children , where a broken or leaking bottle can't contaminate food or other medicines. If you rely on refrigerated medicine (like insulin) or powered medical equipment, ask your doctor or pharmacist now what to do in a power outage. Run out, or had to leave them behind? A pharmacy can give you up to 3 days' supply without a prescription (an \"emergency supply\"). The pharmacy may also contact your doctor for a phone or electronic prescription. You may have to pay full price for these. If you can't reach a community pharmacy, a Queensland Health public hospital pharmacy may be able to help. Damaged medicines Throw out medicines that touched floodwater or unsafe water , and any that are wet or look changed. Exception: if a medicine keeps you alive and you can't get a replacement, you may use it only if it looks unchanged , and replace it as soon as possible. Heat and smoke from a fire can make medicines weaker or useless. Replace them if you can. Refrigerated medicines that got warm in a power outage: check the label or ask a pharmacist or doctor whether they're still OK. If it keeps you alive and there's no replacement, keep using it until you can get more. See also ../01-emergency/power-outage.md . Sources (checked 2026-11-01) Queensland Health, Medication safety in a disaster: https://www.health.qld.gov.au/public-health/disaster/public-health-advice/medication-safety US Food and Drug Administration, Safe drug use after a natural disaster: https://www.fda.gov/drugs/emergency-preparedness-drugs/safe-drug-use-after-natural-disaster"},"02-first-aid/sprains-and-strains":{"title":"Sprains and Strains","folder":"02-first-aid","html":"<h1 id=\"sprains-and-strains\">Sprains and Strains<\/h1>\n<p>A sprain is a stretched or torn ligament (often an ankle or wrist). A strain is\na stretched or torn muscle. If you can't tell whether a bone is broken, treat it\nas broken (see <a href=\"#/02-first-aid/broken-bones\">broken-bones.md<\/a>).<\/p>\n<h2 id=\"rice-for-the-first-1-to-3-days\">RICE, for the first 1 to 3 days<\/h2>\n<ul>\n<li><strong>Rest<\/strong> the injured part. Don't put weight on an injured leg.<\/li>\n<li><strong>Ice:<\/strong> a cold pack or ice wrapped in cloth for <strong>15 to 20 minutes at a\n    time<\/strong>, several times a day. <strong>Never put ice directly on the skin.<\/strong><\/li>\n<li><strong>Compression:<\/strong> wrap a bandage around it to limit swelling.<\/li>\n<li><strong>Elevation:<\/strong> raise it <strong>above the level of the heart<\/strong> while resting.<\/li>\n<\/ul>\n<p>Use RICE only for the first <strong>24 to 72 hours<\/strong>. After that, gentle movement and\nputting weight on it, as much as is comfortable, helps healing.<\/p>\n<p>For pain, paracetamol can help. Anti-inflammatories (like ibuprofen) should be\nused with caution. Ask a pharmacist or doctor if you can.<\/p>\n<h2 id=\"get-urgent-medical-help-if\">Get urgent medical help if<\/h2>\n<ul>\n<li>They <strong>can't put weight on it or walk<\/strong><\/li>\n<li>There's <strong>extreme pain, swelling or the limb looks deformed<\/strong><\/li>\n<li>You're <strong>not sure if it's broken or dislocated<\/strong><\/li>\n<li>There's <strong>chest pain<\/strong>, or pain that doesn't seem to come from a sprain<\/li>\n<\/ul>\n<p>See a doctor if it isn't getting better after a few days. Health advice from a\nnurse, 24/7: <strong>healthdirect 1800 022 222<\/strong>.<\/p>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>healthdirect (Australian Government), Sprains and strains:\n    https://www.healthdirect.gov.au/sprains-and-strains<\/li>\n<\/ul>","text":"Sprains and Strains A sprain is a stretched or torn ligament (often an ankle or wrist). A strain is a stretched or torn muscle. If you can't tell whether a bone is broken, treat it as broken (see broken-bones.md ). RICE, for the first 1 to 3 days Rest the injured part. Don't put weight on an injured leg. Ice: a cold pack or ice wrapped in cloth for 15 to 20 minutes at a time , several times a day. Never put ice directly on the skin. Compression: wrap a bandage around it to limit swelling. Elevation: raise it above the level of the heart while resting. Use RICE only for the first 24 to 72 hours . After that, gentle movement and putting weight on it, as much as is comfortable, helps healing. For pain, paracetamol can help. Anti-inflammatories (like ibuprofen) should be used with caution. Ask a pharmacist or doctor if you can. Get urgent medical help if They can't put weight on it or walk There's extreme pain, swelling or the limb looks deformed You're not sure if it's broken or dislocated There's chest pain , or pain that doesn't seem to come from a sprain See a doctor if it isn't getting better after a few days. Health advice from a nurse, 24/7: healthdirect 1800 022 222 . Sources (checked 2026-11-01) healthdirect (Australian Government), Sprains and strains: https://www.healthdirect.gov.au/sprains-and-strains"},"03-water/README":{"title":"03 · Water","folder":"03-water","html":"<h1 id=\"03-water\">03 · Water<\/h1>\n<p>Finding, collecting, treating and storing drinking water.<\/p>\n<h2 id=\"pages\">Pages<\/h2>\n<ul>\n<li><a href=\"#/03-water/finding-water\">Finding Water in an Emergency<\/a>: safe sources in and around the home<\/li>\n<li><a href=\"#/03-water/collecting-water\">Collecting Water When the Taps Stop<\/a>: rain, beach wells, solar stills, filters<\/li>\n<li><a href=\"#/03-water/making-water-safe\">Making Water Safe to Drink<\/a>: boiling, bleach, and what neither can fix<\/li>\n<li><a href=\"#/03-water/storing-water\">Storing an Emergency Water Supply<\/a>: how much, containers, cleaning, labelling<\/li>\n<li><a href=\"#/03-water/disinfecting-a-well\">Disinfecting a Well After a Flood<\/a><\/li>\n<\/ul>","text":"03 · Water Finding, collecting, treating and storing drinking water. Pages Finding Water in an Emergency : safe sources in and around the home Collecting Water When the Taps Stop : rain, beach wells, solar stills, filters Making Water Safe to Drink : boiling, bleach, and what neither can fix Storing an Emergency Water Supply : how much, containers, cleaning, labelling Disinfecting a Well After a Flood"},"03-water/collecting-water":{"title":"Collecting Water When the Taps Stop","folder":"03-water","html":"<h1 id=\"collecting-water-when-the-taps-stop\">Collecting Water When the Taps Stop<\/h1>\n<blockquote>\n<p><strong>Treat all collected water before drinking it<\/strong>: boil it, or use bleach.\nSee <a href=\"#/03-water/making-water-safe\">making-water-safe.md<\/a>. Filtering makes water\nclearer, but <strong>doesn't make it safe<\/strong>.<\/p>\n<\/blockquote>\n<p>Start with the water you already have at home (see\n<a href=\"#/03-water/finding-water\">finding-water.md<\/a>). These methods are for when that runs out.<\/p>\n<h2 id=\"rain\">Rain<\/h2>\n<p>Put out anything that holds water (buckets, pots, tarps folded into a channel)\nto catch rain as it falls. Rain that runs off leaves and plants on the way to\nthe container picks up dirt and germs.<\/p>\n<p><img alt=\"Split bamboo laid like roof tiles on a frame, draining into a container\" loading=\"lazy\" src=\"03-water/images/rain-catcher.png\" /><\/p>\n<p><em>A simple rain catcher: overlapping channels on a frame, tilted so the water\nruns into a container.<\/em><\/p>\n<h2 id=\"beach-well-near-the-coast\">Beach well (near the coast)<\/h2>\n<p>Never drink sea water. Behind the <strong>first line of sand dunes<\/strong>, dig down until\nyou reach the water table. Water that seeps in there is usually fresh. Line the\nsides with wood so the sand doesn't cave in.<\/p>\n<p><img alt=\"Cross-section of a beach: ocean, first dune, and a well dug behind the dune into saturated sand\" loading=\"lazy\" src=\"03-water/images/beach-well.png\" /><\/p>\n<h2 id=\"solar-still\">Solar still<\/h2>\n<p>A still pulls water out of damp soil or plants using the sun. It can also make\ndrinkable water from <strong>salty or polluted water<\/strong> (pour it into a small trench\nnext to the hole, not inside it). It's <strong>slow<\/strong>: you need <strong>three or more<\/strong> to\nsupply one person, and digging costs you water in sweat.<\/p>\n<p><img alt=\"Plastic sheet over a hole with a rock in the middle, dripping into a container\" loading=\"lazy\" src=\"03-water/images/solar-still.png\" /><\/p>\n<ol>\n<li>In a sunny spot with damp soil, dig a bowl-shaped hole about <strong>1 m across and\n    60 cm deep<\/strong>, with a smaller hole in the middle for a container.<\/li>\n<li>Stand the container in the middle. Run a drinking tube from it to outside the\n    hole, if you have one.<\/li>\n<li>Cover the hole with <strong>clear plastic<\/strong>, holding the edges down with soil.<\/li>\n<li>Put a <strong>rock in the centre<\/strong> so the plastic forms a cone, <strong>about 40 cm<\/strong>\n    below ground, right over the container. The plastic mustn't touch the sides.<\/li>\n<li>Water condenses under the plastic and drips into the container. Plug the tube\n    when you're not drinking.<\/li>\n<\/ol>\n<h2 id=\"filtering-muddy-water\">Filtering muddy water<\/h2>\n<ol>\n<li>Let muddy water <strong>stand for a few hours<\/strong> so the dirt settles. Pour off the\n    clear water.<\/li>\n<li>Or pour it through layers of <strong>sand, gravel and charcoal<\/strong> (from a fire) in a\n    bag, bottle or cloth layers.<\/li>\n<li><strong>Then boil or disinfect it.<\/strong> Filtering doesn't kill germs.<\/li>\n<\/ol>\n<p><img alt=\"Two improvised filters: cloth layers of grass, sand and charcoal on a tripod, and a hanging bag of sand, rocks and charcoal\" loading=\"lazy\" src=\"03-water/images/water-filters.png\" /><\/p>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>US Army, <em>ATP 3-50.21 Survival<\/em> (2018), chapter 3 \"Water\" (approved for\n    public release): https://armypubs.army.mil/ProductMaps/PubForm/Details.aspx?PUB_ID=1005316<\/li>\n<li>CDC, How to Find Clean Water in an Emergency (rainwater must be treated):\n    https://www.cdc.gov/water-emergency/about/how-to-find-clean-water-in-an-emergency.html<\/li>\n<li>Drawings: see <a href=\"#/03-water/images/CREDITS\">images/CREDITS.md<\/a><\/li>\n<\/ul>","text":"Collecting Water When the Taps Stop Treat all collected water before drinking it : boil it, or use bleach. See making-water-safe.md . Filtering makes water clearer, but doesn't make it safe . Start with the water you already have at home (see finding-water.md ). These methods are for when that runs out. Rain Put out anything that holds water (buckets, pots, tarps folded into a channel) to catch rain as it falls. Rain that runs off leaves and plants on the way to the container picks up dirt and germs. A simple rain catcher: overlapping channels on a frame, tilted so the water runs into a container. Beach well (near the coast) Never drink sea water. Behind the first line of sand dunes , dig down until you reach the water table. Water that seeps in there is usually fresh. Line the sides with wood so the sand doesn't cave in. Solar still A still pulls water out of damp soil or plants using the sun. It can also make drinkable water from salty or polluted water (pour it into a small trench next to the hole, not inside it). It's slow : you need three or more to supply one person, and digging costs you water in sweat. In a sunny spot with damp soil, dig a bowl-shaped hole about 1 m across and 60 cm deep , with a smaller hole in the middle for a container. Stand the container in the middle. Run a drinking tube from it to outside the hole, if you have one. Cover the hole with clear plastic , holding the edges down with soil. Put a rock in the centre so the plastic forms a cone, about 40 cm below ground, right over the container. The plastic mustn't touch the sides. Water condenses under the plastic and drips into the container. Plug the tube when you're not drinking. Filtering muddy water Let muddy water stand for a few hours so the dirt settles. Pour off the clear water. Or pour it through layers of sand, gravel and charcoal (from a fire) in a bag, bottle or cloth layers. Then boil or disinfect it. Filtering doesn't kill germs. Sources (checked 2026-11-01) US Army, ATP 3-50.21 Survival (2018), chapter 3 \"Water\" (approved for public release): https://armypubs.army.mil/ProductMaps/PubForm/Details.aspx?PUB_ID=1005316 CDC, How to Find Clean Water in an Emergency (rainwater must be treated): https://www.cdc.gov/water-emergency/about/how-to-find-clean-water-in-an-emergency.html Drawings: see images/CREDITS.md"},"03-water/disinfecting-a-well":{"title":"Disinfecting a Well After a Flood","folder":"03-water","html":"<h1 id=\"disinfecting-a-well-after-a-flood\">Disinfecting a Well After a Flood<\/h1>\n<blockquote>\n<p><strong>Best done by a well or pump contractor.<\/strong> Ask your local council or health\ndepartment first. Until the well tests clean, <strong>boil drinking water<\/strong> (rolling\nboil, 1 minute) or use another safe source.<\/p>\n<\/blockquote>\n<p><strong>Water that smells of fuel or chemicals can't be fixed with bleach.<\/strong> Use bottled\nwater and contact the health department.<\/p>\n<h2 id=\"safety-first\">Safety first<\/h2>\n<ul>\n<li><strong>Turn off the power<\/strong> to the pump before clearing debris. Have an electrician\n    or pump contractor check the wiring before turning it back on.<\/li>\n<li><strong>Never climb into a well pit.<\/strong> Dangerous gases can build up there.<\/li>\n<li>Wear <strong>goggles or a face shield<\/strong> and work where there's fresh air.<\/li>\n<li>Don't drink or bathe in the water until the job is finished.<\/li>\n<\/ul>\n<h2 id=\"steps\">Steps<\/h2>\n<ol>\n<li>Clear debris and repair the pump if needed.<\/li>\n<li>Pump or bail water <strong>until it runs clear<\/strong>. Let it drain outside, not into the\n    house plumbing.<\/li>\n<li>Close the valves to any water softener.<\/li>\n<li>Mix <strong>unscented household bleach<\/strong> with <strong>11–19 litres (3–5 gallons) of\n    water<\/strong> in a bucket. The amount of bleach depends on the well's depth and\n    width (CDC tables; for example, a drilled well 3 m deep with a 10 cm casing\n    needs about 3¼ tablespoons).<\/li>\n<li>Pour it into the well, keeping it away from electrical connections. Circulate\n    it with a hose, and rinse the inside of the casing for <strong>5–10 minutes<\/strong>.<\/li>\n<li>Run <strong>every indoor tap until you smell chlorine<\/strong>, then turn them off and let\n    the water sit for <strong>at least 12 hours<\/strong>.<\/li>\n<li>Drain the chlorinated water <strong>onto bare ground<\/strong> (like a driveway), not into a\n    creek or pond, until the chlorine smell is gone. Then run all indoor taps\n    until they don't smell of chlorine.<\/li>\n<\/ol>\n<h2 id=\"test-it\">Test it<\/h2>\n<ul>\n<li>Wait <strong>7–10 days<\/strong>, with all the chlorine flushed out, then have the water\n    tested for <strong>total coliforms and <em>E. coli<\/em><\/strong>.<\/li>\n<li>Retest after <strong>2–4 weeks<\/strong> and again after <strong>3–4 months<\/strong>, then at least twice\n    a year.<\/li>\n<li>Bacteria still there? Disinfect again. If it keeps failing, contact the health\n    department.<\/li>\n<\/ul>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>CDC, How to Disinfect Wells After an Emergency (with the full bleach tables):\n    https://www.cdc.gov/water-emergency/about/how-to-disinfect-wells-after-an-emergency.html<\/li>\n<\/ul>","text":"Disinfecting a Well After a Flood Best done by a well or pump contractor. Ask your local council or health department first. Until the well tests clean, boil drinking water (rolling boil, 1 minute) or use another safe source. Water that smells of fuel or chemicals can't be fixed with bleach. Use bottled water and contact the health department. Safety first Turn off the power to the pump before clearing debris. Have an electrician or pump contractor check the wiring before turning it back on. Never climb into a well pit. Dangerous gases can build up there. Wear goggles or a face shield and work where there's fresh air. Don't drink or bathe in the water until the job is finished. Steps Clear debris and repair the pump if needed. Pump or bail water until it runs clear . Let it drain outside, not into the house plumbing. Close the valves to any water softener. Mix unscented household bleach with 11–19 litres (3–5 gallons) of water in a bucket. The amount of bleach depends on the well's depth and width (CDC tables; for example, a drilled well 3 m deep with a 10 cm casing needs about 3¼ tablespoons). Pour it into the well, keeping it away from electrical connections. Circulate it with a hose, and rinse the inside of the casing for 5–10 minutes . Run every indoor tap until you smell chlorine , then turn them off and let the water sit for at least 12 hours . Drain the chlorinated water onto bare ground (like a driveway), not into a creek or pond, until the chlorine smell is gone. Then run all indoor taps until they don't smell of chlorine. Test it Wait 7–10 days , with all the chlorine flushed out, then have the water tested for total coliforms and E. coli . Retest after 2–4 weeks and again after 3–4 months , then at least twice a year. Bacteria still there? Disinfect again. If it keeps failing, contact the health department. Sources (checked 2026-11-01) CDC, How to Disinfect Wells After an Emergency (with the full bleach tables): https://www.cdc.gov/water-emergency/about/how-to-disinfect-wells-after-an-emergency.html"},"03-water/finding-water":{"title":"Finding Water in an Emergency","folder":"03-water","html":"<h1 id=\"finding-water-in-an-emergency\">Finding Water in an Emergency<\/h1>\n<p>Listen to local officials for advice about your tap water. You may need to\n<strong>shut off your home's main water valve<\/strong> to keep contaminated water out of\nyour pipes.<\/p>\n<h2 id=\"inside-your-home-safe-to-drink\">Inside your home (safe to drink)<\/h2>\n<ul>\n<li><strong>Water heater tank<\/strong> (the one that feeds your taps and showers). In older\n    homes, <strong>don't<\/strong> use the tank that feeds radiators. That is heating system\n    water, and it's not safe.<\/li>\n<li><strong>Melted ice cubes<\/strong>, if they were made with clean water.<\/li>\n<li><strong>Toilet tank, not the bowl<\/strong>, only if the water is clear and has no cleaning\n    chemicals in it (for example, cleaners that color the water).<\/li>\n<li><strong>Liquid from canned fruit and vegetables.<\/strong><\/li>\n<\/ul>\n<h2 id=\"inside-your-home-washing-only-not-drinking\">Inside your home (washing only, not drinking)<\/h2>\n<ul>\n<li><strong>Swimming pools and spas<\/strong>: fine for washing, cleaning and personal hygiene.\n    <strong>Don't drink it.<\/strong><\/li>\n<\/ul>\n<h2 id=\"outside-must-be-treated-before-use\">Outside (must be treated before use)<\/h2>\n<p>All of these can carry germs from animal waste, sewage or chemicals.\n<strong>Treat them before drinking or washing<\/strong>; see\n<a href=\"#/03-water/making-water-safe\">making-water-safe.md<\/a>.<\/p>\n<ul>\n<li>Rainwater<\/li>\n<li>Streams and rivers<\/li>\n<li>Ponds and lakes<\/li>\n<li>Natural springs<\/li>\n<li>Wells, after a flood<\/li>\n<\/ul>\n<h2 id=\"never-use\">Never use<\/h2>\n<blockquote>\n<p><strong>Water contaminated with fuel or toxic chemicals cannot be made safe.<\/strong>\nDon't drink it or wash with it, even after boiling or bleach.<\/p>\n<\/blockquote>\n<ul>\n<li>Toilet bowl water<\/li>\n<li>Toilet tank water with chemical cleaners in it<\/li>\n<li>Radiator or boiler water from a home heating system<\/li>\n<\/ul>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>CDC, How to Find Clean Water in an Emergency:\n    https://www.cdc.gov/water-emergency/about/how-to-find-clean-water-in-an-emergency.html<\/li>\n<\/ul>","text":"Finding Water in an Emergency Listen to local officials for advice about your tap water. You may need to shut off your home's main water valve to keep contaminated water out of your pipes. Inside your home (safe to drink) Water heater tank (the one that feeds your taps and showers). In older homes, don't use the tank that feeds radiators. That is heating system water, and it's not safe. Melted ice cubes , if they were made with clean water. Toilet tank, not the bowl , only if the water is clear and has no cleaning chemicals in it (for example, cleaners that color the water). Liquid from canned fruit and vegetables. Inside your home (washing only, not drinking) Swimming pools and spas : fine for washing, cleaning and personal hygiene. Don't drink it. Outside (must be treated before use) All of these can carry germs from animal waste, sewage or chemicals. Treat them before drinking or washing ; see making-water-safe.md . Rainwater Streams and rivers Ponds and lakes Natural springs Wells, after a flood Never use Water contaminated with fuel or toxic chemicals cannot be made safe. Don't drink it or wash with it, even after boiling or bleach. Toilet bowl water Toilet tank water with chemical cleaners in it Radiator or boiler water from a home heating system Sources (checked 2026-11-01) CDC, How to Find Clean Water in an Emergency: https://www.cdc.gov/water-emergency/about/how-to-find-clean-water-in-an-emergency.html"},"03-water/images/CREDITS":{"title":"Image Credits: 03-water","folder":"03-water","html":"<h1 id=\"image-credits-03-water\">Image Credits: 03-water<\/h1>\n<table>\n<thead>\n<tr>\n<th>Image<\/th>\n<th>Source<\/th>\n<th>License<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>rain-catcher.png<\/code>, <code>beach-well.png<\/code>, <code>solar-still.png<\/code>, <code>water-filters.png<\/code><\/td>\n<td>US Army, <em>ATP 3-50.21 Survival<\/em> (2018), figures 3-1, 3-10, 3-9 and 3-12, converted to greyscale<\/td>\n<td>Public domain (US Government work, approved for public release)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>","text":"Image Credits: 03-water Image Source License rain-catcher.png , beach-well.png , solar-still.png , water-filters.png US Army, ATP 3-50.21 Survival (2018), figures 3-1, 3-10, 3-9 and 3-12, converted to greyscale Public domain (US Government work, approved for public release)"},"03-water/making-water-safe":{"title":"Making Water Safe to Drink","folder":"03-water","html":"<h1 id=\"making-water-safe-to-drink\">Making Water Safe to Drink<\/h1>\n<p>Use <strong>bottled water<\/strong> first if you have it. If not, <strong>boiling is the best way\nto kill germs<\/strong> in water.<\/p>\n<h2 id=\"option-1-boil-it-best\">Option 1: Boil it (best)<\/h2>\n<ol>\n<li><strong>If the water is cloudy<\/strong>, filter it through a clean cloth, paper towel or\n    coffee filter, <em>or<\/em> let it settle and pour off the clear water.<\/li>\n<li><strong>Bring it to a rolling boil for 1 minute.<\/strong>\n    Above <strong>6,500 feet (about 2,000 m)<\/strong> altitude, boil for <strong>3 minutes<\/strong>.<\/li>\n<li><strong>Let it cool<\/strong> and store it in clean, sanitized containers with tight\n    covers.<\/li>\n<li><em>Better taste:<\/em> pour it back and forth between two clean containers and let\n    it stand a few hours, or add a pinch of salt per quart/liter.<\/li>\n<\/ol>\n<h2 id=\"option-2-household-bleach\">Option 2: Household bleach<\/h2>\n<p>Use <strong>unscented<\/strong> household chlorine bleach. If the label has directions for\ndisinfecting drinking water, follow those. Otherwise, check that the active\ningredient is <strong>sodium hypochlorite<\/strong>. Most US bleach is 5–9%.<\/p>\n<p><strong>For bleach at 5–9% concentration:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Water<\/th>\n<th>Drops<\/th>\n<th>mL<\/th>\n<th>Spoon<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1 quart / 1 liter<\/td>\n<td><strong>2 drops<\/strong><\/td>\n<td>0.1 mL<\/td>\n<td>too small to measure<\/td>\n<\/tr>\n<tr>\n<td>1 gallon (≈3.8 L)<\/td>\n<td><strong>8 drops<\/strong><\/td>\n<td>½ mL<\/td>\n<td>a little less than ⅛ tsp<\/td>\n<\/tr>\n<tr>\n<td>5 gallons (≈19 L)<\/td>\n<td><strong>40 drops<\/strong><\/td>\n<td>2½ mL<\/td>\n<td>½ tsp<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>For bleach at 1% concentration:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Water<\/th>\n<th>Drops<\/th>\n<th>mL<\/th>\n<th>Spoon<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1 quart / 1 liter<\/td>\n<td><strong>10 drops<\/strong><\/td>\n<td>½ mL<\/td>\n<td>⅛ tsp<\/td>\n<\/tr>\n<tr>\n<td>1 gallon (≈3.8 L)<\/td>\n<td><strong>40 drops<\/strong><\/td>\n<td>2½ mL<\/td>\n<td>½ tsp<\/td>\n<\/tr>\n<tr>\n<td>5 gallons (≈19 L)<\/td>\n<td><strong>200 drops<\/strong><\/td>\n<td>12½ mL<\/td>\n<td>2½ tsp<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ol>\n<li><strong>Double the amount<\/strong> if the water is cloudy, murky, colored or very cold.<\/li>\n<li><strong>Stir well.<\/strong><\/li>\n<li><strong>Wait at least 30 minutes<\/strong> before drinking.<\/li>\n<li>Store in clean, sanitized containers with tight covers.<\/li>\n<\/ol>\n<h2 id=\"warnings\">Warnings<\/h2>\n<blockquote>\n<p><strong>Boiling and bleach can't fix everything.<\/strong> Water contaminated with\n<strong>fuel, toxic chemicals or radioactive material<\/strong> cannot be made safe by\nboiling or disinfecting. Find another source.<\/p>\n<\/blockquote>\n<ul>\n<li><strong>Never drink radiator or boiler water<\/strong> from a home heating system.<\/li>\n<li>Until water is treated, don't use it for drinking, washing dishes, brushing\n    teeth, preparing food, washing hands, making ice or baby formula.<\/li>\n<li><strong>Iodine and chlorine tablets do not kill <em>Cryptosporidium<\/em>.<\/strong> Boiling and\n    bleach work better against <em>Cryptosporidium<\/em> and <em>Giardia<\/em>.<\/li>\n<li><strong>Avoid iodine-treated water<\/strong> if you are pregnant, have thyroid problems or\n    are sensitive to iodine. No one should drink it for more than a few weeks at\n    a time.<\/li>\n<li><strong>Portable filters do not remove viruses.<\/strong> Disinfect filtered water too.<\/li>\n<\/ul>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>CDC, Water in an Emergency:\n    https://www.cdc.gov/water
