to some trees and caravans; boats may drag moorings 2 125–164 km/h Minor house damage; significant damage to trees and caravans; risk of power failure 3 (severe) 165–224 km/h Some roof and structural damage; some caravans destroyed; power failure likely 4 (severe) 225–279 km/h Significant roof and structural damage; dangerous flying debris; widespread power failures 5 (severe) over 280 km/h Extremely dangerous, widespread destruction Before the season (October) Clean up the yard; trim trees and overhanging branches; clear gutters. Check the roof, windows and loose fittings. Fit shutters if you can. Know how to turn off water, power and gas at the mains. Know whether you're in a storm tide evacuation zone (see local-hazards.md ). Pack your emergency kit and an evacuation kit (see ../11-preparedness/emergency-kit.md ). Boat owners: follow Maritime Safety Queensland's severe weather plan for the region, double up mooring lines, and know where the boat must go. When a cyclone warning is issued A warning means winds are expected within 24 hours . Start your household emergency plan now. Depending on official advice: Collect children from school or childcare when told to, and go home. Park vehicles under solid shelter (handbrake on, in gear). Put outdoor furniture in the pool or inside, with other loose items. Close shutters, or board or tape windows (tape doesn't strengthen glass, but limits shattering). Draw curtains and lock doors. Pack your evacuation kit. Leave if emergency services tell you to. During the cyclone Listen to the radio: ABC Sunshine Coast 90.3 / 95.3 FM . Stay inside, with your pets. Unplug electrical appliances. Keep the fridge and freezer closed. Shelter in the strongest part of the house, away from windows : an internal hallway or bathroom. If the building starts to break up, protect yourself with mattresses, rugs or blankets under a strong table or bench, or hold onto something solid. Beware the calm \"eye\". If the wind stops, it isn't over. Violent winds will return from the other direction. Wait for the official all-clear. If you're driving: stop (handbrake on, in gear) away from the sea , trees and power lines, and stay in the car. Storm tide A storm tide happens when a storm pushes sea water onshore on top of the normal tide, flooding low coastal land. Wind pushes water ashore; low pressure near the eye lifts it a little more. Stay inside until you're officially told it's safe. Don't use wet electrical appliances. Watch for fallen power lines, damaged bridges and trees. \"If it's flooded, forget it.\" Don't enter floodwater. After Don't go outside until officially advised it's safe. If you evacuated, don't return until told to, and use the recommended route. Check for gas leaks (see ../01-emergency/gas-leak.md ) and fallen power lines. Wear rubber boots and gloves for cleanup. Treat everything that touched floodwater as contaminated, and wash your hands after handling it. Watch for damaged floors, walls and ceilings, and for snakes . Throw out food that touched floodwater, and follow any instructions about treating water (see ../03-water/making-water-safe.md ). Don't go sightseeing. Check on neighbours, friends and family. Avoid unnecessary phone calls so lines stay free. Sources (checked 2026-11-01) Noosa Council, Emergency Action Guide 2024 (Cyclone and Storm surge sections): https://www.noosa.qld.gov.au/Community/Disasters-and-emergencies Diagram: see images/CREDITS.md"},"12-noosa-tewantin/emergency-contacts":{"title":"Emergency Contacts: Noosa / Tewantin (QLD)","folder":"12-noosa-tewantin","html":"<h1 id=\"emergency-contacts-noosa-tewantin-qld\">Emergency Contacts: Noosa / Tewantin (QLD)<\/h1>\n<blockquote>\n<p><strong>Life-threatening emergency: 000<\/strong> (Police, Fire, Ambulance)\nFrom a mobile you can also dial <strong>112<\/strong>.\nOn the water: <strong>VHF channel 16<\/strong> (Marine Rescue Queensland).<\/p>\n<\/blockquote>\n<p>Print this page and keep it with your emergency kit. Phones and internet may be\ndown: <strong>NBN home phones and internet need power at both ends<\/strong>, so they can\nstop working in a power outage even if you have a backup at home.<\/p>\n<h2 id=\"emergency-help\">Emergency help<\/h2>\n<table>\n<thead>\n<tr>\n<th>Who<\/th>\n<th>Number<\/th>\n<th>For<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Police, Fire, Ambulance<\/td>\n<td><strong>000<\/strong> (or <strong>112<\/strong> from a mobile)<\/td>\n<td>Life-threatening emergencies<\/td>\n<\/tr>\n<tr>\n<td>SES (State Emergency Service)<\/td>\n<td><strong>132 500<\/strong><\/td>\n<td>Damaged roof, rising floodwater, trees on buildings, storm damage<\/td>\n<\/tr>\n<tr>\n<td>Poisons Information<\/td>\n<td><strong>13 11 26<\/strong><\/td>\n<td>Poisoning, bites, stings, overdoses<\/td>\n<\/tr>\n<tr>\n<td>13 HEALTH<\/td>\n<td><strong>13 43 25 84<\/strong><\/td>\n<td>Non-urgent health advice (24/7 nurse)<\/td>\n<\/tr>\n<tr>\n<td>healthdirect<\/td>\n<td><strong>1800 022 222<\/strong><\/td>\n<td>Health advice from a registered nurse (24/7)<\/td>\n<\/tr>\n<tr>\n<td>Policelink<\/td>\n<td><strong>131 444<\/strong><\/td>\n<td>Non-emergency police<\/td>\n<\/tr>\n<tr>\n<td>Tsunami warnings<\/td>\n<td><strong>1300 878 6264<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Bureau of Meteorology<\/td>\n<td><strong>1300 659 210<\/strong><\/td>\n<td>Weather and cyclone warnings<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"local\">Local<\/h2>\n<table>\n<thead>\n<tr>\n<th>Who<\/th>\n<th>Number<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Noosa Council (and Local Disaster Management Group)<\/td>\n<td><strong>(07) 5329 6500<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Noosa Hospital<\/td>\n<td><strong>(07) 5455 9200<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Sunshine Coast University Hospital<\/td>\n<td><strong>(07) 5202 0000<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Nambour Hospital<\/td>\n<td><strong>(07) 5470 6600<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Gympie Hospital<\/td>\n<td><strong>(07) 5489 8444<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Wildlife Rehabilitation Centre (Eumundi)<\/td>\n<td><strong>(07) 5442 8057<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"utilities\">Utilities<\/h2>\n<table>\n<thead>\n<tr>\n<th>Who<\/th>\n<th>Number<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Energex: emergencies (fallen power lines etc.)<\/td>\n<td><strong>13 19 62<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Energex: report a fault<\/td>\n<td><strong>13 62 62<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Unitywater (water and sewerage)<\/td>\n<td><strong>1300 086 489<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Telstra faults<\/td>\n<td><strong>13 22 03<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Road and travel conditions (TMR)<\/td>\n<td><strong>13 19 40<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"radio-emergency-broadcaster\">Radio (emergency broadcaster)<\/h2>\n<p><strong>ABC Sunshine Coast: 90.3 FM or 95.3 FM.<\/strong> Keep a battery or wind-up radio.<\/p>\n<h2 id=\"after-a-disaster\">After a disaster<\/h2>\n<table>\n<thead>\n<tr>\n<th>Who<\/th>\n<th>Number<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Community Recovery Hotline<\/td>\n<td><strong>1800 173 349<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Australian Government Emergency Information Line<\/td>\n<td><strong>180 22 66<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Red Cross<\/td>\n<td><strong>1300 554 419<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Lifeline (crisis support)<\/td>\n<td><strong>13 11 14<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Legal Aid (help with insurance claims)<\/td>\n<td><strong>1300 651 188<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Department of Housing<\/td>\n<td><strong>1800 806 197<\/strong><\/td>\n<\/tr>\n<tr>\n<td>RSPCA QLD 24/7 animal emergencies<\/td>\n<td><strong>1300 264 625<\/strong><\/td>\n<\/tr>\n<tr>\n<td>RSPCA QLD lost and found<\/td>\n<td><strong>1300 363 736<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Translating and Interpreting Service (24/7)<\/td>\n<td><strong>13 14 50<\/strong><\/td>\n<\/tr>\n<tr>\n<td>National Relay Service (hearing or speech impairment)<\/td>\n<td><strong>1800 555 677<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"online-when-the-internet-works\">Online (when the internet works)<\/h2>\n<ul>\n<li><strong>Noosa Disaster Dashboard<\/strong>, the council's main source during a disaster:\n    https://disaster.noosa.qld.gov.au (road conditions, power outages, warnings,\n    river heights, evacuation centres, flood cameras)<\/li>\n<li><strong>Noosa ALERT<\/strong>: free SMS and email warnings. Sign up on the dashboard.<\/li>\n<li>Bureau of Meteorology: https://www.bom.gov.au<\/li>\n<li>Queensland alerts: https://www.qld.gov.au/alerts<\/li>\n<li>Get Ready Queensland: https://www.getready.qld.gov.au<\/li>\n<\/ul>\n<h2 id=\"my-own-numbers\">My own numbers<\/h2>\n<p>(Write yours in. Keep personal details in the private folder, not here.)<\/p>\n<ul>\n<li>Gas supplier emergency: ______________________<\/li>\n<li>Family meeting point: see your private plan<\/li>\n<\/ul>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>Noosa Council, Emergency Action Guide (contacts page) and Disaster Dashboard:\n    https://disaster.noosa.qld.gov.au<\/li>\n<li>Get Ready Queensland, Emergency services contacts:\n    https://www.getready.qld.gov.au/during/emergency-services<\/li>\n<li>healthdirect, Spider bites (healthdirect number):\n    https://www.healthdirect.gov.au/spider-bites<\/li>\n<\/ul>","text":"Emergency Contacts: Noosa / Tewantin (QLD) Life-threatening emergency: 000 (Police, Fire, Ambulance) From a mobile you can also dial 112 . On the water: VHF channel 16 (Marine Rescue Queensland). Print this page and keep it with your emergency kit. Phones and internet may be down: NBN home phones and internet need power at both ends , so they can stop working in a power outage even if you have a backup at home. Emergency help Who Number For Police, Fire, Ambulance 000 (or 112 from a mobile) Life-threatening emergencies SES (State Emergency Service) 132 500 Damaged roof, rising floodwater, trees on buildings, storm damage Poisons Information 13 11 26 Poisoning, bites, stings, overdoses 13 HEALTH 13 43 25 84 Non-urgent health advice (24/7 nurse) healthdirect 1800 022 222 Health advice from a registered nurse (24/7) Policelink 131 444 Non-emergency police Tsunami warnings 1300 878 6264 Bureau of Meteorology 1300 659 210 Weather and cyclone warnings Local Who Number Noosa Council (and Local Disaster Management Group) (07) 5329 6500 Noosa Hospital (07) 5455 9200 Sunshine Coast University Hospital (07) 5202 0000 Nambour Hospital (07) 5470 6600 Gympie Hospital (07) 5489 8444 Wildlife Rehabilitation Centre (Eumundi) (07) 5442 8057 Utilities Who Number Energex: emergencies (fallen power lines etc.) 13 19 62 Energex: report a fault 13 62 62 Unitywater (water and sewerage) 1300 086 489 Telstra faults 13 22 03 Road and travel conditions (TMR) 13 19 40 Radio (emergency broadcaster) ABC Sunshine Coast: 90.3 FM or 95.3 FM. Keep a battery or wind-up radio. After a disaster Who Number Community Recovery Hotline 1800 173 349 Australian Government Emergency Information Line 180 22 66 Red Cross 1300 554 419 Lifeline (crisis support) 13 11 14 Legal Aid (help with insurance claims) 1300 651 188 Department of Housing 1800 806 197 RSPCA QLD 24/7 animal emergencies 1300 264 625 RSPCA QLD lost and found 1300 363 736 Translating and Interpreting Service (24/7) 13 14 50 National Relay Service (hearing or speech impairment) 1800 555 677 Online (when the internet works) Noosa Disaster Dashboard , the council's main source during a disaster: https://disaster.noosa.qld.gov.au (road conditions, power outages, warnings, river heights, evacuation centres, flood cameras) Noosa ALERT : free SMS and email warnings. Sign up on the dashboard. Bureau of Meteorology: https://www.bom.gov.au Queensland alerts: https://www.qld.gov.au/alerts Get Ready Queensland: https://www.getready.qld.gov.au My own numbers (Write yours in. Keep personal details in the private folder, not here.) Gas supplier emergency: ______________________ Family meeting point: see your private plan Sources (checked 2026-11-01) Noosa Council, Emergency Action Guide (contacts page) and Disaster Dashboard: https://disaster.noosa.qld.gov.au Get Ready Queensland, Emergency services contacts: https://www.getready.qld.gov.au/during/emergency-services healthdirect, Spider bites (healthdirect number): https://www.healthdirect.gov.au/spider-bites"},"12-noosa-tewantin/heatwave":{"title":"Heatwave (Noosa)","folder":"12-noosa-tewantin","html":"<h1 id=\"heatwave-noosa\">Heatwave (Noosa)<\/h1>\n<p>A heatwave is <strong>three or more days<\/strong> of maximum and minimum temperatures that\nare unusual for the area. <strong>Severe heatwaves have killed more people than any\nother natural hazard in Australia.<\/strong> They can also make power and transport\nfail.<\/p>\n<p>Most at risk: the elderly, pregnant women, babies and young children, but\nanyone can be affected.<\/p>\n<h2 id=\"before\">Before<\/h2>\n<ul>\n<li>Check the Noosa Disaster Dashboard and the Bureau of Meteorology.<\/li>\n<li>Plan to be indoors or somewhere air-conditioned.<\/li>\n<li>Fit blinds or curtains to keep heat out. Check fans and air-conditioners\n    work.<\/li>\n<li>Have enough food, water and medicine.<\/li>\n<\/ul>\n<h2 id=\"during\">During<\/h2>\n<ul>\n<li><strong>Stay out of the sun, especially 11 am to 3 pm.<\/strong><\/li>\n<li>Wear loose, cool clothes; hat, sunglasses and sunscreen outside.<\/li>\n<li>Take cool showers or splash yourself with water.<\/li>\n<li><strong>Drink plenty of water.<\/strong> Avoid caffeine, alcohol and heavy protein meals.<\/li>\n<li>Close curtains and blinds. Avoid physical effort.<\/li>\n<\/ul>\n<p><strong>Know the warning signs:<\/strong> breathlessness, chest pain, confusion, intense\nthirst, weakness, dizziness, cramps that won't stop. See\n<a href=\"#/02-first-aid/heat-illness\">../02-first-aid/heat-illness.md<\/a>. For a\nlife-threatening emergency, call <strong>000<\/strong>.<\/p>\n<h2 id=\"after\">After<\/h2>\n<p>Check on friends, neighbours and anyone less able to look after themselves.<\/p>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>Noosa Council, Emergency Action Guide 2024 (Heatwave section):\n    https://www.noosa.qld.gov.au/Community/Disasters-and-emergencies<\/li>\n<\/ul>","text":"Heatwave (Noosa) A heatwave is three or more days of maximum and minimum temperatures that are unusual for the area. Severe heatwaves have killed more people than any other natural hazard in Australia. They can also make power and transport fail. Most at risk: the elderly, pregnant women, babies and young children, but anyone can be affected. Before Check the Noosa Disaster Dashboard and the Bureau of Meteorology. Plan to be indoors or somewhere air-conditioned. Fit blinds or curtains to keep heat out. Check fans and air-conditioners work. Have enough food, water and medicine. During Stay out of the sun, especially 11 am to 3 pm. Wear loose, cool clothes; hat, sunglasses and sunscreen outside. Take cool showers or splash yourself with water. Drink plenty of water. Avoid caffeine, alcohol and heavy protein meals. Close curtains and blinds. Avoid physical effort. Know the warning signs: breathlessness, chest pain, confusion, intense thirst, weakness, dizziness, cramps that won't stop. See ../02-first-aid/heat-illness.md . For a life-threatening emergency, call 000 . After Check on friends, neighbours and anyone less able to look after themselves. Sources (checked 2026-11-01) Noosa Council, Emergency Action Guide 2024 (Heatwave section): https://www.noosa.qld.gov.au/Community/Disasters-and-emergencies"},"12-noosa-tewantin/images/CREDITS":{"title":"Image Credits: 12-noosa-tewantin","folder":"12-noosa-tewantin","html":"<h1 id=\"image-credits-12-noosa-tewantin\">Image Credits: 12-noosa-tewantin<\/h1>\n<table>\n<thead>\n<tr>\n<th>Image<\/th>\n<th>Source<\/th>\n<th>License<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>storm-surge.png<\/code><\/td>\n<td>Holly Cheng, after an original graphic by Robert Simmon, NASA GSFC: <a class=\"ext\" href=\"https://commons.wikimedia.org/wiki/File:Storm_surge_graphic.svg\" rel=\"noopener\" target=\"_blank\">Storm surge graphic.svg<\/a>, Wikimedia Commons, converted to greyscale<\/td>\n<td>Public domain<\/td>\n<\/tr>\n<\/tbody>\n<\/table>","text":"Image Credits: 12-noosa-tewantin Image Source License storm-surge.png Holly Cheng, after an original graphic by Robert Simmon, NASA GSFC: Storm surge graphic.svg , Wikimedia Commons, converted to greyscale Public domain"},"12-noosa-tewantin/local-hazards":{"title":"Local Hazards: Noosa Shire","folder":"12-noosa-tewantin","html":"<h1 id=\"local-hazards-noosa-shire\">Local Hazards: Noosa Shire<\/h1>\n<p><strong>Cyclones and flooding are the most common disasters here.<\/strong> Noosa can also\nhave bushfire, severe storms, storm tide, heatwave, tsunami, earthquake and\nlandslide.<\/p>\n<p><strong>Main disaster season: November to April.<\/strong> Noosa Council suggests setting\naside a weekend each <strong>October<\/strong> to get your home and family ready.<\/p>\n<h2 id=\"what-has-happened-here\">What has happened here<\/h2>\n<table>\n<thead>\n<tr>\n<th>Hazard<\/th>\n<th>Local history<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Cyclone<\/strong><\/td>\n<td>48 tropical or ex-tropical cyclones have affected Noosa since 1887. <strong>Cyclone Daisy<\/strong> crossed directly over Noosa in February 1972 (Category 2).<\/td>\n<\/tr>\n<tr>\n<td><strong>Flood<\/strong><\/td>\n<td>The <strong>Noosa River<\/strong> catchment (most of the shire) and the <strong>Mary River<\/strong> catchment flood. Last major flood: <strong>1992<\/strong>, about 540 lots flooded. In April 2009 a flash flood in the <strong>Kin Kin Creek<\/strong> catchment brought about 900 mm of rain in under 6 hours.<\/td>\n<\/tr>\n<tr>\n<td><strong>Storm tide<\/strong><\/td>\n<td>Minor storm tides are frequent (some \"king tides\" are actually minor storm tides). The most recent notable one was during <strong>Cyclone Oma<\/strong> (February 2019).<\/td>\n<\/tr>\n<tr>\n<td><strong>East Coast Lows<\/strong><\/td>\n<td>Intense storms off the coast, about 10 significant ones a year, at any time of year: damaging winds and surf, heavy rain, erosion, flooding.<\/td>\n<\/tr>\n<tr>\n<td><strong>Bushfire<\/strong><\/td>\n<td>The <strong>2019 Peregian, Cooroibah and North Shore fires<\/strong> burned more than 2,000 hectares.<\/td>\n<\/tr>\n<tr>\n<td><strong>Tornado<\/strong><\/td>\n<td>A tornado hit <strong>Kin Kin<\/strong> in 1971, killing three people. Kin Kin had tornadoes again as recently as 1984.<\/td>\n<\/tr>\n<tr>\n<td><strong>Landslide<\/strong><\/td>\n<td>Black Mountain.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"is-my-home-at-risk\">Is my home at risk?<\/h2>\n<p>Check these <strong>now<\/strong>, while the internet works:<\/p>\n<ul>\n<li><strong>Flood maps:<\/strong> Noosa Council has minor/moderate and major/extreme flood maps\n    for 27 localities, including Tewantin, Noosaville and Noosa Heads. Run\n    <code>./tools/download-local.sh<\/code> to save the Tewantin-area maps into\n    <code>12-noosa-tewantin/downloads/<\/code>, or see\n    https://www.noosa.qld.gov.au/community/maps/disaster-mapping<\/li>\n<li><strong>Storm tide evacuation zone:<\/strong> check your address on the Disaster Dashboard\n    (https://disaster.noosa.qld.gov.au). If your home is in a zone, plan to\n    evacuate. If it was <strong>built before 1982<\/strong>, or you're not sure, ask the\n    council about its construction ((07) 5329 6500).<\/li>\n<li><strong>Bushfire prone areas:<\/strong> interactive map on the council's disaster mapping\n    page (link above).<\/li>\n<\/ul>\n<h2 id=\"pages-for-each-hazard\">Pages for each hazard<\/h2>\n<ul>\n<li><a href=\"#/12-noosa-tewantin/cyclone-and-storm-tide\">Cyclone and Storm Tide<\/a><\/li>\n<li><a href=\"#/12-noosa-tewantin/bushfire\">Bushfire<\/a><\/li>\n<li><a href=\"#/12-noosa-tewantin/heatwave\">Heatwave<\/a><\/li>\n<li>Flood: see <a href=\"#/01-emergency/flood\">../01-emergency/flood.md<\/a>. Locally, the\n    council's rule is <strong>\"If it's flooded, forget it.\"<\/strong><\/li>\n<li>Severe thunderstorms: warnings are issued for gusts of <strong>90 km/h or more<\/strong>,\n    tornadoes, hail <strong>2 cm or larger<\/strong>, or very heavy rain that causes flash\n    flooding. They often give <strong>less than an hour's<\/strong> notice.<\/li>\n<\/ul>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>Noosa Council, Emergency Action Guide 2024 (4th edition):\n    https://www.noosa.qld.gov.au/Community/Disasters-and-emergencies<\/li>\n<li>Noosa Council, Disaster Mapping:\n    https://www.noosa.qld.gov.au/community/maps/disaster-mapping<\/li>\n<\/ul>","text":"Local Hazards: Noosa Shire Cyclones and flooding are the most common disasters here. Noosa can also have bushfire, severe storms, storm tide, heatwave, tsunami, earthquake and landslide. Main disaster season: November to April. Noosa Council suggests setting aside a weekend each October to get your home and family ready. What has happened here Hazard Local history Cyclone 48 tropical or ex-tropical cyclones have affected Noosa since 1887. Cyclone Daisy crossed directly over Noosa in February 1972 (Category 2). Flood The Noosa River catchment (most of the shire) and the Mary River catchment flood. Last major flood: 1992 , about 540 lots flooded. In April 2009 a flash flood in the Kin Kin Creek catchment brought about 900 mm of rain in under 6 hours. Storm tide Minor storm tides are frequent (some \"king tides\" are actually minor storm tides). The most recent notable one was during Cyclone Oma (February 2019). East Coast Lows Intense storms off the coast, about 10 significant ones a year, at any time of year: damaging winds and surf, heavy rain, erosion, flooding. Bushfire The 2019 Peregian, Cooroibah and North Shore fires burned more than 2,000 hectares. Tornado A tornado hit Kin Kin in 1971, killing three people. Kin Kin had tornadoes again as recently as 1984. Landslide Black Mountain. Is my home at risk? Check these now , while the internet works: Flood maps: Noosa Council has minor/moderate and major/extreme flood maps for 27 localities, including Tewantin, Noosaville and Noosa Heads. Run ./tools/download-local.sh to save the Tewantin-area maps into 12-noosa-tewantin/downloads/ , or see https://www.noosa.qld.gov.au/community/maps/disaster-mapping Storm tide evacuation zone: check your address on the Disaster Dashboard (https://disaster.noosa.qld.gov.au). If your home is in a zone, plan to evacuate. If it was built before 1982 , or you're not sure, ask the council about its construction ((07) 5329 6500). Bushfire prone areas: interactive map on the council's disaster mapping page (link above). Pages for each hazard Cyclone and Storm Tide Bushfire Heatwave Flood: see ../01-emergency/flood.md . Locally, the council's rule is \"If it's flooded, forget it.\" Severe thunderstorms: warnings are issued for gusts of 90 km/h or more , tornadoes, hail 2 cm or larger , or very heavy rain that causes flash flooding. They often give less than an hour's notice. Sources (checked 2026-11-01) Noosa Council, Emergency Action Guide 2024 (4th edition): https://www.noosa.qld.gov.au/Community/Disasters-and-emergencies Noosa Council, Disaster Mapping: https://www.noosa.qld.gov.au/community/maps/disaster-mapping"},"12-noosa-tewantin/warnings":{"title":"Understanding Warnings (Queensland)","folder":"12-noosa-tewantin","html":"<h1 id=\"understanding-warnings-queensland\">Understanding Warnings (Queensland)<\/h1>\n<h2 id=\"australian-warning-system\">Australian Warning System<\/h2>\n<p>Used for bushfire, flood, storm, cyclone, heat and other hazards.<\/p>\n<table>\n<thead>\n<tr>\n<th>Level<\/th>\n<th>Colour<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Advice<\/strong><\/td>\n<td>🟨 Yellow<\/td>\n<td>An incident has started. <strong>No immediate danger.<\/strong> Stay up to date in case it changes.<\/td>\n<\/tr>\n<tr>\n<td><strong>Watch and Act<\/strong><\/td>\n<td>🟧 Orange<\/td>\n<td><strong>Heightened threat.<\/strong> Conditions are changing; <strong>act now<\/strong> to protect yourself and your family.<\/td>\n<\/tr>\n<tr>\n<td><strong>Emergency Warning<\/strong><\/td>\n<td>🟥 Red<\/td>\n<td><strong>Highest level.<\/strong> You may be in danger and must <strong>act immediately<\/strong>. Any delay puts your life at risk.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Each warning comes with an action, for example:<\/p>\n<ul>\n<li><em>Advice:<\/em> Prepare now · Stay informed · Monitor conditions · Avoid the area · Return with caution<\/li>\n<li><em>Watch and Act:<\/em> Prepare to leave · Leave now (if you are not prepared) · Move to higher ground · Do not enter flood water · Be aware of ember attack · Prepare for isolation<\/li>\n<li><em>Emergency Warning:<\/em> <strong>Leave immediately<\/strong> · Shelter indoors now · <strong>Too late / dangerous to leave<\/strong><\/li>\n<\/ul>\n<h2 id=\"fire-danger-ratings\">Fire Danger Ratings<\/h2>\n<p>How dangerous a fire <strong>would be<\/strong> if one started today (not a warning that\nthere is a fire).<\/p>\n<table>\n<thead>\n<tr>\n<th>Rating<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Moderate<\/strong><\/td>\n<td>Plan and prepare<\/td>\n<\/tr>\n<tr>\n<td><strong>High<\/strong><\/td>\n<td>Prepare to act<\/td>\n<\/tr>\n<tr>\n<td><strong>Extreme<\/strong><\/td>\n<td>Take action now to protect your life and property<\/td>\n<\/tr>\n<tr>\n<td><strong>Catastrophic<\/strong><\/td>\n<td><strong>For your survival, leave bush fire risk areas<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Noosa is in the <strong>Southeast Coast<\/strong> fire weather district. The fire season in\nSouth-East Queensland usually starts in <strong>July/August<\/strong> and can run into\nsummer.<\/p>\n<h2 id=\"other-alerts\">Other alerts<\/h2>\n<ul>\n<li><strong>Standard Emergency Warning Signal (SEWS):<\/strong> a <strong>wailing siren<\/strong> played at\n    the start of serious warnings on radio and TV. If you hear it, listen.<\/li>\n<li><strong>Emergency Alert:<\/strong> voice messages to landlines and text messages to mobiles\n    in the affected area. Works on all carriers, with no sign-up needed.<\/li>\n<li><strong>Door-knocks:<\/strong> emergency services may come to your door with warnings.<\/li>\n<li><strong>Noosa ALERT:<\/strong> the council's opt-in SMS and email alerts. Sign up at\n    https://disaster.noosa.qld.gov.au<\/li>\n<\/ul>\n<p>When you get a warning: <strong>act immediately<\/strong>, make sure everyone in the house\nknows, check on neighbours who may need help, and start your household\nemergency plan.<\/p>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>Queensland Government, Watch for the warnings (Australian Warning System):\n    https://www.disaster.qld.gov.au/watch-for-the-warnings<\/li>\n<li>Australian Fire Danger Rating System: https://afdrs.com.au/<\/li>\n<li>Noosa Council, Emergency Action Guide (warnings, bushfire season):\n    https://www.noosa.qld.gov.au/Community/Disasters-and-emergencies<\/li>\n<li>Noosa Disaster Dashboard (fire weather district):\n    https://disaster.noosa.qld.gov.au<\/li>\n<\/ul>","text":"Understanding Warnings (Queensland) Australian Warning System Used for bushfire, flood, storm, cyclone, heat and other hazards. Level Colour Meaning Advice 🟨 Yellow An incident has started. No immediate danger. Stay up to date in case it changes. Watch and Act 🟧 Orange Heightened threat. Conditions are changing; act now to protect yourself and your family. Emergency Warning 🟥 Red Highest level. You may be in danger and must act immediately . Any delay puts your life at risk. Each warning comes with an action, for example: Advice: Prepare now · Stay informed · Monitor conditions · Avoid the area · Return with caution Watch and Act: Prepare to leave · Leave now (if you are not prepared) · Move to higher ground · Do not enter flood water · Be aware of ember attack · Prepare for isolation Emergency Warning: Leave immediately · Shelter indoors now · Too late / dangerous to leave Fire Danger Ratings How dangerous a fire would be if one started today (not a warning that there is a fire). Rating What to do Moderate Plan and prepare High Prepare to act Extreme Take action now to protect your life and property Catastrophic For your survival, leave bush fire risk areas Noosa is in the Southeast Coast fire weather district. The fire season in South-East Queensland usually starts in July/August and can run into summer. Other alerts Standard Emergency Warning Signal (SEWS): a wailing siren played at the start of serious warnings on radio and TV. If you hear it, listen. Emergency Alert: voice messages to landlines and text messages to mobiles in the affected area. Works on all carriers, with no sign-up needed. Door-knocks: emergency services may come to your door with warnings. Noosa ALERT: the council's opt-in SMS and email alerts. Sign up at https://disaster.noosa.qld.gov.au When you get a warning: act immediately , make sure everyone in the house knows, check on neighbours who may need help, and start your household emergency plan. Sources (checked 2026-11-01) Queensland Government, Watch for the warnings (Australian Warning System): https://www.disaster.qld.gov.au/watch-for-the-warnings Australian Fire Danger Rating System: https://afdrs.com.au/ Noosa Council, Emergency Action Guide (warnings, bushfire season): https://www.noosa.qld.gov.au/Community/Disasters-and-emergencies Noosa Disaster Dashboard (fire weather district): https://disaster.noosa.qld.gov.au"},"13-literature/README":{"title":"13 · Literature","folder":"13-literature","html":"<h1 id=\"13-literature\">13 · Literature<\/h1>\n<p><strong>100 great books<\/strong>, free and in the public domain, as plain text files (87 MB in total).\nThey open in any const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem("ark." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("ark." + k, JSON.stringify(v)); } catch {} },
};
let scale = store.get("scale", 1);
let stepPref = store.get("stepMode", null);   // null = default (one step for emergency pages)
let stepIndex = 0;
let printing = false;
document.documentElement.style.setProperty("--scale", scale);
const savedTheme = store.get("theme", null);
if (savedTheme) document.documentElement.dataset.theme = savedTheme;

$("#callNumber").textContent = ARK.call.number;
$("#callText").textContent = ARK.call.text;
$("#callLink").href = "#/" + ARK.call.link;

// ---------- Home ----------
function home() {
  const urgent = ARK.urgent.map(([key, label, hint, hot]) =>
    `<a href="#/${key}" class="${hot ? "hot" : ""}">${esc(label)}<small>${esc(hint)}</small></a>`).join("");
  const shelf = ARK.sections.map(s =>
    `<a href="#/${s.key}"><span class="n">${s.number}</span><span>${esc(s.title)}</span><span class="c">${s.number === "13" ? ARK.books.length + " books" : s.count + (s.count === 1 ? " page" : " pages")}</span></a>`).join("");
  return `
    <section><div class="eyebrow">Offline · stored on this device</div><h1 style="font-size:1.9em;margin:.2em 0 0">What's happening?</h1></section>
    <form class="search" role="search" onsubmit="event.preventDefault()">
      <input id="q" type="search" placeholder="Search: bleeding, heimlich, flood, 000, a book…" autocomplete="off" aria-label="Search the ark">
    </form>
    <div class="results" id="results" hidden></div>
    <nav class="urgent-grid" aria-label="Emergencies">${urgent}</nav>
    <section style="display:grid;gap:10px"><div class="eyebrow">Everything in the ark</div>
      <nav class="shelf">${shelf}<a href="#/library/README"><span class="n">↗</span><span>Reference library (Wikipedia, WikiMed…)</span><span class="c">Kiwix app</span></a></nav>
    </section>
    <p class="foot"><a href="#/README">About this ark</a>${ARK.updated ? " · Updated " + esc(ARK.updated) : ""}</p>`;
}

function search(q) {
  q = q.trim().toLowerCase();
  if (!q) return [];
  const words = q.split(/\s+/);
  const hits = new Map();
  const add = (key, score) => hits.set(key, (hits.get(key) || 0) + score);
  for (const [word, key] of Object.entries(ARK.synonyms)) if (q.includes(word) || (word.length > 3 && word.startsWith(q))) add(key, 50);
  for (const [key, p] of Object.entries(ARK.pages)) {
    if (key.includes("/images/")) continue;
    const title = p.title.toLowerCase(), text = p.text.toLowerCase();
    if (title.includes(q)) add(key, 30);
    let all = true;
    for (const w of words) { if (title.includes(w)) add(key, 5); else if (!text.includes(w)) all = false; }
    if (all) add(key, words.reduce((n, w) => n + Math.min(5, text.split(w).length - 1), 0));
  }
  const pages = [...hits].sort((a, b) => b[1] - a[1]).slice(0, 8).map(([key]) => {
    const p = ARK.pages[key], i = p.text.toLowerCase().indexOf(words[0]);
    const snip = i < 0 ? p.text.slice(0, 110) : (i > 40 ? "…" : "") + p.text.slice(Math.max(0, i - 40), i + 80) + "…";
    return `<a href="#/${key}">${esc(p.title)}<small>${esc(snip)}</small></a>`;
  });
  const books = ARK.books.filter(b => (b.title + " " + b.author).toLowerCase().includes(q)).slice(0, 5)
    .map(b => `<a href="${esc(b.path)}" target="_blank">${esc(b.title)}<small>Book · ${esc(b.author)}</small></a>`);
  return [...pages, ...books];
}

// ---------- Pages ----------
function renderPage(key, anchor) {
  const p = ARK.pages[key];
  if (!p) return `<div class="crumb"><a href="#/">← Ark</a></div><h1>Page not found</h1><p>Try searching from the <a href="#/">home screen</a>.</p>`;
  const folderPage = ARK.pages[p.folder + "/README"];
  const isFolderIndex = key.endsWith("/README");
  const crumb = `<a href="#/">← Ark</a>${folderPage && !isFolderIndex ? `<span>·</span><a href="#/${p.folder}/README">${esc(folderPage.title)}</a>` : ""}`;
  return `<div class="crumb">${crumb}</div><div class="toolbar" id="toolbar" hidden></div><article class="page" id="page">${p.html}</article>`;
}

// Wrap "Don't" sections, mark sources, wrap wide tables
function decorate(page) {
  page.querySelectorAll("table").forEach(t => { const w = document.createElement("div"); w.className = "table-wrap"; t.replaceWith(w); w.appendChild(t); });
  [...page.querySelectorAll("h2")].filter(h => /^don.?t\b/i.test(h.textContent.trim())).forEach(h => {
    const box = document.createElement("aside"); box.className = "dont";
    h.before(box);
    let n = h; const nodes = [];
    while (n && !(n !== h && /^(H1|H2|HR)$/.test(n.tagName))) { nodes.push(n); n = n.nextElementSibling; }
    nodes.forEach(x => box.appendChild(x));
  });
  const hr = [...page.children].find(el => el.tagName === "HR");
  if (hr) { const box = document.createElement("footer"); box.className = "sources"; hr.after(box); while (box.nextSibling) box.appendChild(box.nextSibling); }
}

// Turn a guide into one card per step: each numbered item is a step; other blocks are grouped
function buildSteps(page) {
  const steps = [];
  let group = null, title = $("h1", page)?.textContent || "";
  const flush = () => { if (group && group.nodes.length) steps.push(group); group = null; };
  for (const el of [...page.children]) {
    if (el.tagName === "H1") continue;
    if (el.tagName === "FOOTER") break;
    if (el.tagName === "H2" || el.tagName === "H3") { flush(); title = el.textContent; continue; }
    if (el.tagName === "OL") {
      flush();
      [...el.children].forEach(li => steps.push({ title, nodes: [li], li: true }));
      continue;
    }
    // Pictures and their captions belong to the step just before them
    const pictureOnly = el.tagName === "P" &&
      (el.querySelector("img") ? el.textContent.trim() === "" : /^\s*<em>[\s\S]*<\/em>\s*$/.test(el.innerHTML));
    if (pictureOnly && !group && steps.length && steps[steps.length - 1].li) { steps[steps.length - 1].nodes.push(el); continue; }
    if (el.classList.contains("dont")) { flush(); steps.push({ title: "Don't", nodes: [el], caution: true }); continue; }
    if (!group) group = { title, nodes: [] };
    group.nodes.push(el);
  }
  flush();
  return steps;
}

function showSteps(page, steps, key) {
  stepIndex = Math.max(0, Math.min(stepIndex, steps.length - 1));
  const s = steps[stepIndex];
  const card = document.createElement("section");
  card.className = "step" + (s.caution ? " caution" : "");
  card.setAttribute("aria-label", `Step ${stepIndex + 1} of ${steps.length}`);
  const body = document.createElement("div"); body.className = "body";
  s.nodes.forEach(n => {
    if (n.tagName === "LI") { [...n.childNodes].forEach(c => body.appendChild(c.cloneNode(true))); }
    else if (n.classList?.contains("dont")) { [...n.children].filter(c => c.tagName !== "H2").forEach(c => body.appendChild(c.cloneNode(true))); }
    else body.appendChild(n.cloneNode(true));
  });
  card.innerHTML = `<div class="head"><span class="num">${stepIndex + 1}</span><div class="eyebrow">${esc(s.title)}</div></div>`;
  card.appendChild(body);
  const footer = $("footer.sources", page);
  const h1 = $("h1", page);
  page.innerHTML = "";
  if (h1) page.appendChild(h1);
  page.appendChild(card);
  const nav = document.createElement("div");
  nav.innerHTML = `<div class="dots" aria-hidden="true">${steps.map((_, i) => `<i class="${i === stepIndex ? "on" : ""}"></i>`).join("")}</div>
    <div class="stepper" style="margin-top:12px"><button id="prev" type="button" ${stepIndex === 0 ? "disabled" : ""}>Back</button>
    <button id="next" type="button" class="primary" ${stepIndex === steps.length - 1 ? "disabled" : ""}>${stepIndex === steps.length - 1 ? "Last step" : "Next step"}</button></div>`;
  page.appendChild(nav);
  if (footer) page.appendChild(footer);
  $("#prev").onclick = () => { stepIndex--; route(); };
  $("#next").onclick = () => { stepIndex++; route(); };
}

function addBeat(page) {
  const beat = document.createElement("div");
  beat.className = "beat";
  beat.innerHTML = `<div class="pulse" id="pulse"></div><button id="beatBtn" type="button">Start 110 / min beat</button><span class="foot">Push down on each flash</span>`;
  const firstList = $("ol", page) || $("h1", page);
  firstList.after(beat);
  $("#beatBtn").onclick = () => beatTimer ? stopBeat() : startBeat();
}

// ---------- Router ----------
let currentKey = null;
function route() {
  stopBeat();
  const raw = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  const [key, anchor] = raw.split("~");
  if (key !== currentKey) { stepIndex = 0; currentKey = key; }
  const app = $("#app");
  if (!key) { app.innerHTML = home(); bindHome(); window.scrollTo(0, 0); return; }
  app.innerHTML = renderPage(key, anchor);
  const page = $("#page");
  if (!page) return;
  decorate(page);
  const steps = buildSteps(page);
  const hasList = steps.some(s => s.li);
  const stepDefault = key.startsWith("01-emergency/") && !key.endsWith("README");
  const stepMode = !printing && hasList && !anchor && (stepPref === null ? stepDefault : stepPref);
  const au = [...page.querySelectorAll("h2, h3, blockquote")].find(el => /australia/i.test(el.textContent));
  const bar = $("#toolbar");
  if (hasList || au) {
    bar.hidden = false;
    if (au && !au.id) au.id = "australia";
    bar.innerHTML = `${au ? `<a class="au-chip" href="#/${key}~${au.id}">Australian advice on this page ↓</a>` : "<span></span>"}
      ${hasList ? `<div class="toggle" role="group" aria-label="View"><button type="button" data-mode="step" aria-pressed="${stepMode}">One step</button><button type="button" data-mode="all" aria-pressed="${!stepMode}">All steps</button></div>` : ""}`;
    bar.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { stepPref = b.dataset.mode === "step"; store.set("stepMode", stepPref); route(); });
  }
  if (stepMode) showSteps(page, steps, key);
  if (key === "01-emergency/cpr") addBeat(page);
  if (/^0[12]-/.test(key)) keepAwake();
  if (anchor) { const t = document.getElementById(anchor); if (t) { t.scrollIntoView(); return; } }
  window.scrollTo(0, 0);
}

function bindHome() {
  const q = $("#q"), box = $("#results");
  q.addEventListener("input", () => {
    const res = search(q.value);
    box.hidden = !q.value.trim();
    box.innerHTML = res.length ? res.join("") : `<a href="#/">No match for “${esc(q.value)}”<small>Try a plain word, like “blood”, “breathing” or “water”.</small></a>`;
  });
}

// ---------- CPR beat (110 per minute) ----------
let beatTimer = null, audio = null;
function startBeat() {
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); } catch { audio = null; }
  const tick = () => {
    const p = $("#pulse"); if (!p) return stopBeat();
    p.classList.add("on"); setTimeout(() => p.classList.remove("on"), 120);
    if (audio) { const o = audio.createOscillator(), g = audio.createGain(); o.frequency.value = 880; g.gain.value = .08; o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + .05); }
  };
  tick(); beatTimer = setInterval(tick, 60000 / 110);
  const b = $("#beatBtn"); if (b) b.textContent = "Stop beat";
}
function stopBeat() { clearInterval(beatTimer); beatTimer = null; const b = $("#beatBtn"); if (b) b.textContent = "Start 110 / min beat"; }

// Keep the screen on while a first-aid page is open (ignored where not allowed)
let lock = null;
async function keepAwake() { try { if (!lock && navigator.wakeLock) { lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", () => lock = null); } } catch {} }

// ---------- Text size, theme, keys, print ----------
const setScale = v => { scale = Math.max(.85, Math.min(1.6, +v.toFixed(2))); store.set("scale", scale); document.documentElement.style.setProperty("--scale", scale); };
$("#bigger").onclick = () => setScale(scale + .1);
$("#smaller").onclick = () => setScale(scale - .1);
$("#theme").onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark"; store.set("theme", root.dataset.theme);
};
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight" && $("#next") && !$("#next").disabled) $("#next").click();
  if (e.key === "ArrowLeft" && $("#prev") && !$("#prev").disabled) $("#prev").click();
});
window.addEventListener("beforeprint", () => { printing = true; route(); });
window.addEventListener("afterprint", () => { printing = false; route(); });
window.addEventListener("hashchange", route);
route();
</script>
