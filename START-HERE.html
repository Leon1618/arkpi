-emergency/about/index.html<\/li>\n<\/ul>","text":"Making Water Safe to Drink Use bottled water first if you have it. If not, boiling is the best way to kill germs in water. Option 1: Boil it (best) If the water is cloudy , filter it through a clean cloth, paper towel or coffee filter, or let it settle and pour off the clear water. Bring it to a rolling boil for 1 minute. Above 6,500 feet (about 2,000 m) altitude, boil for 3 minutes . Let it cool and store it in clean, sanitized containers with tight covers. Better taste: pour it back and forth between two clean containers and let it stand a few hours, or add a pinch of salt per quart/liter. Option 2: Household bleach Use unscented household chlorine bleach. If the label has directions for disinfecting drinking water, follow those. Otherwise, check that the active ingredient is sodium hypochlorite . Most US bleach is 5–9%. For bleach at 5–9% concentration: Water Drops mL Spoon 1 quart / 1 liter 2 drops 0.1 mL too small to measure 1 gallon (≈3.8 L) 8 drops ½ mL a little less than ⅛ tsp 5 gallons (≈19 L) 40 drops 2½ mL ½ tsp For bleach at 1% concentration: Water Drops mL Spoon 1 quart / 1 liter 10 drops ½ mL ⅛ tsp 1 gallon (≈3.8 L) 40 drops 2½ mL ½ tsp 5 gallons (≈19 L) 200 drops 12½ mL 2½ tsp Double the amount if the water is cloudy, murky, colored or very cold. Stir well. Wait at least 30 minutes before drinking. Store in clean, sanitized containers with tight covers. Warnings Boiling and bleach can't fix everything. Water contaminated with fuel, toxic chemicals or radioactive material cannot be made safe by boiling or disinfecting. Find another source. Never drink radiator or boiler water from a home heating system. Until water is treated, don't use it for drinking, washing dishes, brushing teeth, preparing food, washing hands, making ice or baby formula. Iodine and chlorine tablets do not kill Cryptosporidium . Boiling and bleach work better against Cryptosporidium and Giardia . Avoid iodine-treated water if you are pregnant, have thyroid problems or are sensitive to iodine. No one should drink it for more than a few weeks at a time. Portable filters do not remove viruses. Disinfect filtered water too. Sources (checked 2026-11-01) CDC, Water in an Emergency: https://www.cdc.gov/water-emergency/about/index.html"},"03-water/storing-water":{"title":"Storing an Emergency Water Supply","folder":"03-water","html":"<h1 id=\"storing-an-emergency-water-supply\">Storing an Emergency Water Supply<\/h1>\n<p>Do this <strong>now<\/strong>, while tap water is safe.<\/p>\n<h2 id=\"how-much\">How much<\/h2>\n<ul>\n<li><strong>At least 1 gallon (≈3.8 L) per person, per day, for 3 days.<\/strong><\/li>\n<li><strong>2 weeks' worth if you can.<\/strong><\/li>\n<li>Store more for pregnant women, people who are sick, pets, and hot climates.<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>People<\/th>\n<th>3 days<\/th>\n<th>2 weeks<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>3 gal (≈11 L)<\/td>\n<td>14 gal (≈53 L)<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>6 gal (≈23 L)<\/td>\n<td>28 gal (≈106 L)<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>12 gal (≈45 L)<\/td>\n<td>56 gal (≈212 L)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"easiest-buy-bottled-water\">Easiest: buy bottled water<\/h2>\n<p><strong>Unopened store-bought bottled water is the safest choice.<\/strong> Check the\nexpiration date.<\/p>\n<h2 id=\"storing-your-own\">Storing your own<\/h2>\n<p><strong>1. Pick containers<\/strong><\/p>\n<ul>\n<li>Best: <strong>food-grade<\/strong> water containers.<\/li>\n<li>Otherwise: a <strong>tight-closing lid<\/strong>, <strong>unbreakable material (not glass)<\/strong>, and\n    a narrow opening if possible.<\/li>\n<li><strong>Never<\/strong> use containers that held chemicals (bleach, pesticides, etc.).<\/li>\n<\/ul>\n<p><strong>2. Clean and sanitize them<\/strong><\/p>\n<ol>\n<li>Wash with soap and rinse well with water.<\/li>\n<li>Mix <strong>1 teaspoon of unscented household bleach in 1 quart (4 cups / ≈1 L)\n    of water.<\/strong> Pour it in the container.<\/li>\n<li>Close the lid and <strong>shake<\/strong> so it touches every inside surface.<\/li>\n<li>Wait <strong>at least 30 seconds<\/strong>, then pour it out.<\/li>\n<li>Let the container air-dry.<\/li>\n<\/ol>\n<p><strong>3. Fill and label<\/strong><\/p>\n<ol>\n<li>Fill with clean tap water and close tightly.<\/li>\n<li>Label it <strong>\"Drinking water\"<\/strong> with <strong>today's date<\/strong>.<\/li>\n<\/ol>\n<p><strong>4. Store it<\/strong><\/p>\n<ul>\n<li><strong>Cool place: 50–70 °F (10–21 °C).<\/strong><\/li>\n<li><strong>Out of direct sunlight.<\/strong><\/li>\n<li><strong>Away from gasoline, pesticides and other chemicals.<\/strong><\/li>\n<li><strong>Replace it every 6 months.<\/strong><\/li>\n<\/ul>\n<h2 id=\"using-stored-water\">Using stored water<\/h2>\n<ul>\n<li>Pour it out, or use a <strong>clean<\/strong> scoop each time.<\/li>\n<li><strong>Don't put your hands<\/strong> in the water or touch the inside of the container.<\/li>\n<\/ul>\n<h2 id=\"also-keep\">Also keep<\/h2>\n<ul>\n<li>A bottle of <strong>unscented household bleach (5–9% sodium hypochlorite)<\/strong> to\n    disinfect water if you need to (see <a href=\"#/03-water/making-water-safe\">making-water-safe.md<\/a>).<\/li>\n<\/ul>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>CDC, How to Create and Store an Emergency Water Supply:\n    https://www.cdc.gov/water-emergency/about/how-to-create-and-store-an-emergency-water-supply.html<\/li>\n<\/ul>","text":"Storing an Emergency Water Supply Do this now , while tap water is safe. How much At least 1 gallon (≈3.8 L) per person, per day, for 3 days. 2 weeks' worth if you can. Store more for pregnant women, people who are sick, pets, and hot climates. People 3 days 2 weeks 1 3 gal (≈11 L) 14 gal (≈53 L) 2 6 gal (≈23 L) 28 gal (≈106 L) 4 12 gal (≈45 L) 56 gal (≈212 L) Easiest: buy bottled water Unopened store-bought bottled water is the safest choice. Check the expiration date. Storing your own 1. Pick containers Best: food-grade water containers. Otherwise: a tight-closing lid , unbreakable material (not glass) , and a narrow opening if possible. Never use containers that held chemicals (bleach, pesticides, etc.). 2. Clean and sanitize them Wash with soap and rinse well with water. Mix 1 teaspoon of unscented household bleach in 1 quart (4 cups / ≈1 L) of water. Pour it in the container. Close the lid and shake so it touches every inside surface. Wait at least 30 seconds , then pour it out. Let the container air-dry. 3. Fill and label Fill with clean tap water and close tightly. Label it \"Drinking water\" with today's date . 4. Store it Cool place: 50–70 °F (10–21 °C). Out of direct sunlight. Away from gasoline, pesticides and other chemicals. Replace it every 6 months. Using stored water Pour it out, or use a clean scoop each time. Don't put your hands in the water or touch the inside of the container. Also keep A bottle of unscented household bleach (5–9% sodium hypochlorite) to disinfect water if you need to (see making-water-safe.md ). Sources (checked 2026-11-01) CDC, How to Create and Store an Emergency Water Supply: https://www.cdc.gov/water-emergency/about/how-to-create-and-store-an-emergency-water-supply.html"},"04-food/README":{"title":"04 · Food","folder":"04-food","html":"<h1 id=\"04-food\">04 · Food<\/h1>\n<p>Keeping food safe and making it last.<\/p>\n<h2 id=\"pages\">Pages<\/h2>\n<ul>\n<li><a href=\"#/04-food/food-safety-in-an-emergency\">Food Safety in an Emergency<\/a>: power cuts, the 2-hour/4-hour rule, floodwater, what to stock<\/li>\n<\/ul>\n<h2 id=\"to-add\">To add<\/h2>\n<ul>\n<li>Preserving food (drying, salting, canning), from an official food-safety source<\/li>\n<li>Foraging: left out on purpose. Don't eat wild plants unless someone who\n    knows them has identified them.<\/li>\n<\/ul>","text":"04 · Food Keeping food safe and making it last. Pages Food Safety in an Emergency : power cuts, the 2-hour/4-hour rule, floodwater, what to stock To add Preserving food (drying, salting, canning), from an official food-safety source Foraging: left out on purpose. Don't eat wild plants unless someone who knows them has identified them."},"04-food/food-safety-in-an-emergency":{"title":"Food Safety in an Emergency","folder":"04-food","html":"<h1 id=\"food-safety-in-an-emergency\">Food Safety in an Emergency<\/h1>\n<h2 id=\"power-cut\">Power cut<\/h2>\n<ul>\n<li><strong>Keep the fridge and freezer doors closed<\/strong> as much as you can.<\/li>\n<li>A <strong>fridge<\/strong> keeps food cold for about <strong>4 hours<\/strong>.<\/li>\n<li>A <strong>freezer<\/strong> usually won't defrost for at least <strong>24 hours if half full, or\n    48 hours if full<\/strong>.<\/li>\n<li><strong>Never refreeze food that has thawed.<\/strong> Eat it as soon as possible, or throw\n    it out.<\/li>\n<\/ul>\n<h2 id=\"the-2-hour-4-hour-rule\">The 2-hour / 4-hour rule<\/h2>\n<p>For food that should be kept in the fridge (meat, dairy, cooked food), count the\n<strong>total time<\/strong> it has been warm (between 5 °C and 60 °C):<\/p>\n<table>\n<thead>\n<tr>\n<th>Total time warm<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Under 2 hours<\/strong><\/td>\n<td>Put it back in the fridge, or use it<\/td>\n<\/tr>\n<tr>\n<td><strong>2 to 4 hours<\/strong><\/td>\n<td>Use it now. Don't put it back in the fridge<\/td>\n<\/tr>\n<tr>\n<td><strong>Over 4 hours<\/strong><\/td>\n<td><strong>Throw it out<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"throw-it-out-if\">Throw it out if<\/h2>\n<ul>\n<li>It touched <strong>floodwater<\/strong><\/li>\n<li>It has an <strong>unusual smell, colour or texture<\/strong><\/li>\n<li><strong>Don't taste it<\/strong> to check. <strong>If in doubt, throw it out.<\/strong><\/li>\n<\/ul>\n<h2 id=\"keep-a-supply\">Keep a supply<\/h2>\n<p>Keep <strong>at least 3 days<\/strong> of food and water for everyone at home, and more if you\ncould be cut off for longer:<\/p>\n<ul>\n<li>☐ Long-life food: canned goods, long-life milk<\/li>\n<li>☐ A manual can opener<\/li>\n<li>☐ Bottled or stored drinking water (see <a href=\"#/03-water/storing-water\">../03-water/storing-water.md<\/a>)<\/li>\n<li>☐ Food for babies and pets<\/li>\n<li>☐ An esky with ice bricks or gel packs<\/li>\n<li>☐ Detergent, bleach and alcohol-based hand sanitiser<\/li>\n<\/ul>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>Food Standards Australia New Zealand, Food safety in an emergency:\n    https://www.foodstandards.gov.au/consumer/safety/safetyduringemergency/food-safety-in-an-emergency<\/li>\n<li>Food Standards Australia New Zealand, 2-hour / 4-hour rule:\n    https://www.foodstandards.gov.au/business/food-safety/2-hour-4-hour-rule<\/li>\n<li>Queensland Health, Food safety after a disaster (freezer times):\n    https://www.health.qld.gov.au/public-health/disaster/public-health-advice/food-safety<\/li>\n<li>Get Ready Queensland, Make a plan (3 days of supplies): https://www.getready.qld.gov.au/plan<\/li>\n<\/ul>","text":"Food Safety in an Emergency Power cut Keep the fridge and freezer doors closed as much as you can. A fridge keeps food cold for about 4 hours . A freezer usually won't defrost for at least 24 hours if half full, or 48 hours if full . Never refreeze food that has thawed. Eat it as soon as possible, or throw it out. The 2-hour / 4-hour rule For food that should be kept in the fridge (meat, dairy, cooked food), count the total time it has been warm (between 5 °C and 60 °C): Total time warm What to do Under 2 hours Put it back in the fridge, or use it 2 to 4 hours Use it now. Don't put it back in the fridge Over 4 hours Throw it out Throw it out if It touched floodwater It has an unusual smell, colour or texture Don't taste it to check. If in doubt, throw it out. Keep a supply Keep at least 3 days of food and water for everyone at home, and more if you could be cut off for longer: ☐ Long-life food: canned goods, long-life milk ☐ A manual can opener ☐ Bottled or stored drinking water (see ../03-water/storing-water.md ) ☐ Food for babies and pets ☐ An esky with ice bricks or gel packs ☐ Detergent, bleach and alcohol-based hand sanitiser Sources (checked 2026-11-01) Food Standards Australia New Zealand, Food safety in an emergency: https://www.foodstandards.gov.au/consumer/safety/safetyduringemergency/food-safety-in-an-emergency Food Standards Australia New Zealand, 2-hour / 4-hour rule: https://www.foodstandards.gov.au/business/food-safety/2-hour-4-hour-rule Queensland Health, Food safety after a disaster (freezer times): https://www.health.qld.gov.au/public-health/disaster/public-health-advice/food-safety Get Ready Queensland, Make a plan (3 days of supplies): https://www.getready.qld.gov.au/plan"},"05-shelter-and-warmth/README":{"title":"05 · Shelter and Warmth","folder":"05-shelter-and-warmth","html":"<h1 id=\"05-shelter-and-warmth\">05 · Shelter and Warmth<\/h1>\n<p>Staying protected, at home or away.<\/p>\n<h2 id=\"pages\">Pages<\/h2>\n<ul>\n<li><a href=\"#/05-shelter-and-warmth/shelter-in-place\">Sheltering in Place<\/a>: staying inside, sealing a room<\/li>\n<li><a href=\"#/05-shelter-and-warmth/improvised-shelter\">Improvised Shelter<\/a>: tarp lean-to, A-frame, raised platform<\/li>\n<li><a href=\"#/05-shelter-and-warmth/knots\">Five Useful Knots<\/a><\/li>\n<li>Keeping warm: see <a href=\"#/02-first-aid/hypothermia\">Hypothermia<\/a>; carbon monoxide danger: see <a href=\"#/01-emergency/carbon-monoxide\">Carbon Monoxide<\/a><\/li>\n<\/ul>","text":"05 · Shelter and Warmth Staying protected, at home or away. Pages Sheltering in Place : staying inside, sealing a room Improvised Shelter : tarp lean-to, A-frame, raised platform Five Useful Knots Keeping warm: see Hypothermia ; carbon monoxide danger: see Carbon Monoxide"},"05-shelter-and-warmth/images/CREDITS":{"title":"Image Credits: 05-shelter-and-warmth","folder":"05-shelter-and-warmth","html":"<h1 id=\"image-credits-05-shelter-and-warmth\">Image Credits: 05-shelter-and-warmth<\/h1>\n<table>\n<thead>\n<tr>\n<th>Image<\/th>\n<th>Source<\/th>\n<th>License<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>tarp-lean-to.png<\/code>, <code>a-frame-shelter.png<\/code>, <code>raised-platform-shelter.png<\/code><\/td>\n<td>US Army, <em>ATP 3-50.21 Survival<\/em> (2018), figures 6-2, 6-6 and 6-9, converted to greyscale<\/td>\n<td>Public domain (US Government work, approved for public release)<\/td>\n<\/tr>\n<tr>\n<td><code>knot-round-turn-two-half-hitches.png<\/code>, <code>knot-figure-eight.png<\/code>, <code>knot-square.png<\/code>, <code>knot-bowline.png<\/code>, <code>knot-clove-hitch.png<\/code><\/td>\n<td>US Army, <em>ATP 3-50.21 Survival<\/em> (2018), figures A-3, A-4, A-5, A-8 and A-15<\/td>\n<td>Public domain (US Government work, approved for public release)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>","text":"Image Credits: 05-shelter-and-warmth Image Source License tarp-lean-to.png , a-frame-shelter.png , raised-platform-shelter.png US Army, ATP 3-50.21 Survival (2018), figures 6-2, 6-6 and 6-9, converted to greyscale Public domain (US Government work, approved for public release) knot-round-turn-two-half-hitches.png , knot-figure-eight.png , knot-square.png , knot-bowline.png , knot-clove-hitch.png US Army, ATP 3-50.21 Survival (2018), figures A-3, A-4, A-5, A-8 and A-15 Public domain (US Government work, approved for public release)"},"05-shelter-and-warmth/improvised-shelter":{"title":"Improvised Shelter","folder":"05-shelter-and-warmth","html":"<h1 id=\"improvised-shelter\">Improvised Shelter<\/h1>\n<p>If your home isn't safe and you can't reach an evacuation centre, use what's\nalready there first: <strong>a vehicle, a wall or another building<\/strong>, a rock overhang,\nor a fallen tree with thick branches. Building from scratch takes much more time\nand energy.<\/p>\n<h2 id=\"choosing-a-spot\">Choosing a spot<\/h2>\n<ul>\n<li><strong>Flat and big enough<\/strong> to lie down, with room for your gear<\/li>\n<li><strong>Away from flood areas, high-water marks and flash-flood channels<\/strong>, and from\n    slopes that could slide<\/li>\n<li><strong>No dead trees or branches<\/strong> that could fall on you<\/li>\n<li>Out of the wind and sun<\/li>\n<li>Brush away rocks and twigs, and <strong>check for snakes, ticks and ants<\/strong><\/li>\n<li>Easy to be seen by rescuers<\/li>\n<\/ul>\n<h2 id=\"tarp-lean-to-fastest\">Tarp lean-to (fastest)<\/h2>\n<p>You need a tarp (or poncho or plastic sheet), about <strong>2–3 m of rope<\/strong>, three\nshort stakes, and two trees or poles about <strong>2–3 m apart<\/strong>.<\/p>\n<ol>\n<li>Check the wind. <strong>The back of the lean-to faces into the wind.<\/strong><\/li>\n<li>Tie a rope to each corner along one long edge of the tarp.<\/li>\n<li>Tie the ropes about <strong>waist-high<\/strong> to the two trees, tight (round turn and two\n    half hitches, see <a href=\"#/05-shelter-and-warmth/knots\">knots.md<\/a>).<\/li>\n<li>Stretch the tarp out and <strong>stake the other edge to the ground<\/strong>.<\/li>\n<li>Rain expected? Add a centre support: a line from the middle of the tarp up to\n    an overhanging branch, so water doesn't pool.<\/li>\n<li>Block the open sides with brush or gear, and put <strong>leaves or grass on the\n    floor<\/strong>: lying on bare ground draws heat out of your body.<\/li>\n<\/ol>\n<p><img alt=\"A tarp tied between two trees on one side and staked to the ground on the other, back to the wind\" loading=\"lazy\" src=\"05-shelter-and-warmth/images/tarp-lean-to.png\" /><\/p>\n<p><em>Tip: a short stick tied to each rope near the tarp stops rain running down the\nrope into the shelter.<\/em><\/p>\n<h2 id=\"a-frame\">A-frame<\/h2>\n<p>A ridge pole resting on two crossed poles, covered with a tarp or with layers of\nleaves and bark laid <strong>from the bottom up<\/strong>, like roof tiles. Keep the sides\nsteep (<strong>40–60°<\/strong>) so rain runs off. Stretch the cover tight: water pools in\nwrinkles and leaks through.<\/p>\n<p><img alt=\"Four steps: build the frame, cover it, cover it again with branches, close the doorway\" loading=\"lazy\" src=\"05-shelter-and-warmth/images/a-frame-shelter.png\" /><\/p>\n<h2 id=\"raised-platform-wet-or-swampy-ground\">Raised platform (wet or swampy ground)<\/h2>\n<p>Lash two strong poles between four trees, lay cross-pieces every <strong>15–30 cm<\/strong> to\nmake a bed, and build an A-frame roof above it. Keeps you off wet ground. Cover\nit with a net or fabric against insects.<\/p>\n<p><img alt=\"A raised sleeping platform between trees, with a roof\" loading=\"lazy\" src=\"05-shelter-and-warmth/images/raised-platform-shelter.png\" /><\/p>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>US Army, <em>ATP 3-50.21 Survival<\/em> (2018), chapter 6 \"Shelter and Clothing\"\n    (approved for public release): https://armypubs.army.mil/ProductMaps/PubForm/Details.aspx?PUB_ID=1005316<\/li>\n<li>Drawings: see <a href=\"#/05-shelter-and-warmth/images/CREDITS\">images/CREDITS.md<\/a><\/li>\n<\/ul>","text":"Improvised Shelter If your home isn't safe and you can't reach an evacuation centre, use what's already there first: a vehicle, a wall or another building , a rock overhang, or a fallen tree with thick branches. Building from scratch takes much more time and energy. Choosing a spot Flat and big enough to lie down, with room for your gear Away from flood areas, high-water marks and flash-flood channels , and from slopes that could slide No dead trees or branches that could fall on you Out of the wind and sun Brush away rocks and twigs, and check for snakes, ticks and ants Easy to be seen by rescuers Tarp lean-to (fastest) You need a tarp (or poncho or plastic sheet), about 2–3 m of rope , three short stakes, and two trees or poles about 2–3 m apart . Check the wind. The back of the lean-to faces into the wind. Tie a rope to each corner along one long edge of the tarp. Tie the ropes about waist-high to the two trees, tight (round turn and two half hitches, see knots.md ). Stretch the tarp out and stake the other edge to the ground . Rain expected? Add a centre support: a line from the middle of the tarp up to an overhanging branch, so water doesn't pool. Block the open sides with brush or gear, and put leaves or grass on the floor : lying on bare ground draws heat out of your body. Tip: a short stick tied to each rope near the tarp stops rain running down the rope into the shelter. A-frame A ridge pole resting on two crossed poles, covered with a tarp or with layers of leaves and bark laid from the bottom up , like roof tiles. Keep the sides steep ( 40–60° ) so rain runs off. Stretch the cover tight: water pools in wrinkles and leaks through. Raised platform (wet or swampy ground) Lash two strong poles between four trees, lay cross-pieces every 15–30 cm to make a bed, and build an A-frame roof above it. Keeps you off wet ground. Cover it with a net or fabric against insects. Sources (checked 2026-11-01) US Army, ATP 3-50.21 Survival (2018), chapter 6 \"Shelter and Clothing\" (approved for public release): https://armypubs.army.mil/ProductMaps/PubForm/Details.aspx?PUB_ID=1005316 Drawings: see images/CREDITS.md"},"05-shelter-and-warmth/knots":{"title":"Five Useful Knots","folder":"05-shelter-and-warmth","html":"<h1 id=\"five-useful-knots\">Five Useful Knots<\/h1>\n<p>Practise these now, with a piece of rope, until you can tie them without looking.<\/p>\n<h2 id=\"round-turn-and-two-half-hitches-tie-a-rope-to-a-tree-or-pole\">Round turn and two half hitches: tie a rope to a tree or pole<\/h2>\n<p>The main knot for anchoring a rope to a tree or pole. It holds under a heavy\nload and still unties easily. Use it to hang a tarp.<\/p>\n<p><img alt=\"Rope wrapped twice around a post, then two half hitches around its own standing part\" loading=\"lazy\" src=\"05-shelter-and-warmth/images/knot-round-turn-two-half-hitches.png\" /><\/p>\n<h2 id=\"bowline-a-loop-that-wont-slip\">Bowline: a loop that won't slip<\/h2>\n<p>Makes a fixed loop at the end of a rope that's easy to untie.<\/p>\n<ol>\n<li>Make a small loop in the standing part of the rope.<\/li>\n<li>Bring the end <strong>up through the loop from underneath<\/strong>,<\/li>\n<li><strong>around behind<\/strong> the standing part,<\/li>\n<li>and <strong>back down through the loop<\/strong>. Pull tight.<\/li>\n<\/ol>\n<p><img alt=\"Three steps of tying a bowline\" loading=\"lazy\" src=\"05-shelter-and-warmth/images/knot-bowline.png\" /><\/p>\n<h2 id=\"square-knot-reef-knot-join-two-ropes\">Square knot (reef knot): join two ropes<\/h2>\n<p>For joining two ropes of the <strong>same thickness<\/strong>.<\/p>\n<ol>\n<li>Cross the two ends and tuck one under the other.<\/li>\n<li>Cross them again <strong>the opposite way<\/strong> and tuck again.<\/li>\n<li>Each end should lie <strong>alongside its own rope<\/strong>. If not, it's a \"granny knot\",\n    which slips. Retie it.<\/li>\n<\/ol>\n<p><img alt=\"Three steps of tying a square knot\" loading=\"lazy\" src=\"05-shelter-and-warmth/images/knot-square.png\" /><\/p>\n<h2 id=\"clove-hitch-fasten-a-rope-to-a-post\">Clove hitch: fasten a rope to a post<\/h2>\n<p>Quick to tie around a pole, pipe or post, and can be tied anywhere along a rope.\nTwo turns around the post, with the end tucked <strong>under itself<\/strong> on the second\nturn.<\/p>\n<p><img alt=\"Clove hitch tied in the middle of a rope and at the end of a rope\" loading=\"lazy\" src=\"05-shelter-and-warmth/images/knot-clove-hitch.png\" /><\/p>\n<h2 id=\"figure-eight-stop-a-rope-slipping-through\">Figure-eight: stop a rope slipping through<\/h2>\n<p>A bulky knot at the end of a rope that stops it pulling through a hole or loop.\nMake a loop, pass the end around the standing part, then down through the loop.<\/p>\n<p><img alt=\"Two steps of tying a figure-eight knot\" loading=\"lazy\" src=\"05-shelter-and-warmth/images/knot-figure-eight.png\" /><\/p>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>US Army, <em>ATP 3-50.21 Survival<\/em> (2018), appendix A \"Survival Knots and Rope\"\n    (approved for public release): https://armypubs.army.mil/ProductMaps/PubForm/Details.aspx?PUB_ID=1005316<\/li>\n<li>Drawings: see <a href=\"#/05-shelter-and-warmth/images/CREDITS\">images/CREDITS.md<\/a><\/li>\n<\/ul>","text":"Five Useful Knots Practise these now, with a piece of rope, until you can tie them without looking. Round turn and two half hitches: tie a rope to a tree or pole The main knot for anchoring a rope to a tree or pole. It holds under a heavy load and still unties easily. Use it to hang a tarp. Bowline: a loop that won't slip Makes a fixed loop at the end of a rope that's easy to untie. Make a small loop in the standing part of the rope. Bring the end up through the loop from underneath , around behind the standing part, and back down through the loop . Pull tight. Square knot (reef knot): join two ropes For joining two ropes of the same thickness . Cross the two ends and tuck one under the other. Cross them again the opposite way and tuck again. Each end should lie alongside its own rope . If not, it's a \"granny knot\", which slips. Retie it. Clove hitch: fasten a rope to a post Quick to tie around a pole, pipe or post, and can be tied anywhere along a rope. Two turns around the post, with the end tucked under itself on the second turn. Figure-eight: stop a rope slipping through A bulky knot at the end of a rope that stops it pulling through a hole or loop. Make a loop, pass the end around the standing part, then down through the loop. Sources (checked 2026-11-01) US Army, ATP 3-50.21 Survival (2018), appendix A \"Survival Knots and Rope\" (approved for public release): https://armypubs.army.mil/ProductMaps/PubForm/Details.aspx?PUB_ID=1005316 Drawings: see images/CREDITS.md"},"05-shelter-and-warmth/shelter-in-place":{"title":"Sheltering in Place","folder":"05-shelter-and-warmth","html":"<h1 id=\"sheltering-in-place\">Sheltering in Place<\/h1>\n<p>Stay inside when going out is more dangerous: for example, when there's a lot of\n<strong>debris in the air<\/strong>, or authorities say the <strong>air is badly contaminated<\/strong>\n(smoke, chemicals). Listen to the radio for official advice:\n<strong>ABC Sunshine Coast 90.3 / 95.3 FM<\/strong>.<\/p>\n<h2 id=\"right-away\">Right away<\/h2>\n<ol>\n<li><strong>Bring everyone and the pets inside.<\/strong><\/li>\n<li><strong>Lock doors. Close windows, air vents and any fireplace damper.<\/strong><\/li>\n<li><strong>Turn off fans, air-conditioning and heating<\/strong> that draw in outside air.<\/li>\n<li>Take your <strong>emergency kit<\/strong>, unless you think it's contaminated.<\/li>\n<li>Go to an <strong>inside room with few or no windows<\/strong>.<\/li>\n<\/ol>\n<h2 id=\"sealing-a-room-chemicals-or-bad-air\">Sealing a room (chemicals or bad air)<\/h2>\n<p>A temporary barrier against outside air. Prepare the materials <strong>before<\/strong> you\nneed them: keep <strong>thick plastic sheeting and duct tape<\/strong> in your emergency kit.<\/p>\n<ol>\n<li>Cut plastic sheets <strong>several centimetres wider<\/strong> than each window, door and\n    vent, and label them.<\/li>\n<li><strong>Tape the corners first, then all the edges.<\/strong><\/li>\n<li>Fill any other gaps with whatever you have.<\/li>\n<\/ol>\n<h2 id=\"going-to-a-public-shelter\">Going to a public shelter<\/h2>\n<p>Evacuation centres may have food, water and basic toilets, but <strong>bring your own\nemergency kit<\/strong>. Most public shelters don't take pets, so plan somewhere for\nthem in advance.<\/p>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>Ready.gov, Shelter: https://www.ready.gov/shelter<\/li>\n<\/ul>","text":"Sheltering in Place Stay inside when going out is more dangerous: for example, when there's a lot of debris in the air , or authorities say the air is badly contaminated (smoke, chemicals). Listen to the radio for official advice: ABC Sunshine Coast 90.3 / 95.3 FM . Right away Bring everyone and the pets inside. Lock doors. Close windows, air vents and any fireplace damper. Turn off fans, air-conditioning and heating that draw in outside air. Take your emergency kit , unless you think it's contaminated. Go to an inside room with few or no windows . Sealing a room (chemicals or bad air) A temporary barrier against outside air. Prepare the materials before you need them: keep thick plastic sheeting and duct tape in your emergency kit. Cut plastic sheets several centimetres wider than each window, door and vent, and label them. Tape the corners first, then all the edges. Fill any other gaps with whatever you have. Going to a public shelter Evacuation centres may have food, water and basic toilets, but bring your own emergency kit . Most public shelters don't take pets, so plan somewhere for them in advance. Sources (checked 2026-11-01) Ready.gov, Shelter: https://www.ready.gov/shelter"},"06-fire-and-light/README":{"title":"06 · Fire and Light","folder":"06-fire-and-light","html":"<h1 id=\"06-fire-and-light\">06 · Fire and Light<\/h1>\n<p>Lighting fires safely, and light when the power is out.<\/p>\n<h2 id=\"pages\">Pages<\/h2>\n<ul>\n<li><a href=\"#/06-fire-and-light/lighting-a-fire\">Lighting a Fire<\/a>: site, tinder and kindling, fire lays, no-match methods<\/li>\n<li><a href=\"#/06-fire-and-light/safe-lighting\">Safe Lighting in a Power Cut<\/a>: torches, not candles<\/li>\n<\/ul>","text":"06 · Fire and Light Lighting fires safely, and light when the power is out. Pages Lighting a Fire : site, tinder and kindling, fire lays, no-match methods Safe Lighting in a Power Cut : torches, not candles"},"06-fire-and-light/images/CREDITS":{"title":"Image Credits: 06-fire-and-light","folder":"06-fire-and-light","html":"<h1 id=\"image-credits-06-fire-and-light\">Image Credits: 06-fire-and-light<\/h1>\n<table>\n<thead>\n<tr>\n<th>Image<\/th>\n<th>Source<\/th>\n<th>License<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>fire-triangle.png<\/code>, <code>fire-base-and-brace.png<\/code>, <code>fire-lays.png<\/code>, <code>fire-from-battery.png<\/code>, <code>fire-from-lens.png<\/code><\/td>\n<td>US Army, <em>ATP 3-50.21 Survival<\/em> (2018), figures 5-1, 5-3, 5-5, 5-6 and 5-7, converted to greyscale<\/td>\n<td>Public domain (US Government work, approved for public release)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>","text":"Image Credits: 06-fire-and-light Image Source License fire-triangle.png , fire-base-and-brace.png , fire-lays.png , fire-from-battery.png , fire-from-lens.png US Army, ATP 3-50.21 Survival (2018), figures 5-1, 5-3, 5-5, 5-6 and 5-7, converted to greyscale Public domain (US Government work, approved for public release)"},"06-fire-and-light/lighting-a-fire":{"title":"Lighting a Fire","folder":"06-fire-and-light","html":"<h1 id=\"lighting-a-fire\">Lighting a Fire<\/h1>\n<blockquote>\n<p><strong>Check the day's Fire Danger Rating and any fire bans first<\/strong> (see\n<a href=\"#/12-noosa-tewantin/warnings\">../12-noosa-tewantin/warnings.md<\/a>).\nIf you light a fire, you're responsible for keeping it under control.<\/p>\n<\/blockquote>\n<h2 id=\"how-fire-works\">How fire works<\/h2>\n<p>A fire needs <strong>heat, fuel and oxygen<\/strong>. Take any one away and it goes out. If a\nfire is struggling, rearrange the wood to change the mix of air and fuel.<\/p>\n<p><img alt=\"Triangle with Oxygen, Heat and Fuel on its sides\" loading=\"lazy\" src=\"06-fire-and-light/images/fire-triangle.png\" /><\/p>\n<h2 id=\"choose-and-clear-the-spot\">Choose and clear the spot<\/h2>\n<ul>\n<li><strong>Flat, dry and out of the wind<\/strong>, near your shelter and a supply of wood.<\/li>\n<li><strong>Clear at least 1 metre<\/strong> of leaves and grass down to bare soil, so the fire\n    can't creep along the ground.<\/li>\n<li><strong>Don't use porous rocks<\/strong> around the fire. Water inside them can make them\n    explode.<\/li>\n<\/ul>\n<h2 id=\"gather-three-sizes-of-fuel-first\">Gather three sizes of fuel first<\/h2>\n<ol>\n<li><strong>Tinder<\/strong> (catches a spark): dry grass, fine wood shavings, paper, cotton\n    wool, lint. At least a cupped handful.<\/li>\n<li><strong>Kindling<\/strong> (catches from the tinder): dry twigs from <strong>pencil-lead to thumb\n    thickness<\/strong>. A bundle as thick as a drink can of each size.<\/li>\n<li><strong>Fuel<\/strong> (keeps it going): dead, dry wood <strong>at least as thick as your\n    forearm<\/strong>. Standing dead wood is drier than wood lying on the ground. Rotten\n    wood smoulders and smokes.<\/li>\n<\/ol>\n<p>Skip a stage and the fire usually dies.<\/p>\n<h2 id=\"build-it\">Build it<\/h2>\n<p>Lay the tinder on something dry (a flat piece of wood or bark) against a stick\nused as a <strong>brace<\/strong>. Light the tinder at the bottom, away from the brace, then\nlay handfuls of kindling <strong>across the brace<\/strong>, leaving gaps for air. Add bigger\nwood as it catches.<\/p>\n<p><img alt=\"Tinder against a brace stick, kindling laid across, logs added\" loading=\"lazy\" src=\"06-fire-and-light/images/fire-base-and-brace.png\" /><\/p>\n<h2 id=\"fire-lays\">Fire lays<\/h2>\n<p><img alt=\"Four fire lays: tepee, lean-to, cross-ditch and pyramid\" loading=\"lazy\" src=\"06-fire-and-light/images/fire-lays.png\" /><\/p>\n<ul>\n<li><strong>Tepee:<\/strong> sticks leaned together in a cone over the tinder. Burns well even\n    with damp wood.<\/li>\n<li><strong>Lean-to:<\/strong> a green stick pushed into the ground at 30°, pointing into the\n    wind, with tinder underneath and kindling leaning on it.<\/li>\n<li><strong>Cross-ditch:<\/strong> dig an X about 30 cm across and 8 cm deep. Air flows in under\n    the tinder.<\/li>\n<li><strong>Pyramid:<\/strong> layers of logs, each smaller and crossways to the one below, with\n    a small fire on top. It burns downwards and lasts all night with no tending.<\/li>\n<\/ul>\n<h2 id=\"no-matches\">No matches?<\/h2>\n<p><strong>Car battery:<\/strong> connect a wire to each terminal and touch their ends to a third,\nbare wire (or stretch fine steel wool between the terminals) to make sparks or a\nglowing coal for the tinder. <strong>Keep flames away from the battery<\/strong>: some\nbatteries give off explosive hydrogen gas.<\/p>\n<p><img alt=\"Wires from a car battery's terminals making sparks over tinder\" loading=\"lazy\" src=\"06-fire-and-light/images/fire-from-battery.png\" /><\/p>\n<p><strong>Magnifying glass or lens (sunny days only):<\/strong> focus the sun on the tinder and\nhold it there until it smoulders, then blow gently.<\/p>\n<p><img alt=\"A lens focusing sunlight onto tinder\" loading=\"lazy\" src=\"06-fire-and-light/images/fire-from-lens.png\" /><\/p>\n<h2 id=\"dont\">Don't<\/h2>\n<ul>\n<li><strong>Never pour petrol or other flammable liquid on a fire<\/strong>, even one that looks\n    out. It can explode.<\/li>\n<li>Don't burn tyres. The smoke is harmful to breathe.<\/li>\n<li>Don't cook food directly over a fire started with petrol or diesel.<\/li>\n<\/ul>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>US Army, <em>ATP 3-50.21 Survival<\/em> (2018), chapter 5 \"Fire\" (approved for public\n    release): https://armypubs.army.mil/ProductMaps/PubForm/Details.aspx?PUB_ID=1005316<\/li>\n<li>Drawings: see <a href=\"#/06-fire-and-light/images/CREDITS\">images/CREDITS.md<\/a><\/li>\n<\/ul>","text":"Lighting a Fire Check the day's Fire Danger Rating and any fire bans first (see ../12-noosa-tewantin/warnings.md ). If you light a fire, you're responsible for keeping it under control. How fire works A fire needs heat, fuel and oxygen . Take any one away and it goes out. If a fire is struggling, rearrange the wood to change the mix of air and fuel. Choose and clear the spot Flat, dry and out of the wind , near your shelter and a supply of wood. Clear at least 1 metre of leaves and grass down to bare soil, so the fire can't creep along the ground. Don't use porous rocks around the fire. Water inside them can make them explode. Gather three sizes of fuel first Tinder (catches a spark): dry grass, fine wood shavings, paper, cotton wool, lint. At least a cupped handful. Kindling (catches from the tinder): dry twigs from pencil-lead to thumb thickness . A bundle as thick as a drink can of each size. Fuel (keeps it going): dead, dry wood at least as thick as your forearm . Standing dead wood is drier than wood lying on the ground. Rotten wood smoulders and smokes. Skip a stage and the fire usually dies. Build it Lay the tinder on something dry (a flat piece of wood or bark) against a stick used as a brace . Light the tinder at the bottom, away from the brace, then lay handfuls of kindling across the brace , leaving gaps for air. Add bigger wood as it catches. Fire lays Tepee: sticks leaned together in a cone over the tinder. Burns well even with damp wood. Lean-to: a green stick pushed into the ground at 30°, pointing into the wind, with tinder underneath and kindling leaning on it. Cross-ditch: dig an X about 30 cm across and 8 cm deep. Air flows in under the tinder. Pyramid: layers of logs, each smaller and crossways to the one below, with a small fire on top. It burns downwards and lasts all night with no tending. No matches? Car battery: connect a wire to each terminal and touch their ends to a third, bare wire (or stretch fine steel wool between the terminals) to make sparks or a glowing coal for the tinder. Keep flames away from the battery : some batteries give off explosive hydrogen gas. Magnifying glass or lens (sunny days only): focus the sun on the tinder and hold it there until it smoulders, then blow gently. Don't Never pour petrol or other flammable liquid on a fire , even one that looks out. It can explode. Don't burn tyres. The smoke is harmful to breathe. Don't cook food directly over a fire started with petrol or diesel. Sources (checked 2026-11-01) US Army, ATP 3-50.21 Survival (2018), chapter 5 \"Fire\" (approved for public release): https://armypubs.army.mil/ProductMaps/PubForm/Details.aspx?PUB_ID=1005316 Drawings: see images/CREDITS.md"},"06-fire-and-light/safe-lighting":{"title":"Safe Lighting in a Power Cut","folder":"06-fire-and-light","html":"<h1 id=\"safe-lighting-in-a-power-cut\">Safe Lighting in a Power Cut<\/h1>\n<blockquote>\n<p><strong>Use torches, not candles.<\/strong> Candles cause house fires during power outages.<\/p>\n<\/blockquote>\n<h2 id=\"before-the-outage\">Before the outage<\/h2>\n<ul>\n<li>☐ A torch (flashlight) for each person, kept where you can find it in the dark<\/li>\n<li>☐ Plenty of <strong>spare batteries<\/strong><\/li>\n<li>☐ A <strong>backup battery in your smoke alarm<\/strong><\/li>\n<\/ul>\n<h2 id=\"if-you-must-use-a-candle\">If you must use a candle<\/h2>\n<ul>\n<li>Put it in a <strong>sturdy holder on a flat surface<\/strong>.<\/li>\n<li>Keep it <strong>at least 30 cm (12 inches) from anything that can burn<\/strong>: curtains,\n    paper, bedding.<\/li>\n<li><strong>Keep children and pets away<\/strong> from it.<\/li>\n<li><strong>Blow it out<\/strong> when you leave the room or go to sleep.<\/li>\n<\/ul>\n<h2 id=\"dont\">Don't<\/h2>\n<ul>\n<li>Don't use a gas stove, oven or barbecue for light or heat indoors (see\n    <a href=\"#/01-emergency/carbon-monoxide\">../01-emergency/carbon-monoxide.md<\/a>).<\/li>\n<\/ul>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>US Fire Administration, Candle fire safety:\n    https://www.usfa.fema.gov/prevention/home-fires/prevent-fires/candle/<\/li>\n<li>US Fire Administration, Severe weather fire safety:\n    https://www.usfa.fema.gov/prevention/home-fires/prevent-fires/severe-weather/index.html<\/li>\n<\/ul>","text":"Safe Lighting in a Power Cut Use torches, not candles. Candles cause house fires during power outages. Before the outage ☐ A torch (flashlight) for each person, kept where you can find it in the dark ☐ Plenty of spare batteries ☐ A backup battery in your smoke alarm If you must use a candle Put it in a sturdy holder on a flat surface . Keep it at least 30 cm (12 inches) from anything that can burn : curtains, paper, bedding. Keep children and pets away from it. Blow it out when you leave the room or go to sleep. Don't Don't use a gas stove, oven or barbecue for light or heat indoors (see ../01-emergency/carbon-monoxide.md ). Sources (checked 2026-11-01) US Fire Administration, Candle fire safety: https://www.usfa.fema.gov/prevention/home-fires/prevent-fires/candle/ US Fire Administration, Severe weather fire safety: https://www.usfa.fema.gov/prevention/home-fires/prevent-fires/severe-weather/index.html"},"07-sanitation-and-hygiene/README":{"title":"07 · Sanitation and Hygiene","folder":"07-sanitation-and-hygiene","html":"<h1 id=\"07-sanitation-and-hygiene\">07 · Sanitation and Hygiene<\/h1>\n<p>Preventing disease when water and sewage systems fail.<\/p>\n<h2 id=\"pages\">Pages<\/h2>\n<ul>\n<li><a href=\"#/07-sanitation-and-hygiene/toilets-and-hygiene\">Toilets and Hygiene When the Water or Sewer Fails<\/a>: handwashing, flushing, bucket toilets<\/li>\n<\/ul>\n<h2 id=\"to-add\">To add<\/h2>\n<ul>\n<li>Cleaning up after a flood: mould, mosquitoes (Queensland Health)<\/li>\n<\/ul>","text":"07 · Sanitation and Hygiene Preventing disease when water and sewage systems fail. Pages Toilets and Hygiene When the Water or Sewer Fails : handwashing, flushing, bucket toilets To add Cleaning up after a flood: mould, mosquitoes (Queensland Health)"},"07-sanitation-and-hygiene/toilets-and-hygiene":{"title":"Toilets and Hygiene When the Water or Sewer Fails","folder":"07-sanitation-and-hygiene","html":"<h1 id=\"toilets-and-hygiene-when-the-water-or-sewer-fails\">Toilets and Hygiene When the Water or Sewer Fails<\/h1>\n<p>Diarrhoea spreads fast when toilets and handwashing stop working. It can kill,\nespecially young children (see\n<a href=\"#/02-first-aid/dehydration\">../02-first-aid/dehydration.md<\/a>).<\/p>\n<h2 id=\"wash-your-hands\">Wash your hands<\/h2>\n<ol>\n<li>Wet your hands, ideally under running water.<\/li>\n<li>Use enough <strong>soap<\/strong> to cover them. Ordinary soap works as well as\n    antibacterial soap.<\/li>\n<li><strong>Rub for at least 20 seconds<\/strong>: backs of hands and between the fingers.<\/li>\n<li>Rinse, and dry them well.<\/li>\n<\/ol>\n<p><strong>Always wash:<\/strong> after the toilet or a nappy change, before preparing or eating\nfood, after handling raw meat, and before and after touching a wound.<\/p>\n<p><strong>No water?<\/strong> Use <strong>alcohol-based hand sanitiser<\/strong> (about half a teaspoon, rubbed\nover every surface until dry, 20–30 seconds). It <strong>doesn't work on visibly dirty\nhands<\/strong>. Keep it away from children: it's poisonous if swallowed.<\/p>\n<h2 id=\"toilet-still-there-but-no-water\">Toilet still there but no water<\/h2>\n<p>Water that isn't safe to drink (from a pool, rain or floodwater) can still be\nused to <strong>flush the toilet<\/strong>, by pouring it into the bowl. Keep clean water for\ndrinking and cooking.<\/p>\n<h2 id=\"no-working-toilet-bucket-toilet\">No working toilet: bucket toilet<\/h2>\n<ol>\n<li>Use a <strong>bucket lined with a strong plastic bag<\/strong>.<\/li>\n<li>Plan for about <strong>one bag per person per day<\/strong>.<\/li>\n<li>Keep it <strong>covered<\/strong> between uses.<\/li>\n<li><strong>Tie the bags off<\/strong> and store them sealed, away from water and food, until\n    they can be disposed of. Ask the council about collection.<\/li>\n<li>Put a <strong>handwashing station<\/strong> (soap and water, or sanitiser) right next to it.<\/li>\n<\/ol>\n<h2 id=\"cleaning\">Cleaning<\/h2>\n<p>Clean toilet seats and taps often. Use <strong>unscented household bleach<\/strong> diluted in\nwater. <strong>Never mix bleach with ammonia or other cleaners<\/strong>: it makes toxic gas.<\/p>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>healthdirect (Australian Government), Hand washing:\n    https://www.healthdirect.gov.au/hand-washing<\/li>\n<li>CDC, Cistern Safety and Disasters (contaminated water for flushing):\n    https://www.cdc.gov/water-emergency/about/cistern-safety-and-disasters-before-during-and-after.html<\/li>\n<li>CDC (archive), Potential Sanitation Solutions During an Emergency Response:\n    https://archive.cdc.gov/www_cdc_gov/healthywater/global/sanitation/sanitation-emergency-response.html<\/li>\n<\/ul>","text":"Toilets and Hygiene When the Water or Sewer Fails Diarrhoea spreads fast when toilets and handwashing stop working. It can kill, especially young children (see ../02-first-aid/dehydration.md ). Wash your hands Wet your hands, ideally under running water. Use enough soap to cover them. Ordinary soap works as well as antibacterial soap. Rub for at least 20 seconds : backs of hands and between the fingers. Rinse, and dry them well. Always wash: after the toilet or a nappy change, before preparing or eating food, after handling raw meat, and before and after touching a wound. No water? Use alcohol-based hand sanitiser (about half a teaspoon, rubbed over every surface until dry, 20–30 seconds). It doesn't work on visibly dirty hands . Keep it away from children: it's poisonous if swallowed. Toilet still there but no water Water that isn't safe to drink (from a pool, rain or floodwater) can still be used to flush the toilet , by pouring it into the bowl. Keep clean water for drinking and cooking. No working toilet: bucket toilet Use a bucket lined with a strong plastic bag . Plan for about one bag per person per day . Keep it covered between uses. Tie the bags off and store them sealed, away from water and food, until they can be disposed of. Ask the council about collection. Put a handwashing station (soap and water, or sanitiser) right next to it. Cleaning Clean toilet seats and taps often. Use unscented household bleach diluted in water. Never mix bleach with ammonia or other cleaners : it makes toxic gas. Sources (checked 2026-11-01) healthdirect (Australian Government), Hand washing: https://www.healthdirect.gov.au/hand-washing CDC, Cistern Safety and Disasters (contaminated water for flushing): https://www.cdc.gov/water-emergency/about/cistern-safety-and-disasters-before-during-and-after.html CDC (archive), Potential Sanitation Solutions During an Emergency Response: https://archive.cdc.gov/www_cdc_gov/healthywater/global/sanitation/sanitation-emergency-response.html"},"08-power/README":{"title":"08 · Power","folder":"08-power","html":"<h1 id=\"08-power\">08 · Power<\/h1>\n<p>Electricity when the grid is down.<\/p>\n<h2 id=\"pages\">Pages<\/h2>\n<ul>\n<li><a href=\"#/08-power/generators-and-backup-power\">Generators and Backup Power<\/a><\/li>\n<li>During an outage: see <a href=\"#/01-emergency/power-outage\">Power Outage<\/a><\/li>\n<\/ul>\n<h2 id=\"to-add\">To add<\/h2>\n<ul>\n<li>Small solar setups<\/li>\n<\/ul>","text":"08 · Power Electricity when the grid is down. Pages Generators and Backup Power During an outage: see Power Outage To add Small solar setups"},"08-power/generators-and-backup-power":{"title":"Generators and Backup Power","folder":"08-power","html":"<h1 id=\"generators-and-backup-power\">Generators and Backup Power<\/h1>\n<blockquote>\n<p><strong>Generators kill through carbon monoxide.<\/strong> Run one <strong>only outdoors<\/strong>, at\nleast <strong>6 m (20 feet)<\/strong> from windows, doors and attached garages. Never in the\nhouse, garage, carport or under the house. See\n<a href=\"#/01-emergency/carbon-monoxide\">../01-emergency/carbon-monoxide.md<\/a>.<\/p>\n<\/blockquote>\n<h2 id=\"using-a-portable-generator\">Using a portable generator<\/h2>\n<ul>\n<li><strong>Outdoors only<\/strong>, away from windows, doors and vents.<\/li>\n<li><strong>Keep it dry.<\/strong> Touching a wet generator, or anything plugged into it, can\n    give you an electric shock.<\/li>\n<li>Plug appliances in with <strong>heavy-duty extension cords<\/strong>.<\/li>\n<li><strong>Let it cool down before refuelling.<\/strong><\/li>\n<li>Have a working <strong>carbon monoxide alarm on every level<\/strong> of the home.<\/li>\n<\/ul>\n<h2 id=\"before-the-outage\">Before the outage<\/h2>\n<ul>\n<li>If someone relies on <strong>powered medical equipment<\/strong> or <strong>refrigerated\n    medicine<\/strong>, ask the doctor now for a backup plan (see\n    <a href=\"#/02-first-aid/medicines-in-an-emergency\">../02-first-aid/medicines-in-an-emergency.md<\/a>).<\/li>\n<li><strong>NBN phone and internet won't work in a power cut<\/strong>, even with a backup at\n    home. Keep a charged mobile, a power bank and a battery or wind-up radio.<\/li>\n<li>Keep torches and spare batteries (see\n    <a href=\"#/06-fire-and-light/safe-lighting\">../06-fire-and-light/safe-lighting.md<\/a>).<\/li>\n<\/ul>\n<h2 id=\"car-batteries\">Car batteries<\/h2>\n<p>A car can charge phones from its USB or 12 V socket. <strong>Only run the engine\noutdoors<\/strong>, never in a garage. Car batteries can give off <strong>explosive hydrogen\ngas<\/strong>, so keep sparks and flames away from them.<\/p>\n<h2 id=\"report-problems\">Report problems<\/h2>\n<ul>\n<li><strong>Fallen power lines:<\/strong> keep well away, treat them as live, and call\n    <strong>Energex 13 19 62<\/strong> (or 000 if someone is in danger).<\/li>\n<li>Power faults: <strong>Energex 13 62 62<\/strong>.<\/li>\n<\/ul>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>Ready.gov, Power Outages: https://www.ready.gov/power-outages<\/li>\n<li>US Consumer Product Safety Commission, Carbon Monoxide Questions and Answers:\n    https://www.cpsc.gov/Safety-Education/Safety-Education-Centers/Carbon-Monoxide-Information-Center/Carbon-Monoxide-Questions-and-Answers<\/li>\n<li>Noosa Council, Emergency Action Guide 2024 (NBN warning, Energex numbers)<\/li>\n<li>US Army, <em>ATP 3-50.21 Survival<\/em> (2018), 5-40 (battery hydrogen gas warning)<\/li>\n<\/ul>","text":"Generators and Backup Power Generators kill through carbon monoxide. Run one only outdoors , at least 6 m (20 feet) from windows, doors and attached garages. Never in the house, garage, carport or under the house. See ../01-emergency/carbon-monoxide.md . Using a portable generator Outdoors only , away from windows, doors and vents. Keep it dry. Touching a wet generator, or anything plugged into it, can give you an electric shock. Plug appliances in with heavy-duty extension cords . Let it cool down before refuelling. Have a working carbon monoxide alarm on every level of the home. Before the outage If someone relies on powered medical equipment or refrigerated medicine , ask the doctor now for a backup plan (see ../02-first-aid/medicines-in-an-emergency.md ). NBN phone and internet won't work in a power cut , even with a backup at home. Keep a charged mobile, a power bank and a battery or wind-up radio. Keep torches and spare batteries (see ../06-fire-and-light/safe-lighting.md ). Car batteries A car can charge phones from its USB or 12 V socket. Only run the engine outdoors , never in a garage. Car batteries can give off explosive hydrogen gas , so keep sparks and flames away from them. Report problems Fallen power lines: keep well away, treat them as live, and call Energex 13 19 62 (or 000 if someone is in danger). Power faults: Energex 13 62 62 . Sources (checked 2026-11-01) Ready.gov, Power Outages: https://www.ready.gov/power-outages US Consumer Product Safety Commission, Carbon Monoxide Questions and Answers: https://www.cpsc.gov/Safety-Education/Safety-Education-Centers/Carbon-Monoxide-Information-Center/Carbon-Monoxide-Questions-and-Answers Noosa Council, Emergency Action Guide 2024 (NBN warning, Energex numbers) US Army, ATP 3-50.21 Survival (2018), 5-40 (battery hydrogen gas warning)"},"09-communication/README":{"title":"09 · Communication","folder":"09-communication","html":"<h1 id=\"09-communication\">09 · Communication<\/h1>\n<p>Staying in touch and getting help without phones or internet.<\/p>\n<h2 id=\"pages\">Pages<\/h2>\n<ul>\n<li><a href=\"#/09-communication/emergency-communication\">Emergency Communication<\/a>: 000 and 112, radio, UHF CB emergency channels, signalling for help<\/li>\n<\/ul>","text":"09 · Communication Staying in touch and getting help without phones or internet. Pages Emergency Communication : 000 and 112, radio, UHF CB emergency channels, signalling for help"},"09-communication/emergency-communication":{"title":"Emergency Communication","folder":"09-communication","html":"<h1 id=\"emergency-communication\">Emergency Communication<\/h1>\n<h2 id=\"calling-for-help\">Calling for help<\/h2>\n<ul>\n<li><strong>000<\/strong> for police, fire and ambulance. <strong>112<\/strong> also works from a mobile.<\/li>\n<li>If you can't speak English, call 000 and say \"police\", \"fire\" or\n    \"ambulance\". They will arrange a free interpreter.<\/li>\n<li>The <strong>Emergency+<\/strong> app shows your exact location (latitude and longitude) to\n    read out to the 000 operator. Install it now.<\/li>\n<li><strong>SES (storm and flood help): 132 500.<\/strong><\/li>\n<li>Full local list: <a href=\"#/12-noosa-tewantin/emergency-contacts\">../12-noosa-tewantin/emergency-contacts.md<\/a><\/li>\n<\/ul>\n<h2 id=\"when-phones-and-internet-are-down\">When phones and internet are down<\/h2>\n<ul>\n<li><strong>NBN phones and internet stop working in a power cut<\/strong>, even with a backup at\n    home. Keep a mobile and a power bank charged.<\/li>\n<li><strong>Avoid unnecessary calls<\/strong> during a disaster, to keep the lines free. Send a\n    text instead.<\/li>\n<li><strong>Battery or wind-up radio:<\/strong> <strong>ABC Sunshine Coast 90.3 FM or 95.3 FM<\/strong> is the\n    emergency broadcaster. Listen for the <strong>emergency warning siren<\/strong> played\n    before serious warnings.<\/li>\n<\/ul>\n<h2 id=\"uhf-cb-radio-no-licence-needed\">UHF CB radio (no licence needed)<\/h2>\n<table>\n<thead>\n<tr>\n<th>Channel<\/th>\n<th>Use<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>UHF 5<\/strong> (476.525 MHz)<\/td>\n<td><strong>Emergencies only<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>UHF 35<\/strong> (477.275 MHz)<\/td>\n<td>Emergencies only<\/td>\n<\/tr>\n<tr>\n<td>HF 9 (27.065 MHz)<\/td>\n<td>Emergencies only<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>These channels may be used <strong>during an emergency or natural disaster<\/strong>.<\/li>\n<li>In an emergency you can call on <strong>any<\/strong> CB channel to get attention.<\/li>\n<li><strong>Emergency services don't listen to these channels.<\/strong> CB doesn't replace\n    calling 000; use it to reach people nearby.<\/li>\n<\/ul>\n<h2 id=\"signalling-for-help\">Signalling for help<\/h2>\n<ul>\n<li><strong>Trapped (e.g. in rubble):<\/strong> <strong>bang on a pipe or wall<\/strong>, send a text, and use\n    a <strong>whistle<\/strong> instead of shouting. Cover your mouth with your shirt.<\/li>\n<li><strong>Trapped in a building (e.g. fire):<\/strong> signal at a window with a\n    <strong>light-coloured cloth or a torch<\/strong>.<\/li>\n<li><strong>On a roof in a flood:<\/strong> stay visible and signal to rescuers.<\/li>\n<li><strong>Outdoors:<\/strong> a fire can be seen from the air. Rotten or damp wood makes lots\n    of smoke, which is useful for signalling (see\n    <a href=\"#/06-fire-and-light/lighting-a-fire\">../06-fire-and-light/lighting-a-fire.md<\/a>).<\/li>\n<\/ul>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>Australian Communications and Media Authority, Citizen band radio stations\n    class licence (2025): https://www.acma.gov.au/licences/citizen-band-radio-stations-class-licence<\/li>\n<li>healthdirect, Calling triple zero (000): https://www.healthdirect.gov.au/calling-triple-zero<\/li>\n<li>Noosa Council, Emergency Action Guide 2024 (radio, NBN, unnecessary calls)<\/li>\n<li>Ready.gov, Earthquakes; Home Fires; Floods (signalling when trapped)<\/li>\n<li>US Army, <em>ATP 3-50.21 Survival<\/em> (2018), chapter 5 (fire and smoke as signals)<\/li>\n<\/ul>","text":"Emergency Communication Calling for help 000 for police, fire and ambulance. 112 also works from a mobile. If you can't speak English, call 000 and say \"police\", \"fire\" or \"ambulance\". They will arrange a free interpreter. The Emergency+ app shows your exact location (latitude and longitude) to read out to the 000 operator. Install it now. SES (storm and flood help): 132 500. Full local list: ../12-noosa-tewantin/emergency-contacts.md When phones and internet are down NBN phones and internet stop working in a power cut , even with a backup at home. Keep a mobile and a power bank charged. Avoid unnecessary calls during a disaster, to keep the lines free. Send a text instead. Battery or wind-up radio: ABC Sunshine Coast 90.3 FM or 95.3 FM is the emergency broadcaster. Listen for the emergency warning siren played before serious warnings. UHF CB radio (no licence needed) Channel Use UHF 5 (476.525 MHz) Emergencies only UHF 35 (477.275 MHz) Emergencies only HF 9 (27.065 MHz) Emergencies only These channels may be used during an emergency or natural disaster . In an emergency you can call on any CB channel to get attention. Emergency services don't listen to these channels. CB doesn't replace calling 000; use it to reach people nearby. Signalling for help Trapped (e.g. in rubble): bang on a pipe or wall , send a text, and use a whistle instead of shouting. Cover your mouth with your shirt. Trapped in a building (e.g. fire): signal at a window with a light-coloured cloth or a torch . On a roof in a flood: stay visible and signal to rescuers. Outdoors: a fire can be seen from the air. Rotten or damp wood makes lots of smoke, which is useful for signalling (see ../06-fire-and-light/lighting-a-fire.md ). Sources (checked 2026-11-01) Australian Communications and Media Authority, Citizen band radio stations class licence (2025): https://www.acma.gov.au/licences/citizen-band-radio-stations-class-licence healthdirect, Calling triple zero (000): https://www.healthdirect.gov.au/calling-triple-zero Noosa Council, Emergency Action Guide 2024 (radio, NBN, unnecessary calls) Ready.gov, Earthquakes; Home Fires; Floods (signalling when trapped) US Army, ATP 3-50.21 Survival (2018), chapter 5 (fire and smoke as signals)"},"10-navigation-and-maps/README":{"title":"10 · Navigation and Maps","folder":"10-navigation-and-maps","html":"<h1 id=\"10-navigation-and-maps\">10 · Navigation and Maps<\/h1>\n<p>Finding your way without GPS or online maps.<\/p>\n<h2 id=\"pages\">Pages<\/h2>\n<ul>\n<li><a href=\"#/10-navigation-and-maps/maps-noosa\">Maps of Noosa<\/a>: printable maps with emergency services marked<\/li>\n<li><a href=\"#/10-navigation-and-maps/key-places-noosa\">Key Places: Noosa Shire<\/a>: hospitals, police, fire, ambulance, pharmacies, fuel, water, with GPS coordinates<\/li>\n<li><a href=\"#/10-navigation-and-maps/offline-map-apps\">Offline Map Apps<\/a>: maps on your phone with no signal<\/li>\n<li><a href=\"#/10-navigation-and-maps/finding-direction\">Finding Direction Without GPS<\/a>: sun, watch, Southern Cross, moon<\/li>\n<\/ul>\n<h2 id=\"update-the-maps\">Update the maps<\/h2>\n<p><code>tools/make-map.py<\/code> redraws the maps and the list of places from the latest\nOpenStreetMap data (needs internet). Edit the areas at the top of the script to\nmap another region.<\/p>\n<h2 id=\"to-add\">To add<\/h2>\n<ul>\n<li>Using a compass with a map<\/li>\n<\/ul>","text":"10 · Navigation and Maps Finding your way without GPS or online maps. Pages Maps of Noosa : printable maps with emergency services marked Key Places: Noosa Shire : hospitals, police, fire, ambulance, pharmacies, fuel, water, with GPS coordinates Offline Map Apps : maps on your phone with no signal Finding Direction Without GPS : sun, watch, Southern Cross, moon Update the maps tools/make-map.py redraws the maps and the list of places from the latest OpenStreetMap data (needs internet). Edit the areas at the top of the script to map another region. To add Using a compass with a map"},"10-navigation-and-maps/finding-direction":{"title":"Finding Direction Without GPS","folder":"10-navigation-and-maps","html":"<h1 id=\"finding-direction-without-gps\">Finding Direction Without GPS<\/h1>\n<blockquote>\n<p><strong>In Australia (the Southern Hemisphere), the sun is due north at midday and\nshadows point south.<\/strong> Most survival books are written for the Northern\nHemisphere, where it's the other way round.<\/p>\n<\/blockquote>\n<p>The sun rises roughly in the east and sets roughly in the west (rarely exactly\ndue east or west).<\/p>\n<h2 id=\"shadow-tip-method-sun-any-time-of-day\">Shadow-tip method (sun, any time of day)<\/h2>\n<ol>\n<li>Push a stick into the ground where it casts a clear shadow. <strong>Mark the tip of\n    the shadow<\/strong> with a stone or twig. This first mark is always <strong>west<\/strong>.<\/li>\n<li>Wait <strong>10 to 15 minutes<\/strong>, until the shadow tip has moved a few centimetres.\n    Mark the new tip. This second mark is <strong>east<\/strong>.<\/li>\n<li>Draw a straight line through the two marks: that's <strong>east–west<\/strong>.<\/li>\n<li>Stand with the first mark (west) on your left: <strong>north is in front of you<\/strong>,\n    east to your right, south behind you.<\/li>\n<\/ol>\n<p><img alt=\"Stick and shadow marks: the first mark is west, the second is east\" loading=\"lazy\" src=\"10-navigation-and-maps/images/shadow-tip-method.png\" /><\/p>\n<p><em>The stick can lean, and any fixed object (like the end of a branch) works too.\nOnly the shadow tip matters.<\/em><\/p>\n<h2 id=\"watch-method-analog-watch\">Watch method (analog watch)<\/h2>\n<p><strong>Southern Hemisphere:<\/strong> hold the watch flat and point the <strong>12<\/strong> at the sun.\nHalfway between the 12 and the hour hand is <strong>north<\/strong>. On daylight saving time,\nuse halfway between the hour hand and the 1 instead (Queensland doesn't use\ndaylight saving; New South Wales and Victoria do in summer).<\/p>\n<p><img alt=\"Watch methods for the north and south temperate zones\" loading=\"lazy\" src=\"10-navigation-and-maps/images/watch-method.png\" /><\/p>\n<p><em>Use the bottom drawing (\"South temperate zone\") in Australia.<\/em><\/p>\n<p>This can be inaccurate, especially closer to the equator. Check it with the\nshadow-tip method when you can.<\/p>\n<p><strong>Digital watch?<\/strong> Draw a clock face showing the current time on paper or on the\nground and use that.<\/p>\n<h2 id=\"southern-cross-at-night\">Southern Cross (at night)<\/h2>\n<p>There's no bright \"south star\", so use the <strong>Southern Cross<\/strong> (Crux):<\/p>\n<ol>\n<li>Find the <strong>four bright stars<\/strong> of the Cross. Nearby there's a dimmer\n    <strong>False Cross<\/strong>. The real one has two bright <strong>Pointer Stars<\/strong> beside it.<\/li>\n<li>Imagine a line along the <strong>long axis<\/strong> of the Cross, extended <strong>4½ to 5\n    times<\/strong> its length.<\/li>\n<li>Look straight down from that point to the horizon: that's <strong>south<\/strong>.\n    Pick a landmark there to walk towards.<\/li>\n<\/ol>\n<p><img alt=\"Southern Cross, Pointer Stars and False Cross, with a line down to the south horizon\" loading=\"lazy\" src=\"10-navigation-and-maps/images/southern-cross.png\" /><\/p>\n<p><em>If you're staying put, mark south at night with sticks in the ground so you\nhave it in daylight.<\/em><\/p>\n<h2 id=\"the-moon\">The moon<\/h2>\n<p>If the moon rises <strong>before sunset<\/strong>, its lit side faces <strong>west<\/strong>. If it rises\n<strong>after midnight<\/strong>, its lit side faces <strong>east<\/strong>. That gives a rough east–west\nline at night.<\/p>\n<h2 id=\"reading-the-land-on-a-map\">Reading the land on a map<\/h2>\n<p>Contour lines join points of the same height. Closed rings, one inside the\nother, are a hill; the smallest ring is the top.<\/p>\n<p><img alt=\"A hill and the contour lines that show it on a map\" loading=\"lazy\" src=\"10-navigation-and-maps/images/contour-lines-hill.png\" /><\/p>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>US Army, <em>ATP 3-50.21 Survival<\/em> (2018), chapter 7 \"Movement and Navigation\"\n    (approved for public release; distribution unlimited):\n    https://armypubs.army.mil/ProductMaps/PubForm/Details.aspx?PUB_ID=1005316<\/li>\n<li>Drawings: see <a href=\"#/10-navigation-and-maps/images/CREDITS\">images/CREDITS.md<\/a><\/li>\n<\/ul>","text":"Finding Direction Without GPS In Australia (the Southern Hemisphere), the sun is due north at midday and shadows point south. Most survival books are written for the Northern Hemisphere, where it's the other way round. The sun rises roughly in the east and sets roughly in the west (rarely exactly due east or west). Shadow-tip method (sun, any time of day) Push a stick into the ground where it casts a clear shadow. Mark the tip of the shadow with a stone or twig. This first mark is always west . Wait 10 to 15 minutes , until the shadow tip has moved a few centimetres. Mark the new tip. This second mark is east . Draw a straight line through the two marks: that's east–west . Stand with the first mark (west) on your left: north is in front of you , east to your right, south behind you. The stick can lean, and any fixed object (like the end of a branch) works too. Only the shadow tip matters. Watch method (analog watch) Southern Hemisphere: hold the watch flat and point the 12 at the sun. Halfway between the 12 and the hour hand is north . On daylight saving time, use halfway between the hour hand and the 1 instead (Queensland doesn't use daylight saving; New South Wales and Victoria do in summer). Use the bottom drawing (\"South temperate zone\") in Australia. This can be inaccurate, especially closer to the equator. Check it with the shadow-tip method when you can. Digital watch? Draw a clock face showing the current time on paper or on the ground and use that. Southern Cross (at night) There's no bright \"south star\", so use the Southern Cross (Crux): Find the four bright stars of the Cross. Nearby there's a dimmer False Cross . The real one has two bright Pointer Stars beside it. Imagine a line along the long axis of the Cross, extended 4½ to 5 times its length. Look straight down from that point to the horizon: that's south . Pick a landmark there to walk towards. If you're staying put, mark south at night with sticks in the ground so you have it in daylight. The moon If the moon rises before sunset , its lit side faces west . If it rises after midnight , its lit side faces east . That gives a rough east–west line at night. Reading the land on a map Contour lines join points of the same height. Closed rings, one inside the other, are a hill; the smallest ring is the top. Sources (checked 2026-11-01) US Army, ATP 3-50.21 Survival (2018), chapter 7 \"Movement and Navigation\" (approved for public release; distribution unlimited): https://armypubs.army.mil/ProductMaps/PubForm/Details.aspx?PUB_ID=1005316 Drawings: see images/CREDITS.md"},"10-navigation-and-maps/images/CREDITS":{"title":"Image Credits: 10-navigation-and-maps","folder":"10-navigation-and-maps","html":"<h1 id=\"image-credits-10-navigation-and-maps\">Image Credits: 10-navigation-and-maps<\/h1>\n<table>\n<thead>\n<tr>\n<th>Image<\/th>\n<th>Source<\/th>\n<th>License<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>shadow-tip-method.png<\/code>, <code>watch-method.png<\/code>, <code>southern-cross.png<\/code>, <code>contour-lines-hill.png<\/code><\/td>\n<td>US Army, <em>ATP 3-50.21 Survival<\/em> (2018), figures 7-8, 7-10, 7-12 and 7-15, converted to greyscale (the night-sky drawing inverted to black on white)<\/td>\n<td>Public domain (US Government work, approved for public release)<\/td>\n<\/tr>\n<tr>\n<td><code>../maps/*.svg<\/code><\/td>\n<td>Drawn by <code>tools/make-map.py<\/code> from OpenStreetMap data<\/td>\n<td>Map data © OpenStreetMap contributors, <a class=\"ext\" href=\"https://www.openstreetmap.org/copyright\" rel=\"noopener\" target=\"_blank\">ODbL<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>","text":"Image Credits: 10-navigation-and-maps Image Source License shadow-tip-method.png , watch-method.png , southern-cross.png , contour-lines-hill.png US Army, ATP 3-50.21 Survival (2018), figures 7-8, 7-10, 7-12 and 7-15, converted to greyscale (the night-sky drawing inverted to black on white) Public domain (US Government work, approved for public release) ../maps/*.svg Drawn by tools/make-map.py from OpenStreetMap data Map data © OpenStreetMap contributors, ODbL"},"10-navigation-and-maps/key-places-noosa":{"title":"Key Places: Noosa Shire","folder":"10-navigation-and-maps","html":"<h1 id=\"key-places-noosa-shire\">Key Places: Noosa Shire<\/h1>\n<p>Numbers match the markers on the maps. <strong>Black squares<\/strong> on the maps are emergency\nservices and health; white circles are everything else. Coordinates are latitude, longitude\n(enter them in a GPS or offline map app).<\/p>\n<blockquote>\n<p>Map data comes from OpenStreetMap volunteers and may be incomplete or out of date.\nIn an emergency, call <strong>000<\/strong>.<\/p>\n<\/blockquote>\n<h2 id=\"hospital-4\">Hospital (4)<\/h2>\n<table>\n<thead>\n<tr>\n<th>No.<\/th>\n<th>Name<\/th>\n<th>Address<\/th>\n<th>Lat, Lon<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Noosa Hospital<\/td>\n<td>111 Goodchap Street · +61 7 5455 9200<\/td>\n<td>-26.40307, 153.04595<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Eden Private Hospital<\/td>\n<td>50 Maple Street Cooroy · +61 7 5472 6472<\/td>\n<td>-26.41996, 152.90874<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Nambour Selangor Private Hospital<\/td>\n<td>62 Netherton Street Nambour · +61 7 5459 7444<\/td>\n<td>-26.61881, 152.95
