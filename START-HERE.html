main { max-width: 760px; margin: 0 auto; padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(60px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 20px; }

const ARK = {"pages":{"README":{"title":"Arkpi: Offline Knowledge Ark","folder":"","html":"<h1 id=\"arkpi-offline-knowledge-ark\">Arkpi: Offline Knowledge Ark<\/h1>\n<p>Survival guides and essential information that work <strong>without internet<\/strong>.\nCopy this folder to a computer, USB drive or phone, and everything is there.<\/p>\n<h2 id=\"start-here\">Start here<\/h2>\n<p><strong>Open <a href=\"START-HERE.html\" target=\"_blank\"><code>START-HERE.html<\/code><\/a> in any web browser<\/strong> (double-click\nit). It shows the emergencies first, walks you through each guide one step at a\ntime with drawings, searches everything, and links to the books. It works with\nno internet, straight from this folder or a USB stick.<\/p>\n<p>Every guide is also a plain text file in the numbered folders below, so you\ncan read it in any text editor or print it.<\/p>\n<blockquote>\n<p><strong>In an emergency right now:<\/strong>\n<a href=\"#/01-emergency/severe-bleeding\">Severe bleeding<\/a> ·\n<a href=\"#/01-emergency/cpr\">CPR<\/a> ·\n<a href=\"#/01-emergency/choking\">Choking<\/a> ·\n<a href=\"#/01-emergency/burns\">Burns<\/a> ·\n<a href=\"#/01-emergency/gas-leak\">Gas leak<\/a> ·\n<a href=\"#/01-emergency/home-fire\">Fire<\/a> ·\n<a href=\"#/01-emergency/earthquake\">Earthquake<\/a> ·\n<a href=\"#/01-emergency/flood\">Flood<\/a> ·\n<a href=\"#/01-emergency/README\">All emergency pages<\/a><\/p>\n<p>If phones work, call your local emergency number first:\n<strong>000 in Australia<\/strong> (112 from a mobile), 911 in the US, 112 in the EU.\nNoosa / Tewantin contacts: <a href=\"#/12-noosa-tewantin/emergency-contacts\">12-noosa-tewantin/emergency-contacts.md<\/a><\/p>\n<\/blockquote>\n<h2 id=\"whats-inside\">What's inside<\/h2>\n<table>\n<thead>\n<tr>\n<th>Folder<\/th>\n<th>What it covers<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><a href=\"#/01-emergency/README\">01-emergency<\/a><\/td>\n<td>Urgent steps for the first minutes. <strong>Read first.<\/strong><\/td>\n<\/tr>\n<tr>\n<td><a href=\"#/02-first-aid/README\">02-first-aid<\/a><\/td>\n<td>Injuries and illness<\/td>\n<\/tr>\n<tr>\n<td><a href=\"#/03-water/README\">03-water<\/a><\/td>\n<td>Finding and treating drinking water<\/td>\n<\/tr>\n<tr>\n<td><a href=\"#/04-food/README\">04-food<\/a><\/td>\n<td>Food safety and preservation<\/td>\n<\/tr>\n<tr>\n<td><a href=\"#/05-shelter-and-warmth/README\">05-shelter-and-warmth<\/a><\/td>\n<td>Staying protected and warm<\/td>\n<\/tr>\n<tr>\n<td><a href=\"#/06-fire-and-light/README\">06-fire-and-light<\/a><\/td>\n<td>Fire and light without power<\/td>\n<\/tr>\n<tr>\n<td><a href=\"#/07-sanitation-and-hygiene/README\">07-sanitation-and-hygiene<\/a><\/td>\n<td>Preventing disease<\/td>\n<\/tr>\n<tr>\n<td><a href=\"#/08-power/README\">08-power<\/a><\/td>\n<td>Electricity when the grid is down<\/td>\n<\/tr>\n<tr>\n<td><a href=\"#/09-communication/README\">09-communication<\/a><\/td>\n<td>Contact and signaling without phones<\/td>\n<\/tr>\n<tr>\n<td><a href=\"#/10-navigation-and-maps/README\">10-navigation-and-maps<\/a><\/td>\n<td>Finding your way without GPS<\/td>\n<\/tr>\n<tr>\n<td><a href=\"#/11-preparedness/README\">11-preparedness<\/a><\/td>\n<td>Checklists for before a disaster<\/td>\n<\/tr>\n<tr>\n<td><a href=\"#/12-noosa-tewantin/README\">12-noosa-tewantin<\/a><\/td>\n<td>Local contacts, warnings and hazards for Noosa Shire, Queensland<\/td>\n<\/tr>\n<tr>\n<td><a href=\"#/13-literature/README\">13-literature<\/a><\/td>\n<td>100 great public-domain books, as plain text<\/td>\n<\/tr>\n<tr>\n<td><a href=\"#/library/README\">library<\/a><\/td>\n<td>Large offline libraries (Wikipedia, medical encyclopedia…), downloaded separately<\/td>\n<\/tr>\n<tr>\n<td><a href=\"#/tools/README\">tools<\/a><\/td>\n<td>Optional scripts. You don't need them to read anything.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Every page is a plain text file (Markdown). Open it in any text editor or\nbrowser, print it, or paste it into a message.<\/p>\n<h2 id=\"sharing-it\">Sharing it<\/h2>\n<ul>\n<li><strong>Copy the whole folder.<\/strong> That's the whole backup: no installation needed.<\/li>\n<li><strong>Leave out <code>private/<\/code><\/strong> if you made one (see below). It's for your own\n    family information and is never uploaded to GitHub.<\/li>\n<\/ul>\n<h2 id=\"rules-for-content\">Rules for content<\/h2>\n<ol>\n<li><strong>Medical and safety guidance comes only from trusted sources<\/strong>: CDC,\n    MedlinePlus (NIH), FEMA / Ready.gov, DHS, CPSC, WHO, Red Cross,\n    healthdirect (Australian Government), Queensland Government, Noosa Council,\n    public-domain military manuals. Where Australian advice differs, the page\n    says so.\n    Never from memory.<\/li>\n<li><strong>Each page ends with a Sources section<\/strong> listing where the information came\n    from and the date it was checked.<\/li>\n<li><strong>One topic per page<\/strong>, named in plain words, inside the right numbered\n    folder. Files it needs (PDFs) go next to it; pictures go in the folder's\n    <code>images/<\/code>.<\/li>\n<li><strong>Pictures are small and black-and-white<\/strong>: drawings and diagrams, converted\n    with <code>tools/make-image.py<\/code> (greyscale, usually under 50 KB). Only public\n    domain or freely licensed images, each credited in <code>images/CREDITS.md<\/code>.<\/li>\n<li><strong>After changing any guide, run <code>./tools/update-reader.sh<\/code><\/strong> so\n    <code>START-HERE.html<\/code> shows the change.<\/li>\n<li>These pages don't replace training. Take a first-aid course while you can.<\/li>\n<\/ol>\n<p>US federal government publications (CDC, FEMA, Ready.gov, DHS) are in the\npublic domain. Content from other organizations is summarized and linked\nrather than copied, unless its license allows sharing.<\/p>\n<h2 id=\"your-private-information\">Your private information<\/h2>\n<p>Create a <code>private/<\/code> folder for family contacts, meeting points, medical\ninformation and copies of documents. It is ignored by git, so it never ends\nup on GitHub. Remember to leave it out when sharing the folder.<\/p>","text":"Arkpi: Offline Knowledge Ark Survival guides and essential information that work without internet . Copy this folder to a computer, USB drive or phone, and everything is there. Start here Open START-HERE.html in any web browser (double-click it). It shows the emergencies first, walks you through each guide one step at a time with drawings, searches everything, and links to the books. It works with no internet, straight from this folder or a USB stick. Every guide is also a plain text file in the numbered folders below, so you can read it in any text editor or print it. In an emergency right now: Severe bleeding · CPR · Choking · Burns · Gas leak · Fire · Earthquake · Flood · All emergency pages If phones work, call your local emergency number first: 000 in Australia (112 from a mobile), 911 in the US, 112 in the EU. Noosa / Tewantin contacts: 12-noosa-tewantin/emergency-contacts.md What's inside Folder What it covers 01-emergency Urgent steps for the first minutes. Read first. 02-first-aid Injuries and illness 03-water Finding and treating drinking water 04-food Food safety and preservation 05-shelter-and-warmth Staying protected and warm 06-fire-and-light Fire and light without power 07-sanitation-and-hygiene Preventing disease 08-power Electricity when the grid is down 09-communication Contact and signaling without phones 10-navigation-and-maps Finding your way without GPS 11-preparedness Checklists for before a disaster 12-noosa-tewantin Local contacts, warnings and hazards for Noosa Shire, Queensland 13-literature 100 great public-domain books, as plain text library Large offline libraries (Wikipedia, medical encyclopedia…), downloaded separately tools Optional scripts. You don't need them to read anything. Every page is a plain text file (Markdown). Open it in any text editor or browser, print it, or paste it into a message. Sharing it Copy the whole folder. That's the whole backup: no installation needed. Leave out private/ if you made one (see below). It's for your own family information and is never uploaded to GitHub. Rules for content Medical and safety guidance comes only from trusted sources : CDC, MedlinePlus (NIH), FEMA / Ready.gov, DHS, CPSC, WHO, Red Cross, healthdirect (Australian Government), Queensland Government, Noosa Council, public-domain military manuals. Where Australian advice differs, the page says so. Never from memory. Each page ends with a Sources section listing where the information came from and the date it was checked. One topic per page , named in plain words, inside the right numbered folder. Files it needs (PDFs) go next to it; pictures go in the folder's images/ . Pictures are small and black-and-white : drawings and diagrams, converted with tools/make-image.py (greyscale, usually under 50 KB). Only public domain or freely licensed images, each credited in images/CREDITS.md . After changing any guide, run ./tools/update-reader.sh so START-HERE.html shows the change. These pages don't replace training. Take a first-aid course while you can. US federal government publications (CDC, FEMA, Ready.gov, DHS) are in the public domain. Content from other organizations is summarized and linked rather than copied, unless its license allows sharing. Your private information Create a private/ folder for family contacts, meeting points, medical information and copies of documents. It is ignored by git, so it never ends up on GitHub. Remember to leave it out when sharing the folder."},"library/README":{"title":"Library","folder":"library","html":"<h1 id=\"library\">Library<\/h1>\n<p>Large offline libraries: Wikipedia, a medical encyclopedia, survival manuals,\nrepair guides and more. They are too big for GitHub, so they are downloaded\nseparately into this folder as <code>.zim<\/code> files.<\/p>\n<h2 id=\"get-the-libraries-needs-internet-do-it-now\">Get the libraries (needs internet, do it now)<\/h2>\n<p><code>bash\n./tools/download-library.sh --list                # see what's available\n./tools/download-library.sh --tier essential      # about 1 GB of core survival content<\/code><\/p>\n<h2 id=\"read-the-libraries-no-internet-needed\">Read the libraries (no internet needed)<\/h2>\n<ul>\n<li><strong>Easiest:<\/strong> install the free <strong>Kiwix<\/strong> app (Mac, Windows, Linux, Android,\n    iPhone) from https://kiwix.org and open any <code>.zim<\/code> file from this folder.<\/li>\n<li><strong>In a browser:<\/strong> <code>./tools/open-library.sh<\/code>, then go to http://localhost:8080<\/li>\n<\/ul>","text":"Library Large offline libraries: Wikipedia, a medical encyclopedia, survival manuals, repair guides and more. They are too big for GitHub, so they are downloaded separately into this folder as .zim files. Get the libraries (needs internet, do it now) bash ./tools/download-library.sh --list # see what's available ./tools/download-library.sh --tier essential # about 1 GB of core survival content Read the libraries (no internet needed) Easiest: install the free Kiwix app (Mac, Windows, Linux, Android, iPhone) from https://kiwix.org and open any .zim file from this folder. In a browser: ./tools/open-library.sh , then go to http://localhost:8080"},"tools/README":{"title":"Tools","folder":"tools","html":"<h1 id=\"tools\">Tools<\/h1>\n<p><strong>Optional.<\/strong> You don't need anything here to read the ark: just open\n<code>START-HERE.html<\/code>. These scripts are for people who maintain the ark.\nThey run on Mac and Linux.<\/p>\n<table>\n<thead>\n<tr>\n<th>Script<\/th>\n<th>What it does<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>update-reader.sh<\/code><\/td>\n<td>Rebuilds <code>START-HERE.html<\/code> from the guides. <strong>Run it after changing any guide.<\/strong><\/td>\n<\/tr>\n<tr>\n<td><code>download-library.sh<\/code><\/td>\n<td>Downloads offline libraries into <code>library/<\/code> (needs internet)<\/td>\n<\/tr>\n<tr>\n<td><code>open-library.sh<\/code><\/td>\n<td>Opens the downloaded libraries in a browser at http://localhost:8080<\/td>\n<\/tr>\n<tr>\n<td><code>download-local.sh<\/code><\/td>\n<td>Downloads Noosa Council's emergency guide and local flood maps into <code>12-noosa-tewantin/downloads/<\/code> (needs internet)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Run them from the Arkpi folder, for example:<\/p>\n<p><code>bash\n./tools/download-library.sh --list<\/code><\/p>\n<p>Other files here:<\/p>\n<ul>\n<li><code>make-image.py<\/code>: turns any picture into a small greyscale PNG for a guide\n    (<code>tools/.venv/bin/python tools/make-image.py input.jpg 03-water/images/name.png 480<\/code>)<\/li>\n<li><code>build-reader.py<\/code>, <code>reader-template.html<\/code>: how <code>START-HERE.html<\/code> is made. The\n    home screen buttons, the red call bar and the search words are set at the\n    top of <code>build-reader.py<\/code>.<\/li>\n<li><code>library-sources.tsv<\/code>: the list of libraries the download script knows about<\/li>\n<li><code>requirements.txt<\/code>: Python packages for the reader build and image tool<\/li>\n<\/ul>","text":"Tools Optional. You don't need anything here to read the ark: just open START-HERE.html . These scripts are for people who maintain the ark. They run on Mac and Linux. Script What it does update-reader.sh Rebuilds START-HERE.html from the guides. Run it after changing any guide. download-library.sh Downloads offline libraries into library/ (needs internet) open-library.sh Opens the downloaded libraries in a browser at http://localhost:8080 download-local.sh Downloads Noosa Council's emergency guide and local flood maps into 12-noosa-tewantin/downloads/ (needs internet) Run them from the Arkpi folder, for example: bash ./tools/download-library.sh --list Other files here: make-image.py : turns any picture into a small greyscale PNG for a guide ( tools/.venv/bin/python tools/make-image.py input.jpg 03-water/images/name.png 480 ) build-reader.py , reader-template.html : how START-HERE.html is made. The home screen buttons, the red call bar and the search words are set at the top of build-reader.py . library-sources.tsv : the list of libraries the download script knows about requirements.txt : Python packages for the reader build and image tool"},"01-emergency/README":{"title":"01 · Emergency","folder":"01-emergency","html":"<h1 id=\"01-emergency\">01 · Emergency<\/h1>\n<p>Short, urgent pages for the first minutes. <strong>Read these first.<\/strong><\/p>\n<h2 id=\"someone-is-hurt\">Someone is hurt<\/h2>\n<ul>\n<li><a href=\"#/01-emergency/severe-bleeding\">Severe Bleeding<\/a><\/li>\n<li><a href=\"#/01-emergency/cpr\">CPR (Adult)<\/a><\/li>\n<li><a href=\"#/01-emergency/choking\">Choking<\/a><\/li>\n<li><a href=\"#/01-emergency/burns\">Burns<\/a><\/li>\n<li><a href=\"#/01-emergency/shock\">Shock<\/a><\/li>\n<li><a href=\"#/01-emergency/carbon-monoxide\">Carbon Monoxide Poisoning<\/a><\/li>\n<\/ul>\n<h2 id=\"disaster-is-happening\">Disaster is happening<\/h2>\n<ul>\n<li><a href=\"#/01-emergency/earthquake\">Earthquake<\/a><\/li>\n<li><a href=\"#/01-emergency/flood\">Flood<\/a><\/li>\n<li><a href=\"#/01-emergency/home-fire\">Fire in the Home<\/a><\/li>\n<li><a href=\"#/01-emergency/gas-leak\">Gas Leak<\/a><\/li>\n<li><a href=\"#/01-emergency/power-outage\">Power Outage<\/a><\/li>\n<\/ul>\n<h2 id=\"to-add\">To add<\/h2>\n<ul>\n<li>CPR and choking for infants and children<\/li>\n<li>Severe allergic reaction (anaphylaxis)<\/li>\n<li>Hurricane, tornado, wildfire, extreme heat and cold<\/li>\n<\/ul>","text":"01 · Emergency Short, urgent pages for the first minutes. Read these first. Someone is hurt Severe Bleeding CPR (Adult) Choking Burns Shock Carbon Monoxide Poisoning Disaster is happening Earthquake Flood Fire in the Home Gas Leak Power Outage To add CPR and choking for infants and children Severe allergic reaction (anaphylaxis) Hurricane, tornado, wildfire, extreme heat and cold"},"01-emergency/burns":{"title":"Burns","folder":"01-emergency","html":"<h1 id=\"burns\">Burns<\/h1>\n<blockquote>\n<p><strong>Australian advice:<\/strong> cool the burn under <strong>cool running water for at least\n20 minutes<\/strong>, as soon as possible. It still helps up to <strong>3 hours<\/strong> after the\nburn. Chemical burns: remove contaminated clothing and rinse for up to 60\nminutes. Cover with a light, loose, non-stick dressing; <strong>cling film<\/strong> works\nwell, <strong>but not on the face<\/strong>. Call <strong>000<\/strong> for deep burns, burns to the face,\nhands or genitals, chemical or electrical burns, or any breathing difficulty.<\/p>\n<\/blockquote>\n<h2 id=\"if-someone-is-on-fire\">If someone is on fire<\/h2>\n<p><strong>Stop, drop and roll.<\/strong> Wrap them in something thick (a wool or cotton coat,\nrug or blanket) to smother the flames, and pour water on them.<\/p>\n<p><img alt=\"Wrapping a person in a coat to smother flames\" loading=\"lazy\" src=\"01-emergency/images/burns-smother-flames.png\" />\n<img alt=\"Person covered and rolled on the ground\" loading=\"lazy\" src=\"01-emergency/images/burns-roll-on-ground.png\" /><\/p>\n<p><em>Smother the flames and roll them on the ground.<\/em><\/p>\n<p><strong>Electrical burn:<\/strong> don't touch the person while they may still be in contact\nwith power. Push them away from the source with something <strong>non-metal and\ndry<\/strong> (a wooden broom handle, for example).<\/p>\n<p><img alt=\"Using a dry wooden pole to push a person away from an electric wire\" loading=\"lazy\" src=\"01-emergency/images/burns-electrical-push-away.png\" /><\/p>\n<h2 id=\"is-it-serious-get-emergency-help-if\">Is it serious? Get emergency help if:<\/h2>\n<ul>\n<li>The burn is <strong>about the size of your palm or bigger<\/strong><\/li>\n<li>It's a deep (full-thickness) burn<\/li>\n<li>It was caused by <strong>chemicals or electricity<\/strong><\/li>\n<li>The person <strong>breathed in smoke<\/strong>, or shows signs of <strong>shock<\/strong> (see\n    <a href=\"#/01-emergency/shock\">shock.md<\/a>)<\/li>\n<li>You aren't sure how bad it is<\/li>\n<\/ul>\n<h2 id=\"minor-burn-small-skin-not-broken\">Minor burn (small, skin not broken)<\/h2>\n<ol>\n<li><strong>Cool it<\/strong> under cool running water, or soak it in cool water (<strong>not ice\n    water<\/strong>), for <strong>5 to 30 minutes<\/strong>.<\/li>\n<li>Cover it loosely with a dry, sterile bandage or clean cloth. Protect it from\n    rubbing and pressure.<\/li>\n<li>For pain, ibuprofen or acetaminophen (paracetamol) can help.\n    <strong>No aspirin for anyone under 19.<\/strong><\/li>\n<li>Once cooled, an aloe lotion can soothe it. If the skin is broken, use an\n    antibiotic ointment so the bandage doesn't stick.<\/li>\n<li>Check that their tetanus vaccination is up to date.<\/li>\n<\/ol>\n<h2 id=\"major-burn\">Major burn<\/h2>\n<ol>\n<li>Make sure they are no longer touching anything burning or smoking.<\/li>\n<li>Check their breathing. Start CPR if needed (see <a href=\"#/01-emergency/cpr\">cpr.md<\/a>).<\/li>\n<li>Cover the burn with a <strong>dry<\/strong> sterile bandage or clean cloth.<\/li>\n<li>Burned fingers or toes: separate them with dry, non-stick dressings.<\/li>\n<li>Raise the burned area <strong>above heart level<\/strong> if possible, and protect it from\n    pressure.<\/li>\n<li><strong>Prevent shock:<\/strong> if there's no head, neck, back or leg injury, lay them\n    flat, raise their feet about <strong>12 inches (30 cm)<\/strong>, and cover them with a\n    blanket.<\/li>\n<li>Keep watching their breathing until help arrives.<\/li>\n<\/ol>\n<h2 id=\"dont\">Don't<\/h2>\n<ul>\n<li><strong>Don't put butter, oil, ice, creams, sprays or home remedies<\/strong> on a severe\n    burn.<\/li>\n<li><strong>Don't put a severe burn in cold water.<\/strong> It can cause shock.<\/li>\n<li>Don't break blisters or remove dead skin.<\/li>\n<li>Don't pull off clothing that is stuck to the burn.<\/li>\n<li>Don't breathe, blow or cough on the burn.<\/li>\n<li>Don't give food or drink to someone with a severe burn.<\/li>\n<li>If the airway may be burned, don't put a pillow under their head.<\/li>\n<\/ul>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>MedlinePlus (US National Library of Medicine), Burns:\n    https://medlineplus.gov/ency/article/000030.htm<\/li>\n<li>healthdirect (Australian Government), Burns and scalds:\n    https://www.healthdirect.gov.au/burns-and-scalds<\/li>\n<li>Drawings: see <a href=\"#/01-emergency/images/CREDITS\">images/CREDITS.md<\/a><\/li>\n<\/ul>","text":"Burns Australian advice: cool the burn under cool running water for at least 20 minutes , as soon as possible. It still helps up to 3 hours after the burn. Chemical burns: remove contaminated clothing and rinse for up to 60 minutes. Cover with a light, loose, non-stick dressing; cling film works well, but not on the face . Call 000 for deep burns, burns to the face, hands or genitals, chemical or electrical burns, or any breathing difficulty. If someone is on fire Stop, drop and roll. Wrap them in something thick (a wool or cotton coat, rug or blanket) to smother the flames, and pour water on them. Smother the flames and roll them on the ground. Electrical burn: don't touch the person while they may still be in contact with power. Push them away from the source with something non-metal and dry (a wooden broom handle, for example). Is it serious? Get emergency help if: The burn is about the size of your palm or bigger It's a deep (full-thickness) burn It was caused by chemicals or electricity The person breathed in smoke , or shows signs of shock (see shock.md ) You aren't sure how bad it is Minor burn (small, skin not broken) Cool it under cool running water, or soak it in cool water ( not ice water ), for 5 to 30 minutes . Cover it loosely with a dry, sterile bandage or clean cloth. Protect it from rubbing and pressure. For pain, ibuprofen or acetaminophen (paracetamol) can help. No aspirin for anyone under 19. Once cooled, an aloe lotion can soothe it. If the skin is broken, use an antibiotic ointment so the bandage doesn't stick. Check that their tetanus vaccination is up to date. Major burn Make sure they are no longer touching anything burning or smoking. Check their breathing. Start CPR if needed (see cpr.md ). Cover the burn with a dry sterile bandage or clean cloth. Burned fingers or toes: separate them with dry, non-stick dressings. Raise the burned area above heart level if possible, and protect it from pressure. Prevent shock: if there's no head, neck, back or leg injury, lay them flat, raise their feet about 12 inches (30 cm) , and cover them with a blanket. Keep watching their breathing until help arrives. Don't Don't put butter, oil, ice, creams, sprays or home remedies on a severe burn. Don't put a severe burn in cold water. It can cause shock. Don't break blisters or remove dead skin. Don't pull off clothing that is stuck to the burn. Don't breathe, blow or cough on the burn. Don't give food or drink to someone with a severe burn. If the airway may be burned, don't put a pillow under their head. Sources (checked 2026-11-01) MedlinePlus (US National Library of Medicine), Burns: https://medlineplus.gov/ency/article/000030.htm healthdirect (Australian Government), Burns and scalds: https://www.healthdirect.gov.au/burns-and-scalds Drawings: see images/CREDITS.md"},"01-emergency/carbon-monoxide":{"title":"Carbon Monoxide (CO) Poisoning","folder":"01-emergency","html":"<h1 id=\"carbon-monoxide-co-poisoning\">Carbon Monoxide (CO) Poisoning<\/h1>\n<p>Carbon monoxide has <strong>no smell and no color<\/strong>. It comes from anything that\nburns fuel: generators, gas stoves and heaters, grills, car engines. The risk\nis highest during power outages, when people are tempted to use these indoors.<\/p>\n<h2 id=\"signs\">Signs<\/h2>\n<ul>\n<li><strong>Early:<\/strong> like the flu but <strong>without a fever<\/strong>: headache, tiredness,\n    shortness of breath, nausea, dizziness<\/li>\n<li><strong>Severe:<\/strong> confusion, vomiting, loss of coordination, passing out, death<\/li>\n<\/ul>\n<h2 id=\"if-you-suspect-co-or-a-co-alarm-goes-off\">If you suspect CO, or a CO alarm goes off<\/h2>\n<ol>\n<li><strong>Get everyone outside into fresh air immediately.<\/strong> Don't look for the\n    source. Staying inside can be fatal.<\/li>\n<li><strong>Count heads.<\/strong> Make sure everyone is out.<\/li>\n<li><strong>Call emergency services<\/strong> (911 in the US) from outside or a neighbor's\n    home.<\/li>\n<li><strong>See a doctor<\/strong> right away and say you suspect CO poisoning.<\/li>\n<li><strong>Don't go back in<\/strong> until emergency responders say it's safe.<\/li>\n<li>Don't use the suspected appliance again until a qualified technician has\n    checked it.<\/li>\n<\/ol>\n<p><strong>Never ignore a CO alarm.<\/strong> If it goes off again within 24 hours of going\nback in, repeat these steps and have all fuel-burning equipment inspected.<\/p>\n<h2 id=\"prevent-it\">Prevent it<\/h2>\n<ul>\n<li>Run generators <strong>only outdoors<\/strong>, at least <strong>20 feet (6 m)<\/strong> from windows,\n    doors and attached garages.<\/li>\n<li><strong>Never<\/strong> heat your home with a gas stove or oven.<\/li>\n<li>Put a working CO alarm (battery-powered or with battery backup) on <strong>every\n    level<\/strong> of your home.<\/li>\n<\/ul>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>US Consumer Product Safety Commission, Carbon Monoxide Questions and Answers:\n    https://www.cpsc.gov/Safety-Education/Safety-Education-Centers/Carbon-Monoxide-Information-Center/Carbon-Monoxide-Questions-and-Answers<\/li>\n<li>Ready.gov, Power Outages: https://www.ready.gov/power-outages<\/li>\n<\/ul>","text":"Carbon Monoxide (CO) Poisoning Carbon monoxide has no smell and no color . It comes from anything that burns fuel: generators, gas stoves and heaters, grills, car engines. The risk is highest during power outages, when people are tempted to use these indoors. Signs Early: like the flu but without a fever : headache, tiredness, shortness of breath, nausea, dizziness Severe: confusion, vomiting, loss of coordination, passing out, death If you suspect CO, or a CO alarm goes off Get everyone outside into fresh air immediately. Don't look for the source. Staying inside can be fatal. Count heads. Make sure everyone is out. Call emergency services (911 in the US) from outside or a neighbor's home. See a doctor right away and say you suspect CO poisoning. Don't go back in until emergency responders say it's safe. Don't use the suspected appliance again until a qualified technician has checked it. Never ignore a CO alarm. If it goes off again within 24 hours of going back in, repeat these steps and have all fuel-burning equipment inspected. Prevent it Run generators only outdoors , at least 20 feet (6 m) from windows, doors and attached garages. Never heat your home with a gas stove or oven. Put a working CO alarm (battery-powered or with battery backup) on every level of your home. Sources (checked 2026-11-01) US Consumer Product Safety Commission, Carbon Monoxide Questions and Answers: https://www.cpsc.gov/Safety-Education/Safety-Education-Centers/Carbon-Monoxide-Information-Center/Carbon-Monoxide-Questions-and-Answers Ready.gov, Power Outages: https://www.ready.gov/power-outages"},"01-emergency/choking":{"title":"Choking (Adults and Children Over 1 Year)","folder":"01-emergency","html":"<h1 id=\"choking-adults-and-children-over-1-year\">Choking (Adults and Children Over 1 Year)<\/h1>\n<blockquote>\n<p><strong>In Australia, the official advice is different:<\/strong> use <strong>back blows and\nchest thrusts, not abdominal thrusts<\/strong> (abdominal thrusts can break ribs and\ndamage organs). See <a href=\"#/01-emergency/choking~australian-method\">Australian method<\/a> below.<\/p>\n<\/blockquote>\n<h2 id=\"is-it-really-choking\">Is it really choking?<\/h2>\n<p>Ask: <strong>\"Are you choking? Can you speak?\"<\/strong><\/p>\n<p>If they can <strong>cough hard, speak or breathe<\/strong>, don't interfere. Coughing is the\nbest way to clear it. Stay with them and be ready to act if it gets worse.<\/p>\n<p><img alt=\"A man clutching his throat with both hands\" loading=\"lazy\" src=\"01-emergency/images/choking-universal-sign.png\" /><\/p>\n<p><em>Hands at the throat: the universal sign of choking.<\/em><\/p>\n<h2 id=\"if-they-cant-speak-cough-or-breathe\">If they can't speak, cough or breathe<\/h2>\n<p>Repeat <strong>5 back blows, then 5 abdominal thrusts<\/strong>, until the object comes out\nor the person passes out.<\/p>\n<p><strong>Back blows<\/strong><\/p>\n<ol>\n<li>Stand behind them, supporting their chest with one arm.<\/li>\n<li>Lean them forward until their chest is about level with the ground.<\/li>\n<li>Give a firm blow <strong>between the shoulder blades<\/strong> with the heel of your\n    other hand.<\/li>\n<\/ol>\n<p><strong>Abdominal thrusts (Heimlich maneuver)<\/strong><\/p>\n<ol>\n<li>Stand behind them and wrap your arms around their waist.<\/li>\n<li>Make a fist. Put the <strong>thumb side just above the belly button<\/strong>, well\n    below the breastbone.<\/li>\n<li>Grab the fist with your other hand and pull <strong>quickly inward and upward<\/strong>.<\/li>\n<\/ol>\n<p><img alt=\"Rescuer behind the person, arms around the waist, fist above the belly button\" loading=\"lazy\" src=\"01-emergency/images/choking-abdominal-thrust.png\" /><\/p>\n<p><em>Abdominal thrust (US method).<\/em><\/p>\n<p><strong>Pregnant or very large person:<\/strong> use <strong>chest thrusts<\/strong> instead. Put your\nfist on the middle of the breastbone and push firmly backward.<\/p>\n<h2 id=\"if-they-pass-out\">If they pass out<\/h2>\n<ol>\n<li>Shout for help, and have someone call your local emergency number.<\/li>\n<li>Lower them carefully to a firm, flat surface.<\/li>\n<li><strong>Start CPR<\/strong> (see <a href=\"#/01-emergency/cpr\">cpr.md<\/a>). Chest compressions, not abdominal\n    thrusts, are used for someone who is unconscious.<\/li>\n<li>Before each set of breaths, <strong>look in the mouth<\/strong>. If you can see a\n    <strong>loose<\/strong> object, take it out. Don't reach for something stuck deep in the\n    throat.<\/li>\n<li>Keep going until they breathe on their own or help arrives.<\/li>\n<\/ol>\n<h2 id=\"dont\">Don't<\/h2>\n<ul>\n<li>Don't force open the mouth of a conscious person to grab the object.<\/li>\n<li>Don't do anything while they are coughing strongly, talking or breathing well.<\/li>\n<\/ul>\n<blockquote>\n<p>Infants under 1 year need a different technique. Learn it in a first-aid\ncourse.<\/p>\n<\/blockquote>\n<h2 id=\"australian-method\">Australian method<\/h2>\n<p>If coughing doesn't clear it, <strong>call 000<\/strong> (112 from a mobile) for an\nambulance, then:<\/p>\n<ol>\n<li><strong>Up to 5 back blows:<\/strong> sharp blows between the shoulder blades with the\n    heel of your hand, with the person leaning forward (not upright). Check\n    after each blow whether it has cleared.<\/li>\n<li>\n<p><strong>Up to 5 chest thrusts:<\/strong> heel of your hand on the <strong>lower half of the\n    breastbone<\/strong>; press hard into the chest with a quick thrust. Check after\n    each one.<\/p>\n<p><img alt=\"Rescuer behind the person, hands on the middle of the chest\" loading=\"lazy\" src=\"01-emergency/images/choking-chest-thrust.png\" /><\/p>\n<p><em>Chest thrust (US Army drawing). Australian method: the heel of your hand\non the lower half of the breastbone.<\/em>\n3. <strong>Keep alternating<\/strong> 5 back blows and 5 chest thrusts until it clears or\nhelp arrives.\n4. If they turn blue, go limp or pass out: <strong>start CPR, beginning with\ncompressions.<\/strong><\/p>\n<\/li>\n<\/ol>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>healthdirect (Australian Government), Choking (Australian method):\n    https://www.healthdirect.gov.au/choking<\/li>\n<li>MedlinePlus (US National Library of Medicine), Choking – adult or child over\n    1 year: https://medlineplus.gov/ency/article/000049.htm<\/li>\n<li>Drawings: see <a href=\"#/01-emergency/images/CREDITS\">images/CREDITS.md<\/a><\/li>\n<\/ul>","text":"Choking (Adults and Children Over 1 Year) In Australia, the official advice is different: use back blows and chest thrusts, not abdominal thrusts (abdominal thrusts can break ribs and damage organs). See Australian method below. Is it really choking? Ask: \"Are you choking? Can you speak?\" If they can cough hard, speak or breathe , don't interfere. Coughing is the best way to clear it. Stay with them and be ready to act if it gets worse. Hands at the throat: the universal sign of choking. If they can't speak, cough or breathe Repeat 5 back blows, then 5 abdominal thrusts , until the object comes out or the person passes out. Back blows Stand behind them, supporting their chest with one arm. Lean them forward until their chest is about level with the ground. Give a firm blow between the shoulder blades with the heel of your other hand. Abdominal thrusts (Heimlich maneuver) Stand behind them and wrap your arms around their waist. Make a fist. Put the thumb side just above the belly button , well below the breastbone. Grab the fist with your other hand and pull quickly inward and upward . Abdominal thrust (US method). Pregnant or very large person: use chest thrusts instead. Put your fist on the middle of the breastbone and push firmly backward. If they pass out Shout for help, and have someone call your local emergency number. Lower them carefully to a firm, flat surface. Start CPR (see cpr.md ). Chest compressions, not abdominal thrusts, are used for someone who is unconscious. Before each set of breaths, look in the mouth . If you can see a loose object, take it out. Don't reach for something stuck deep in the throat. Keep going until they breathe on their own or help arrives. Don't Don't force open the mouth of a conscious person to grab the object. Don't do anything while they are coughing strongly, talking or breathing well. Infants under 1 year need a different technique. Learn it in a first-aid course. Australian method If coughing doesn't clear it, call 000 (112 from a mobile) for an ambulance, then: Up to 5 back blows: sharp blows between the shoulder blades with the heel of your hand, with the person leaning forward (not upright). Check after each blow whether it has cleared. Up to 5 chest thrusts: heel of your hand on the lower half of the breastbone ; press hard into the chest with a quick thrust. Check after each one. Chest thrust (US Army drawing). Australian method: the heel of your hand on the lower half of the breastbone. 3. Keep alternating 5 back blows and 5 chest thrusts until it clears or help arrives. 4. If they turn blue, go limp or pass out: start CPR, beginning with compressions. Sources (checked 2026-11-01) healthdirect (Australian Government), Choking (Australian method): https://www.healthdirect.gov.au/choking MedlinePlus (US National Library of Medicine), Choking – adult or child over 1 year: https://medlineplus.gov/ency/article/000049.htm Drawings: see images/CREDITS.md"},"01-emergency/cpr":{"title":"CPR (Adult)","folder":"01-emergency","html":"<h1 id=\"cpr-adult\">CPR (Adult)<\/h1>\n<p>For an adult who is <strong>unresponsive and not breathing normally<\/strong>.<\/p>\n<blockquote>\n<p><strong>Do not<\/strong> start chest compressions if the person is breathing normally,\ncoughing or moving. It can stop a heart that is still beating.<\/p>\n<\/blockquote>\n<h2 id=\"steps\">Steps<\/h2>\n<ol>\n<li><strong>Check if they respond.<\/strong> Tap or gently shake them and shout \"Are you OK?\"<\/li>\n<li><strong>Get help.<\/strong> If there is no response, call your local emergency number (or\n    have someone call). If you <strong>know<\/strong> there is an AED (defibrillator) nearby,\n    send someone for it. Don't leave the person to search for one.<\/li>\n<li><strong>Lay them on their back<\/strong> on a firm, flat surface. If a spine injury is\n    possible, use two people to move them.<\/li>\n<li><strong>Hand position:<\/strong> heel of one hand in the <strong>center of the chest, between\n    the nipples<\/strong>, other hand on top, fingers interlaced. Lock your elbows and\n    keep your shoulders directly over your hands.<\/li>\n<li><strong>Push hard and fast:<\/strong><ul>\n<li><strong>Depth:<\/strong> about <strong>2 inches (5 cm)<\/strong><\/li>\n<li><strong>Rate:<\/strong> <strong>100 to 120 per minute<\/strong><\/li>\n<li>Let the chest come all the way back up after each push.<\/li>\n<\/ul>\n<\/li>\n<li>\n<p>After <strong>30 compressions<\/strong>, give <strong>2 rescue breaths<\/strong>:<\/p>\n<ul>\n<li>Tilt the head back (hand on forehead) and lift the chin with two fingers.<\/li>\n<li>Pinch the nose, seal your mouth over theirs, and breathe for about\n <strong>1 second<\/strong> each, enough to make the chest rise.<\/li>\n<li>Keep the pause for breaths <strong>under 10 seconds<\/strong>.<\/li>\n<\/ul>\n<p><img alt=\"Opening the airway: one hand tilts the head back, two fingers lift the chin\" loading=\"lazy\" src=\"01-emergency/images/cpr-head-tilt-chin-lift.png\" />\n<img alt=\"Rescue breath: nose pinched, mouth sealed over the person's mouth\" loading=\"lazy\" src=\"01-emergency/images/cpr-rescue-breathing.png\" /><\/p>\n<p><em>Head tilt and chin lift, then a rescue breath.<\/em><\/p>\n<\/li>\n<li>\n<p><strong>Repeat 30 compressions : 2 breaths.<\/strong> With two or more rescuers, swap the\n    person doing compressions every <strong>2 minutes<\/strong> (about 5 cycles). It's tiring.<\/p>\n<\/li>\n<li><strong>Use the AED as soon as it arrives.<\/strong> Turn it on and do exactly what it\n    says.<\/li>\n<\/ol>\n<h2 id=\"when-to-stop\">When to stop<\/h2>\n<p>Keep going until the person starts breathing and moving again, or until\ntrained help takes over.<\/p>\n<p>If they start breathing, roll them onto their side (recovery position) and\nkeep checking their breathing until help arrives.<\/p>\n<p><img alt=\"Person lying on their side, top knee bent, head resting on their hand\" loading=\"lazy\" src=\"01-emergency/images/recovery-position.png\" /><\/p>\n<p><em>Recovery position.<\/em><\/p>\n<h2 id=\"special-cases\">Special cases<\/h2>\n<ul>\n<li><strong>Suspected opioid overdose:<\/strong> if naloxone (Narcan) is available, give it,\n    but don't stop CPR to do so.<\/li>\n<li>\n<p><strong>Suspected spine injury:<\/strong> open the airway by pulling the jaw forward\n    instead of tilting the head.<\/p>\n<p><img alt=\"Jaw thrust: fingers behind the angles of the jaw push it forward\" loading=\"lazy\" src=\"01-emergency/images/cpr-jaw-thrust.png\" /><\/p>\n<\/li>\n<li>\n<p><strong>Not a health professional?<\/strong> Don't spend time checking for a pulse.<\/p>\n<\/li>\n<\/ul>\n<h2 id=\"in-australia-drsabcd\">In Australia: DRSABCD<\/h2>\n<p>The same 30 compressions : 2 breaths at 100–120 per minute, remembered as\n<strong>DRSABCD<\/strong>:<\/p>\n<ul>\n<li><strong>D<\/strong>anger: make sure it's safe for you.<\/li>\n<li><strong>R<\/strong>esponse: loudly ask their name, squeeze their shoulders.<\/li>\n<li><strong>S<\/strong>end for help: call <strong>000<\/strong> (112 from a mobile). Don't leave them.<\/li>\n<li><strong>A<\/strong>irway: check the mouth; tilt the head back and lift the chin.<\/li>\n<li><strong>B<\/strong>reathing: look, listen and feel for 10 seconds.<\/li>\n<li><strong>C<\/strong>PR: press down about <strong>one third of the chest depth<\/strong>; 30:2, about\n    5 cycles every 2 minutes. <strong>Can't give breaths? Do compressions only\n    without stopping.<\/strong> It may still save a life.<\/li>\n<li><strong>D<\/strong>efibrillation: attach an AED as soon as one arrives and follow its\n    voice prompts. Don't stop compressions to go and get one. Pads: upper right\n    chest below the collarbone, and left side under the armpit.<\/li>\n<\/ul>\n<h2 id=\"be-ready\">Be ready<\/h2>\n<p>CPR is a physical skill. Take a hands-on course (Red Cross, American Heart\nAssociation, or your local fire department) while you can.<\/p>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>MedlinePlus (US National Library of Medicine), CPR – adults and children\n    after onset of puberty: https://medlineplus.gov/ency/article/000013.htm<\/li>\n<li>healthdirect (Australian Government), How to perform CPR:\n    https://www.healthdirect.gov.au/how-to-perform-cpr<\/li>\n<li>Drawings: see <a href=\"#/01-emergency/images/CREDITS\">images/CREDITS.md<\/a><\/li>\n<\/ul>","text":"CPR (Adult) For an adult who is unresponsive and not breathing normally . Do not start chest compressions if the person is breathing normally, coughing or moving. It can stop a heart that is still beating. Steps Check if they respond. Tap or gently shake them and shout \"Are you OK?\" Get help. If there is no response, call your local emergency number (or have someone call). If you know there is an AED (defibrillator) nearby, send someone for it. Don't leave the person to search for one. Lay them on their back on a firm, flat surface. If a spine injury is possible, use two people to move them. Hand position: heel of one hand in the center of the chest, between the nipples , other hand on top, fingers interlaced. Lock your elbows and keep your shoulders directly over your hands. Push hard and fast: Depth: about 2 inches (5 cm) Rate: 100 to 120 per minute Let the chest come all the way back up after each push. After 30 compressions , give 2 rescue breaths : Tilt the head back (hand on forehead) and lift the chin with two fingers. Pinch the nose, seal your mouth over theirs, and breathe for about 1 second each, enough to make the chest rise. Keep the pause for breaths under 10 seconds . Head tilt and chin lift, then a rescue breath. Repeat 30 compressions : 2 breaths. With two or more rescuers, swap the person doing compressions every 2 minutes (about 5 cycles). It's tiring. Use the AED as soon as it arrives. Turn it on and do exactly what it says. When to stop Keep going until the person starts breathing and moving again, or until trained help takes over. If they start breathing, roll them onto their side (recovery position) and keep checking their breathing until help arrives. Recovery position. Special cases Suspected opioid overdose: if naloxone (Narcan) is available, give it, but don't stop CPR to do so. Suspected spine injury: open the airway by pulling the jaw forward instead of tilting the head. Not a health professional? Don't spend time checking for a pulse. In Australia: DRSABCD The same 30 compressions : 2 breaths at 100–120 per minute, remembered as DRSABCD : D anger: make sure it's safe for you. R esponse: loudly ask their name, squeeze their shoulders. S end for help: call 000 (112 from a mobile). Don't leave them. A irway: check the mouth; tilt the head back and lift the chin. B reathing: look, listen and feel for 10 seconds. C PR: press down about one third of the chest depth ; 30:2, about 5 cycles every 2 minutes. Can't give breaths? Do compressions only without stopping. It may still save a life. D efibrillation: attach an AED as soon as one arrives and follow its voice prompts. Don't stop compressions to go and get one. Pads: upper right chest below the collarbone, and left side under the armpit. Be ready CPR is a physical skill. Take a hands-on course (Red Cross, American Heart Association, or your local fire department) while you can. Sources (checked 2026-11-01) MedlinePlus (US National Library of Medicine), CPR – adults and children after onset of puberty: https://medlineplus.gov/ency/article/000013.htm healthdirect (Australian Government), How to perform CPR: https://www.healthdirect.gov.au/how-to-perform-cpr Drawings: see images/CREDITS.md"},"01-emergency/earthquake":{"title":"Earthquake","folder":"01-emergency","html":"<h1 id=\"earthquake\">Earthquake<\/h1>\n<h2 id=\"during-the-shaking-drop-cover-hold-on\">During the shaking: Drop, Cover, Hold On<\/h2>\n<ol>\n<li><strong>Drop<\/strong> to your hands and knees.<\/li>\n<li><strong>Cover<\/strong> your head and neck with one arm and hand.<\/li>\n<li><strong>Hold on<\/strong> until the shaking stops.<\/li>\n<\/ol>\n<p><img alt=\"Pictogram in three steps: drop to the floor, cover under a table, hold on\" loading=\"lazy\" src=\"01-emergency/images/earthquake-drop-cover-hold.png\" /><\/p>\n<p><strong>Where you are:<\/strong><\/p>\n<ul>\n<li><strong>Inside:<\/strong> stay inside. <strong>Don't run outside, and avoid doorways.<\/strong><\/li>\n<li><strong>In bed:<\/strong> turn face down and cover your head and neck with a pillow.<\/li>\n<li><strong>In a car:<\/strong> pull over, stop, and set the parking brake.<\/li>\n<li><strong>Outside:<\/strong> stay outside. Move to an open area away from buildings, trees,\n    streetlights and power lines.<\/li>\n<\/ul>\n<h2 id=\"right-after\">Right after<\/h2>\n<ul>\n<li><strong>Expect aftershocks.<\/strong> Drop, Cover and Hold On again each time.<\/li>\n<li><strong>Check yourself for injuries first<\/strong>, then help others if you can (see\n    <a href=\"#/01-emergency/severe-bleeding\">severe-bleeding.md<\/a>, <a href=\"#/01-emergency/cpr\">cpr.md<\/a>).<\/li>\n<li><strong>If the building is damaged, get out<\/strong> and stay well away from it. <strong>Don't\n    go into damaged buildings.<\/strong><\/li>\n<li><strong>Near the coast?<\/strong> Go inland or to higher ground <strong>as soon as the shaking\n    stops<\/strong>. A tsunami can follow.<\/li>\n<li><strong>Smell gas?<\/strong> See <a href=\"#/01-emergency/gas-leak\">gas-leak.md<\/a>.<\/li>\n<\/ul>\n<h2 id=\"if-you-are-trapped\">If you are trapped<\/h2>\n<ul>\n<li>Send a text message, or <strong>bang on a pipe or wall<\/strong> so rescuers can hear you.<\/li>\n<li>Use a <strong>whistle<\/strong> instead of shouting.<\/li>\n<li>Cover your mouth with your shirt to filter dust.<\/li>\n<\/ul>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>Ready.gov, Earthquakes: https://www.ready.gov/earthquakes<\/li>\n<li>Pictogram: see <a href=\"#/01-emergency/images/CREDITS\">images/CREDITS.md<\/a><\/li>\n<\/ul>","text":"Earthquake During the shaking: Drop, Cover, Hold On Drop to your hands and knees. Cover your head and neck with one arm and hand. Hold on until the shaking stops. Where you are: Inside: stay inside. Don't run outside, and avoid doorways. In bed: turn face down and cover your head and neck with a pillow. In a car: pull over, stop, and set the parking brake. Outside: stay outside. Move to an open area away from buildings, trees, streetlights and power lines. Right after Expect aftershocks. Drop, Cover and Hold On again each time. Check yourself for injuries first , then help others if you can (see severe-bleeding.md , cpr.md ). If the building is damaged, get out and stay well away from it. Don't go into damaged buildings. Near the coast? Go inland or to higher ground as soon as the shaking stops . A tsunami can follow. Smell gas? See gas-leak.md . If you are trapped Send a text message, or bang on a pipe or wall so rescuers can hear you. Use a whistle instead of shouting. Cover your mouth with your shirt to filter dust. Sources (checked 2026-11-01) Ready.gov, Earthquakes: https://www.ready.gov/earthquakes Pictogram: see images/CREDITS.md"},"01-emergency/flood":{"title":"Flood","folder":"01-emergency","html":"<h1 id=\"flood\">Flood<\/h1>\n<blockquote>\n<p><strong>Turn Around, Don't Drown!<\/strong>\n<strong>6 inches (15 cm)<\/strong> of moving water can knock you down.\n<strong>1 foot (30 cm)<\/strong> of moving water can sweep a car away.<\/p>\n<\/blockquote>\n<h2 id=\"during-a-flood\">During a flood<\/h2>\n<ul>\n<li><strong>If told to evacuate, go immediately.<\/strong><\/li>\n<li><strong>Don't walk, swim or drive through floodwater.<\/strong><\/li>\n<li>Don't drive around barricades. They are there to keep you out of flooded\n    areas.<\/li>\n<li>Stay off bridges over fast-moving water. They can wash away without warning.<\/li>\n<\/ul>\n<p><strong>If you're trapped:<\/strong><\/p>\n<ul>\n<li><strong>In a car in fast-moving water:<\/strong> stay inside. If water rises inside the\n    car, get onto the roof.<\/li>\n<li><strong>In a building:<\/strong> go to the highest level. <strong>Don't climb into a closed\n    attic<\/strong>, where you can be trapped by rising water. Go onto the roof only if\n    necessary, and signal for help.<\/li>\n<\/ul>\n<h2 id=\"after-a-flood\">After a flood<\/h2>\n<ul>\n<li><strong>Go home only when authorities say it is safe.<\/strong><\/li>\n<li>Avoid driving unless it's an emergency.<\/li>\n<li><strong>Stay out of floodwater.<\/strong> It can be contaminated, hide sharp debris, and be\n    <strong>electrically charged<\/strong> by downed or underground power lines.<\/li>\n<li><strong>Don't touch electrical equipment if it's wet or you're standing in water.<\/strong>\n    Turn off the electricity only if it's safe to do so.<\/li>\n<li>Watch for snakes and other animals in your home.<\/li>\n<li>Run generators <strong>only outdoors<\/strong>, away from windows (see\n    <a href=\"#/01-emergency/carbon-monoxide\">carbon-monoxide.md<\/a>).<\/li>\n<li><strong>Cleanup:<\/strong> wear heavy gloves, protective clothing and boots. Children\n    shouldn't help. People with asthma, other lung conditions or weak immune\n    systems should stay out of buildings with mold or water leaks.<\/li>\n<li>Drinking water may be unsafe; see\n    <a href=\"#/03-water/making-water-safe\">../03-water/making-water-safe.md<\/a>.<\/li>\n<\/ul>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>Ready.gov, Floods: https://www.ready.gov/floods<\/li>\n<\/ul>","text":"Flood Turn Around, Don't Drown! 6 inches (15 cm) of moving water can knock you down. 1 foot (30 cm) of moving water can sweep a car away. During a flood If told to evacuate, go immediately. Don't walk, swim or drive through floodwater. Don't drive around barricades. They are there to keep you out of flooded areas. Stay off bridges over fast-moving water. They can wash away without warning. If you're trapped: In a car in fast-moving water: stay inside. If water rises inside the car, get onto the roof. In a building: go to the highest level. Don't climb into a closed attic , where you can be trapped by rising water. Go onto the roof only if necessary, and signal for help. After a flood Go home only when authorities say it is safe. Avoid driving unless it's an emergency. Stay out of floodwater. It can be contaminated, hide sharp debris, and be electrically charged by downed or underground power lines. Don't touch electrical equipment if it's wet or you're standing in water. Turn off the electricity only if it's safe to do so. Watch for snakes and other animals in your home. Run generators only outdoors , away from windows (see carbon-monoxide.md ). Cleanup: wear heavy gloves, protective clothing and boots. Children shouldn't help. People with asthma, other lung conditions or weak immune systems should stay out of buildings with mold or water leaks. Drinking water may be unsafe; see ../03-water/making-water-safe.md . Sources (checked 2026-11-01) Ready.gov, Floods: https://www.ready.gov/floods"},"01-emergency/gas-leak":{"title":"Gas Leak","folder":"01-emergency","html":"<h1 id=\"gas-leak\">Gas Leak<\/h1>\n<h2 id=\"signs\">Signs<\/h2>\n<ul>\n<li><strong>Smell:<\/strong> natural gas has an added <strong>\"rotten egg\"<\/strong> smell. Near pipelines\n    you may also smell petroleum or another unusual odor.<\/li>\n<li><strong>Sound:<\/strong> an unusual <strong>hissing or roaring<\/strong>.<\/li>\n<li><strong>Sight (outdoors, near pipelines):<\/strong> dead or discolored plants, pooled\n    liquid, or a cloud of vapor or mist.<\/li>\n<\/ul>\n<h2 id=\"do\">Do<\/h2>\n<ol>\n<li><strong>Make sure gas appliances are turned all the way OFF<\/strong> (only on your way\n    out; don't search for the leak).<\/li>\n<li><strong>Leave the area on foot<\/strong>, right away.<\/li>\n<li><strong>Call emergency services (911 in the US) from a neighbor's house or\n    somewhere well away from the leak.<\/strong> Then call your gas company if you know\n    the number.<\/li>\n<li><strong>Explain the situation<\/strong>: your name, phone number, what happened and where.<\/li>\n<li><strong>Warn others<\/strong>, only if it's safe, to stay away and not create sparks.<\/li>\n<\/ol>\n<h2 id=\"dont\">Don't<\/h2>\n<p>Anything that makes a spark can ignite the gas:<\/p>\n<ul>\n<li><strong>Don't turn any light switches, garage door openers or other electrical\n    switches on or off.<\/strong><\/li>\n<li><strong>Don't use a phone or cell phone near the leak.<\/strong><\/li>\n<li><strong>Don't light matches or create any flame.<\/strong><\/li>\n<li><strong>Don't start an engine of any kind<\/strong>, and don't drive into a gas or vapor\n    cloud.<\/li>\n<li>Don't touch or breathe in leaking liquids.<\/li>\n<\/ul>\n<h2 id=\"before-it-happens\">Before it happens<\/h2>\n<ul>\n<li>\n<p>Write your gas company's emergency number here:<\/p>\n<p>Gas company emergency number: ______________________<\/p>\n<\/li>\n<\/ul>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>US Pipeline and Hazardous Materials Safety Administration (PHMSA),\n    Recognizing and Responding to Pipeline Emergencies:\n    https://primis.phmsa.dot.gov/stakeholder-comms/emergencyresponse/<\/li>\n<\/ul>","text":"Gas Leak Signs Smell: natural gas has an added \"rotten egg\" smell. Near pipelines you may also smell petroleum or another unusual odor. Sound: an unusual hissing or roaring . Sight (outdoors, near pipelines): dead or discolored plants, pooled liquid, or a cloud of vapor or mist. Do Make sure gas appliances are turned all the way OFF (only on your way out; don't search for the leak). Leave the area on foot , right away. Call emergency services (911 in the US) from a neighbor's house or somewhere well away from the leak. Then call your gas company if you know the number. Explain the situation : your name, phone number, what happened and where. Warn others , only if it's safe, to stay away and not create sparks. Don't Anything that makes a spark can ignite the gas: Don't turn any light switches, garage door openers or other electrical switches on or off. Don't use a phone or cell phone near the leak. Don't light matches or create any flame. Don't start an engine of any kind , and don't drive into a gas or vapor cloud. Don't touch or breathe in leaking liquids. Before it happens Write your gas company's emergency number here: Gas company emergency number: ______________________ Sources (checked 2026-11-01) US Pipeline and Hazardous Materials Safety Administration (PHMSA), Recognizing and Responding to Pipeline Emergencies: https://primis.phmsa.dot.gov/stakeholder-comms/emergencyresponse/"},"01-emergency/home-fire":{"title":"Fire in the Home","folder":"01-emergency","html":"<h1 id=\"fire-in-the-home\">Fire in the Home<\/h1>\n<h2 id=\"get-out\">Get out<\/h2>\n<ol>\n<li><strong>Get low and crawl<\/strong> under the smoke to your exit. Smoke and poisonous\n    gases collect near the ceiling first.<\/li>\n<li><strong>Before opening a door, feel the doorknob and the door.<\/strong> If either is hot,\n    or smoke is coming around it, <strong>keep it closed<\/strong> and use another way out.<\/li>\n<li>If you do open a door, <strong>open it slowly<\/strong>, ready to shut it fast if there's\n    heavy smoke or fire.<\/li>\n<li>Once out, <strong>stay out<\/strong>, and call emergency services (911 in the US).<\/li>\n<li>If you can't reach someone who needs help, get out and tell the\n    firefighters. Same for trapped pets.<\/li>\n<\/ol>\n<h2 id=\"if-youre-trapped\">If you're trapped<\/h2>\n<ol>\n<li><strong>Close the door.<\/strong> Block vents and gaps around doors with cloth or tape to\n    keep smoke out.<\/li>\n<li><strong>Call emergency services<\/strong> and say exactly where you are.<\/li>\n<li><strong>Signal at a window<\/strong> with a light-colored cloth or a flashlight.<\/li>\n<\/ol>\n<h2 id=\"if-your-clothes-catch-fire\">If your clothes catch fire<\/h2>\n<ol>\n<li><strong>Stop, drop<\/strong> to the ground, and <strong>cover your face<\/strong> with your hands.<\/li>\n<li><strong>Roll<\/strong> over and over until the fire is out. If you can't roll, smother\n    the flames with a blanket or towel.<\/li>\n<li><strong>Cool the burn<\/strong> with water for 3 to 5 minutes, cover it with a clean, dry\n    cloth, and get medical help. See <a href=\"#/01-emergency/burns\">burns.md<\/a>.<\/li>\n<\/ol>\n<h2 id=\"after-the-fire\">After the fire<\/h2>\n<ul>\n<li><strong>Don't go back in<\/strong> until the fire department says it's safe.<\/li>\n<li><strong>Don't reconnect utilities<\/strong> (gas, electricity) yourself.<\/li>\n<li>Contact a disaster relief service (such as the Red Cross) for temporary\n    housing, food and medicine.<\/li>\n<li>For insurance: list damaged property and keep damaged items until the list is\n    done, save receipts for fire-related costs, and tell your mortgage company.<\/li>\n<\/ul>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>Ready.gov, Home Fires: https://www.ready.gov/home-fires<\/li>\n<\/ul>","text":"Fire in the Home Get out Get low and crawl under the smoke to your exit. Smoke and poisonous gases collect near the ceiling first. Before opening a door, feel the doorknob and the door. If either is hot, or smoke is coming around it, keep it closed and use another way out. If you do open a door, open it slowly , ready to shut it fast if there's heavy smoke or fire. Once out, stay out , and call emergency services (911 in the US). If you can't reach someone who needs help, get out and tell the firefighters. Same for trapped pets. If you're trapped Close the door. Block vents and gaps around doors with cloth or tape to keep smoke out. Call emergency services and say exactly where you are. Signal at a window with a light-colored cloth or a flashlight. If your clothes catch fire Stop, drop to the ground, and cover your face with your hands. Roll over and over until the fire is out. If you can't roll, smother the flames with a blanket or towel. Cool the burn with water for 3 to 5 minutes, cover it with a clean, dry cloth, and get medical help. See burns.md . After the fire Don't go back in until the fire department says it's safe. Don't reconnect utilities (gas, electricity) yourself. Contact a disaster relief service (such as the Red Cross) for temporary housing, food and medicine. For insurance: list damaged property and keep damaged items until the list is done, save receipts for fire-related costs, and tell your mortgage company. Sources (checked 2026-11-01) Ready.gov, Home Fires: https://www.ready.gov/home-fires"},"01-emergency/images/CREDITS":{"title":"Image Credits: 01-emergency","folder":"01-emergency","html":"<h1 id=\"image-credits-01-emergency\">Image Credits: 01-emergency<\/h1>\n<p>All images were converted to small greyscale PNGs for this ark.<\/p>\n<table>\n<thead>\n<tr>\n<th>Image<\/th>\n<th>Source<\/th>\n<th>License<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>cpr-head-tilt-chin-lift.png<\/code>, <code>cpr-rescue-breathing.png<\/code>, <code>cpr-jaw-thrust.png<\/code>, <code>choking-universal-sign.png<\/code>, <code>choking-abdominal-thrust.png<\/code>, <code>choking-chest-thrust.png<\/code>, <code>bleeding-direct-pressure.png<\/code>, <code>shock-legs-raised.png<\/code>, <code>shock-keep-warm.png<\/code>, <code>shock-head-to-side.png<\/code>, <code>burns-smother-flames.png<\/code>, <code>burns-roll-on-ground.png<\/code>, <code>burns-electrical-push-away.png<\/code><\/td>\n<td>US Army, <em>FM 4-25.11 First Aid<\/em> (2002), figures 2-4, 2-5, 2-8, 2-10, 2-12, 2-13, 2-25, 2-37, 2-38, 2-39, 3-13, 3-14<\/td>\n<td>Public domain (US Government work)<\/td>\n<\/tr>\n<tr>\n<td><code>tourniquet-poster.png<\/code><\/td>\n<td>US Department of Homeland Security, <em>Stop the Bleed: Applying a Tourniquet<\/em> (STB_Tourniquet_08-06-2018)<\/td>\n<td>Public domain (US Government work)<\/td>\n<\/tr>\n<tr>\n<td><code>tourniquet-placement.png<\/code><\/td>\n<td>Bizhan Khodabandeh, <a class=\"ext\" href=\"https://commons.wikimedia.org/wiki/File:Applying_tourniquet.svg\" rel=\"noopener\" target=\"_blank\">Applying tourniquet.svg<\/a>, Wikimedia Commons, converted to greyscale<\/td>\n<td><a class=\"ext\" href=\"https://creativecommons.org/licenses/by-sa/4.0/\" rel=\"noopener\" target=\"_blank\">CC BY-SA 4.0<\/a><\/td>\n<\/tr>\n<tr>\n<td><code>earthquake-drop-cover-hold.png<\/code><\/td>\n<td>Jesús Franco Martínez, <a class=\"ext\" href=\"https://commons.wikimedia.org/wiki/File:Agacharse,_cubrirse_y_sujetarse.png\" rel=\"noopener\" target=\"_blank\">Agacharse, cubrirse y sujetarse.png<\/a>, Wikimedia Commons; Spanish labels replaced with English (\"Drop\", \"Cover\", \"Hold on\") and converted to greyscale<\/td>\n<td><a class=\"ext\" href=\"https://creativecommons.org/licenses/by-sa/3.0/\" rel=\"noopener\" target=\"_blank\">CC BY-SA 3.0<\/a><\/td>\n<\/tr>\n<tr>\n<td><code>recovery-position.png<\/code><\/td>\n<td>de:User:DerSchim, <a class=\"ext\" href=\"https://commons.wikimedia.org/wiki/File:Seitenlage2.gif\" rel=\"noopener\" target=\"_blank\">Seitenlage2.gif<\/a>, Wikimedia Commons<\/td>\n<td>Public domain<\/td>\n<\/tr>\n<\/tbody>\n<\/table>","text":"Image Credits: 01-emergency All images were converted to small greyscale PNGs for this ark. Image Source License cpr-head-tilt-chin-lift.png , cpr-rescue-breathing.png , cpr-jaw-thrust.png , choking-universal-sign.png , choking-abdominal-thrust.png , choking-chest-thrust.png , bleeding-direct-pressure.png , shock-legs-raised.png , shock-keep-warm.png , shock-head-to-side.png , burns-smother-flames.png , burns-roll-on-ground.png , burns-electrical-push-away.png US Army, FM 4-25.11 First Aid (2002), figures 2-4, 2-5, 2-8, 2-10, 2-12, 2-13, 2-25, 2-37, 2-38, 2-39, 3-13, 3-14 Public domain (US Government work) tourniquet-poster.png US Department of Homeland Security, Stop the Bleed: Applying a Tourniquet (STB_Tourniquet_08-06-2018) Public domain (US Government work) tourniquet-placement.png Bizhan Khodabandeh, Applying tourniquet.svg , Wikimedia Commons, converted to greyscale CC BY-SA 4.0 earthquake-drop-cover-hold.png Jesús Franco Martínez, Agacharse, cubrirse y sujetarse.png , Wikimedia Commons; Spanish labels replaced with English (\"Drop\", \"Cover\", \"Hold on\") and converted to greyscale CC BY-SA 3.0 recovery-position.png de:User:DerSchim, Seitenlage2.gif , Wikimedia Commons Public domain"},"01-emergency/power-outage":{"title":"Power Outage","folder":"01-emergency","html":"<h1 id=\"power-outage\">Power Outage<\/h1>\n<h2 id=\"right-away\">Right away<\/h2>\n<ul>\n<li><strong>Keep the fridge and freezer closed.<\/strong><ul>\n<li>Fridge: keeps food cold for about <strong>4 hours<\/strong>.<\/li>\n<li>Full freezer: keeps its temperature for about <strong>48 hours<\/strong>.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Unplug electronics and appliances.<\/strong> Power can come back with surges that\n    damage them.<\/li>\n<li><strong>Extreme heat or cold?<\/strong> Go to a community location that has power (ask\n    local officials where heating or cooling centers are open).<\/li>\n<\/ul>\n<h2 id=\"stay-safe\">Stay safe<\/h2>\n<blockquote>\n<p><strong>Never heat your home with a gas stove or oven.<\/strong> It risks carbon monoxide\npoisoning and fire. See <a href=\"#/01-emergency/carbon-monoxide\">carbon-monoxide.md<\/a>.<\/p>\n<\/blockquote>\n<p><strong>Generators:<\/strong><\/p>\n<ul>\n<li><strong>Only outdoors<\/strong>, at least <strong>20 feet (6 m)<\/strong> from windows, doors and attached\n    garages.<\/li>\n<li>Keep it dry. Touching a wet generator or anything plugged into it can shock\n    you.<\/li>\n<li>Connect appliances with <strong>heavy-duty extension cords<\/strong>.<\/li>\n<li><strong>Let it cool before refueling.<\/strong><\/li>\n<li>Have working <strong>CO alarms on every level<\/strong> of your home.<\/li>\n<\/ul>\n<h2 id=\"food-and-medicine\">Food and medicine<\/h2>\n<ul>\n<li><strong>Throw out food that has been at 40 °F (4 °C) or warmer for 2 hours or\n    more<\/strong>, or that smells, looks or feels unusual. <strong>When in doubt, throw it\n    out!<\/strong> Use a thermometer if you have one.<\/li>\n<li><strong>Medicine that needs refrigeration:<\/strong> if the power is out for <strong>more than a\n    day<\/strong>, throw it out unless the label says otherwise, and contact your doctor\n    or pharmacist for a new supply.<\/li>\n<\/ul>\n<h2 id=\"before-it-happens\">Before it happens<\/h2>\n<ul>\n<li>If you rely on powered medical devices or refrigerated medicine, ask your\n    doctor now for a plan, including how long your medicine lasts at higher\n    temperatures.<\/li>\n<li>Keep a thermometer in the fridge and freezer.<\/li>\n<\/ul>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>Ready.gov, Power Outages: https://www.ready.gov/power-outages<\/li>\n<\/ul>","text":"Power Outage Right away Keep the fridge and freezer closed. Fridge: keeps food cold for about 4 hours . Full freezer: keeps its temperature for about 48 hours . Unplug electronics and appliances. Power can come back with surges that damage them. Extreme heat or cold? Go to a community location that has power (ask local officials where heating or cooling centers are open). Stay safe Never heat your home with a gas stove or oven. It risks carbon monoxide poisoning and fire. See carbon-monoxide.md . Generators: Only outdoors , at least 20 feet (6 m) from windows, doors and attached garages. Keep it dry. Touching a wet generator or anything plugged into it can shock you. Connect appliances with heavy-duty extension cords . Let it cool before refueling. Have working CO alarms on every level of your home. Food and medicine Throw out food that has been at 40 °F (4 °C) or warmer for 2 hours or more , or that smells, looks or feels unusual. When in doubt, throw it out! Use a thermometer if you have one. Medicine that needs refrigeration: if the power is out for more than a day , throw it out unless the label says otherwise, and contact your doctor or pharmacist for a new supply. Before it happens If you rely on powered medical devices or refrigerated medicine, ask your doctor now for a plan, including how long your medicine lasts at higher temperatures. Keep a thermometer in the fridge and freezer. Sources (checked 2026-11-01) Ready.gov, Power Outages: https://www.ready.gov/power-outages"},"01-emergency/severe-bleeding":{"title":"Severe Bleeding","folder":"01-emergency","html":"<h1 id=\"severe-bleeding\">Severe Bleeding<\/h1>\n<blockquote>\n<p><strong>Act fast.<\/strong> A person who is bleeding heavily can die from blood loss\n<strong>within five minutes<\/strong>. The people nearest are the ones who can save them.<\/p>\n<\/blockquote>\n<p>If phones work, call your local emergency number, or send someone for help,\n<strong>while<\/strong> you start these steps.<\/p>\n<h2 id=\"step-1-direct-pressure-now\">Step 1: Direct pressure, now<\/h2>\n<ol>\n<li><strong>Expose the wound.<\/strong> Tear or cut clothing away so you can see where the\n    blood is coming from.<\/li>\n<li><strong>Press hard, directly on the wound<\/strong>, with gauze or clean cloth. If you\n    have nothing, use your hand, elbow or knee: whatever it takes to slow or\n    stop the bleeding.<\/li>\n<li><strong>Keep pressing.<\/strong><\/li>\n<\/ol>\n<p><img alt=\"Hands pressing a dressing firmly onto a leg wound\" loading=\"lazy\" src=\"01-emergency/images/bleeding-direct-pressure.png\" /><\/p>\n<p><em>Firm, direct pressure on the wound.<\/em><\/p>\n<p>If pressure does not stop the bleeding and the dressing becomes soaked with\nblood, <strong>and the wound is on an arm or leg<\/strong>, apply a tourniquet.<\/p>\n<h2 id=\"step-2-tourniquet-arm-or-leg-only\">Step 2: Tourniquet (arm or leg only)<\/h2>\n<ol>\n<li><strong>Place the tourniquet at least 2–3 inches (5–8 cm) from the wound,\n    between the wound and the heart.<\/strong> It can go over clothing.<\/li>\n<li><strong>Never place it over a joint<\/strong> (elbow, knee, wrist, ankle). Joints protect\n    the blood vessels and stop the tourniquet from pressing hard enough.<\/li>\n<li><strong>Pull the strap tight<\/strong> through the buckle, as tight as you can.<\/li>\n<li><strong>Twist the windlass rod<\/strong> in one direction until the bleeding stops.<\/li>\n<li><strong>Lock the rod<\/strong> in its clip so it can't unwind, and secure it with the\n    Velcro strap if there is one.<\/li>\n<li><strong>Write down the time<\/strong> the tourniquet was applied (on the tourniquet\n    itself if you can). Leaving it on too long damages tissue, and the time\n    helps medical staff decide who to treat first.<\/li>\n<\/ol>\n<p><img alt=\"Tourniquet on the thigh above a wound on the lower leg, not over the knee\" loading=\"lazy\" src=\"01-emergency/images/tourniquet-placement.png\" /><\/p>\n<p><em>Above the wound, between the wound and the heart, never over a joint.<\/em><\/p>\n<p><img alt=\"DHS Stop the Bleed poster: seven steps for applying a tourniquet\" loading=\"lazy\" src=\"01-emergency/images/tourniquet-poster.png\" /><\/p>\n<p><em>All seven steps. Full-size poster:\n<a href=\"01-emergency/tourniquet-poster-dhs.pdf\" target=\"_blank\">tourniquet-poster-dhs.pdf<\/a> (US Department of\nHomeland Security, in this folder).<\/em><\/p>\n<h2 id=\"be-ready-before-you-need-this\">Be ready before you need this<\/h2>\n<ul>\n<li>Keep a commercial tourniquet in your first-aid kit and car, and practice\n    with it.<\/li>\n<li>Take a free Stop the Bleed course while training is available:\n    https://www.stopthebleed.org/<\/li>\n<\/ul>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>DHS / Stop the Bleed, \"Applying a Tourniquet\" poster (STB_Tourniquet_08-06-2018):\n    https://www.dhs.gov/publication/stop-bleed-tourniquet<\/li>\n<li>DHS, Stop the Bleed: https://www.dhs.gov/stopthebleed<\/li>\n<li>Drawings: see <a href=\"#/01-emergency/images/CREDITS\">images/CREDITS.md<\/a><\/li>\n<\/ul>","text":"Severe Bleeding Act fast. A person who is bleeding heavily can die from blood loss within five minutes . The people nearest are the ones who can save them. If phones work, call your local emergency number, or send someone for help, while you start these steps. Step 1: Direct pressure, now Expose the wound. Tear or cut clothing away so you can see where the blood is coming from. Press hard, directly on the wound , with gauze or clean cloth. If you have nothing, use your hand, elbow or knee: whatever it takes to slow or stop the bleeding. Keep pressing. Firm, direct pressure on the wound. If pressure does not stop the bleeding and the dressing becomes soaked with blood, and the wound is on an arm or leg , apply a tourniquet. Step 2: Tourniquet (arm or leg only) Place the tourniquet at least 2–3 inches (5–8 cm) from the wound, between the wound and the heart. It can go over clothing. Never place it over a joint (elbow, knee, wrist, ankle). Joints protect the blood vessels and stop the tourniquet from pressing hard enough. Pull the strap tight through the buckle, as tight as you can. Twist the windlass rod in one direction until the bleeding stops. Lock the rod in its clip so it can't unwind, and secure it with the Velcro strap if there is one. Write down the time the tourniquet was applied (on the tourniquet itself if you can). Leaving it on too long damages tissue, and the time helps medical staff decide who to treat first. Above the wound, between the wound and the heart, never over a joint. All seven steps. Full-size poster: tourniquet-poster-dhs.pdf (US Department of Homeland Security, in this folder). Be ready before you need this Keep a commercial tourniquet in your first-aid kit and car, and practice with it. Take a free Stop the Bleed course while training is available: https://www.stopthebleed.org/ Sources (checked 2026-11-01) DHS / Stop the Bleed, \"Applying a Tourniquet\" poster (STB_Tourniquet_08-06-2018): https://www.dhs.gov/publication/stop-bleed-tourniquet DHS, Stop the Bleed: https://www.dhs.gov/stopthebleed Drawings: see images/CREDITS.md"},"01-emergency/shock":{"title":"Shock","folder":"01-emergency","html":"<h1 id=\"shock\">Shock<\/h1>\n<p>Shock means the body isn't getting enough blood flow. It can follow heavy\nbleeding, severe burns, serious injury, infection or allergic reactions.\n<strong>It is life-threatening.<\/strong> Don't wait for it to get worse before getting help.<\/p>\n<h2 id=\"signs\">Signs<\/h2>\n<ul>\n<li>Pale, cool, clammy skin; heavy sweating<\/li>\n<li>Fast but weak pulse<\/li>\n<li>Fast, shallow breathing<\/li>\n<li>Dizziness, feeling faint<\/li>\n<li>Anxiety, restlessness, confusion<\/li>\n<li>Blue lips or fingernails<\/li>\n<li>Chest discomfort<\/li>\n<li>Little or no urine<\/li>\n<li>Passing out<\/li>\n<\/ul>\n<h2 id=\"what-to-do\">What to do<\/h2>\n<ol>\n<li><strong>Call your local emergency number right away.<\/strong><\/li>\n<li>Check airway and breathing. Start CPR if needed (see <a href=\"#/01-emergency/cpr\">cpr.md<\/a>).<\/li>\n<li><strong>Recheck breathing at least every 5 minutes<\/strong>, even if they seem fine.<\/li>\n<li>\n<p>If they are conscious and have <strong>no head, neck, spine or leg injury<\/strong>: lay\n    them on their back and <strong>raise their legs about 12 inches (30 cm)<\/strong>, head\n    flat. If raising the legs hurts or could cause harm, leave them flat.<\/p>\n<p><img alt=\"Person lying on their back with feet raised on a pack\" loading=\"lazy\" src=\"01-emergency/images/shock-legs-raised.png\" /><\/p>\n<\/li>\n<li>\n<p>Treat other injuries (for bleeding, see\n    <a href=\"#/01-emergency/severe-bleeding\">severe-bleeding.md<\/a>).<\/p>\n<\/li>\n<li>\n<p><strong>Keep them warm<\/strong> and comfortable. Loosen tight clothing.<\/p>\n<p><img alt=\"Person lying covered by a blanket, feet raised\" loading=\"lazy\" src=\"01-emergency/images/shock-keep-warm.png\" /><\/p>\n<\/li>\n<li>\n<p>If they vomit or drool, turn their head to the side so they don't choke.\n    If a spine injury is possible, roll the <strong>whole body<\/strong> together, keeping\n    head, neck and back in line.<\/p>\n<p><img alt=\"Person's head turned to one side\" loading=\"lazy\" src=\"01-emergency/images/shock-head-to-side.png\" /><\/p>\n<\/li>\n<\/ol>\n<h2 id=\"dont\">Don't<\/h2>\n<ul>\n<li><strong>Don't give them anything to eat or drink.<\/strong><\/li>\n<li>Don't move someone with a known or suspected spine injury.<\/li>\n<li>Don't wait for mild signs to get worse before calling for help.<\/li>\n<\/ul>\n<hr />\n<p><strong>Sources<\/strong> (checked 2026-11-01)<\/p>\n<ul>\n<li>MedlinePlus (US National Library of Medicine), Shock:\n    https://medlineplus.gov/ency/article/000039.htm<\/li>\n<li>Drawings: see <a href=\"#/01-emergency/images/CREDITS\">images/CREDITS.md<\/a><\/li>\n<\/ul>","text":"Shock Shock means the body isn't getting enough blood flow. It can follow heavy bleeding, severe burns, serious injury, infection or allergic reactions. It is life-threatening. Don't wait for it to get worse before getting help. Signs Pale, cool, clammy skin; heavy sweating Fast but weak pulse Fast, shallow breathing Dizziness, feeling faint Anxiety, restlessness, confusion Blue lips or fingernails Chest discomfort Little or no urine Passing out What to do Call your local emergency number right away. Check airway and breathing. Start CPR if needed (see cpr.md ). Recheck breathing at least every 5 minutes , even if they seem fine. If they are conscious and have no head, neck, spine or leg injury : lay them on their back and raise their legs about 12 inches (30 cm) , head flat. If raising the legs hurts or could cause harm, leave them flat. Treat other injuries (for bleeding, see severe-bleeding.md ). Keep them warm and comfortable. Loosen tight clothing. If they vomit or drool, turn their head to the side so they don't choke. If a spine injury is possible, roll the whole body together, keeping head, neck and back in line. Don't Don't give them anything to eat or drink. Don't move someone with a known or suspected spine injury. Don't wait for mild signs to get worse before calling for help. Sources (checked 2026-11-01) MedlinePlus (US National Library of Medicine), Shock: https://medlineplus.gov/ency/article/000039.htm Drawings: see images/CREDITS.md"},"02-first-aid/README":{"title":"02 · First Aid","folder":"02-first-aid","html":"<h1 id=\"02-first-aid\">02 · First Aid<\/h1>\n<p>Care for injuries and illness once the immediate danger has passed.\nFor life-threatening situations, start with <a href=\"#/01-emergency/README\">01-emergency<\/a>.<\/p>\n<h2 id=\"pages\">Pages<\/h2>\n<ul>\n<li><a href=\"#/02-first-aid/cuts-and-wounds\">Cuts and Puncture Wounds<\/a>, including signs of infection<\/li>\n<li><a href=\"#/02-first-aid/broken-bones\">Broken Bones<\/a>, including improvised splints<\/li>\n<li><a href=\"#/02-first-aid/dehydration\">Dehydration and Oral Rehydration Solution<\/a>, with a homemade ORS recipe<\/li>\n<li><a href=\"#/02-first-aid/hypothermia\">Hypothermia<\/a><\/li>\n<li><a href=\"#/02-first-aid/heat-illness\">Heat Illness<\/a><\/li>\n<li><a href=\"#/02-first-aid/bites-and-stings-australia\">Bites and Stings (Australia)<\/a>: snakes, spiders, ticks, bluebottles<\/li>\n<\/ul>\n<h2 id=\"to-add\">To add<\/h2>\n<ul>\n<li>Sprains and strains<\/li>\n<li>Eye injuries<\/li>\n<li>Common medications: uses, doses, expiry<\/li>\n<li>Emergency childbirth<\/li>\n<\/ul>","text":"02 · First Aid Care for injuries and illness once the immediate danger has passed. For life-threatening situations, start with 01-emergency . Pages Cuts and Punctu
