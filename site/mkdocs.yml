site_name: Arkpi — Offline Knowledge Ark
site_description: Survival guides and essential reference for an internet outage
docs_dir: ../guides
site_dir: build

theme:
  name: material
  # No Google Fonts: everything must load without internet
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight

plugins:
  - search
  # Makes the built site work when opened straight from disk (file://),
  # including search, so it can be copied to a USB drive
  - offline

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - First Aid:
      - first-aid/index.md
      - Controlling Severe Bleeding: first-aid/severe-bleeding.md
  - Water:
      - water/index.md
      - Making Water Safe to Drink: water/purifying-water.md
  - Preparedness:
      - preparedness/index.md
      - Emergency Supply Kit: preparedness/emergency-kit.md
  - About & Sources: about.md
