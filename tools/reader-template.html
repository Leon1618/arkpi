<style>
/* Layout: one column, phone-first; a red call bar on every screen; big tap targets; system fonts only (works offline) */
:root {
  --paper: #f3f4f0; --card: #ffffff; --ink: #161a1d; --muted: #5b6460; --line: #d9ddd6;
  --urgent: #b3131f; --urgent-ink: #ffffff; --caution: #8a5a00; --caution-bg: #fbf1dc;
  --calm: #0e5f63; --calm-bg: #e3efee; --plate: #ffffff; --plate-ink: #4a524e;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --scale: 1;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0f1214; --card: #171b1e; --ink: #e8ebe7; --muted: #9aa39e; --line: #2b3236;
  --urgent: #c8242e; --caution: #f0b74a; --caution-bg: #2a2214; --calm: #6cc3c4; --calm-bg: #14282a; --plate: #e9ebe6; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0f1214; --card: #171b1e; --ink: #e8ebe7; --muted: #9aa39e; --line: #2b3236;
  --urgent: #c8242e; --caution: #f0b74a; --caution-bg: #2a2214; --calm: #6cc3c4; --calm-bg: #14282a; --plate: #e9ebe6; color-scheme: dark }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font); font-size: calc(17px * var(--scale)); line-height: 1.55; }
a { color: var(--calm); }
a.ext::after { content: " ↗"; font-size: .8em; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--calm); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; line-height: 1.2; }
img { max-width: 100%; height: auto; }

.call { position: sticky; top: 0; z-index: 5; background: var(--urgent); color: var(--urgent-ink);
  padding: calc(8px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
.call-in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.call a { color: var(--urgent-ink); text-decoration: none; display: flex; gap: 10px; align-items: baseline; min-width: 0; }
.call b { font-size: 1.35em; font-family: var(--mono); letter-spacing: .04em; }
.call span { font-size: .85em; opacity: .92; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.call .tools { margin-left: auto; display: flex; gap: 6px; flex: none; }
.call .tools button { background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.4); color: var(--urgent-ink); border-radius: 8px; padding: 3px 10px; font-size: .85em; }

main { max-width: 760px; margin: 0 auto; padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(60px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 20px; }
.eyebrow { font-size: .74em; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.crumb { font-size: .9em; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.crumb a { text-decoration: none; font-weight: 600; }
.crumb span { color: var(--muted); }

.search { margin: 0; }
.search input { width: 100%; font: inherit; padding: 14px 16px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); color: var(--ink); }
.results { display: grid; gap: 6px; }
.results a { display: block; padding: 10px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: var(--ink); }
.results small { color: var(--muted); display: block; font-size: .82em; }

.urgent-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.urgent-grid a { display: flex; flex-direction: column; justify-content: flex-end; min-height: 92px; padding: 14px; border-radius: 14px;
  background: var(--card); border: 2px solid var(--line); text-decoration: none; color: var(--ink); font-weight: 700; font-size: 1.05em; line-height: 1.2; }
.urgent-grid a small { font-weight: 400; color: var(--muted); font-size: .8em; margin-top: 4px; }
.urgent-grid a.hot { background: var(--urgent); border-color: var(--urgent); color: var(--urgent-ink); }
.urgent-grid a.hot small { color: var(--urgent-ink); opacity: .88; }

.shelf { display: grid; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.shelf a { display: grid; grid-template-columns: 2.2em 1fr auto; gap: 12px; align-items: baseline; padding: 13px 16px; border-top: 1px solid var(--line); text-decoration: none; color: var(--ink); }
.shelf a:first-child { border-top: 0; }
.shelf .n { font-family: var(--mono); color: var(--muted); font-size: .85em; }
.shelf .c { color: var(--muted); font-size: .85em; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Pages */
.page { min-width: 0; }
.page h1 { font-size: 2em; margin: 0 0 .4em; }
.page h2 { font-size: 1.35em; margin: 1.4em 0 .5em; }
.page h3 { font-size: 1.1em; margin: 1.2em 0 .4em; }
.page p, .page ul, .page ol { margin: .6em 0; }
.page li { margin: .3em 0; }
.page li > p { margin: .3em 0; }
.page img { display: block; background: var(--plate); border-radius: 10px; padding: 8px; margin: 10px 0 4px; max-height: 340px; width: auto; }
.page p:has(> img) { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.page p:has(> img) img { margin: 0; }
.page em { color: var(--muted); }
.page blockquote { margin: 1em 0; background: var(--calm-bg); border-radius: 10px; padding: 4px 16px; }
.page table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
.page th, .page td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.page th { font-size: .8em; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.table-wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin: 1em 0; }
.page hr { border: 0; border-top: 1px solid var(--line); margin: 2em 0 1em; }
.sources { font-size: .85em; color: var(--muted); }
.sources a { word-break: break-word; }
.dont { background: var(--caution-bg); border-left: 4px solid var(--caution); border-radius: 10px; padding: 2px 16px 8px; margin: 1.2em 0; }
.dont h2 { color: var(--caution); font-size: 1em; text-transform: uppercase; letter-spacing: .08em; margin-top: .9em; }
.headerlink { display: none; }

.au-chip { display: inline-flex; gap: 8px; align-items: center; background: var(--calm-bg); color: var(--ink); border-radius: 999px; padding: 6px 14px; text-decoration: none; font-size: .9em; font-weight: 600; }
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card); }
.toggle button { border: 0; background: none; padding: 8px 14px; font-size: .9em; }
.toggle button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

/* Step mode */
.step { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 10px; min-width: 0; }
.step.caution { background: var(--caution-bg); border-color: var(--caution); }
.step .head { display: flex; gap: 14px; align-items: center; }
.step .num { flex: none; width: 2.1em; height: 2.1em; border-radius: 50%; background: var(--ink); color: var(--paper); display: grid; place-items: center; font-weight: 800; font-family: var(--mono); }
.step .body { font-size: 1.12em; }
.step .body > :first-child { margin-top: 0; }
.stepper { display: flex; gap: 10px; }
.stepper button { flex: 1; padding: 14px; border-radius: 12px; border: 2px solid var(--ink); background: var(--card); font-weight: 700; }
.stepper button.primary { background: var(--ink); color: var(--paper); }
.stepper button:disabled { opacity: .35; cursor: default; }
.dots { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--ink); }

.beat { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.beat .pulse { width: 46px; height: 46px; border-radius: 50%; background: var(--urgent); transform: scale(.55); opacity: .35; transition: transform 80ms, opacity 80ms; }
.beat .pulse.on { transform: scale(1); opacity: 1; }
.beat button { padding: 10px 16px; border-radius: 10px; border: 2px solid var(--urgent); background: var(--card); color: var(--urgent); font-weight: 700; }
.foot { font-size: .85em; color: var(--muted); }

@media (prefers-reduced-motion: reduce) { .beat .pulse { transition: none; } }
@media print {
  .call, .toolbar, .stepper, .dots, .beat, .search, .crumb { display: none !important; }
  body { background: #fff; color: #000; font-size: 12pt; }
  .page img { max-height: 200px; }
}
</style>
</head>
<body>
<div class="call" role="banner"><div class="call-in">
  <a id="callLink" href="#/"><b id="callNumber"></b><span id="callText"></span></a>
  <div class="tools">
    <button id="smaller" type="button" aria-label="Smaller text">A−</button>
    <button id="bigger" type="button" aria-label="Bigger text">A+</button>
    <button id="theme" type="button" aria-label="Switch between light and dark">◐</button>
  </div>
</div></div>
<main id="app" aria-live="polite"></main>

<script>
const ARK = /*ARK_DATA*/null;

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem("ark." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("ark." + k, JSON.stringify(v)); } catch {} },
};
let scale = store.get("scale", 1);
let stepPref = store.get("stepMode", null);   // null = default (one step for emergency pages)
let stepIndex = 0;
let printing = false;
document.documentElement.style.setProperty("--scale", scale);
const savedTheme = store.get("theme", null);
if (savedTheme) document.documentElement.dataset.theme = savedTheme;

$("#callNumber").textContent = ARK.call.number;
$("#callText").textContent = ARK.call.text;
$("#callLink").href = "#/" + ARK.call.link;

// ---------- Home ----------
function home() {
  const urgent = ARK.urgent.map(([key, label, hint, hot]) =>
    `<a href="#/${key}" class="${hot ? "hot" : ""}">${esc(label)}<small>${esc(hint)}</small></a>`).join("");
  const shelf = ARK.sections.map(s =>
    `<a href="#/${s.key}"><span class="n">${s.number}</span><span>${esc(s.title)}</span><span class="c">${s.number === "13" ? ARK.books.length + " books" : s.count + (s.count === 1 ? " page" : " pages")}</span></a>`).join("");
  return `
    <section><div class="eyebrow">Offline · stored on this device</div><h1 style="font-size:1.9em;margin:.2em 0 0">What's happening?</h1></section>
    <form class="search" role="search" onsubmit="event.preventDefault()">
      <input id="q" type="search" placeholder="Search: bleeding, heimlich, flood, 000, a book…" autocomplete="off" aria-label="Search the ark">
    </form>
    <div class="results" id="results" hidden></div>
    <nav class="urgent-grid" aria-label="Emergencies">${urgent}</nav>
    <section style="display:grid;gap:10px"><div class="eyebrow">Everything in the ark</div>
      <nav class="shelf">${shelf}<a href="#/library/README"><span class="n">↗</span><span>Reference library (Wikipedia, WikiMed…)</span><span class="c">Kiwix app</span></a></nav>
    </section>
    <p class="foot"><a href="#/README">About this ark</a>${ARK.updated ? " · Updated " + esc(ARK.updated) : ""}</p>`;
}

function search(q) {
  q = q.trim().toLowerCase();
  if (!q) return [];
  const words = q.split(/\s+/);
  const hits = new Map();
  const add = (key, score) => hits.set(key, (hits.get(key) || 0) + score);
  for (const [word, key] of Object.entries(ARK.synonyms)) if (q.includes(word) || (word.length > 3 && word.startsWith(q))) add(key, 50);
  for (const [key, p] of Object.entries(ARK.pages)) {
    if (key.includes("/images/")) continue;
    const title = p.title.toLowerCase(), text = p.text.toLowerCase();
    if (title.includes(q)) add(key, 30);
    let all = true;
    for (const w of words) { if (title.includes(w)) add(key, 5); else if (!text.includes(w)) all = false; }
    if (all) add(key, words.reduce((n, w) => n + Math.min(5, text.split(w).length - 1), 0));
  }
  const pages = [...hits].sort((a, b) => b[1] - a[1]).slice(0, 8).map(([key]) => {
    const p = ARK.pages[key], i = p.text.toLowerCase().indexOf(words[0]);
    const snip = i < 0 ? p.text.slice(0, 110) : (i > 40 ? "…" : "") + p.text.slice(Math.max(0, i - 40), i + 80) + "…";
    return `<a href="#/${key}">${esc(p.title)}<small>${esc(snip)}</small></a>`;
  });
  const books = ARK.books.filter(b => (b.title + " " + b.author).toLowerCase().includes(q)).slice(0, 5)
    .map(b => `<a href="${esc(b.path)}" target="_blank">${esc(b.title)}<small>Book · ${esc(b.author)}</small></a>`);
  return [...pages, ...books];
}

// ---------- Pages ----------
function renderPage(key, anchor) {
  const p = ARK.pages[key];
  if (!p) return `<div class="crumb"><a href="#/">← Ark</a></div><h1>Page not found</h1><p>Try searching from the <a href="#/">home screen</a>.</p>`;
  const folderPage = ARK.pages[p.folder + "/README"];
  const isFolderIndex = key.endsWith("/README");
  const crumb = `<a href="#/">← Ark</a>${folderPage && !isFolderIndex ? `<span>·</span><a href="#/${p.folder}/README">${esc(folderPage.title)}</a>` : ""}`;
  return `<div class="crumb">${crumb}</div><div class="toolbar" id="toolbar" hidden></div><article class="page" id="page">${p.html}</article>`;
}

// Wrap "Don't" sections, mark sources, wrap wide tables
function decorate(page) {
  page.querySelectorAll("table").forEach(t => { const w = document.createElement("div"); w.className = "table-wrap"; t.replaceWith(w); w.appendChild(t); });
  [...page.querySelectorAll("h2")].filter(h => /^don.?t\b/i.test(h.textContent.trim())).forEach(h => {
    const box = document.createElement("aside"); box.className = "dont";
    h.before(box);
    let n = h; const nodes = [];
    while (n && !(n !== h && /^(H1|H2|HR)$/.test(n.tagName))) { nodes.push(n); n = n.nextElementSibling; }
    nodes.forEach(x => box.appendChild(x));
  });
  const hr = [...page.children].find(el => el.tagName === "HR");
  if (hr) { const box = document.createElement("footer"); box.className = "sources"; hr.after(box); while (box.nextSibling) box.appendChild(box.nextSibling); }
}

// Turn a guide into one card per step: each numbered item is a step; other blocks are grouped
function buildSteps(page) {
  const steps = [];
  let group = null, title = $("h1", page)?.textContent || "";
  const flush = () => { if (group && group.nodes.length) steps.push(group); group = null; };
  for (const el of [...page.children]) {
    if (el.tagName === "H1") continue;
    if (el.tagName === "FOOTER") break;
    if (el.tagName === "H2" || el.tagName === "H3") { flush(); title = el.textContent; continue; }
    if (el.tagName === "OL") {
      flush();
      [...el.children].forEach(li => steps.push({ title, nodes: [li], li: true }));
      continue;
    }
    // Pictures and their captions belong to the step just before them
    const pictureOnly = el.tagName === "P" &&
      (el.querySelector("img") ? el.textContent.trim() === "" : /^\s*<em>[\s\S]*<\/em>\s*$/.test(el.innerHTML));
    if (pictureOnly && !group && steps.length && steps[steps.length - 1].li) { steps[steps.length - 1].nodes.push(el); continue; }
    if (el.classList.contains("dont")) { flush(); steps.push({ title: "Don't", nodes: [el], caution: true }); continue; }
    if (!group) group = { title, nodes: [] };
    group.nodes.push(el);
  }
  flush();
  return steps;
}

function showSteps(page, steps, key) {
  stepIndex = Math.max(0, Math.min(stepIndex, steps.length - 1));
  const s = steps[stepIndex];
  const card = document.createElement("section");
  card.className = "step" + (s.caution ? " caution" : "");
  card.setAttribute("aria-label", `Step ${stepIndex + 1} of ${steps.length}`);
  const body = document.createElement("div"); body.className = "body";
  s.nodes.forEach(n => {
    if (n.tagName === "LI") { [...n.childNodes].forEach(c => body.appendChild(c.cloneNode(true))); }
    else if (n.classList?.contains("dont")) { [...n.children].filter(c => c.tagName !== "H2").forEach(c => body.appendChild(c.cloneNode(true))); }
    else body.appendChild(n.cloneNode(true));
  });
  card.innerHTML = `<div class="head"><span class="num">${stepIndex + 1}</span><div class="eyebrow">${esc(s.title)}</div></div>`;
  card.appendChild(body);
  const footer = $("footer.sources", page);
  const h1 = $("h1", page);
  page.innerHTML = "";
  if (h1) page.appendChild(h1);
  page.appendChild(card);
  const nav = document.createElement("div");
  nav.innerHTML = `<div class="dots" aria-hidden="true">${steps.map((_, i) => `<i class="${i === stepIndex ? "on" : ""}"></i>`).join("")}</div>
    <div class="stepper" style="margin-top:12px"><button id="prev" type="button" ${stepIndex === 0 ? "disabled" : ""}>Back</button>
    <button id="next" type="button" class="primary" ${stepIndex === steps.length - 1 ? "disabled" : ""}>${stepIndex === steps.length - 1 ? "Last step" : "Next step"}</button></div>`;
  page.appendChild(nav);
  if (footer) page.appendChild(footer);
  $("#prev").onclick = () => { stepIndex--; route(); };
  $("#next").onclick = () => { stepIndex++; route(); };
}

function addBeat(page) {
  const beat = document.createElement("div");
  beat.className = "beat";
  beat.innerHTML = `<div class="pulse" id="pulse"></div><button id="beatBtn" type="button">Start 110 / min beat</button><span class="foot">Push down on each flash</span>`;
  const firstList = $("ol", page) || $("h1", page);
  firstList.after(beat);
  $("#beatBtn").onclick = () => beatTimer ? stopBeat() : startBeat();
}

// ---------- Router ----------
let currentKey = null;
function route() {
  stopBeat();
  const raw = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  const [key, anchor] = raw.split("~");
  if (key !== currentKey) { stepIndex = 0; currentKey = key; }
  const app = $("#app");
  if (!key) { app.innerHTML = home(); bindHome(); window.scrollTo(0, 0); return; }
  app.innerHTML = renderPage(key, anchor);
  const page = $("#page");
  if (!page) return;
  decorate(page);
  const steps = buildSteps(page);
  const hasList = steps.some(s => s.li);
  const stepDefault = key.startsWith("01-emergency/") && !key.endsWith("README");
  const stepMode = !printing && hasList && !anchor && (stepPref === null ? stepDefault : stepPref);
  const au = [...page.querySelectorAll("h2, h3, blockquote")].find(el => /australia/i.test(el.textContent));
  const bar = $("#toolbar");
  if (hasList || au) {
    bar.hidden = false;
    if (au && !au.id) au.id = "australia";
    bar.innerHTML = `${au ? `<a class="au-chip" href="#/${key}~${au.id}">Australian advice on this page ↓</a>` : "<span></span>"}
      ${hasList ? `<div class="toggle" role="group" aria-label="View"><button type="button" data-mode="step" aria-pressed="${stepMode}">One step</button><button type="button" data-mode="all" aria-pressed="${!stepMode}">All steps</button></div>` : ""}`;
    bar.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { stepPref = b.dataset.mode === "step"; store.set("stepMode", stepPref); route(); });
  }
  if (stepMode) showSteps(page, steps, key);
  if (key === "01-emergency/cpr") addBeat(page);
  if (/^0[12]-/.test(key)) keepAwake();
  if (anchor) { const t = document.getElementById(anchor); if (t) { t.scrollIntoView(); return; } }
  window.scrollTo(0, 0);
}

function bindHome() {
  const q = $("#q"), box = $("#results");
  q.addEventListener("input", () => {
    const res = search(q.value);
    box.hidden = !q.value.trim();
    box.innerHTML = res.length ? res.join("") : `<a href="#/">No match for “${esc(q.value)}”<small>Try a plain word, like “blood”, “breathing” or “water”.</small></a>`;
  });
}

// ---------- CPR beat (110 per minute) ----------
let beatTimer = null, audio = null;
function startBeat() {
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); } catch { audio = null; }
  const tick = () => {
    const p = $("#pulse"); if (!p) return stopBeat();
    p.classList.add("on"); setTimeout(() => p.classList.remove("on"), 120);
    if (audio) { const o = audio.createOscillator(), g = audio.createGain(); o.frequency.value = 880; g.gain.value = .08; o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + .05); }
  };
  tick(); beatTimer = setInterval(tick, 60000 / 110);
  const b = $("#beatBtn"); if (b) b.textContent = "Stop beat";
}
function stopBeat() { clearInterval(beatTimer); beatTimer = null; const b = $("#beatBtn"); if (b) b.textContent = "Start 110 / min beat"; }

// Keep the screen on while a first-aid page is open (ignored where not allowed)
let lock = null;
async function keepAwake() { try { if (!lock && navigator.wakeLock) { lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", () => lock = null); } } catch {} }

// ---------- Text size, theme, keys, print ----------
const setScale = v => { scale = Math.max(.85, Math.min(1.6, +v.toFixed(2))); store.set("scale", scale); document.documentElement.style.setProperty("--scale", scale); };
$("#bigger").onclick = () => setScale(scale + .1);
$("#smaller").onclick = () => setScale(scale - .1);
$("#theme").onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark"; store.set("theme", root.dataset.theme);
};
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight" && $("#next") && !$("#next").disabled) $("#next").click();
  if (e.key === "ArrowLeft" && $("#prev") && !$("#prev").disabled) $("#prev").click();
});
window.addEventListener("beforeprint", () => { printing = true; route(); });
window.addEventListener("afterprint", () => { printing = false; route(); });
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
